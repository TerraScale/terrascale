# Fast tests run on every main push and before trusted image publication.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check repository contracts before installing dependencies
        run: |
          python3 scripts/verify-sdk.py
          python3 scripts/verify-e2e.py
          python3 scripts/report-slow-failure.py --self-check
          python3 scripts/ci/tree-proof.py --self-check
          bash scripts/ci/check-release-result.sh
          node scripts/check-document-changes.mjs
      - name: Restore the pinned advisory scanner
        id: advisory
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/osv-scanner-bin
          key: advisory-osv-2.7.0-go1.27.3-linux-amd64
      - name: Select the patched scanner compiler on a cache miss
        if: steps.advisory.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Audit every committed dependency graph
        run: |
          mkdir -p ~/.cache/osv-scanner-bin
          scanner=~/.cache/osv-scanner-bin/osv-scanner
          if [[ ! -f "$scanner" ]]; then
            GOBIN="$HOME/.cache/osv-scanner-bin" CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 GOFLAGS='' GOTOOLCHAIN=go1.27.3 go install -trimpath github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          fi
          echo "1a7e2584c17db2e523c13f41ae4a4d1d13ee221dbc4abc19a6bba00aac3f40f2  $scanner" | sha256sum --check
          chmod +x "$scanner"
          python3 scripts/ci/audit-dependencies.py "$scanner"
          python3 scripts/ci/audit-runtime-images.py "$scanner"
      - uses: ./.github/actions/dashboard-setup
        id: dependencies
      - name: Build and run Fast tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fast-results
          path: test-results/tunit/fast.trx
          if-no-files-found: warn
      - name: Publish the already-built application
        run: |
          dotnet publish src/TerraScale.Dashboard --configuration Release --no-build --no-restore \
            --output "$RUNNER_TEMP/dashboard-publish" \
            -p:ContinuousIntegrationBuild=true -p:SourceRevisionId="$GITHUB_SHA"
      - name: Package and smoke-test the checked build
        run: |
          docker build -f scripts/ci/Dockerfile.runtime -t "ts-dashboard:$GITHUB_SHA" "$RUNNER_TEMP/dashboard-publish"
          bash scripts/ci/smoke.sh
      - name: Retain the tested application for gated publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-publish
          path: ${{ runner.temp }}/dashboard-publish
          retention-days: 1
          if-no-files-found: error
      - name: Cache main dependencies after successful checks
        if: github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/nuget
            ~/.npm
          key: ${{ steps.dependencies.outputs.cache-key }}
      - name: Cache the verified advisory scanner on main
        if: github.ref == 'refs/heads/main' && steps.advisory.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/osv-scanner-bin
          key: advisory-osv-2.7.0-go1.27.3-linux-amd64
