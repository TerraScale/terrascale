name: CI

# Every main push tests the repository before publishing the checked site.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR checks cancel; main publication and verification finish together.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Pinned legacy scanner, sparse so only its policy directory lands beside the checkout.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: TerraScale/terrascale
          ref: a2e200187ffe32084a10f2a81c9e3e1f59b49a29
          sparse-checkout: scripts/legacy-scan
          persist-credentials: false
          path: legacy-scanner
      - name: Scan for legacy references
        run: python3 legacy-scanner/scripts/legacy-scan/scan.py --repo ts-docs --root . --output legacy-hits.md
      - name: Upload legacy hits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-hits
          path: legacy-hits.md
          if-no-files-found: error
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # PRs reuse main's npm downloads without publishing their own cache.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: npm-cache
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('.node-version', '**/package-lock.json') }}
      - name: Audit every locked npm project
        shell: bash
        run: |
          while IFS= read -r -d '' lock; do
            echo "Auditing $lock"
            npm audit --prefix "$(dirname "$lock")" --package-lock-only --ignore-scripts --audit-level=high --registry=https://registry.npmjs.org
          done < <(git ls-files -z -- '**/package-lock.json' 'package-lock.json')
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Validate prebuilt Workers publication
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          cf deploy --prebuilt --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Retain the checked site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-site
          path: |
            .cloudflare/output
            docs/.vitepress/dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # A running release finishes; the newest queued main push replaces older queued ones.
    concurrency:
      group: ts-docs-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('.node-version', '**/package-lock.json') }}
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checked-site
          path: .
      - name: Deploy the checked site to Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run deploy:site -- --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check hosted output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/check-hosted.mjs
