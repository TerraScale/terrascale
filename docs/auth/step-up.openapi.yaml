openapi: 3.1.0
info:
  title: TerraScale purpose-bound step-up API
  version: v1
  description: Supplement to platform-api.openapi.yaml; see step-up-proof.md for hosted verification and protected mutation headers.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://auth.terrascale.tech
security:
  - platformUser: []
tags:
  - name: Security
    description: Fresh primary and active MFA verification before sensitive operations.
paths:
  /v1/terrascale/step-up:
    post:
      operationId: request_step_up
      tags: [Security]
      summary: Start purpose-bound reauthentication
      description: |
        Creates a pending proof expiring within five minutes, bound to the account, authentication state,
        purpose and audience. Keep proof on the backend; send the browser only to step_up_url.
        The existing hosted session never approves the proof. Fresh password or one explicitly requested
        email code, followed by fresh active MFA when enrolled, is required. GET never sends mail.
        Valid pairs are delete_account with ts-auth or ts-dashboard, create_pat with ts-dashboard,
        and create_api_key, rotate_api_key, create_oauth_client or change_email with ts-auth.
        return_uri must be /auth/step-up/callback on a registered dashboard redirect origin without
        query or fragment. Issuance is limited to ten requests per account per fifteen-minute window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '201':
          description: Pending backend proof and hosted verification URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpBody'
        '400': { $ref: 'platform-api.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'platform-api.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '429': { description: Account issuance budget exhausted (rate_limited). }
        '503': { $ref: 'platform-api.openapi.yaml#/components/responses/Unavailable' }
  /v1/terrascale/step-up/consume:
    post:
      operationId: consume_step_up
      tags: [Security]
      summary: Consume a dashboard step-up proof
      description: |
        Accepts only ts-dashboard create_pat or delete_account. Atomically consumes the approved,
        unexpired proof for the authenticated account and current authentication state before side effects.
        Deletion requires a canonical random 32-byte unpadded base64url operation_receipt. Its response
        releases operation_grant only after commit and a final expiry check. Persist both capabilities
        privately before side effects. Auth DELETE continuation requires the exact receipt and grant
        in X-TerraScale-Deletion-Receipt and X-TerraScale-Deletion-Authorization, respectively, for fifteen days,
        with current account state and primary credential lineage. PAT consumption returns 204.
        A late or failed consume exposes no grant. After an uncertain response, start with BOTH a fresh
        proof and a new random receipt; the old receipt hash may already be reserved. Never retry automatically.
        Auth-owned key create/rotate and OAuth-client creation consume their respective ts-auth proof
        through X-TerraScale-Step-Up-Proof at the mutation endpoint, rather than this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeStepUpRequest'
      responses:
        '200':
          description: Deletion authorization acknowledgement; keep secret and persist before effects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpGrantBody'
        '204': { description: PAT proof consumed; no credential in the response. }
        '400': { $ref: 'platform-api.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'platform-api.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '503': { $ref: 'platform-api.openapi.yaml#/components/responses/Unavailable' }
components:
  securitySchemes:
    platformUser:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform management access token for the current account; this alone never approves step-up.
  responses:
    StepUpRequired:
      description: Missing, invalid, unapproved, expired, replayed or mismatched proof (step_up_required).
      content:
        application/json:
          schema:
            $ref: 'platform-api.openapi.yaml#/components/schemas/Error'
  schemas:
    StepUpRequest:
      type: object
      required: [purpose, audience, return_uri]
      properties:
        purpose:
          type: string
          enum: [delete_account, create_pat, create_api_key, rotate_api_key, create_oauth_client, change_email]
        audience:
          type: string
          enum: [ts-auth, ts-dashboard]
        return_uri:
          type: string
          format: uri
    StepUpBody:
      type: object
      required: [proof, step_up_url, expires_at]
      properties:
        proof:
          type: string
          description: Backend-only secret; never put in URLs or logs.
        step_up_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    ConsumeStepUpRequest:
      type: object
      required: [proof, purpose, audience]
      properties:
        proof:
          type: string
        purpose:
          type: string
          enum: [delete_account, create_pat]
        audience:
          type: string
          const: ts-dashboard
        operation_receipt:
          type: [string, 'null']
          description: Required for deletion and absent or null for PAT creation.
    StepUpGrantBody:
      type: object
      required: [operation_grant]
      properties:
        operation_grant:
          type: string
          description: Backend-only deletion authorization acknowledgement; never put in URLs or logs.
