openapi: 3.1.0
info:
  title: TerraScale purpose-bound step-up API
  version: v1
  description: Supplement to platform-api.openapi.yaml; see step-up-proof.md for hosted verification and protected mutation headers.
servers:
  - url: https://auth.terrascale.tech
security:
  - platformUser: []
tags:
  - name: Security
    description: Fresh primary and active MFA verification before sensitive operations.
paths:
  /v1/terrascale/step-up:
    post:
      operationId: request_step_up
      tags: [Security]
      summary: Start purpose-bound reauthentication
      description: |
        Creates a pending proof expiring within five minutes, bound to the account, authentication state,
        purpose and audience. Keep proof on the backend; send the browser only to step_up_url.
        The existing hosted session never approves the proof. Fresh password or one explicitly requested
        email code, followed by fresh active MFA when enrolled, is required. GET never sends mail.
        Valid pairs are delete_account with ts-auth or ts-dashboard, create_pat with ts-dashboard,
        and delete_organization, start_ownership_transfer, change_plan, create_api_key, rotate_api_key, create_oauth_client, update_oauth_client, rotate_oauth_client,
        create_webhook_endpoint, rotate_webhook_secret,
        change_email, add_passkey, enroll_totp or delete_passkey with ts-auth.
        return_uri must be /auth/step-up/callback on a registered dashboard redirect origin without
        query or fragment. Issuance is limited to ten requests per account per fifteen-minute window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '201':
          description: Pending backend proof and hosted verification URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpBody'
        '400': { $ref: 'platform-api.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'platform-api.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '429': { description: Account issuance budget exhausted (rate_limited). }
        '503': { $ref: 'platform-api.openapi.yaml#/components/responses/Unavailable' }
  /v1/terrascale/step-up/consume:
    post:
      operationId: consume_step_up
      tags: [Security]
      summary: Consume a dashboard step-up proof
      description: |
        Accepts ts-dashboard create_pat, ts-auth change_plan, ts-auth delete_organization, or ts-dashboard delete_account.
        Atomically consumes the approved, unexpired proof for the authenticated account and current authentication
        state before side effects. change_plan and delete_organization consume their proof single-use for the signed-in
        user and the organization it was minted for and return 204; the dashboard binds the resume to that organization
        via its one-use encrypted, organization-pinned intent. A consumed delete_organization proof then authorizes one
        DELETE /v1/terrascale/organizations/{organization} of that organization for the same account and authentication
        state, sent in X-TerraScale-Step-Up-Proof before the proof's five-minute deadline; that delete spends it.
        delete_account requires a canonical random 32-byte unpadded base64url operation_receipt. Its response
        releases operation_grant only after commit and a final expiry check. Persist both capabilities
        privately before side effects. Auth DELETE continuation requires the exact receipt and grant
        in X-TerraScale-Deletion-Receipt and X-TerraScale-Deletion-Authorization, respectively, for fifteen days,
        with current account state and primary credential lineage. PAT consumption returns 204.
        A late or failed consume exposes no grant. After an uncertain response, start with BOTH a fresh
        proof and a new random receipt; the old receipt hash may already be reserved. Never retry automatically.
        Auth-owned key rotation and OAuth-client creation consume their respective ts-auth proof
        through X-TerraScale-Step-Up-Proof at the mutation endpoint, rather than this endpoint.
        API-key creation, at ts-auth and in the dashboard, needs only the signed-in session (the dashboard
        form also its CSRF token) and consumes no proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeStepUpRequest'
      responses:
        '200':
          description: Deletion authorization acknowledgement; keep secret and persist before effects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpGrantBody'
        '204': { description: 'create_pat, change_plan or delete_organization proof consumed; no credential in the response.' }
        '400': { $ref: 'platform-api.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'platform-api.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '503': { $ref: 'platform-api.openapi.yaml#/components/responses/Unavailable' }
components:
  securitySchemes:
    platformUser:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform management access token for the current account; this alone never approves step-up.
  responses:
    StepUpRequired:
      description: Missing, invalid, unapproved, expired, replayed or mismatched proof (step_up_required).
      content:
        application/json:
          schema:
            $ref: 'platform-api.openapi.yaml#/components/schemas/Error'
  schemas:
    StepUpRequest:
      type: object
      required: [purpose, audience, return_uri]
      properties:
        purpose:
          type: string
          enum: [delete_account, delete_organization, start_ownership_transfer, change_plan, create_pat, create_api_key, rotate_api_key, create_oauth_client, update_oauth_client, rotate_oauth_client, create_webhook_endpoint, rotate_webhook_secret, change_email, add_passkey, enroll_totp]
        audience:
          type: string
          enum: [ts-auth, ts-dashboard]
        return_uri:
          type: string
          format: uri
        organization_id:
          type: string
          description: Required for and binds delete_organization, start_ownership_transfer and change_plan proofs; refused for other purposes.
    StepUpBody:
      type: object
      required: [proof, step_up_url, expires_at]
      properties:
        proof:
          type: string
          description: Backend-only secret; never put in URLs or logs.
        step_up_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    ConsumeStepUpRequest:
      type: object
      required: [proof, purpose, audience]
      properties:
        proof:
          type: string
        purpose:
          type: string
          enum: [delete_account, create_pat, change_plan, delete_organization]
        audience:
          type: string
          enum: [ts-dashboard, ts-auth]
          description: ts-dashboard for delete_account and create_pat, ts-auth for change_plan and delete_organization.
        operation_receipt:
          type: [string, 'null']
          description: Required for delete_account and absent or null for every other purpose.
    StepUpGrantBody:
      type: object
      required: [operation_grant]
      properties:
        operation_grant:
          type: string
          description: Backend-only deletion authorization acknowledgement; never put in URLs or logs.
