openapi: 3.1.0
info:
  title: Project account unlock
  version: v1
paths:
  /v1/{project}/attack-protection/unlock:
    get:
      operationId: unlock_project_account
      summary: Redeem a single-use account unlock link
      security: []
      parameters:
        - name: project
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        - name: user
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        - name: token
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
      responses:
        '429':
          description: Shared IP request budget exhausted
        '200':
          description: Generic acknowledgement for valid and invalid links
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            text/plain:
              schema: { type: string }
