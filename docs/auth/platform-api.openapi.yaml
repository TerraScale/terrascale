      summary: Verify the SSO connection's domain
      description: Needs the owner role. Looks up the TXT record named in verification; 409 domain_unverified until it carries the value. Once verified, no other organization can take the domain, and every account of the domain signs in through the identity provider on the hosted sign-in page (new accounts join with default_role), except the organization's owners, who keep email-code and password sign-in.
      responses:
        '200':
          description: The verified connection.
          content:
