    post:
      operationId: oauth_device_authorization
      tags: [OAuth]
      summary: Device authorization endpoint
      description: RFC 8628 for the public ts-cli client (client_id 00000000000000000000000007). verification_uri is ts-auth's hosted page, {issuer origin}/ui/terrascale/device, where the user signs in and approves or denies; codes live 10 minutes and interval is 5.
      security: [{}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/DeviceAuthorizationRequest' }
      responses:
        '200':
          description: The device and user codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthorizationResponse' }
        '400':
          description: invalid_request, invalid_client, unauthorized_client or invalid_scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /terrascale/oauth/token:
    post:
      operationId: oauth_token
      tags: [OAuth]
      summary: Token endpoint
      description: |
        The grants this contract adds. The existing ones (authorization_code, refresh_token, device_code)
        are unchanged and described in the served OpenAPI. Tokens are ES256 JWTs with typ at+jwt;
        docs/platform-contract.md section 6.3 lists their claims. Token exchange refuses primary-only sign-in
        tokens for users with active MFA; unavailable or corrupt MFA state answers 503 temporarily_unavailable.
        User tokens preserve server-issued numeric auth_time (Unix seconds) through refresh and exchange;
        submitted auth_time is ignored. Exchange requires a nonnegative integer no more than 30 seconds ahead
        of the exchanging replica; missing, malformed, negative or further-ahead values answer invalid_grant.
        Machine tokens omit auth_time; accepted time is copied unchanged without clamping or renewal.
        Refresh and exchange do not prove MFA completion or renew authentication.
      security:
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ClientCredentialsGrant'
                - $ref: '#/components/schemas/TokenExchangeGrant'
                - $ref: '#/components/schemas/DeviceCodeGrant'
                - $ref: '#/components/schemas/GitHubActionsGrant'
            examples:
              apiKey:
                summary: An organization API key, for a project token
                value:
                  grant_type: client_credentials
                  project: 01M4EQ2FRJ8S8B29E8TQVWNW4K
                  scope: documents:read documents:write
              user:
                summary: A user's sign-in token, for a project token
                value:
                  grant_type: urn:ietf:params:oauth:grant-type:token-exchange
                  subject_token: eyJhbGciOiJFUzI1NiIsInR5cCI6ImF0K2p3dCJ9…
                  subject_token_type: urn:ietf:params:oauth:token-type:access_token
                  organization: 01M4EQ2FRJ8S8B29E8TQVWNW4J
                  project: 01M4EQ2FRJ8S8B29E8TQVWNW4K
              githubActions:
                summary: The bound GitHub Actions e2e workload's OIDC token, for a project token of the e2e project
                value:
                  grant_type: urn:terrascale:params:oauth:grant-type:github-actions
                  client_id: 01M4GHA0E2E000000000000000
                  subject_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9…
      responses:
        '200':
          description: An organization or project access token.
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: invalid_request, unsupported_grant_type, unauthorized_client, invalid_grant, invalid_scope or invalid_target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: invalid_client; unknown, wrong, revoked and expired keys answer alike.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429':
          description: rate_limited.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '503':
          description: temporarily_unavailable; the request could not be checked, or storage did not answer within 10 seconds (then with Retry-After).
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
components:
  securitySchemes:
    platformUser:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A sign-in access token of the terrascale tenant (typ at+jwt, aud including the issuer). Organization,
        project, API key and service tokens are refused. The user's authentication epoch must still match;
        primary-only tokens for active MFA accounts are refused. Unavailable or corrupt MFA state fails closed.
    apiKeyToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token the token endpoint issued for an API key (client credentials), carrying key_id and key_gen.
    clientBasic:
      type: http
      scheme: basic
      description: OAuth client authentication; for an API key, the key id and the whole key string.
    platformClient:
      type: http
      scheme: basic
      description: A confidential service client from TS_AUTH_SERVICE_CLIENTS whose id is listed in TS_AUTH_PLATFORM_CLIENTS.
  headers:
    Location:
      description: The created resource.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait.
      schema: { type: integer }
  parameters:
    Organization:
      name: organization
      in: path
      required: true
      description: Organization id.
      schema: { $ref: '#/components/schemas/Ulid' }
    Project:
      name: project
      in: path
      required: true
      description: Project id, also its tenant slug.
      schema: { $ref: '#/components/schemas/Ulid' }
    User:
      name: user
      in: path
      required: true
      description: User id (the sub of its tokens).
      schema: { $ref: '#/components/schemas/Ulid' }
    Invitation:
      name: invitation
      in: path
      required: true
      description: Invitation id.
      schema: { $ref: '#/components/schemas/Ulid' }
    Key:
      name: key
      in: path
      required: true
      description: API key id.
      schema: { $ref: '#/components/schemas/ApiKeyId' }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    After:
      name: after
      in: query
      required: false
      description: The previous page's next.
      schema: { type: string }
  responses:
    BadRequest:
      description: invalid_request, or name_taken-style input errors listed on the operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: invalid_request, message: The request is invalid. } }
    Unauthorized:
      description: unauthorized; no valid platform sign-in token.
      headers:
        WWW-Authenticate:
          description: Bearer
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: forbidden_role, mfa_required (the organization requires two-factor authentication and the caller has none), or for invitations email_mismatch.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: not_found; also for anything the caller cannot see.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: name_taken, not_empty, last_owner, already_member, invitation_pending, invitation_expired, not_pending, rotation_pending, closure_conflict, binding_conflict or mfa_not_enrolled.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: temporarily_unavailable; storage could not complete the request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Ulid:
      type: string
      minLength: 26
      maxLength: 26
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      example: 01M4EQ2FRJ8S8B29E8TQVWNW4J
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    Name:
      type: string
      minLength: 1
      maxLength: 128
      description: Trimmed; contains a letter or digit and no control characters.
    Email:
      type: string
      format: email
      maxLength: 254
    OrganizationRole:
      type: string
      enum: [viewer, member, admin, owner]
    ProjectRole:
      type: string
      enum: [viewer, member, admin]
    Scope:
      type: string
      enum: ['databases:read', 'databases:write', 'documents:read', 'documents:write', 'usage:read', 'billing:read', 'billing:write']
    ApiKeyId:
      type: string
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      example: 01M4EQ2FRJ8S8B29E8TQVWNW4K
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }
    NameRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/Name' }
    Organization:
      type: object
      required: [id, name, created_by, created_at, role, require_mfa]
      properties:
        require_mfa: { type: boolean, description: Whether members need an active second factor to reach it. }
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        created_by: { $ref: '#/components/schemas/Ulid' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        role:
          description: The caller's organization role; null for a collaborator.
          oneOf:
            - $ref: '#/components/schemas/OrganizationRole'
            - type: 'null'
      example:
        id: 01M4EQ2FRJ8S8B29E8TQVWNW4J
        name: Acme
        created_by: 01M4EQ2FRJ8S8B29E8TQVWNW4M
        created_at: '2026-10-06T12:00:00Z'
        role: owner
    SsoConnectionRequest:
      type: object
      required: [domain, oidc]
      additionalProperties: false
      properties:
        domain: { type: string, description: 'The members'' email domain.' }
        protocol: { type: string, enum: [oidc], default: oidc }
        default_role: { type: string, enum: [viewer, member, admin], default: member }
        oidc:
          type: object
          required: [issuer, client_id]
          additionalProperties: false
          properties:
            issuer: { type: string, format: uri, description: 'https issuer; {issuer}/.well-known/openid-configuration must name it.' }
            client_id: { type: string, minLength: 1, maxLength: 256 }
            client_secret: { type: string, maxLength: 1024, writeOnly: true, description: 'Required for a new connection; omit to keep the stored one.' }
      example:
        domain: acme.com
        default_role: member
        oidc: { issuer: 'https://idp.acme.com/realms/acme', client_id: terrascale, client_secret: synthetic-example-secret }
    SsoConnection:
      type: object
      required: [organization_id, domain, domain_verified, verified_at, verification, protocol, default_role, oidc, created_at, updated_at]
      properties:
        organization_id: { $ref: '#/components/schemas/Ulid' }
        domain: { type: string }
        domain_verified: { type: boolean }
        verified_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        verification:
          type: object
          required: [type, name, value]
          properties:
            type: { type: string, const: TXT }
            name: { type: string }
            value: { type: string }
        protocol: { type: string, enum: [oidc] }
        default_role: { type: string, enum: [viewer, member, admin] }
        oidc:
          oneOf:
            - type: object
              required: [issuer, client_id, client_secret_set, redirect_uri]
              properties:
                issuer: { type: string }
                client_id: { type: string }
                client_secret_set: { type: boolean }
                redirect_uri: { type: string, description: 'Register it at the identity provider.' }
            - type: 'null'
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
      example:
        organization_id: 01M4EQ2FRJ8S8B29E8TQVWNW4J
        domain: acme.com
        domain_verified: false
        verified_at: null
        verification: { type: TXT, name: _terrascale-sso.acme.com, value: terrascale-sso-verification=Q2xLb3d0ZXN0VmFsdWVPbmx5Rm9yRG9jcw }
        protocol: oidc
        default_role: member
        oidc: { issuer: 'https://idp.acme.com/realms/acme', client_id: terrascale, client_secret_set: true, redirect_uri: 'https://auth.terrascale.tech/ui/terrascale/sso/callback' }
        created_at: '2026-10-24T12:00:00Z'
        updated_at: '2026-10-24T12:00:00Z'
    OrganizationPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
        next: { type: ['string', 'null'] }
    OrganizationRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/OrganizationRole' }
    ProjectRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/ProjectRole' }
    Member:
      type: object
      required: [user_id, email, role, joined_at]
      properties:
        user_id: { $ref: '#/components/schemas/Ulid' }
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/OrganizationRole' }
        joined_at: { $ref: '#/components/schemas/Timestamp' }
    MemberPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        next: { type: ['string', 'null'] }
    Project:
      type: object
      required: [id, organization_id, name, issuer, created_by, created_at, role, allowed_cidrs]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        organization_id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        issuer:
          type: [string, 'null']
          format: uri
          description: The project tenant's issuer, {public origin}/{project id}.
        created_by: { $ref: '#/components/schemas/Ulid' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        role:
          $ref: '#/components/schemas/ProjectRole'
        allowed_cidrs:
          type: array
          maxItems: 32
          description: IPv4 or IPv6 CIDRs or addresses every API key token of the project must be used from, stored canonical (host bits cleared, an address as /32 or /128); empty allows any address.
          items: { type: string }
      example:
        id: 01M4EQ2FRJ8S8B29E8TQVWNW4K
        organization_id: 01M4EQ2FRJ8S8B29E8TQVWNW4J
        name: Production
        issuer: null
        created_by: 01M4EQ2FRJ8S8B29E8TQVWNW4M
        created_at: '2026-10-06T12:00:00Z'
        role: admin
        allowed_cidrs: []
    ProjectPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        next: { type: ['string', 'null'] }
    ProjectMember:
      type: object
      required: [user_id, email, role, granted_at]
      properties:
        user_id: { $ref: '#/components/schemas/Ulid' }
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/ProjectRole' }
        granted_at: { $ref: '#/components/schemas/Timestamp' }
    ProjectMemberPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectMember' }
        next: { type: ['string', 'null'] }
    CreateInvitationRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { $ref: '#/components/schemas/Email' }
        role:
          description: An organization role without project_id, a project role with it.
          type: string
          enum: [viewer, member, admin, owner]
        project_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    Invitation:
      type: object
      required: [id, email, role, project_id, invited_by, created_at, expires_at, status]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        email: { $ref: '#/components/schemas/Email' }
        role: { type: string, enum: [viewer, member, admin, owner] }
        project_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        invited_by: { $ref: '#/components/schemas/Ulid' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        status: { type: string, enum: [pending, accepted, declined, revoked, expired] }
    InvitationCreated:
      type: object
      required: [invitation, token]
      properties:
        invitation: { $ref: '#/components/schemas/Invitation' }
        token:
          type: string
          pattern: '^tsi_[0-9a-hjkmnp-tv-z]{52}$'
          description: Shown once; also emailed to the invitee.
    InvitationPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        next: { type: ['string', 'null'] }
    InvitationTokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string }
    InvitationLookup:
      type: object
      required: [organization, project, email, role, expires_at]
      properties:
        organization:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            name: { type: string }
        project:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { $ref: '#/components/schemas/Ulid' }
                name: { type: string }
            - type: 'null'
        email: { $ref: '#/components/schemas/Email' }
        role: { type: string, enum: [viewer, member, admin, owner] }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    AcceptedInvitation:
      type: object
      required: [organization_id, project_id, role]
      properties:
        organization_id: { $ref: '#/components/schemas/Ulid' }
        project_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        role: { type: string, enum: [viewer, member, admin, owner] }
    StartTransferRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { $ref: '#/components/schemas/Ulid' }
    OwnershipTransfer:
      type: object
      required: [from_user_id, to_user_id, created_at, expires_at]
      properties:
        from_user_id: { $ref: '#/components/schemas/Ulid' }
        to_user_id: { $ref: '#/components/schemas/Ulid' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    CreateOrganizationApiKeyRequest:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/Name' }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Scope' }
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        allowed_cidrs:
          type: array
          maxItems: 32
          description: IPv4 or IPv6 CIDRs or addresses its tokens must be used from, stored canonical (host bits cleared, an address as /32 or /128); empty allows any address.
          items: { type: string }
    CreateProjectApiKeyRequest:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/Name' }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Scope' }
        database:
          description: A TerraBase database name; the key then reaches only that database.
          oneOf:
            - type: string
              pattern: '^[a-z][a-z0-9_-]{0,62}$'
            - type: 'null'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        allowed_cidrs:
          type: array
          maxItems: 32
          description: IPv4 or IPv6 CIDRs or addresses its tokens must be used from, stored canonical (host bits cleared, an address as /32 or /128); empty allows any address.
          items: { type: string }
    AllowedCidrsRequest:
      type: object
      required: [allowed_cidrs]
      additionalProperties: false
      properties:
        allowed_cidrs:
          type: array
          maxItems: 32
          description: IPv4 or IPv6 CIDRs or addresses its tokens must be used from, stored canonical (host bits cleared, an address as /32 or /128); empty allows any address.
          items: { type: string }
    RotateApiKeyRequest:
      type: object
      additionalProperties: false
      properties:
        previous_secret_ttl:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
          description: Seconds the previous secret keeps working.
    ApiKey:
      type: object
      required: [id, name, organization_id, project_id, database, scopes, created_by, created_at, expires_at, previous_secret_expires_at, last_used_at, allowed_cidrs]
      properties:
        id: { $ref: '#/components/schemas/ApiKeyId' }
        name: { type: string }
        organization_id: { $ref: '#/components/schemas/Ulid' }
        project_id:
          description: null for an organization key.
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        database: { type: ['string', 'null'] }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        created_by: { $ref: '#/components/schemas/Ulid' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        previous_secret_expires_at:
          description: Until when the secret before the last rotation still works; null when it no longer does.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_used_at:
          description: The key's last successful token exchange, up to 5 minutes stale; null when it was never used.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        allowed_cidrs:
          type: array
          maxItems: 32
          description: IPv4 or IPv6 CIDRs or addresses its tokens must be used from, stored canonical (host bits cleared, an address as /32 or /128); empty allows any address.
          items: { type: string }
    ApiKeySecret:
      type: object
      required: [api_key, key]
      properties:
        api_key: { $ref: '#/components/schemas/ApiKey' }
        key:
          type: string
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}_[0-9a-hjkmnp-tv-z]{52}$'
          description: The whole key string, shown once. Its first 24 characters are the id.
    ApiKeyPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiKey' }
        next: { type: ['string', 'null'] }
    AuditEvent:
      type: object
      required: [id, actor, action, target, detail, occurred_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        actor: { type: string, description: 'The acting user id.' }
        action:
          type: string
          enum:
            - organization.created
            - organization.renamed
            - member.role_changed
            - member.removed
            - member.left
            - member.joined
            - invitation.created
            - invitation.revoked
            - invitation.accepted
            - invitation.declined
            - ownership.transfer_started
            - ownership.transfer_confirmed
            - ownership.transfer_cancelled
            - project.created
            - project.renamed
            - project.deleted
            - project_member.role_set
            - project_member.removed
            - api_key.created
            - api_key.rotated
            - api_key.revoked
            - project.suspended
            - project.unsuspended
        target: { type: ['string', 'null'], description: 'A user id, email, project id or key id.' }
        detail: { type: ['string', 'null'], description: 'The new role, name or scopes.' }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
    AuditEventPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        next: { type: ['string', 'null'] }
    SuspendRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 256 }
    Suspension:
      type: object
      required: [project_id, reason, suspended_at]
      properties:
        project_id: { $ref: '#/components/schemas/Ulid' }
        reason: { type: string }
        suspended_at: { $ref: '#/components/schemas/Timestamp' }
    DeviceAuthorizationRequest:
      type: object
      required: [client_id]
      properties:
        client_id: { type: string, const: '00000000000000000000000007', description: The ts-cli client. }
        scope: { type: string, description: 'For example openid email offline_access.' }
    DeviceAuthorizationResponse:
      type: object
      required: [device_code, user_code, verification_uri, expires_in, interval]
      properties:
        device_code: { type: string }
        user_code: { type: string }
        verification_uri: { type: string, format: uri }
        verification_uri_complete: { type: string, format: uri }
        expires_in: { type: integer }
        interval: { type: integer }
    DeviceCodeGrant:
      type: object
      description: ts-cli polling for the tokens of an approved device code (RFC 8628).
      required: [grant_type, device_code, client_id]
      properties:
        grant_type: { type: string, const: 'urn:ietf:params:oauth:grant-type:device_code' }
        device_code: { type: string }
        client_id: { type: string, const: '00000000000000000000000007', description: The ts-cli client. }
    ClientCredentialsGrant:
      type: object
      description: An API key exchanged for an organization or project token.
      required: [grant_type]
      properties:
        grant_type: { type: string, const: client_credentials }
        project:
          $ref: '#/components/schemas/Ulid'
          description: Organization keys, the project to act in (omit for an organization token); project keys, optional and equal to the key's.
        scope:
          type: string
          description: Space-separated subset of the key's scopes; default all of them.
        client_id: { type: string, description: 'With client_secret_post, the key id.' }
        client_secret: { type: string, description: 'With client_secret_post, the whole key string.' }
    GitHubActionsGrant:
      type: object
      description: |
        The bound GitHub Actions workload (docs/auth/github-actions-oidc.md): a GitHub Actions OIDC token of
        TerraScale/terrascale's ci.yml on a push to main, audience the platform issuer, used once, for a 15-minute
        project token of the bound e2e project. Refused with invalid_client until an operator binds the workload.
      required: [grant_type, client_id, subject_token]
      properties:
        grant_type: { type: string, const: 'urn:terrascale:params:oauth:grant-type:github-actions' }
        client_id: { type: string, const: '01M4GHA0E2E000000000000000' }
        subject_token: { type: string, description: 'The GitHub Actions OIDC token (RS256, signed by GitHub).' }
        scope:
          type: string
          description: Space-separated subset of databases:read databases:write documents:read documents:write; default all four.
    TokenExchangeGrant:
      type: object
      description: A user's sign-in access token exchanged for an organization or project token (RFC 8693).
      required: [grant_type, subject_token, subject_token_type, organization]
      properties:
        grant_type: { type: string, const: 'urn:ietf:params:oauth:grant-type:token-exchange' }
        subject_token: { type: string, description: 'A sign-in access token of this tenant, issued to the same client.' }
        subject_token_type: { type: string, const: 'urn:ietf:params:oauth:token-type:access_token' }
        organization: { $ref: '#/components/schemas/Ulid' }
        project:
          $ref: '#/components/schemas/Ulid'
          description: Omit for an organization token.
        scope:
          type: string
          description: Space-separated subset of what the user's role allows; default all of it.
        client_id: { type: string, description: 'A public client, or a confidential one with client_secret_post.' }
        client_secret: { type: string }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string, description: 'ES256 JWT, typ at+jwt.' }
        issued_token_type: { type: string, const: 'urn:ietf:params:oauth:token-type:access_token', description: 'Token exchange only.' }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, maximum: 900 }
        scope: { type: string }
