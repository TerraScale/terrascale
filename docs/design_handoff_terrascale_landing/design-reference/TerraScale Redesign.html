<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TerraScale — Redesign Exploration</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: 'Quantico';
    src: url('fonts/quantico.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Quantico';
    src: url('fonts/quantico-bold.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('fonts/jetbrains-mono.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('fonts/jetbrains-mono-bold.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap;
  }
</style>

<style>
  [data-theme="focused"] {
    --ts-bg-base: #050508;
    --ts-bg-base-raw: 5, 5, 8;
    --ts-bg-surface: #09090F;
    --ts-bg-card: #0B0B14;
    --ts-code-bg: #07070D;
    --ts-divider: #15151F;

    --ts-primary: #2563EB;
    --ts-primary-light: #60A5FA;
    --ts-primary-rgb: 37, 99, 235;
    --ts-secondary: #10B981;
    --ts-secondary-rgb: 16, 185, 129;
    --ts-tertiary: #8B5CF6;
    --ts-tertiary-rgb: 139, 92, 246;

    --ts-text: #F1F5F9;
    --ts-text-muted: #9BACCB;

    --ts-glass-bg: rgba(37, 99, 235, 0.04);
    --ts-glass-border: rgba(148, 163, 184, 0.16);
    --ts-grid-color: rgba(37, 99, 235, 0.055);

    --ts-hero-glow-top: rgba(37, 99, 235, 0.22);
    --ts-hero-glow-mid: rgba(37, 99, 235, 0.10);
    --ts-hero-glow-accent: rgba(16, 185, 129, 0.05);

    --ts-gradient-primary: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
  }

  [data-theme="indigo"] {
    --ts-bg-base: #07060F;
    --ts-bg-base-raw: 7, 6, 15;
    --ts-bg-surface: #0B0A18;
    --ts-bg-card: #100F1E;
    --ts-code-bg: #09081A;
    --ts-divider: #1A1830;

    --ts-primary: #6366F1;
    --ts-primary-light: #A5B4FC;
    --ts-primary-rgb: 99, 102, 241;
    --ts-secondary: #F59E0B;
    --ts-secondary-rgb: 245, 158, 11;
    --ts-tertiary: #A78BFA;
    --ts-tertiary-rgb: 167, 139, 250;

    --ts-text: #F1F5F9;
    --ts-text-muted: #A0A8CC;

    --ts-glass-bg: rgba(99, 102, 241, 0.06);
    --ts-glass-border: rgba(148, 148, 200, 0.16);
    --ts-grid-color: rgba(99, 102, 241, 0.06);

    --ts-hero-glow-top: rgba(99, 102, 241, 0.28);
    --ts-hero-glow-mid: rgba(139, 92, 246, 0.14);
    --ts-hero-glow-accent: rgba(245, 158, 11, 0.06);

    --ts-gradient-primary: linear-gradient(135deg, #818CF8 0%, #6366F1 50%, #A78BFA 100%);
  }

  [data-theme="arctic"] {
    --ts-bg-base: #030309;
    --ts-bg-base-raw: 3, 3, 9;
    --ts-bg-surface: #09090F;
    --ts-bg-card: #0E0E18;
    --ts-code-bg: #060610;
    --ts-divider: #17172A;

    --ts-primary: #0EA5E9;
    --ts-primary-light: #38BDF8;
    --ts-primary-rgb: 14, 165, 233;
    --ts-secondary: #22C55E;
    --ts-secondary-rgb: 34, 197, 94;
    --ts-tertiary: #A855F7;
    --ts-tertiary-rgb: 168, 85, 247;

    --ts-text: #F8FAFC;
    --ts-text-muted: #A8B8D0;

    --ts-glass-bg: rgba(255, 255, 255, 0.05);
    --ts-glass-border: rgba(14, 165, 233, 0.18);
    --ts-grid-color: rgba(14, 165, 233, 0.06);

    --ts-hero-glow-top: rgba(14, 165, 233, 0.26);
    --ts-hero-glow-mid: rgba(56, 189, 248, 0.12);
    --ts-hero-glow-accent: rgba(34, 197, 94, 0.06);

    --ts-gradient-primary: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 50%, #06B6D4 100%);
  }

  [data-glass="strong"] {
    --ts-glass-bg: rgba(var(--ts-primary-rgb), 0.1);
  }
  [data-glass="subtle"] {
    --ts-glass-bg: rgba(var(--ts-primary-rgb), 0.025);
  }

  :root {
    --ts-font-body: 'Quantico', system-ui, -apple-system, sans-serif;
    --ts-font-accent: 'Roboto', system-ui, sans-serif;
    --ts-font-mono: 'Roboto Mono', 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--ts-font-body);
    background: var(--ts-bg-base);
    color: var(--ts-text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  #app { min-height: 100vh; }

  @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @keyframes float-up {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-20px) rotate(1deg); }
  }
  @keyframes float-down {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(18px) rotate(-1deg); }
  }
  .pulse-dot { animation: pulse-soft 2.2s ease-in-out infinite; }
  .float-up   { animation: float-up   14s ease-in-out infinite; }
  .float-down { animation: float-down 16s ease-in-out infinite; }

  .reveal {
    opacity: 0;
    transform: translateY(22px);
    filter: blur(4px);
    transition:
      opacity 720ms cubic-bezier(.22, 1, .36, 1),
      transform 720ms cubic-bezier(.22, 1, .36, 1),
      filter 720ms cubic-bezier(.22, 1, .36, 1);
    will-change: opacity, transform, filter;
  }
  .reveal.is-in {
    opacity: 1;
    transform: none;
    filter: none;
  }
  .reveal-stagger > .reveal { transition-delay: 0ms; }
  .reveal-stagger.is-in > .reveal:nth-child(1) { transition-delay: 0ms; }
  .reveal-stagger.is-in > .reveal:nth-child(2) { transition-delay: 80ms; }
  .reveal-stagger.is-in > .reveal:nth-child(3) { transition-delay: 160ms; }
  .reveal-stagger.is-in > .reveal:nth-child(4) { transition-delay: 240ms; }
  .reveal-stagger.is-in > .reveal:nth-child(5) { transition-delay: 320ms; }
  .reveal-stagger.is-in > .reveal:nth-child(6) { transition-delay: 400ms; }

  .ts-tile-hover { transition: transform 260ms cubic-bezier(.2,.8,.2,1), box-shadow 260ms ease, border-color 260ms ease; }
  .ts-tile-hover:hover { transform: translateY(-3px); }

  .link-wipe { position: relative; }
  .link-wipe::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -2px; height: 1px;
    background: currentColor; transform: scaleX(0); transform-origin: left center;
    transition: transform 340ms cubic-bezier(.22,1,.36,1);
  }
  .link-wipe:hover::after { transform: scaleX(1); }

  @keyframes shine-sweep {
    0%   { transform: translateX(-120%) skewX(-18deg); }
    100% { transform: translateX(260%)  skewX(-18deg); }
  }
  .cta-shine { position: relative; overflow: hidden; isolation: isolate; }
  .cta-shine::before {
    content: '';
    position: absolute; top: 0; left: 0; width: 50%; height: 100%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,0.18) 50%,
      transparent 100%);
    transform: translateX(-120%) skewX(-18deg);
    pointer-events: none;
    z-index: 1;
  }
  .cta-shine:hover::before {
    animation: shine-sweep 900ms cubic-bezier(.4,0,.2,1);
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1);   opacity: 0.82; }
    50%      { transform: scale(1.04); opacity: 1; }
  }
  .breathe { animation: breathe 5.5s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .reveal, .reveal.is-in { opacity: 1; transform: none; filter: none; transition: none; }
    .pulse-dot, .float-up, .float-down, .breathe { animation: none; }
    .cta-shine::before { display: none; }
  }

  body[data-atmosphere="minimal"] {
    --ts-atmo-mult: 0.35;
    --ts-atmo-grid-opacity: 0.35;
    --ts-atmo-float-opacity: 0;
  }
  body[data-atmosphere="standard"] {
    --ts-atmo-mult: 1;
    --ts-atmo-grid-opacity: 0.7;
    --ts-atmo-float-opacity: 1;
  }
  body[data-atmosphere="dramatic"] {
    --ts-atmo-mult: 1.9;
    --ts-atmo-grid-opacity: 1;
    --ts-atmo-float-opacity: 1.25;
  }

  .float-up, .float-down { opacity: var(--ts-atmo-float-opacity, 1); transition: opacity 300ms; }

  .hero-atmo-overlay {
    position: absolute; inset: 0; pointer-events: none;
    opacity: var(--ts-atmo-mult, 1);
    transition: opacity 350ms ease;
  }
  .hero-grid-overlay {
    position: absolute; inset: 0; pointer-events: none;
    opacity: var(--ts-atmo-grid-opacity, 0.7);
    transition: opacity 350ms ease;
    background-image:
      linear-gradient(var(--ts-grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--ts-grid-color) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .hero-scan-overlay {
    position: absolute; inset: 0; pointer-events: none;
    opacity: calc(0.12 * var(--ts-atmo-mult, 1));
    background-image: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.02) 50%);
    background-size: 100% 4px;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--ts-bg-base); }
  ::-webkit-scrollbar-thumb {
    background: var(--ts-divider); border-radius: 5px;
    border: 2px solid var(--ts-bg-base);
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(var(--ts-primary-rgb), 0.4); }

</style>
</head>
<body data-theme="focused" data-glass="subtle" data-atmosphere="dramatic">

<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ts-sections-1.jsx"></script>
<script type="text/babel" src="ts-sections-2.jsx"></script>
<script type="text/babel" src="ts-sections-3.jsx"></script>
<script type="text/babel" src="ts-pages.jsx"></script>
<script type="text/babel" src="ts-pricing-page.jsx"></script>

<script type="text/babel">
  function useScrollReveal(deps) {
    useEffect(() => {
      requestAnimationFrame(() => {
        const root = document.getElementById('app');
        if (!root) return;
        const sections = root.querySelectorAll('section');
        sections.forEach(s => {
          s.classList.add('reveal');
          s.querySelectorAll(':scope > div, :scope > *').forEach(el => {
            const cs = getComputedStyle(el);
            if (cs.display.includes('grid') && el.children.length >= 2 && el.children.length <= 6) {
              el.classList.add('reveal-stagger');
              Array.from(el.children).forEach(c => c.classList.add('reveal'));
            }
          });
        });

        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add('is-in');
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

        root.querySelectorAll('.reveal').forEach(el => io.observe(el));

        window.__ts_reveal_io = io;
      });

      return () => {
        if (window.__ts_reveal_io) {
          window.__ts_reveal_io.disconnect();
          window.__ts_reveal_io = null;
        }
        document.querySelectorAll('.reveal, .reveal-stagger').forEach(el => {
          el.classList.remove('reveal', 'reveal-stagger', 'is-in');
        });
      };
    }, deps);
  }

  function App() {
    const [page, setPage] = useState(() => {
      try { return localStorage.getItem('ts-page') || 'home'; } catch { return 'home'; }
    });
    const setPageAndSave = (p) => {
      setPage(p);
      try { localStorage.setItem('ts-page', p); } catch {}
      requestAnimationFrame(() => window.scrollTo({ top: 0 }));
    };

    useScrollReveal([page]);
    return (
      <React.Fragment>
        <Header currentPage={page} setPage={setPageAndSave} />
        {page === 'home' && <React.Fragment>
          <HeroSection />
          <FeaturesSection />
          <CodePanelSection />
          <PricingSection />
          <CtaSection />
        </React.Fragment>}
        {page === 'pricing' && <PricingPage />}
        {page === 'contact' && <ContactPage />}
        <Footer setPage={setPageAndSave} />
      </React.Fragment>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('app'));
  root.render(<App />);
</script>
</body>
</html>
