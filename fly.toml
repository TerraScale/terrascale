app = "ts-dashboard"
primary_region = "gru"
swap_size_mb = 900

[env]
  DASHBOARD_ADDR = ":8080"
  TS_DASHBOARD_PRODUCTION_DEMO = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the in-memory demo warm. Auto-start can wake stopped Machines if
  # operators provision them; Fly Proxy does not create Machines on requests.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health/ready"
  protocol = "http"
  timeout = "5s"
