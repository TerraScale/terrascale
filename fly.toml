app = "ts-dashboard-2"
primary_region = "gru"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"

[http_service]
  internal_port = 8080
  force_https = true
  # Single always-on machine: never auto-stop, never spawn an HA replica.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
