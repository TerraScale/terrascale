app = "ts-dashboard-2"
primary_region = "gru"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  TS_DASHBOARD_PRODUCTION_DEMO = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Single machine that sleeps when idle and wakes on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
