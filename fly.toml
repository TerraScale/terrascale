app = "ts-dashboard"
primary_region = "gru"
swap_size_mb = 4096

# Fly delivers secrets; the application discovers ts-auth and TerraBase in code.

[http_service]
  internal_port = 8080
  force_https = true
  # The rollout provisions one always-running Machine in gru, sjc and fra.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/readyz"
  protocol = "http"
  timeout = "5s"
