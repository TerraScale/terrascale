app = "ts-dashboard"
primary_region = "gru"
swap_size_mb = 900

[env]
  DASHBOARD_ADDR = ":8080"
  # Production keeps its state in TerraBase (the TERRABASE_* secrets), so it
  # never runs the in-memory demo.
  # GlitchTip project; the DSN key only permits sending events.
  SENTRY_DSN = "https://116f3420d22b471e905488aecd859878@glitchtip.mariogk.com/1"
  DASHBOARD_CSP_REPORT_URL = "https://glitchtip.mariogk.com/api/1/security/?glitchtip_key=116f3420d22b471e905488aecd859878"
  # ts-auth sign-in takes TS_AUTH_ISSUER, TS_AUTH_CLIENT_ID and
  # TS_AUTH_CLIENT_SECRET as secrets; the issuer is regional:
  # https://gru.auth.terrascale.tech/<instance>.

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one Machine warm. Auto-start can wake stopped Machines if
  # operators provision them; Fly Proxy does not create Machines on requests.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health/ready"
  protocol = "http"
  timeout = "5s"
