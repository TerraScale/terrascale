app = "ts-dashboard"
primary_region = "gru"
swap_size_mb = 4096

# The image reads its identity from OCI Vault delivery and discovers ts-auth and
# TerraBase itself (docs/zero-configuration.md): there is no [env] to set.
# While the Fly secret DEMO=true is set it serves the in-memory public demo (README).

[http_service]
  internal_port = 8080
  force_https = true
  # The rollout provisions one always-running Machine in gru, sjc and fra.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/readyz"
  protocol = "http"
  timeout = "5s"
