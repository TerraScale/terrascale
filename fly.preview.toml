# The preview workflow supplies the per-PR app name with --app.
primary_region = "gru"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  TS_DASHBOARD_PRODUCTION_DEMO = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Demo accounts and sessions reset when an idle preview stops.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
