# The preview workflow supplies the per-PR app name with --app. Keep this
# config without swap_size_mb or [[mounts]]: previews use ephemeral rootfs.
primary_region = "gru"

[env]
  DASHBOARD_ADDR = ":8080"
  TS_DASHBOARD_PRODUCTION_DEMO = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Demo accounts and sessions reset when an idle preview stops.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health/ready"
  protocol = "http"
  timeout = "5s"
