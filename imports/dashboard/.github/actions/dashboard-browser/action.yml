name: Dashboard browser
description: Restore the lockfile-pinned headless Chromium used by browser journeys.
runs:
  using: composite
  steps:
    - id: browser
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-headless-${{ runner.os }}-${{ hashFiles('tests/TerraScale.Dashboard.E2E/packages.lock.json') }}
    - name: Install pinned headless Chromium and system dependencies
      shell: bash
      run: |
        driver=tests/TerraScale.Dashboard.E2E/bin/Release/net10.0/.playwright
        "$driver/node/linux-x64/node" "$driver/package/cli.js" install --with-deps --only-shell chromium
    - if: github.ref == 'refs/heads/main' && steps.browser.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browser.outputs.cache-primary-key }}
