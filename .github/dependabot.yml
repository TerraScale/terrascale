version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /src/**
      - /benchmark/**
      - /sdk/dotnet/**
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directories:
      - /benchmark
      - /sdk/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /sites/docs
      - /sites/docs/create-terrascale-app
      - /sites/docs/examples/server-token-provider
      - /sites/landing
      - /sites/status
      - /sdk/js
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directories:
      - /sdk/rust
      - /benchmark/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /
      - /src/vendor/Turso.Native/scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
