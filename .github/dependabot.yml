version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /src/**
      - /tests/**
      - /benchmark/**
      - /aspire/**
      - /tools/**
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /benchmark
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /aspire
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directories:
      - /benchmark/clients/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
