version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /src/**
      - /benchmark/**
      - /aspire/**
      - /sdk/dotnet/**
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directories:
      - /benchmark
      - /sdk/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /aspire
      - /docs-site
      - /docs-site/create-terrascale-app
      - /docs-site/examples/server-token-provider
      - /landing-site
      - /status-site
      - /sdk/js
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /sdk/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /
      - /scripts/dashboard
      - /scripts/dashboard/ci
      - /scripts/vendor
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
