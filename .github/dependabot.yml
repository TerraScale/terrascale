version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /src/**
      - /tests/**
      - /benchmark/**
      - /aspire/**
      - /tools/**
      - /sdk/dotnet/**
      - /scripts/dashboard/**
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directories:
      - /benchmark
      - /sdk/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /aspire
      - /sdk/js
      - /docs-site
      - /docs-site/create-terrascale-app
      - /scripts/dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directories:
      - /benchmark/clients/rust
      - /sdk/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
