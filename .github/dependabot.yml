version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /src/TerraScale.Dashboard/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /
      - /scripts/ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      runtime-security:
        applies-to: security-updates
        patterns: ['*']
