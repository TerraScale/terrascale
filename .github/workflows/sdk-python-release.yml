name: SDK Python Release

on:
  push:
    tags: ['sdk/python/v0.0.*']

permissions:
  contents: read
  statuses: read

concurrency:
  group: sdk-python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/sdk-fast.yml
    with:
      area: sdk-python

  publish:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      statuses: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the versioned main tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^sdk/python/v0\.0\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download exact qualified bytes
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sdk/download-qualified.py python "$GITHUB_SHA" "$RUNNER_TEMP/qualified"
      - name: Require the qualified package version
        env:
          VERSION: ${{ steps.qualified.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "sdk/python/v$VERSION"
      - name: Stage only qualified distribution files
        run: |
          mkdir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/qualified/"*.whl "$RUNNER_TEMP/qualified/"*.tar.gz "$RUNNER_TEMP/dist/"
      - name: Publish to PyPI through trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/dist/
