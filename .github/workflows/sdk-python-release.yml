name: SDK Python Release

on:
  push:
    tags: ['sdk/python/v0.0.*']

permissions:
  contents: read

concurrency:
  group: sdk-python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the versioned main tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^sdk/python/v0\.0\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
      - name: Install the pinned uv
        run: mise use -g uv@0.13.7 && dirname "$(mise which uv)" >> "$GITHUB_PATH"
      - name: Build the release artifacts with their release gates
        id: qualified
        run: python3 scripts/sdk/build-release.py python "$RUNNER_TEMP/qualified"
      - name: Require the tagged package version
        env:
          VERSION: ${{ steps.qualified.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "sdk/python/v$VERSION"
      - name: Stage only qualified distribution files
        run: |
          mkdir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/qualified/"*.whl "$RUNNER_TEMP/qualified/"*.tar.gz "$RUNNER_TEMP/dist/"
      - name: Publish to PyPI through trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/dist/
