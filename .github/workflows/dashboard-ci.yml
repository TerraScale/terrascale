name: Dashboard Fast

# Main pushes run this through images-ghcr.yml, the dashboard's single main entry point.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/TerraScale.Dashboard*/**'
      # The dashboard calls TerraBase through these MagicOnion contracts.
      - 'src/TerraScale.TerraBase.Contracts/**'
      # The dashboard's endpoints and their source generator.
      - 'src/TerraScale.Endpoints/**'
      - 'src/TerraScale.Endpoints.Generators/**'
      - 'tests/TerraScale.Dashboard*/**'
      - 'scripts/dashboard/**'
      - 'sdk/dotnet/**'
      - 'Directory.*'
      - '.editorconfig'
      - 'BannedSymbols.txt'
      - 'global.json'
      - 'NuGet.config'
      - 'Makefile'
      - '.github/actions/**'
      - '.github/workflows/dashboard-ci.yml'
      - '.github/workflows/images-ghcr.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      # dashboard-test-fast verifies the pinned native libraries (or downloads them on a miss): the
      # cache keeps a release-CDN outage from blocking the dashboard's only build job.
      - name: Cached pinned Turso native libraries
        uses: ./.github/actions/turso-native-cache
      - name: Dashboard Fast
        run: make dashboard-test-fast
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: src/TerraScale.Dashboard/web/package-lock.json
      - name: Install the web asset build
        run: npm ci --prefix src/TerraScale.Dashboard/web
      - name: Dashboard lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then git fetch --no-tags --depth=1 origin "$BASE_SHA"; fi
          make dashboard-lint
      # The image job wraps these exact bytes without another build.
      - name: Publish the tested application
        if: github.event_name != 'pull_request'
        env:
          REVISION: ${{ github.sha }}
        run: |
          dotnet publish src/TerraScale.Dashboard --configuration Release --no-restore \
            --output "$RUNNER_TEMP/dashboard-publish" -p:ContinuousIntegrationBuild=true -p:SourceRevisionId="$REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request'
        with:
          name: dashboard-publish
          path: ${{ runner.temp }}/dashboard-publish
          if-no-files-found: error
          retention-days: 1
