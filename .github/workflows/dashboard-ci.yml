name: Dashboard

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore the dashboard
        run: make dashboard-restore
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: src/TerraScale.Dashboard/web/package-lock.json
      - name: Install the web asset build
        run: npm ci --prefix src/TerraScale.Dashboard/web
      - name: Checked build
        run: |
          make -o dashboard-restore dashboard-build CONFIGURATION=Release
          .github/scripts/ci/release-only.sh
      - name: Dashboard lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then git fetch --no-tags --depth=1 origin "$BASE_SHA"; fi
          make dashboard-lint CONFIGURATION=Release
