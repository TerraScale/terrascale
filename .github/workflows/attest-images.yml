name: Attest images

on:
  workflow_run:
    workflows: [CI, "Images (OCIR)"]
    types: [completed]
    branches: [main]

permissions: {}

env:
  OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}

jobs:
  targets:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/ci
      - id: targets
        name: Read the images the triggering run published
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW: ${{ github.event.workflow_run.path }}
        run: |
          set -euo pipefail
          bash .github/scripts/ci/attest-targets.sh | tee -a "$GITHUB_OUTPUT"

  attest:
    needs: targets
    if: needs.targets.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    name: attest ${{ matrix.target.service }}
    concurrency:
      group: attest-${{ matrix.target.service }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    env:
      IMAGE: ${{ matrix.target.image }}
      ARM64: ${{ matrix.target.arm64 }}
      ARTIFACT: ${{ matrix.target.artifact }}
      REVISION: ${{ github.event.workflow_run.head_sha }}
      SIGNER: ${{ github.event.workflow_run.path }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/ci
      - name: Authenticate to OCIR with GitHub OIDC
        uses: TerraScale/ts-orchestrator/.github/actions/ocir-login@623419d401570afd0d8bc172dc6245760a78d058
        with:
          regions: sa-saopaulo-1 eu-frankfurt-1 us-sanjose-1
          domain-url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          client-id: ${{ vars.OCI_TOKEN_EXCHANGE_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_TOKEN_EXCHANGE_CLIENT_SECRET }}
      - name: Verify the build provenance the build job signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > "$RUNNER_TEMP/target.zip"
          unzip -p "$RUNNER_TEMP/target.zip" provenance.json > "$RUNNER_TEMP/provenance.json"
          gh attestation verify "oci://${IMAGE}@${ARM64}" --bundle "$RUNNER_TEMP/provenance.json" --owner TerraScale \
            --signer-workflow "TerraScale/terrascale/${SIGNER}" --source-ref refs/heads/main --source-digest "$REVISION"
      - uses: oras-project/setup-oras@6c7c53b4590464855840e6196435c3af71140f64
        with:
          version: 1.3.6
      - name: Verify the image revision label
        run: |
          set -euo pipefail
          manifest=$(oras manifest fetch "${IMAGE}@${ARM64}")
          config=$(jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest")
          image=$(oras blob fetch --output - "${IMAGE}@${config}")
          jq -e --arg revision "$REVISION" \
            '.architecture == "arm64" and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision' <<< "$image" > /dev/null
      - name: Generate the linux/arm64 child SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ matrix.target.image }}@${{ matrix.target.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
      - id: sbom
        name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-name: ${{ matrix.target.image }}
          subject-digest: ${{ matrix.target.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: false
      - name: Attach the Sigstore bundles in every OCIR region
        env:
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          repositories=$(bash .github/scripts/ci/ocir-repositories.sh "${IMAGE##*/}")
          pids=()
          while IFS= read -r repository; do
            bash .github/scripts/ci/attach-image-bundles.sh "${repository}@${ARM64}" "$RUNNER_TEMP/provenance.json" "$SBOM" &
            pids+=("$!")
          done <<< "$repositories"
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          subject="oci://${IMAGE}@${ARM64}"
          gh attestation verify "$subject" --bundle "$RUNNER_TEMP/provenance.json" --owner TerraScale --signer-workflow "TerraScale/terrascale/${SIGNER}" --source-ref refs/heads/main --source-digest "$REVISION" &
          provenance=$!
          gh attestation verify "$subject" --bundle "$SBOM" --predicate-type https://spdx.dev/Document/v2.3 --owner TerraScale --signer-workflow TerraScale/terrascale/.github/workflows/attest-images.yml --source-ref refs/heads/main &
          sbom=$!
          status=0
          wait "$provenance" || status=$?
          wait "$sbom" || status=$?
          exit "$status"
