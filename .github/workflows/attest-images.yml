name: Attest images

on:
  workflow_run:
    workflows: [CI, "Images (OCIR)"]
    types: [completed]
    branches: [main]

permissions: {}

env:
  OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}

jobs:
  targets:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        name: Read the images the triggering run published
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ $REVISION =~ ^[0-9a-f]{40}$ ]]
          mapfile -t artifacts < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("attest-targets-")) and (.expired | not)) | .id')
          targets='[]'
          for artifact in "${artifacts[@]}"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/$artifact.zip"
            target=$(unzip -p "$RUNNER_TEMP/$artifact.zip" attest-target.json)
            jq -e --arg namespace "${OCIR_NAMESPACE:?}" --arg revision "$REVISION" '
              (.service | IN("terrabase", "ts-platform", "ts-auth", "ts-dashboard"))
              and (.image | test("^sa-saopaulo-1\\.ocir\\.io/" + $namespace + "/terrascale/(terrabase|ts-platform|ts-auth|terrascale-dashboard)$"))
              and (.arm64 | test("^sha256:[0-9a-f]{64}$"))
              and .revision == $revision
              and (.tags | type == "array" and length > 0 and .[0] == $revision)
            ' <<< "$target" > /dev/null || { echo "::error::Artifact $artifact holds an invalid attestation target"; exit 1; }
            targets=$(jq -c --argjson target "$target" '. + [$target]' <<< "$targets")
          done
          echo "targets=$targets" | tee -a "$GITHUB_OUTPUT"

  attest:
    needs: targets
    if: needs.targets.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    name: attest ${{ matrix.target.service }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      IMAGE: ${{ matrix.target.image }}
      ARM64: ${{ matrix.target.arm64 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/ci
      - name: Authenticate to OCIR with GitHub OIDC
        uses: TerraScale/ts-orchestrator/.github/actions/ocir-login@623419d401570afd0d8bc172dc6245760a78d058
        with:
          regions: sa-saopaulo-1 eu-frankfurt-1 us-sanjose-1
          domain-url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          client-id: ${{ vars.OCI_TOKEN_EXCHANGE_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_TOKEN_EXCHANGE_CLIENT_SECRET }}
      - id: provenance
        name: Attest build provenance (linux/arm64 child)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ matrix.target.image }}
          subject-digest: ${{ matrix.target.arm64 }}
          push-to-registry: false
      - name: Generate the linux/arm64 child SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ matrix.target.image }}@${{ matrix.target.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
      - id: sbom
        name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-name: ${{ matrix.target.image }}
          subject-digest: ${{ matrix.target.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: false
      - uses: oras-project/setup-oras@6c7c53b4590464855840e6196435c3af71140f64
        with:
          version: 1.3.6
      - name: Attach the Sigstore bundles in every OCIR region
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          pids=()
          while IFS= read -r repository; do
            bash .github/scripts/ci/attach-image-bundles.sh "${repository}@${ARM64}" "$PROVENANCE" "$SBOM" &
            pids+=("$!")
          done < <(bash .github/scripts/ci/ocir-repositories.sh "${IMAGE##*/}")
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          subject="oci://${IMAGE}@${ARM64}"
          gh attestation verify "$subject" --bundle "$PROVENANCE" --owner TerraScale --signer-workflow TerraScale/terrascale/.github/workflows/attest-images.yml --source-ref refs/heads/main &
          provenance=$!
          gh attestation verify "$subject" --bundle "$SBOM" --predicate-type https://spdx.dev/Document/v2.3 --owner TerraScale --signer-workflow TerraScale/terrascale/.github/workflows/attest-images.yml --source-ref refs/heads/main &
          sbom=$!
          status=0
          wait "$provenance" || status=$?
          wait "$sbom" || status=$?
          exit "$status"
