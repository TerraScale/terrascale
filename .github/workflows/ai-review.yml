name: AI review

on:
  workflow_call:
    inputs:
      head_sha:
        type: string
      deny_paths:
        description: Newline-separated paths excluded from auto-fix. The policy and prompt come from this reusable workflow's revision.
        type: string
        required: true
      max_fix_lines:
        type: number
        default: 200
    secrets:
      OCR_LLM_URL:
      OCR_LLM_TOKEN:
      AI_FIX_APP_CLIENT_ID:
      AI_FIX_APP_PRIVATE_KEY:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ai-review-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      head: ${{ steps.range.outputs.head }}
      watermark: ${{ steps.range.outputs.watermark }}
      app: ${{ steps.secrets.outputs.app }}
      fixable_count: ${{ steps.route.outputs.fixable_count }}
      fixable_file: ${{ steps.route.outputs.fixable_file }}
      report: ${{ steps.route.outputs.report }}
      checkpoint: ${{ steps.route.outputs.checkpoint }}
    steps:
      - name: Check credentials
        id: secrets
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL != '' }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN != '' }}
          AI_FIX_APP_CLIENT_ID: ${{ secrets.AI_FIX_APP_CLIENT_ID != '' }}
          AI_FIX_APP_PRIVATE_KEY: ${{ secrets.AI_FIX_APP_PRIVATE_KEY != '' }}
        run: |
          for secret in OCR_LLM_URL OCR_LLM_TOKEN AI_FIX_APP_CLIENT_ID AI_FIX_APP_PRIVATE_KEY; do
            if [[ "${!secret}" == false ]]; then
              echo "::notice::Missing secret $secret"
            fi
          done
          if [[ "$OCR_LLM_URL" == true && "$OCR_LLM_TOKEN" == true ]]; then
            echo 'review=true' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$AI_FIX_APP_CLIENT_ID" == true && "$AI_FIX_APP_PRIVATE_KEY" == true ]]; then
            echo 'app=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: steps.secrets.outputs.review == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Resolve commit range
        if: steps.secrets.outputs.review == 'true'
        id: range
        working-directory: source
        env:
          HEAD_SHA: ${{ inputs.head_sha || github.sha }}
        run: |
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo '::error::Review head must be a full commit SHA on main'
            exit 1
          fi
          head=$(git rev-parse "$HEAD_SHA")
          subject=$(git show -s --format=%s "$head")
          if [[ "$subject" == '[ai-fix]'* ]]; then
            echo '::notice::Skipping an AI fix commit'
            exit 0
          fi
          marker=$(git ls-remote --refs origin refs/ai-review/last)
          watermark=${marker%%$'\t'*}
          if [[ -n "$watermark" ]]; then
            git fetch --no-tags origin refs/ai-review/last
            if git merge-base --is-ancestor "$head" "$watermark"; then
              echo '::notice::Review head already covered by the checkpoint'
              exit 0
            fi
          fi
          if [[ -n "$watermark" ]] && git merge-base --is-ancestor "$watermark" "$head"; then
            base=$watermark
          else
            workflow_path=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
            workflow_path=${workflow_path%@*}
            rollout=$(git log --first-parent --format=%H -G 'uses:.*ai-review\.yml' origin/main -- "$workflow_path" | tail -1)
            if [[ -z "$rollout" ]]; then
              echo '::error::Could not locate the AI review workflow rollout on main'
              exit 1
            fi
            base=$(git rev-parse "$rollout^" 2>/dev/null || git rev-parse "$rollout")
            if ! git merge-base --is-ancestor "$base" "$head"; then
              base=$(git rev-parse "$head^")
            fi
          fi
          git checkout --detach "$head"
          printf 'head=%s\nbase=%s\nwatermark=%s\n' "$head" "$base" "$watermark" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: steps.range.outputs.head != ''
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          sparse-checkout: .github/ai-review
          persist-credentials: false
          path: policy
      - name: Review the range
        if: steps.range.outputs.head != ''
        working-directory: source
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: glm-5.3
          OCR_LLM_PROTOCOL: openai
        run: |
          mkdir "$RUNNER_TEMP/review"
          cd "$RUNNER_TEMP"
          npx --yes --ignore-scripts @alibaba-group/open-code-review@1.13.13 review --repo "$GITHUB_WORKSPACE/source" \
            --from "$BASE_SHA" --to "$HEAD_SHA" --concurrency 2 --effort medium --audience agent \
            --format json --output "$RUNNER_TEMP/review/result.json"
      - name: Route findings
        if: steps.range.outputs.head != ''
        id: route
        working-directory: source
        env:
          DENY_PATHS: ${{ inputs.deny_paths }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: python3 ../policy/.github/ai-review/review.py route
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.range.outputs.head != '' }}
        with:
          name: ai-review-${{ steps.range.outputs.head }}
          path: ${{ runner.temp }}/review/
          overwrite: true

  report:
    needs: review
    if: needs.review.outputs.report == 'true'
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-review-${{ needs.review.outputs.head }}
          path: ${{ runner.temp }}/review
      - name: Publish findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issues=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" |
            jq -rs '[.[][] | select(.title == "AI review findings" and (has("pull_request") | not)
              and .user.login == "github-actions[bot]" and any(.labels[]; .name == "ai-review")) | .number]')
          case "$(jq length <<< "$issues")" in
            0)
              gh label create ai-review --repo "$GITHUB_REPOSITORY" --color 7057ff --force
              url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title 'AI review findings' --label ai-review \
                --body 'High and critical findings from AI reviews of main.')
              issue=${url##*/}
              ;;
            1) issue=$(jq -r '.[0]' <<< "$issues") ;;
            *) echo '::error::Multiple open AI review findings issues'; exit 1 ;;
          esac
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/review/report.md"

  generate:
    needs: review
    if: needs.review.outputs.app == 'true' && fromJSON(needs.review.outputs.fixable_count || '0') > 0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      base: ${{ steps.plan.outputs.base }}
      patch: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.review.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          sparse-checkout: .github/ai-review
          persist-credentials: false
          path: policy
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-review-${{ needs.review.outputs.head }}
          path: ${{ runner.temp }}/review
      - name: Plan fix publication
        id: plan
        working-directory: source
        env:
          HEAD_SHA: ${{ needs.review.outputs.head }}
          DENY_PATHS: ${{ inputs.deny_paths }}
          MAX_FIX_LINES: ${{ inputs.max_fix_lines }}
          FIXABLE_FILE: ${{ needs.review.outputs.fixable_file }}
        run: python3 ../policy/.github/ai-review/review.py plan
      - name: Install the pinned OpenCode package
        if: steps.plan.outputs.resume != 'true' && steps.plan.outputs.reject != 'true'
        working-directory: ${{ runner.temp }}
        run: npm install --prefix opencode --no-audit --no-fund --ignore-scripts opencode-ai@1.19.6
      - name: Generate a fix in an isolated checkout
        if: steps.plan.outputs.resume != 'true' && steps.plan.outputs.reject != 'true'
        working-directory: source
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          FIX_BASE: ${{ steps.plan.outputs.base }}
          DENY_PATHS: ${{ inputs.deny_paths }}
          FIXABLE_FILE: ${{ needs.review.outputs.fixable_file }}
        run: python3 ../policy/.github/ai-review/review.py generate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        if: steps.plan.outputs.resume != 'true' && steps.plan.outputs.reject != 'true'
        with:
          name: fix-${{ needs.review.outputs.head }}
          path: ${{ runner.temp }}/fix.patch
          if-no-files-found: error
          overwrite: true

  fix:
    needs: [review, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.generate.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          sparse-checkout: .github/ai-review
          persist-credentials: false
          path: policy
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-review-${{ needs.review.outputs.head }}
          path: ${{ runner.temp }}/review
      - name: Resolve current fix PR state
        id: plan
        working-directory: source
        env:
          HEAD_SHA: ${{ needs.review.outputs.head }}
          DENY_PATHS: ${{ inputs.deny_paths }}
          MAX_FIX_LINES: ${{ inputs.max_fix_lines }}
          FIXABLE_FILE: ${{ needs.review.outputs.fixable_file }}
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python3 ../policy/.github/ai-review/review.py plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.plan.outputs.resume != 'true' && steps.plan.outputs.reject != 'true' && needs.generate.outputs.patch != ''
        with:
          name: fix-${{ needs.review.outputs.head }}
          path: ${{ runner.temp }}
      - name: Validate the patch on a fresh runner
        if: steps.plan.outputs.resume != 'true' && steps.plan.outputs.reject != 'true'
        working-directory: source
        env:
          DENY_PATHS: ${{ inputs.deny_paths }}
          MAX_FIX_LINES: ${{ inputs.max_fix_lines }}
          FIXABLE_FILE: ${{ needs.review.outputs.fixable_file }}
        run: python3 ../policy/.github/ai-review/review.py validate
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        id: app
        with:
          client-id: ${{ secrets.AI_FIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_FIX_APP_PRIVATE_KEY }}
          permission-contents: ${{ steps.plan.outputs.reject != 'true' && 'write' || '' }}
          permission-pull-requests: write
      - name: Publish the fix or resume auto-merge
        working-directory: source
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          HEAD_SHA: ${{ needs.review.outputs.head }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          EXISTING_PR: ${{ steps.plan.outputs.number }}
          EXISTING_SHA: ${{ steps.plan.outputs.sha }}
          RESUME: ${{ steps.plan.outputs.resume }}
          REJECT: ${{ steps.plan.outputs.reject }}
          FIXABLE_COUNT: ${{ needs.review.outputs.fixable_count }}
        run: |
          bot="${APP_SLUG}[bot]"
          if [[ -n "$EXISTING_PR" ]]; then
            existing=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$EXISTING_PR")
            if ! jq -e --arg bot "$bot" --arg sha "$EXISTING_SHA" --arg branch "$BRANCH" \
              '.user.login == $bot and .head.sha == $sha and .head.ref == $branch and .base.ref == "main"' <<< "$existing" >/dev/null; then
              echo '::error::The existing fix PR changed or belongs to another author'
              exit 1
            fi
            if [[ "$REJECT" == true ]]; then
              gh pr close "$EXISTING_PR" --comment 'Closed because this fix failed validation against current main.'
              echo '::error::Closed an AI fix that failed validation against current main'
              exit 1
            fi
            pr=$EXISTING_PR
            pr_head=$EXISTING_SHA
          fi
          rules=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main")
          if ! jq -e 'any(.[]; .type == "required_status_checks" and any(.parameters.required_status_checks[]; .context == "all-green"))' <<< "$rules" >/dev/null; then
            echo '::error::Main must require all-green before automated fixes can merge'
            exit 1
          fi
          if [[ "$RESUME" != true ]]; then
            bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
            title="[ai-fix] $FIXABLE_COUNT findings from ${HEAD_SHA:0:12}"
            git -c user.name="$bot" -c user.email="$bot_id+$bot@users.noreply.github.com" commit -m "$title"
            pr_head=$(git rev-parse HEAD)
            remote=$(git ls-remote --heads origin "refs/heads/$BRANCH")
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              push origin --force-with-lease="refs/heads/$BRANCH:${remote%%$'\t'*}" "HEAD:refs/heads/$BRANCH"
            gh label create ai-fix --color 7057ff --force
            pr=$(gh pr create --base main --head "$BRANCH" --title "$title" --label ai-fix --body-file "$RUNNER_TEMP/review/fix.md")
          fi
          state=$(gh pr view "$pr" --json state,autoMergeRequest,headRefOid)
          if ! jq -e --arg head "$pr_head" '.headRefOid == $head and (.state == "MERGED" or (.state == "OPEN" and .autoMergeRequest != null))' <<< "$state" >/dev/null; then
            gh pr merge "$pr" --auto --squash --delete-branch --match-head-commit "$pr_head"
            state=$(gh pr view "$pr" --json state,autoMergeRequest,headRefOid)
            jq -e --arg head "$pr_head" '.headRefOid == $head and (.state == "MERGED" or (.state == "OPEN" and .autoMergeRequest != null))' <<< "$state" >/dev/null
          fi

  checkpoint:
    needs: [review, report, generate, fix]
    if: >-
      ${{ !cancelled() &&
      needs.review.result == 'success' &&
      needs.review.outputs.app == 'true' &&
      needs.review.outputs.checkpoint == 'true' &&
      ((needs.review.outputs.report == 'true' && needs.report.result == 'success') ||
       (needs.review.outputs.report == 'false' && needs.report.result == 'skipped')) &&
      ((needs.review.outputs.fixable_count == '0' && needs.generate.result == 'skipped' && needs.fix.result == 'skipped') ||
       (needs.generate.result == 'success' && needs.fix.result == 'success')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.review.outputs.head }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          sparse-checkout: .github/ai-review
          persist-credentials: false
          path: policy
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        id: app
        with:
          client-id: ${{ secrets.AI_FIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_FIX_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Advance the completed review checkpoint
        working-directory: source
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ needs.review.outputs.head }}
          WATERMARK: ${{ needs.review.outputs.watermark }}
        run: python3 ../policy/.github/ai-review/review.py checkpoint
