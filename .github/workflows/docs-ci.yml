name: Docs Fast

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'scripts/docs/**'
      - 'Makefile'
      - '.github/workflows/docs-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'scripts/docs/**'
      - 'Makefile'
      - '.github/workflows/docs-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read
  actions: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require this commit's dev-host docs Fast result
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/docs/check-proof.py docs "$REVISION"

  deploy:
    needs: fast
    if: github.event_name == 'push'
    uses: ./.github/workflows/docs-deploy.yml
    with:
      revision: ${{ github.sha }}
    secrets: inherit
