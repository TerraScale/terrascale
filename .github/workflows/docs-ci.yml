name: Docs Fast

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'Makefile'
      - '.github/workflows/docs-*.yml'
      - 'src/TerraBase/**'
      - 'src/TerraScale.Dashboard/sdk-versions.json'
      - 'src/TerraScale.Dashboard/Features/Home/SdkVersions.cs'
      - 'sdk/go/README.md'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  pull_request:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'Makefile'
      - '.github/workflows/docs-*.yml'
      - 'src/TerraBase/**'
      - 'src/TerraScale.Dashboard/sdk-versions.json'
      - 'src/TerraScale.Dashboard/Features/Home/SdkVersions.cs'
      - 'sdk/go/README.md'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read
  # docs-deploy.yml reads workflow runs for its manual green-main check.
  actions: read

concurrency:
  group: docs-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: docs-site/.node-version
          package-manager-cache: false
      - name: Docs Fast
        run: make docs-test-fast

  deploy:
    needs: fast
    if: github.event_name == 'push'
    uses: ./.github/workflows/docs-deploy.yml
    with:
      revision: ${{ github.sha }}
    secrets: inherit
