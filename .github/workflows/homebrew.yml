name: Publish Homebrew formula
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published CLI version (0.0.X)
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: '[[ "$RELEASE_VERSION" =~ ^0\.0\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: TerraScale/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Publish generated formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release download "v$RELEASE_VERSION" --repo TerraScale/ts-go --pattern ts.rb --dir "$RUNNER_TEMP"
          mkdir -p Formula
          cp "$RUNNER_TEMP/ts.rb" Formula/ts.rb
          git config user.name 'TerraScale'
          git config user.email 'releases@terrascale.tech'
          git add Formula/ts.rb
          git diff --cached --quiet && exit 0
          git commit -m "Update ts to $RELEASE_VERSION"
          git push
