name: Upstream storage watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: List upstream storage-risk commits from the last 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/vendor/upstream-storage-watch.sh
