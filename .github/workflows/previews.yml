name: Previews

# Deletes PR previews (scripts/fly/preview.sh): a PR's app when the PR closes, and hourly every preview created more
# than 24 hours ago. ci.yml creates and updates them.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Share the PR's creation group so close cancels builds before deletion; different PR closes remain independent.
  cleanup:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.pull_request.number) || 'preview-reap' }}
      cancel-in-progress: true
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_PREVIEWS }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - if: github.event_name == 'pull_request'
        run: scripts/fly/preview.sh destroy ${{ github.event.pull_request.number }}
      - if: github.event_name != 'pull_request'
        run: scripts/fly/preview.sh reap
