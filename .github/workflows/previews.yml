name: Previews

# Deletes PR previews (scripts/fly/preview.sh): a PR's app when the PR closes, and hourly every preview of a closed PR
# or created more than 24 hours ago. ci.yml creates and updates them, and runs the same reap after each preview update
# (GitHub's hourly schedule is best effort).

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_PREVIEWS }}
      # The reaper asks each preview's PR state.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - if: github.event_name == 'pull_request'
        run: scripts/fly/preview.sh destroy ${{ github.event.pull_request.number }}
      - if: github.event_name != 'pull_request'
        run: scripts/fly/preview.sh reap
