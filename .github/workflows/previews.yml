name: Previews

# Deletes PR previews (scripts/fly/preview.sh): a PR's app when the PR closes, and hourly every preview of a closed PR
# plus every open PR's preview created more than 24 hours ago. ci.yml creates and updates them.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fork PRs never get a preview (ci.yml) and receive no Fly token.
  discover:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.expired.outputs.prs }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_PREVIEWS }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      # A failed check fails this job but still deletes the previews it could decide.
      - id: expired
        shell: bash
        run: |
          status=0
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            prs="[$PR_NUMBER]"
          else
            prs=$(scripts/fly/preview.sh expired) || status=$?
          fi
          printf 'prs=%s\n' "$prs" >> "$GITHUB_OUTPUT"
          exit "$status"

  # One job per PR in the PR's creation group: deleting cancels that PR's running preview build, so it cannot recreate
  # the app afterwards; different PRs stay independent.
  cleanup:
    needs: discover
    if: ${{ !cancelled() && startsWith(needs.discover.outputs.prs, '[') && needs.discover.outputs.prs != '[]' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    concurrency:
      group: preview-${{ matrix.pr }}
      cancel-in-progress: true
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_PREVIEWS }}
      PR_NUMBER: ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - run: scripts/fly/preview.sh destroy "$PR_NUMBER"
