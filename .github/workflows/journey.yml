name: Journey

on:
  workflow_call:

permissions: {}

jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      E2E_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      E2E_STATE: ${{ github.workspace }}/e2e/.state
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/e2e/.state/pki/ca.pem
      E2E_CA_FILE: ${{ github.workspace }}/e2e/.state/pki/ca.pem
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Journey paths
        run: |
          {
            echo "E2E_TOOLS=$HOME/.cache/terrascale-e2e"
            echo "E2E_BUILD=$RUNNER_TEMP/journey-build"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            src/TerraScale.Dashboard/web/package-lock.json
      - name: Cached journey tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/terrascale-e2e
          key: journey-tools-${{ hashFiles('e2e/env/tools.sh') }}
      - name: Cached journey browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: journey-chromium-${{ hashFiles('e2e/package-lock.json') }}
      - name: Build the services
        run: bash e2e/env/build.sh . "$E2E_BUILD"
      - name: Install the suite and its browser
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --only-shell chromium
      - name: Pin the production names and trust the run CA
        run: |
          sudo apt-get install -y --no-install-recommends libnss3-tools > /dev/null
          bash e2e/env/tools.sh
          bash e2e/env/pki.sh
          bash e2e/env/install-runner.sh
      - name: Boot the stack
        run: |
          bash e2e/env/up.sh
          while read -r secret; do echo "::add-mask::$secret"; done < "$E2E_STATE/secrets"
      - name: Journey
        working-directory: e2e
        run: npx playwright test
      - name: Stop the stack
        if: always()
        run: bash e2e/env/down.sh
      - name: Remove files that hold a generated secret
        if: always()
        run: python3 e2e/env/scrub.py "$E2E_STATE" e2e/playwright-report e2e/test-results "$E2E_STATE/logs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: journey-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: journey-evidence
          path: |
            e2e/test-results
            e2e/.state/logs
          retention-days: 7
          if-no-files-found: ignore
