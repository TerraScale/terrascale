name: Journey

on:
  workflow_call:

permissions: {}

jobs:
  runners:
    name: runner ${{ matrix.sdk }}
    strategy:
      matrix:
        sdk: [go, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SDK: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: matrix.sdk == 'go'
        with:
          install: false
      - name: Install the pinned toolchain
        run: |
          echo "E2E_SDK_BUILD=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
          case "$SDK" in
            go) mise use -g "go@$(cat sdk/go/.go-version)"; dirname "$(mise which go)" >> "$GITHUB_PATH" ;;
            rust) rustup toolchain install 1.99.1 --profile minimal ;;
          esac
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            e2e/sdk/rust/target
          key: journey-${{ matrix.sdk }}-${{ hashFiles('e2e/sdk/go/go.sum', 'sdk/go/go.sum', 'e2e/sdk/rust/Cargo.lock') }}-${{ hashFiles(format('sdk/{0}/**', matrix.sdk), format('e2e/sdk/{0}/**', matrix.sdk)) }}
          restore-keys: journey-${{ matrix.sdk }}-${{ hashFiles('e2e/sdk/go/go.sum', 'sdk/go/go.sum', 'e2e/sdk/rust/Cargo.lock') }}-
      - id: build
        name: Build the runner
        run: bash e2e/sdk/build.sh "$SDK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-${{ matrix.sdk }}
          path: ${{ runner.temp }}/sdk
          retention-days: 1
          if-no-files-found: error
      - if: always() && steps.build.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            e2e/sdk/rust/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  services:
    name: build ${{ matrix.part }}
    strategy:
      matrix:
        part: [terrabase, ts-auth, dashboard]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PART: ${{ matrix.part }}
      E2E_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.21.0'
      - id: nuget
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.nuget/packages
            ~/.npm
          key: journey-build-${{ matrix.part }}-${{ hashFiles('**/packages.lock.json', 'src/TerraScale.Dashboard/web/package-lock.json') }}
      - id: build
        name: Build
        run: |
          out="$RUNNER_TEMP/services"
          case "$PART" in
            all) bash e2e/env/build.sh . "$out"; E2E_SDK_BUILD="$out/sdk" bash e2e/sdk/build.sh dotnet ;;
            terrabase)
              make turso-native
              dotnet restore src/TerraBase/TerraBase.csproj --locked-mode
              dotnet build src/TerraBase/TerraBase.csproj --configuration Release --no-restore -p:SourceRevisionId="$E2E_REVISION"
              mkdir -p "$out" && cp -a src/TerraBase/bin/Release/net11.0 "$out/terrabase" ;;
            ts-auth)
              dotnet restore src/TerraScale.Authentication/TerraScale.Authentication.csproj --locked-mode
              dotnet build src/TerraScale.Authentication/TerraScale.Authentication.csproj --configuration Release --no-restore -p:SourceRevisionId="$E2E_REVISION"
              mkdir -p "$out" && cp -a src/TerraScale.Authentication/bin/Release/net11.0 "$out/ts-auth"
              E2E_SDK_BUILD="$out/sdk" bash e2e/sdk/build.sh dotnet ;;
            dashboard)
              dotnet restore src/TerraScale.Dashboard/TerraScale.Dashboard.csproj --locked-mode
              dotnet publish src/TerraScale.Dashboard --configuration Release --no-restore --output "$out/dashboard" -p:SourceRevisionId="$E2E_REVISION" ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: services-${{ matrix.part }}
          path: ${{ runner.temp }}/services
          retention-days: 1
          if-no-files-found: error
      - if: always() && steps.build.outcome == 'success' && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.nuget/packages
            ~/.npm
          key: ${{ steps.nuget.outputs.cache-primary-key }}

  journey:
    needs: [services, runners]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      E2E_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      E2E_STATE: ${{ github.workspace }}/e2e/.state
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Journey paths
        run: |
          {
            echo "E2E_TOOLS=$HOME/.cache/terrascale-e2e"
            echo "E2E_BUILD=$RUNNER_TEMP/journey-build"
            echo "E2E_SDK_BUILD=$RUNNER_TEMP/sdk"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.21.0'
      - id: packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ~/.cache/pip
          key: journey-packages-${{ hashFiles('e2e/package-lock.json', 'src/TerraScale.Dashboard/web/package-lock.json', 'sdk/js/package-lock.json', 'sdk/python/pyproject.toml') }}
      - id: tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/terrascale-e2e
          key: journey-tools-${{ hashFiles('e2e/env/tools.sh') }}
      - id: browser
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: journey-chromium-${{ hashFiles('e2e/package-lock.json') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: services-*
          merge-multiple: true
          path: ${{ runner.temp }}/services
      - id: build
        name: Install the Python and JS runners
        run: |
          echo "E2E_BUILD=$RUNNER_TEMP/services" >> "$GITHUB_ENV"
          mkdir -p "$E2E_SDK_BUILD"
          mv "$RUNNER_TEMP/services/sdk/dotnet" "$E2E_SDK_BUILD/dotnet"
          bash e2e/sdk/build.sh python &
          python=$!
          bash e2e/sdk/build.sh js
          wait "$python"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runner-*
          merge-multiple: true
          path: ${{ runner.temp }}/sdk
      - id: install
        name: Install the suite and its browser
        working-directory: e2e
        run: |
          chmod +x "$E2E_SDK_BUILD/go/runner" "$E2E_SDK_BUILD/rust/runner"
          npm ci --no-audit --no-fund
          npx playwright install --only-shell chromium
      - id: trust
        name: Pin the production names and trust the run CA
        run: |
          sudo apt-get install -y --no-install-recommends libnss3-tools > /dev/null
          bash e2e/env/tools.sh
          bash e2e/env/pki.sh
          bash e2e/env/install-runner.sh
      - name: Boot the stack
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          bash e2e/env/up.sh
          while read -r secret; do echo "::add-mask::$secret"; done < "$E2E_STATE/secrets"
      - name: Journey
        working-directory: e2e
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/e2e/.state/pki/ca.pem
          E2E_CA_FILE: ${{ github.workspace }}/e2e/.state/pki/ca.pem
        run: npx playwright test
      - name: Stop the stack
        if: always()
        run: bash e2e/env/down.sh
      - name: Remove files that hold a generated secret
        if: always()
        run: python3 e2e/env/scrub.py "$E2E_STATE" e2e/playwright-report e2e/test-results "$E2E_STATE/logs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: journey-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: journey-evidence
          path: |
            e2e/test-results
            e2e/.state/logs
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      - if: always() && steps.install.outcome == 'success' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ~/.cache/pip
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - if: always() && steps.trust.outcome == 'success' && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/terrascale-e2e
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - if: always() && steps.install.outcome == 'success' && steps.browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser.outputs.cache-primary-key }}
