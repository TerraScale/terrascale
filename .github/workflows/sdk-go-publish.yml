name: SDK Go Publish

# sdk-go-release.yml calls this after tagging: tags created with the job token trigger no push event.
on:
  push:
    tags: ['sdk/go/v0.0.*']
  workflow_call:
    inputs:
      tag:
        description: 'sdk/go/v0.0.X tag to publish'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'sdk/go/v0.0.X tag to publish'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the versioned main tag
        id: rev
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^sdk/go/v0\.0\.(0|[1-9][0-9]*)$ ]]
          sha=$(git rev-parse "$TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # sdk-go-release.yml built and tagged these bytes in this run; a tag push or dispatch builds them from the tag.
      - name: Download the bytes autorelease built
        if: github.event_name == 'push' && inputs.tag != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-go-release
          path: ${{ runner.temp }}/qualified
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: github.event_name != 'push' || inputs.tag == ''
        with:
          install: false
      - name: Build the release artifacts from the tag
        if: github.event_name != 'push' || inputs.tag == ''
        run: |
          mise install "go@$(cat sdk/go/.go-version)" go@1.25.0 goreleaser@2.19.0
          python3 scripts/sdk/build-release.py go "$RUNNER_TEMP/qualified"
      - name: Require the tagged version
        id: qualified
        run: |
          version=$(cat "$RUNNER_TEMP/qualified/version.txt")
          test "${{ steps.rev.outputs.tag }}" = "sdk/go/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish the qualified CLI assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/qualified"
          sha256sum --check checksums.txt
          version="${{ steps.qualified.outputs.version }}"
          gh release create "${{ steps.rev.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --target "${{ steps.rev.outputs.sha }}" --title "TerraScale Go $version" \
            --notes "CLI and module release built and qualified in CI at ${{ steps.rev.outputs.sha }}." \
            ./*.tar.gz ./*.zip checksums.txt ts.rb install.sh
