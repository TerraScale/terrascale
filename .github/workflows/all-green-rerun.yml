name: all-green-rerun
on:
  workflow_run:
    workflows:
      - CI
      - Dashboard Fast
      - Docs Fast
      - Landing
      - Landing secret scan
      - SDK dotnet Fast
      - SDK go Fast
      - SDK js Fast
      - SDK python Fast
      - SDK rust Fast
      - Status
    types: [requested]
permissions:
  actions: write
  contents: read
concurrency:
  group: all-green-rerun-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.run_attempt > 1
    steps:
      - name: Rerun the head's failed all-green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          run=$(gh run list -R "$REPO" --workflow all-green.yml --commit "$SHA" --limit 1 --json databaseId,status,conclusion -q '.[0] // empty')
          if [ -z "$run" ]; then
            echo "no all-green run for $SHA"
            exit 0
          fi
          id=$(jq -r .databaseId <<< "$run")
          status=$(jq -r .status <<< "$run")
          conclusion=$(jq -r .conclusion <<< "$run")
          if [ "$status" = completed ] && [ "$conclusion" != success ]; then
            gh run rerun -R "$REPO" "$id"
            echo "rerun all-green run $id ($conclusion) for $SHA"
          else
            echo "all-green run $id for $SHA is $status ${conclusion:-}: nothing to do"
          fi
