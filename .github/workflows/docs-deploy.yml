name: Docs Deploy

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  eligible:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.proof.outputs.deploy }}
      revision: ${{ steps.proof.outputs.revision }}
    steps:
      - id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          main=$(gh api repos/TerraScale/terrascale/git/ref/heads/main --jq .object.sha)
          [[ "$REVISION" = "$main" ]] || { echo 'A newer main revision superseded this deployment.'; exit 0; }
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

  deploy:
    needs: eligible
    if: needs.eligible.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: docs-site
    env:
      REVISION: ${{ needs.eligible.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.eligible.outputs.revision }}
          persist-credentials: false
      - name: Require green main for a manual deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Automatic deployment runs after Docs Fast in the path-filtered caller.
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            python3 scripts/check-main.py "$REVISION"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: docs-site/.node-version
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Build this revision's site
        run: |
          npm run build
          python3 -c 'import json,sys; assert json.load(open("docs/.vitepress/dist/build-info.json"))["commit"] == sys.argv[1]' "$REVISION"
      - name: Deploy the site to Workers
        run: npm run deploy:site -- --message "$REVISION"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Prove hosted pages, assets and revision
        run: node scripts/check-hosted.mjs
