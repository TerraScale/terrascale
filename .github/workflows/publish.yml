name: publish

# Publishes to PyPI with trusted publishing (no token) when a GitHub release
# is published for a vX.Y.Z tag. PyPI side: project "terrascale", owner
# TerraScale, repo ts-python, workflow publish.yml, environment pypi.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements-ci.txt
      - name: tag matches version
        run: test "v$(sed -n 's/__version__ = "\(.*\)"/\1/p' src/terrascale/_version.py)" = "${{ github.event.release.tag_name || github.ref_name }}"
      - run: 'uv pip sync --require-hashes --only-binary :all: requirements-ci.txt'
      - run: bash scripts/check-ci-lock.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip-audit
          key: pip-audit-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: pip-audit-${{ runner.os }}-
      - name: audit runtime, dev and build graph (all severities)
        run: pip-audit --strict --disable-pip --require-hashes -r requirements-ci.txt --cache-dir ~/.cache/pip-audit
      - run: uv build --no-build-isolation && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
