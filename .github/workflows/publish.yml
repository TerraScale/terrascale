name: Publish

# Pushing a v0.0.N tag on main publishes that commit to npm as @terrascale/sdk@0.0.N.
on:
  push:
    tags: ["v0.0.*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # npm provenance and trusted publishing (OIDC).
      id-token: write
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a release commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require the tag to match the 0.0.x package version
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [[ ! "$version" =~ ^0\.0\.[0-9]+$ ]]; then
            echo "TS-528: 0.0.x is required until the owner lifts it; got $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Set up the reviewed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Provision the reviewed npm CLI
        run: node scripts/provision-reviewed-npm.js
      - name: Audit every committed npm graph before publishing
        run: npm run check:vulnerabilities
      - name: Install locked dependencies
        run: npm ci
      # prepack builds the type declarations. npm uses trusted publishing when configured, else NPM_TOKEN.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
