name: CI time
on:
  workflow_run:
    workflows: [CI, Sites, "Images (OCIR)"]
    types: [requested, completed]
concurrency:
  group: ci-time-${{ github.event.workflow_run.event == 'pull_request' && format('{0}-{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || github.run_id }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

permissions:
  actions: read
  checks: read
  issues: write
jobs:
  ci-time:
    if: github.event.action == 'completed' && (github.event.workflow_run.name != 'Sites' || github.event.workflow_run.event != 'schedule')
    uses: TerraScale/.github/.github/workflows/ci-time.yml@b2244dc7f9f527ca7a24e86854741ba7671ad265
    with:
      scan-limit: 15
