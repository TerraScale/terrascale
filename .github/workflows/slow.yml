# Independent, non-blocking Slow results receive an issue report on failure.
name: Slow

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  slow:
    runs-on: alpha
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: src/TerraScale.Dashboard/web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: src/TerraScale.Dashboard/web
      - run: make build
      # The E2E lock file pins Microsoft.Playwright, so it keys the browser build. Only main saves it.
      - id: playwright
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/TerraScale.Dashboard.E2E/packages.lock.json') }}
      - name: Install pinned Chromium and its system dependencies
        run: |
          driver=tests/TerraScale.Dashboard.E2E/bin/Release/net10.0/.playwright
          "$driver/node/linux-x64/node" "$driver/package/cli.js" install --with-deps chromium
      - if: github.event_name != 'pull_request' && steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.cache-primary-key }}
      - run: make test-slow
      - name: Write redacted failure report
        if: failure()
        run: python3 scripts/report-slow-failure.py --prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: slow-results
          path: |
            test-results/tunit/slow.trx
            test-results/slow-failure.json
          if-no-files-found: warn
      - name: Upload running-app screenshots and videos for the tested commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dashboard-flow-evidence-${{ github.sha }}
          path: |
            docs/reviews/2026-10-13/onboarding-projects/test-results/pr-head/browser/*.png
            docs/reviews/2026-10-13/onboarding-projects/test-results/pr-head/browser/*-project-flow.webm
          if-no-files-found: warn

  report:
    needs: slow
    if: always() && needs.slow.result == 'failure'
    runs-on: alpha
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true # A setup failure can precede artifact creation; report it too.
        with:
          name: slow-results
          path: test-results
      - name: Create or update the matching failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report-slow-failure.py
