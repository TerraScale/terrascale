# Independent Slow results gate production deployment and receive an issue report on failure.
name: Slow

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  slow:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: src/TerraScale.Dashboard/web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: src/TerraScale.Dashboard/web
      - run: make build
      - name: Install pinned Chromium and its system dependencies
        run: |
          driver=tests/TerraScale.Dashboard.E2E/bin/Release/net10.0/.playwright
          "$driver/node/linux-x64/node" "$driver/package/cli.js" install --with-deps chromium
      - run: make test-slow
      - name: Write redacted failure report
        if: failure()
        run: python3 scripts/report-slow-failure.py --prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slow-results
          path: |
            test-results/tunit/slow.trx
            test-results/slow-failure.json
          if-no-files-found: warn
      - name: Upload running-app screenshots and videos for the tested commit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-flow-evidence-${{ github.sha }}
          path: |
            docs/reviews/2026-10-13/onboarding-projects/test-results/pr-head/browser/*.png
            docs/reviews/2026-10-13/onboarding-projects/test-results/pr-head/browser/*-project-flow.webm
          if-no-files-found: warn

  report:
    needs: slow
    if: always() && needs.slow.result == 'failure'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true # A setup failure can precede artifact creation; report it too.
        with:
          name: slow-results
          path: test-results
      - name: Create or update the matching failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report-slow-failure.py
