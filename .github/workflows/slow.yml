# Browser/policy Slow coverage runs on affected main changes, never automatically on PRs.
# Investigate repeats on dev hosts; dispatch is for a missing natural main run.
name: Slow

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vendor/dotnet/**'
      - 'contracts/**'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/slow.yml'
      - 'Directory.*.props'
      - 'NuGet.Config'
      - 'global.json'
      - 'Makefile'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer main push cancels superseded browser work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  slow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: ./.github/actions/dashboard-setup
        id: dependencies
        timeout-minutes: 5
      - run: make build
        timeout-minutes: 5
      # The E2E lock file pins Microsoft.Playwright, so it keys the browser build. Only main saves it.
      - id: playwright
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 1
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/TerraScale.Dashboard.E2E/packages.lock.json') }}
      - name: Install pinned Chromium and its system dependencies
        timeout-minutes: 8
        run: |
          driver=tests/TerraScale.Dashboard.E2E/bin/Release/net10.0/.playwright
          "$driver/node/linux-x64/node" "$driver/package/cli.js" install --with-deps chromium
      - if: github.ref == 'refs/heads/main' && steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 1
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.cache-primary-key }}
      - timeout-minutes: 15
        run: |
          dotnet run --configuration Release --no-build --no-restore \
            --project tests/TerraScale.Dashboard.E2E/TerraScale.Dashboard.E2E.csproj -- \
            --treenode-filter '/*/*/*/*[Category=Slow]' --report-trx \
            --results-directory "$PWD/test-results/tunit" --report-trx-filename slow.trx
      - name: Save main's locked dependency cache
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 1
        with:
          path: |
            ${{ runner.temp }}/nuget
            ~/.npm
          key: ${{ steps.dependencies.outputs.cache-key }}
      - name: Write redacted failure report
        timeout-minutes: 1
        if: failure()
        run: python3 scripts/report-slow-failure.py --prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 1
        if: always()
        with:
          name: slow-results
          path: |
            test-results/tunit/slow.trx
            test-results/slow-failure.json
          if-no-files-found: warn
      - name: Upload running-app screenshots and videos for the tested commit
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dashboard-flow-evidence-${{ github.sha }}
          path: |
            test-results/dotnet/directory-export-browser/
            test-results/dotnet/code-editor-styling/
            test-results/dotnet/hosted-auth-v3/
            docs/reviews/2026-10-13/onboarding-projects/test-results/pr-head/browser/*.png
            docs/reviews/2026-10-13/onboarding-projects/test-results/pr-head/browser/*-project-flow.webm
          if-no-files-found: warn

      # Main-only workflow: retain issue reporting without a setup job or artifact round trip.
      - name: Create or update the matching failure issue
        timeout-minutes: 2
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report-slow-failure.py
