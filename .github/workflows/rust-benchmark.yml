name: Rust benchmark client

on:
  pull_request:
    paths:
      - benchmark/clients/rust/**
      - .github/workflows/rust-benchmark.yml
  push:
    branches: [main]
    paths:
      - benchmark/clients/rust/**
      - .github/workflows/rust-benchmark.yml
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  rust-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Restore locked Cargo dependencies and build output
        id: cargo
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            benchmark/clients/rust/target
          key: ${{ runner.os }}-cargo-1.99.1-${{ hashFiles('benchmark/clients/rust/Cargo.lock', 'benchmark/clients/rust/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-1.99.1-
      - name: Build and test the locked SDK dependency and benchmark client
        run: cargo +1.99.1 test --locked --all-targets --manifest-path benchmark/clients/rust/Cargo.toml
      - name: Retain main Cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            benchmark/clients/rust/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}
