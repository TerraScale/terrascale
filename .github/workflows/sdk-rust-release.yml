name: SDK Rust Release

on:
  push:
    tags: ['sdk/rust/v0.0.*']

permissions:
  contents: read

concurrency:
  group: sdk-rust-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/sdk-fast.yml
    with:
      area: sdk-rust

  publish:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the versioned main tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^sdk/rust/v0\.0\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Build the release artifacts with their release gates
        id: qualified
        run: python3 scripts/sdk/build-release.py rust "$RUNNER_TEMP/qualified"
      - name: Require the tagged package version
        env:
          VERSION: ${{ steps.qualified.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "sdk/rust/v$VERSION"
      - name: Publish the qualified source without rebuilding
        working-directory: sdk/rust
        env:
          VERSION: ${{ steps.qualified.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo 'CARGO_REGISTRY_TOKEN must be installed by the release owner.' >&2; exit 1; }
          python3 - "$VERSION" <<'PYTHON'
          import sys, tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          assert manifest["name"] == "terrascale" and manifest["version"] == sys.argv[1]
          PYTHON
          test -s "$RUNNER_TEMP/qualified/terrascale-$VERSION.crate"
          cargo publish --no-verify --locked --all-features --registry crates-io
