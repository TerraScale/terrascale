name: SDK rust Fast

on:
  push:
    branches: [main]
    paths:
      - 'sdk/rust/**'
      - '.github/workflows/sdk-rust-*.yml'
      - '.github/workflows/sdk-fast.yml'
      - 'scripts/sdk/**'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/rust/**'
      - '.github/workflows/sdk-rust-*.yml'
      - '.github/workflows/sdk-fast.yml'
      - 'scripts/sdk/**'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    uses: ./.github/workflows/sdk-fast.yml
    with:
      area: sdk-rust
