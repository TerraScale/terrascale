name: SDK rust Fast

on:
  push:
    branches: [main]
    paths:
      - 'sdk/rust/**'
      - '.github/workflows/sdk-rust-*.yml'
      - '.github/workflows/sdk-fast.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/rust/**'
      - '.github/workflows/sdk-rust-*.yml'
      - '.github/workflows/sdk-fast.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-rust-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    uses: ./.github/workflows/sdk-fast.yml
    with:
      area: sdk-rust
