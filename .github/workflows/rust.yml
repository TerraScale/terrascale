name: Rust

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # Markdown and docs never change what CI checks.
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

# A newer PR push cancels the older run. Main runs finish (so main's caches get saved); a newer main push replaces only
# a pending one. merge_group runs keep their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Draft PRs run nothing; marking the PR ready runs it.
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      # Cargo registry + target dir, keyed on the toolchain and Cargo.lock. Only main saves; PRs restore main's cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test with HTTP fakes and conformance fixtures
        run: cargo test --locked --all-features
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
