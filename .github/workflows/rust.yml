name: Rust

on:
  push:
    tags: ['v0.0.*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Keep the default-branch Cargo cache warm without repeating PR validation.
  schedule:
    - cron: '11 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ !github.event.deleted && !github.event.pull_request.draft && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select changes that need Rust validation
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]] ||
             ! git diff --quiet HEAD^ HEAD -- '*.rs' 'Cargo.*' 'rust-toolchain*' \
               .cargo src tests examples .github/workflows/rust.yml ':(exclude)*.md'; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned Rust toolchain
        if: steps.changes.outputs.rust == 'true'
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.rust == 'true'
        id: cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        if: steps.changes.outputs.rust == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push')
        run: cargo fmt --all -- --check
      - name: Test with HTTP fakes and conformance fixtures
        if: steps.changes.outputs.rust == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push')
        run: cargo test --locked --all-features
      - name: Clippy
        if: steps.changes.outputs.rust == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push')
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Qualify crates.io package without credentials
        if: steps.changes.outputs.rust == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push')
        run: cargo publish --dry-run --locked --all-features --registry crates-io
      - name: Validate release tag and current main
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 - <<'PY'
          import os
          import re
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              package = tomllib.load(manifest)["package"]
          assert package["name"] == "terrascale", "unexpected package name"
          assert re.fullmatch(r"0\.0\.(0|[1-9][0-9]*)", package["version"]), "version must be 0.0.X"
          assert os.environ["RELEASE_TAG"] == f"v{package['version']}", "tag must match Cargo.toml version exactly"
          PY
      - name: Publish tagged crate to crates.io
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo 'CARGO_REGISTRY_TOKEN must be installed by the release owner.' >&2
            exit 1
          fi
          cargo publish --locked --all-features --registry crates-io
      - name: Prime default-branch dependency cache without running tests
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.cache.outputs.cache-hit != 'true'
        run: cargo test --locked --all-features --no-run
