name: SDK Go Release

on:
  push:
    tags: ['sdk/go/v0.0.*']

permissions:
  contents: read
  statuses: read

concurrency:
  group: sdk-go-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/sdk-fast.yml
    with:
      area: sdk-go

  publish:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the versioned main tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^sdk/go/v0\.0\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download exact qualified bytes
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sdk/download-qualified.py go "$GITHUB_SHA" "$RUNNER_TEMP/qualified"
      - name: Require the qualified package version
        env:
          VERSION: ${{ steps.qualified.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "sdk/go/v$VERSION"
      - name: Publish the qualified CLI assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/qualified"
          sha256sum --check checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --target "$GITHUB_SHA" --title "TerraScale Go ${GITHUB_REF_NAME#sdk/go/v}" \
            --notes "CLI and module release qualified on a dev host at $GITHUB_SHA." \
            ./*.tar.gz ./*.zip checksums.txt ts.rb install.sh
