name: SDK Go Release

on:
  push:
    branches: [main]
    paths:
      - 'sdk/go/**'
      - 'scripts/sdk/**'
      - '.github/workflows/sdk-go-release.yml'
    tags: ['sdk/go/v0.0.*']
permissions:
  contents: read
  statuses: read

concurrency:
  group: sdk-go-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: read
      actions: read
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: gate
        name: Select qualified current green main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess, time
          def gh(*args):
              return json.loads(subprocess.check_output(['gh', *args], text=True))
          repo, revision = os.environ['REPOSITORY'], os.environ['REVISION']
          def main_green():
              runs = gh('run', 'list', '--repo', repo, '--branch', 'main', '--commit', revision,
                        '--event', 'push', '--limit', '100', '--json', 'status,conclusion,workflowName')
              runs = [item for item in runs if item['workflowName'] != 'SDK Go Release']
              return bool(runs) and all(item['status'] == 'completed'
                                        and item['conclusion'] in {'success', 'skipped'} for item in runs)
          def qualified():
              pages = gh('api', '--paginate', '--slurp',
                         f'repos/{repo}/commits/{revision}/statuses?per_page=100')
              rows = [row for page in pages for row in page if row.get('context') == 'sdk-release/sdk-go']
              proof = max(rows, key=lambda row: row['id']) if rows else None
              return bool(proof) and proof['state'] == 'success' and proof['creator']['login'] == 'MarioGK'
          def current_main():
              return gh('api', f'repos/{repo}/git/ref/heads/main')['object']['sha']
          deadline = time.monotonic() + 25 * 60
          while time.monotonic() < deadline and not (main_green() and qualified()):
              time.sleep(30)
          eligible = (main_green() and qualified() and current_main() == revision)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"eligible={'true' if eligible else 'false'}\n")
          if not eligible:
              print('This revision never became qualified green main.')
          PYTHON
      - name: Require this commit's dev-host Fast result
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: python3 scripts/sdk/check-proof.py sdk-go "$REVISION"

  autorelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tests.outputs.eligible == 'true'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      statuses: read
      actions: read
    steps:
      - name: Tag the qualified revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          QUALIFIED_DIR: ${{ runner.temp }}/qualified
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          repo, revision = os.environ['REPOSITORY'], os.environ['REVISION']
          qualified_dir = pathlib.Path(os.environ['QUALIFIED_DIR'])
          qualified_dir.mkdir(parents=True, exist_ok=True)
          subprocess.check_call(['gh', 'release', 'download', f'sdk/go/qualified-{revision}',
                                 '--repo', repo, '--dir', str(qualified_dir),
                                 '--pattern', 'qualification.json'])
          manifest = json.loads((qualified_dir / 'qualification.json').read_text())
          if manifest['revision'] != revision or manifest['language'] != 'go':
              raise SystemExit('Qualified artifact identity differs from this revision')
          version = manifest['version']
          tag = f'sdk/go/v{version}'
          existing = subprocess.run(['gh', 'api', f'repos/{repo}/git/ref/tags/sdk%2Fgo%2Fv{version}'],
                                    capture_output=True, text=True)
          if existing.returncode == 0:
              print(f'{tag} is already released; nothing to do.')
              raise SystemExit(0)
          subprocess.check_call(['gh', 'api', f'repos/{repo}/git/refs',
                                 '-f', f'ref=refs/tags/{tag}', '-f', f'sha={revision}'])
          print(f'Tagged {tag} at {revision}')
          PYTHON

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the versioned main tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^sdk/go/v0\.0\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download exact qualified bytes
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sdk/download-qualified.py go "$GITHUB_SHA" "$RUNNER_TEMP/qualified"
      - name: Require the qualified package version
        env:
          VERSION: ${{ steps.qualified.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "sdk/go/v$VERSION"
      - name: Publish the qualified CLI assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/qualified"
          sha256sum --check checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --target "$GITHUB_SHA" --title "TerraScale Go ${GITHUB_REF_NAME#sdk/go/v}" \
            --notes "CLI and module release qualified on a dev host at $GITHUB_SHA." \
            ./*.tar.gz ./*.zip checksums.txt ts.rb install.sh
