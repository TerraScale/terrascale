name: SDK Go Release

on:
  push:
    branches: [main]
    paths:
      - 'sdk/go/**'
      - 'scripts/sdk/**'
      - '.github/workflows/sdk-go-release.yml'
      - '.github/workflows/sdk-go-publish.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
permissions:
  contents: read

concurrency:
  group: sdk-go-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      revision: ${{ steps.gate.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: gate
        name: Select green main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess, time
          def gh(*args):
              return json.loads(subprocess.check_output(['gh', *args], text=True))
          repo, pushed = os.environ['REPOSITORY'], os.environ['REVISION']
          def green(sha):
              runs = gh('run', 'list', '--repo', repo, '--branch', 'main', '--commit', sha,
                        '--event', 'push', '--limit', '100', '--json', 'status,conclusion,workflowName')
              runs = [item for item in runs if item['workflowName'] != 'SDK Go Release']
              return bool(runs) and all(item['status'] == 'completed'
                                        and item['conclusion'] in {'success', 'skipped'} for item in runs)
          # Each Go push releases itself once all its other push workflows are green.
          def releasable():
              return pushed if green(pushed) else None
          deadline = time.monotonic() + 25 * 60
          revision = releasable()
          while time.monotonic() < deadline and revision is None:
              time.sleep(30)
              revision = releasable()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"eligible={'true' if revision else 'false'}\n")
              if revision:
                  output.write(f'revision={revision}\n')
          if not revision:
              print('No green main revision became releasable.')
          PYTHON

  autorelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tests.outputs.eligible == 'true'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.tests.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
      - name: Install the pinned Go toolchains and GoReleaser
        run: mise install "go@$(cat sdk/go/.go-version)" go@1.25.0 goreleaser@2.19.0
      - name: Build the release artifacts with their release gates
        id: qualified
        run: python3 scripts/sdk/build-release.py go "$RUNNER_TEMP/qualified"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-go-release
          path: ${{ runner.temp }}/qualified
          if-no-files-found: error
          retention-days: 1
      - name: Tag the built revision
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.tests.outputs.revision }}
          VERSION: ${{ steps.qualified.outputs.version }}
        run: |
          set -euo pipefail
          tag="sdk/go/v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/sdk%2Fgo%2Fv$VERSION" > /dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$REVISION" > /dev/null
          echo "Tagged $tag at $REVISION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # A tag created with the job token starts no workflow, so publish the new tag here.
  publish:
    needs: autorelease
    if: needs.autorelease.outputs.tag != ''
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/sdk-go-publish.yml
    with:
      tag: ${{ needs.autorelease.outputs.tag }}
