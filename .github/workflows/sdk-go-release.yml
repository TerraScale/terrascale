name: SDK Go Release

on:
  push:
    branches: [main]
    paths:
      - 'sdk/go/**'
      - 'scripts/sdk/**'
      - '.github/workflows/sdk-go-release.yml'
      - '.github/workflows/sdk-go-publish.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
      - '!.cos/**'
permissions:
  contents: read
  statuses: read

concurrency:
  group: sdk-go-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: read
      actions: read
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      revision: ${{ steps.gate.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: gate
        name: Select qualified green main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess, time
          def gh(*args):
              return json.loads(subprocess.check_output(['gh', *args], text=True))
          repo, pushed = os.environ['REPOSITORY'], os.environ['REVISION']
          def green(sha):
              runs = gh('run', 'list', '--repo', repo, '--branch', 'main', '--commit', sha,
                        '--event', 'push', '--limit', '100', '--json', 'status,conclusion,workflowName')
              runs = [item for item in runs if item['workflowName'] != 'SDK Go Release']
              return bool(runs) and all(item['status'] == 'completed'
                                        and item['conclusion'] in {'success', 'skipped'} for item in runs)
          def qualified(sha):
              pages = gh('api', '--paginate', '--slurp',
                         f'repos/{repo}/commits/{sha}/statuses?per_page=100')
              rows = [row for page in pages for row in page if row.get('context') == 'sdk-release/sdk-go']
              proof = max(rows, key=lambda row: row['id']) if rows else None
              return bool(proof) and proof['state'] == 'success' and proof['creator']['login'] == 'MarioGK'
          def released_commit():
              pages = gh('api', '--paginate', '--slurp', f'repos/{repo}/tags?per_page=100')
              names = [tag['name'] for page in pages for tag in page
                       if tag['name'].startswith('sdk/go/v0.0.')]
              if not names:
                  return None
              newest = max(names, key=lambda name: tuple(int(part) for part in name.rsplit('v', 1)[1].split('.')))
              ref = gh('api', f'repos/{repo}/git/ref/tags/{newest.replace("/", "%2F")}')
              sha = ref['object']['sha']
              if ref['object']['type'] == 'tag':
                  sha = gh('api', f'repos/{repo}/git/tags/{sha}')['object']['sha']
              return sha
          def unreleased():
              # Newest first, stopping at the commit already carrying the newest tag.
              bound = released_commit()
              found = []
              for page in range(1, 4):
                  commits = gh('api', f'repos/{repo}/commits?sha=main&per_page=40&page={page}')
                  if not commits:
                      break
                  for commit in commits:
                      if commit['sha'] == bound:
                          return found[:20]
                      found.append(commit['sha'])
                  if len(commits) < 40:
                      break
              return found[:20]
          def releasable():
              if qualified(pushed) and green(pushed):
                  return pushed
              for sha in unreleased():
                  if sha != pushed and qualified(sha) and green(sha):
                      return sha
              return None
          deadline = time.monotonic() + 25 * 60
          revision = releasable()
          while time.monotonic() < deadline and revision is None:
              time.sleep(30)
              revision = releasable()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"eligible={'true' if revision else 'false'}\n")
              if revision:
                  output.write(f'revision={revision}\n')
          if not revision:
              print('No qualified green main revision became releasable.')
          PYTHON
      - name: Require the released revision's dev-host Fast result
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.gate.outputs.revision }}
        run: python3 scripts/sdk/check-proof.py sdk-go "$REVISION"

  autorelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tests.outputs.eligible == 'true'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      statuses: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Download exact qualified bytes
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.tests.outputs.revision }}
        run: python3 scripts/sdk/download-qualified.py go "$REVISION" "$RUNNER_TEMP/qualified"
      - name: Tag the qualified revision
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.tests.outputs.revision }}
          VERSION: ${{ steps.qualified.outputs.version }}
        run: |
          set -euo pipefail
          tag="sdk/go/v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/sdk%2Fgo%2Fv$VERSION" > /dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$REVISION" > /dev/null
          echo "Tagged $tag at $REVISION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # A tag created with the job token starts no workflow, so publish the new tag here.
  publish:
    needs: autorelease
    if: needs.autorelease.outputs.tag != ''
    permissions:
      contents: write
      statuses: read
    uses: ./.github/workflows/sdk-go-publish.yml
    with:
      tag: ${{ needs.autorelease.outputs.tag }}
