name: SDK Fast

on:
  workflow_call:
    inputs:
      area:
        required: true
        type: string

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AREA: ${{ inputs.area }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/dotnet-setup
        if: inputs.area == 'sdk-dotnet'
        with:
          solution: sdk/dotnet/TerraScale.DotNet.slnx
          dotnet-version: 10.0.401
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: inputs.area != 'sdk-dotnet'
        with:
          install: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: inputs.area == 'sdk-go'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: sdk-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/go/.go-version', 'sdk/go/go.sum') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: inputs.area == 'sdk-js'
        with:
          path: ~/.npm
          key: sdk-js-${{ runner.os }}-${{ hashFiles('sdk/js/package-lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: inputs.area == 'sdk-python'
        with:
          path: ~/.cache/uv
          key: sdk-python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/python/requirements-ci.txt') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: inputs.area == 'sdk-rust'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sdk/rust/target
          key: sdk-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/rust/rust-toolchain.toml', 'sdk/rust/Cargo.lock') }}
      - name: Install the pinned SDK toolchain
        run: |
          set -euo pipefail
          case "$AREA" in
            sdk-go) mise use -g "go@$(cat sdk/go/.go-version)"; dirname "$(mise which go)" >> "$GITHUB_PATH" ;;
            sdk-python) mise use -g uv@0.13.7; dirname "$(mise which uv)" >> "$GITHUB_PATH" ;;
            sdk-rust) rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy ;;
          esac
      - name: SDK Fast
        run: make "$AREA-test-fast"
