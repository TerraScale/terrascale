name: AI review on main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit on main to review
        type: string

permissions:
  contents: read
  issues: write

jobs:
  review:
    uses: ./.github/workflows/ai-review.yml
    with:
      head_sha: ${{ inputs.head_sha || github.sha }}
      deny_paths: |
        .github/**
        scripts/ci/**
        ops/**
        aspire/**
        e2e/**
        src/TerraBase/**
        src/TerraBase.*/**
        src/TerraScale.Authentication*/**
        src/TerraScale.Dashboard/Features/Billing/**
        src/TerraScale.Dashboard/Platform/Persistence/Migrations/**
        **/Migrations/**
        **/*.lock
        **/packages.lock.json
    secrets: inherit
