name: CI

on:
  pull_request:
    # No `labeled`: a label must not re-run and cancel the running check.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reconcile_auth:
        description: Reconcile ts-auth with the newest journey-qualified main commit
        type: boolean
        default: false
      native_artifacts:
        description: 'Maintenance: prepare combined native release assets only (no builds, images or publication)'
        type: boolean
        default: false
      # Cold maintenance pins the TerraBase digest into its fences before the window, then releases it to the fenced
      # regions: build-only qualifies and publishes the immutable images without releasing; release-only releases one
      # TerraBase arm64 digest this main revision built, to each region separately, without building.
      publication:
        description: 'release (default), build-only (TerraBase images, no release) or release-only (needs terrabase_arm64)'
        type: choice
        options: [release, build-only, release-only]
        default: release
      terrabase_arm64:
        description: 'release-only: the linux/arm64 child digest (sha256:...) a build-only run published for this main revision'
        type: string
        default: ''

# A new push cancels the older run of the same PR. Every other run has its own group: each main push publishes the
# images of the areas it changed, so none may be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # SDK source belongs to the same checked revision as its consumers.
  TS_DOTNET_DIR: sdk/dotnet
  TsDotnetRoot: ${{ github.workspace }}/terrascale/sdk/dotnet
  TERRABASE_REVISION: ${{ github.sha }}
  TS_AUTH_REVISION: ${{ github.sha }}
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  ASPNETCORE_HTTP_PORTS: ''

jobs:
  changes:
    if: ${{ !inputs.reconcile_auth }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.areas.outputs.dotnet }}
      main: ${{ steps.areas.outputs.main }}
      sha: ${{ github.sha }}
      sdks: ${{ steps.areas.outputs.sdks }}
      docs: ${{ steps.filter.outputs.docs }}
      landing: ${{ steps.filter.outputs.landing }}
      status: ${{ steps.filter.outputs.status }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      journey: ${{ steps.journey.outputs.journey }}
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      # Pull requests list files through the API; pushes diff the checkout against the push's `before` commit.
      - if: github.event_name == 'push'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          ref: ${{ github.event_name == 'push' && github.sha || '' }}
          filters: |
            engine:
              - src/TerraBase/Engine/**/!(AGENTS.md|CLAUDE.md)
              - src/vendor/**/!(AGENTS.md|CLAUDE.md)
              - src/TerraBase/Features/Backup/**/!(AGENTS.md|CLAUDE.md)
              - src/TerraBase/Hosting/Shutdown.cs
              - src/TerraBase/Hosting/ApplicationRunCompletion.cs
              - src/TerraBase/Hosting/DatabaseRoute.cs
              - src/TerraBase/Hosting/DatabaseLifecycleCheckpoint.cs
              - src/TerraBase/Hosting/BadRequests.cs
              - src/TerraBase/Hosting/Listeners.cs
              - src/TerraBase/Features/Health/NodeReadiness.cs
              - src/TerraBase/Features/Health/ReadyzEndpoint.cs
              - src/TerraBase/Configuration/TerraBaseOptions.cs
              - src/TerraBase/Features/Memory/MemoryBudget.cs
              - src/TerraBase/Features/Memory/IMemoryBudget.cs
              - src/TerraBase/Features/Qos/QosAdmission.cs
              - src/TerraBase/Features/Qos/IQosAdmission.cs
              - src/TerraBase/Features/Qos/QosContext.cs
              - src/TerraBase/Features/Qos/QosPolicy.cs
              - src/TerraBase/Features/Qos/QosRequestLease.cs
              - src/TerraBase/Tenancy/TenantContext.cs
              - src/TerraBase/Tenancy/PlanTierExtensions.cs
              - src/TerraBase/Program.cs
              - src/TerraBase/TerraBase.csproj
              - src/TerraBase/Features/Sql/SqlErrors.cs
              - src/TerraBase/Features/Sql/SqlService.cs
              - src/TerraBase/Features/Sql/SqlScript.cs
              - src/TerraBase/Features/Sql/SqlSocket.cs
              - src/TerraBase/Features/Postgres/PostgresConnectionHandler.cs
              - src/TerraBase/Features/Management/CreateDatabaseEndpoint.cs
              - src/TerraBase/Features/Management/DeleteManagedDatabaseEndpoint.cs
              - src/TerraBase/Features/Management/EngineManagementService.AddPipeline.cs
              - src/TerraBase/Features/Management/EngineManagementService.DeletePipeline.cs
              - src/TerraBase/Features/Management/EngineManagementService.Databases.cs
              - src/TerraBase/Features/Management/EngineManagementService.Recovery.cs
              - src/TerraBase/Features/Management/EngineManagementService.Orphans.cs
              - src/TerraBase/Features/Management/EngineManagementService.Tenants.cs
              - src/TerraBase/Features/Management/Backups/StorageSweep.cs
              - src/TerraBase/Features/Management/Backups/EngineManagedBackupService.Restores.cs
              - src/TerraBase/Features/Replicas/HomeMoves.cs
              - src/TerraBase/Features/Replicas/HomeLeases.cs
              - src/TerraBase/Features/Replicas/RegionalHandoff.cs
              - src/TerraBase/Features/Memory/MemoryBudgetExtensions.cs
              - src/TerraBase/Primitives/DirectorySync.cs
              - src/TerraBase/Primitives/EntityIds.cs
              - src/TerraBase/Primitives/StrictJson.cs
              - src/TerraScale.Logging/**/!(AGENTS.md|CLAUDE.md)
              - e2e/env/engine-crash*
              - e2e/env/build.sh
              - scripts/terrabase/**
              - scripts/vendor/download-turso-native.sh
              - scripts/vendor/verify-turso-native.sh
              - benchmark/turso-sync-host/turso-pin.env
              - Makefile
              - Directory.*
              - global.json
              - NuGet.config
              - .github/workflows/ci.yml
              - .github/workflows/journey.yml
            shared: &shared
              - .github/workflows/ci.yml
              - Makefile
              - Directory.*
              - global.json
              - NuGet.config
              - .editorconfig
              - BannedSymbols.txt
              - TerraScale.slnx
              - src/TerraScale.Endpoints*/**/!(AGENTS.md|CLAUDE.md)
              - src/TerraScale.Logging/**/!(AGENTS.md|CLAUDE.md)
            # Each area lists only inputs its own projects build.
            dotnet-sdk: &dotnet-sdk
              - sdk/dotnet/Directory.*
              - sdk/dotnet/NuGet.config
              - sdk/dotnet/BannedSymbols.txt
              - sdk/dotnet/contracts/auth/error-codes.json
              - sdk/dotnet/src/**/!(AGENTS.md|CLAUDE.md)
            libs:
              - *shared
              - libs.slnf
              - benchmark/dotnet/TerraScale.Endpoints.Benchmarks/**/!(AGENTS.md|CLAUDE.md)
              - benchmark/dotnet/TerraScale.Logging.Benchmarks/**/!(AGENTS.md|CLAUDE.md)
            auth:
              - *shared
              - *dotnet-sdk
              - Dockerfile
              - scripts/ci/image-payloads.sh
              - auth.slnf
              - src/TerraScale.Authentication*/**/!(AGENTS.md|CLAUDE.md)
              - docs/auth/*.yaml
              - scripts/auth/{check-nuget-vulnerabilities{,.lib}.cs,export-openapi.sh,packages.lock.json}
              - scripts/efcore/check-design-host.py
            auth-server:
              - src/TerraBase/**/!(AGENTS.md|CLAUDE.md)
              # TerraBase's RPC surface and the contracts it implements.
              - src/TerraScale.TerraBase.*/**/!(AGENTS.md|CLAUDE.md)
              - src/vendor/**/!(*.md|*.patch)
            # What ts-auth runs against TerraBase: its own code and the SDK it calls TerraBase with.
            auth-client:
              - *dotnet-sdk
              - src/TerraScale.Authentication*/**/!(AGENTS.md|CLAUDE.md)
            terrabase:
              - *shared
              - .github/actions/**
              - Dockerfile
              - src/vendor/**/!(*.md|*.patch)
              - scripts/vendor/{download,verify}-turso-native.sh
              - benchmark/turso-sync-host/turso-pin.env
              - terrabase.slnf
              - scripts/ci/image-payloads.sh
              - src/TerraBase*/**/!(AGENTS.md|CLAUDE.md)
              - src/TerraScale.TerraBase.*/**/!(AGENTS.md|CLAUDE.md)
              - landing-site/static/pricing.json
            sdk-dotnet:
              - sdk/dotnet/**/!(AGENTS.md|CLAUDE.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-go:
              - sdk/go/**/!(AGENTS.md|CLAUDE.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-js:
              - sdk/js/**/!(AGENTS.md|CLAUDE.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-python:
              - sdk/python/**/!(AGENTS.md|CLAUDE.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-rust:
              - sdk/rust/**/!(AGENTS.md|CLAUDE.md)
              - Makefile
              - .github/workflows/ci.yml
            docs:
              - docs-site/**/!(AGENTS.md|CLAUDE.md)
              - landing-site/static/{pricing,regions}.json
              - Makefile
              - .github/workflows/ci.yml
            landing:
              - landing-site/**/!(AGENTS.md|CLAUDE.md)
              - .github/workflows/ci.yml
            status:
              - status-site/**/!(AGENTS.md|CLAUDE.md)
              - .github/workflows/ci.yml
            dashboard:
              - src/TerraScale.Dashboard*/**/!(AGENTS.md|CLAUDE.md)
              - src/TerraScale.TerraBase.Contracts/**/!(AGENTS.md|CLAUDE.md)
              - src/TerraScale.Endpoints/**/!(AGENTS.md|CLAUDE.md)
              - src/TerraScale.Endpoints.Generators/**/!(AGENTS.md|CLAUDE.md)
              - scripts/dashboard/{Makefile,TerraScale.Dashboard.slnx,check-simple-ui.py,check-stripe-dependency.py,verify-sdk.py}
              - scripts/dashboard/ci/format.sh
              - scripts/efcore/check-design-host.py
              - scripts/ci/release-only.sh
              - *dotnet-sdk
              - Directory.*
              - .editorconfig
              - BannedSymbols.txt
              - global.json
              - NuGet.config
              - Makefile
              - .github/workflows/dashboard-ci.yml
              - .github/workflows/ci.yml
      - id: journey
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          predicate-quantifier: every
          filters: |
            journey:
              - '!docs-site/**'
              - '!landing-site/**/!(pricing.json)'
              - '!status-site/**'
              - '!docs/**'
              - '!**/*.md'
              - '!.github/**/!(ci.yml|journey.yml)'
              - '!scripts/**/!(check-stripe-dependency.py|download-turso-native.sh|verify-turso-native.sh)'
              - '!benchmark/**/!(turso-pin.env)'
              - '!{aspire,ops}/**'
              - '!{.dockerignore,.gitignore,.legacy-scan-mode,.mcp.json,Dockerfile,TerraScale.slnx,*.slnf,dotnet-tools.json}'
      - id: areas
        env:
          CHANGES: ${{ github.event_name == 'workflow_dispatch' && ((inputs.native_artifacts || inputs.publication == 'release-only') && '[]' || inputs.publication == 'build-only' && '["terrabase"]' || '["libs","auth","terrabase"]') || steps.filter.outputs.changes }}
        run: |
          {
            echo "main=$(jq -c '[.[] | select(. == "auth" or . == "terrabase")]' <<< "$CHANGES")"
            echo "dotnet=$(jq -c '[.[] | select(. == "libs" or . == "auth" or . == "terrabase")] | unique' <<< "$CHANGES")"
            echo "sdks=$(jq -c '[.[] | select(startswith("sdk-"))]' <<< "$CHANGES")"
          } >> "$GITHUB_OUTPUT"

  checks:
    if: ${{ !inputs.reconcile_auth }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Start the legacy scan
        run: |
          (status=0
            python3 scripts/legacy-scan/scan.py --repo terrascale --output legacy-hits.md > legacy-scan.log 2>&1 || status=$?
            echo "$status" > legacy-scan.exit.tmp && mv legacy-scan.exit.tmp legacy-scan.exit) > /dev/null 2>&1 &
      - name: Lint workflows
        if: github.event_name == 'pull_request'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          sha256sum --check --strict <<EOF
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz
          EOF
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 shellcheck-v0.11.0/shellcheck
          "$RUNNER_TEMP/actionlint" -shellcheck "$RUNNER_TEMP/shellcheck"
      - name: Merged EF Core migrations stay unchanged
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/migrations-frozen.py HEAD^1
      - name: No test file outside the journey
        if: github.event_name == 'pull_request'
        run: |
          added=$(git diff --name-only --no-renames --diff-filter=A HEAD^1 HEAD)
          if grep -v '^e2e/' <<< "$added" | grep -E '(^|/)([Tt]ests?|[Tt]esting|__tests__|__mocks__|[^/]*-tests)/|\.(Test[^/]*|E2E)/|(^|/)(tests?|test_[^/]*|conftest)\.py$|(^|/)tests?\.rs$|_tests?\.(go|rs|py)$|\.(test|spec)\.[cm]?[jt]sx?$|([.-]t|T)ests?\.cs$|(^|/)test-[^/]*\.(sh|py|[cm]?js|ts)$|-tests?\.(sh|py|[cm]?js|ts)$|(^|/)(vitest|jest|playwright)[^/]*\.config\.[cm]?[jt]s$'; then
            echo '::error::This pull request adds the test files above. The journey in e2e/ is the only test.'
            exit 1
          fi
      # Production runs on OCI through ts-orch; only Tigris (its endpoint and `fly storage`) stays. The brackets keep
      # these lines from matching themselves.
      - name: Workflows name no retired hosting provider
        if: github.event_name != 'push'
        run: '! grep -rniI "fl[y]" .github/workflows | grep -viE "fl[y]\.storage\.tigris\.dev|fl[y] storage"'
      - name: Storage format migrations
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-storage-format.sh HEAD^1 "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}"
      - name: Scan for legacy terms (fail)
        if: ${{ !cancelled() }}
        run: |
          until [ -f legacy-scan.exit ]; do sleep 1; done
          head -1 legacy-scan.log
          exit "$(cat legacy-scan.exit)"
      - name: Retain legacy hits
        if: ${{ !cancelled() && hashFiles('legacy-hits.md') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-hits
          path: |
            legacy-hits.md
            legacy-scan.log

  # Native Rust builds stay in explicit maintenance dispatches; every build verifies the pinned release bytes.
  native-build:
    if: github.event_name == 'workflow_dispatch' && inputs.native_artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            repeat: 1
          - arch: amd64
            runner: ubuntu-24.04
            repeat: 2
          - arch: arm64
            runner: ubuntu-24.04-arm
            repeat: 1
          - arch: arm64
            runner: ubuntu-24.04-arm
            repeat: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - &setup-builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build once on the real target architecture and run both native smokes
        run: scripts/vendor/build-turso-native.sh '${{ matrix.arch }}' native-output
      - name: Record this run's native SHA-256
        run: |
          cd native-output
          sha256sum --check SHA256SUMS-*
          grep 'runtimes/.*libturso_sdk_kit.so$' SHA256SUMS-* >> "$GITHUB_STEP_SUMMARY"
          (cd router-parser && sha256sum --check linux-*/SHA256SUMS && cat linux-*/SHA256SUMS >> "$GITHUB_STEP_SUMMARY")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turso-native-build-${{ matrix.arch }}-${{ matrix.repeat }}
          path: native-output/
          if-no-files-found: error

  native-release:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: turso-native-build-*
          path: native-builds
      - name: Assemble publication assets and source/patch receipts
        run: |
          for arch in amd64 arm64; do
            case "$arch" in amd64) rid=linux-x64 ;; arm64) rid=linux-arm64 ;; esac
            for repeat in 1 2; do
              (cd "native-builds/turso-native-build-$arch-$repeat" && sha256sum --check "SHA256SUMS-$rid")
            done
            cmp "native-builds/turso-native-build-$arch-1/runtimes/$rid/native/libturso_sdk_kit.so" \
                "native-builds/turso-native-build-$arch-2/runtimes/$rid/native/libturso_sdk_kit.so"
            for repeat in 1 2; do
              (cd "native-builds/turso-native-build-$arch-$repeat/router-parser" && sha256sum --check "$rid/SHA256SUMS")
            done
            cmp "native-builds/turso-native-build-$arch-1/router-parser/runtimes/$rid/native/libterrascale_sql_parser.so" \
                "native-builds/turso-native-build-$arch-2/router-parser/runtimes/$rid/native/libterrascale_sql_parser.so"
          done
          scripts/vendor/prepare-turso-native-release.sh native-builds/turso-native-build-amd64-1 native-builds/turso-native-build-arm64-1 native-release
          for arch in amd64 arm64; do
            case "$arch" in amd64) rid=linux-x64 ;; arm64) rid=linux-arm64 ;; esac
            cp "native-builds/turso-native-build-$arch-2/release/$rid-build-receipt.txt" "native-release/$rid-independent-build-receipt.txt"
          done
          (cd native-release && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > ../native-SHA256SUMS)
          mv native-SHA256SUMS native-release/SHA256SUMS
          cat native-release/NATIVE-SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turso-native-release
          path: native-release/
          if-no-files-found: error

  libs:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.dotnet), 'libs')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: terrascale
          persist-credentials: false
          ref: ${{ needs.changes.outputs.sha }}
      - &setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: terrascale/global.json
      - name: Locked restore
        working-directory: terrascale
        run: make restore SOLUTION=libs.slnf
      - name: Checked build, whitespace and style
        working-directory: terrascale
        run: |
          make -o restore fmt-check libs-build SOLUTION=libs.slnf CONFIGURATION=Release
          make -o restore -o libs-build libs-check CONFIGURATION=Release
          scripts/ci/release-only.sh

  auth:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.dotnet), 'auth')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *setup-dotnet
      - name: Locked restore
        working-directory: terrascale
        run: make restore SOLUTION=auth.slnf
      - name: Checked build, whitespace, NuGet audit and OpenAPI contract
        working-directory: terrascale
        run: |
          make -o restore fmt-check SOLUTION=auth.slnf CONFIGURATION=Release
          make -o restore -o auth-restore auth-check CONFIGURATION=Release
          scripts/ci/release-only.sh

  terrabase:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.dotnet), 'terrabase')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *setup-dotnet
      - name: Cached pinned Turso native libraries
        uses: ./terrascale/.github/actions/turso-native-cache
        with:
          dir: terrascale
      - name: Locked restore and pinned native libraries
        working-directory: terrascale
        run: make restore turso-native SOLUTION=terrabase.slnf
      - name: Whitespace
        working-directory: terrascale
        run: make -o restore fmt-check SOLUTION=terrabase.slnf CONFIGURATION=Release
      - name: Checked release publish keeps the natives inside the single file
        working-directory: terrascale
        run: |
          make -o turso-native terrabase-publish RUNTIME=linux-arm64 PUBLISH_DIR="$RUNNER_TEMP/terrabase-publish"
          scripts/ci/release-only.sh

  main:
    needs: [changes, terrabase, test, journey]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.terrabase.result == 'success'
      && needs.journey.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      && contains(fromJSON(needs.changes.outputs.main), 'terrabase') && inputs.publication != 'build-only'
    concurrency:
      group: production-terrabase
      cancel-in-progress: false
    env:
      AREA: terrabase
      SERVICE: terrabase
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # ts-orch accepts this job's OIDC token to release the image it just published.
      id-token: write
      # A failed release dispatches a fresh main run (a newer signed run) so the latest main still ends up live.
      actions: write
    steps: &production-steps
      - *checkout
      - uses: ./terrascale/.github/actions/qualified-main
        if: github.event_name == 'workflow_dispatch' && inputs.publication == 'build-only'
        with:
          revision: ${{ github.sha }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: terrascale/global.json
      # The publish step's make turso-native verifies these cached bytes (or downloads once on a miss).
      - name: Cached pinned Turso native libraries
        uses: ./terrascale/.github/actions/turso-native-cache
        with:
          dir: terrascale
      # Production runs linux/arm64 only: publish that runtime once, then wrap it in the image without another build.
      # The publish restores only its own project, locked, from nuget.org (8-12 s cold; the monorepo package cache took
      # 25 s to download plus 7 s to restore). The image builder boots meanwhile.
      - name: Publish the linux/arm64 runtime payload
        working-directory: terrascale
        run: |
          docker buildx create --use --driver docker-container --bootstrap > "$RUNNER_TEMP/builder.log" 2>&1 &
          builder=$!
          bash scripts/ci/image-payloads.sh publish "$AREA"
          bash scripts/ci/image-payloads.sh runtime-dockerfile "$AREA" > "$RUNNER_TEMP/image-payloads/Dockerfile"
          wait "$builder" || { cat "$RUNNER_TEMP/builder.log"; exit 1; }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Public images ts-orch runs: ghcr.io/terrascale/{terrabase,ts-auth}:<sha> and :main. Production runs linux/arm64
      # only, so that is the only platform built; ts-orch pins its child digest.
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/image-payloads
          file: ${{ runner.temp }}/image-payloads/Dockerfile
          platforms: linux/arm64
          tags: |
            ghcr.io/terrascale/${{ env.SERVICE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && inputs.publication != 'build-only' && format('ghcr.io/terrascale/{0}:main', env.SERVICE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
      - id: digest
        name: Verify the published linux/arm64 child
        env:
          INDEX: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/terrascale/${SERVICE}"
          { echo '```'; docker buildx imagetools inspect "${image}@${INDEX}"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          arm64=$(docker buildx imagetools inspect "${image}@${INDEX}" --format '{{json .Manifest}}' |
            jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          test -n "$arm64"
          docker buildx imagetools inspect "${image}@${arm64}" --format '{{json .Image}}' |
            jq -e --arg revision "$GITHUB_SHA" '.architecture == "arm64" and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision'
          echo "arm64=${arm64}" >> "$GITHUB_OUTPUT"
      - name: Record the build-only digest (no release)
        if: github.event_name == 'workflow_dispatch' && inputs.publication == 'build-only'
        env:
          INDEX: ${{ steps.image.outputs.digest }}
          ARM64: ${{ steps.digest.outputs.arm64 }}
        run: echo "BUILD_ONLY ${SERVICE} revision=${GITHUB_SHA} index=${INDEX} arm64=${ARM64}" | tee -a "$GITHUB_STEP_SUMMARY"

  main-build-only:
    needs: [changes, terrabase, test]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.terrabase.result == 'success'
      && github.event_name == 'workflow_dispatch' && inputs.publication == 'build-only' && github.ref == 'refs/heads/main'
    concurrency:
      group: build-${{ github.run_id }}
      cancel-in-progress: false
    env:
      AREA: terrabase
      SERVICE: terrabase
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    steps: *production-steps

  release-only:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.publication == 'release-only' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-terrabase
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: read
      actions: read
      # Reads the private TerraBase image to check its revision label.
      packages: read
      # ts-orch accepts this job's OIDC token to release the pinned digest.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .github/actions/qualified-main
      - uses: ./.github/actions/qualified-main
        with:
          revision: ${{ github.sha }}
      - *setup-builder
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Release the pinned arm64 digest to each region
        env:
          GH_TOKEN: ${{ github.token }}
          ARM64: ${{ inputs.terrabase_arm64 }}
        run: |
          set -euo pipefail
          [[ "$ARM64" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'terrabase_arm64 must be sha256:<64 hex>' >&2; exit 1; }
          image="ghcr.io/terrascale/terrabase@${ARM64}"
          docker buildx imagetools inspect "$image" --format '{{json .Image}}' |
            jq -e --arg revision "$GITHUB_SHA" '.architecture == "arm64" and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision'
          bash scripts/ci/fetch-ts-orch.sh "${RUNNER_TEMP}/ts-orch"
          status=0
          for i in $(jq -r 'to_entries | sort_by(.value.region == "gru", .value.region != "sjc", .value.region) | .[].key' "${RUNNER_TEMP}/ts-orch/regions.json"); do
            jq -c "[.[$i]]" "${RUNNER_TEMP}/ts-orch/regions.json" > "${RUNNER_TEMP}/region.json"
            echo "Region $(jq -r '.[0].region' "${RUNNER_TEMP}/region.json")" | tee -a "$GITHUB_STEP_SUMMARY"
            out=$("${RUNNER_TEMP}/ts-orch/terrascale-orchestrator-linux-amd64" release app --service terrabase \
              --image "$image" --regions "${RUNNER_TEMP}/region.json" 2>&1) || status=1
            tee -a "$GITHUB_STEP_SUMMARY" <<< "$out"
            # A superseded release exits 0 without this digest: require this region's own done state.
            tail -1 <<< "$out" | jq -e '.state == "done" and (.error // "") == ""' > /dev/null || status=1
            [ "$status" -eq 0 ] || break
          done
          exit "$status"

  main-auth:
    if: github.event_name == 'workflow_dispatch' && inputs.reconcile_auth && github.ref == 'refs/heads/main'
    concurrency:
      group: production-auth
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      issues: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - id: live
        name: Reconcile qualified main with live ts-auth
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/site-deploy-gate.mjs auth
      - name: Prepare the qualified target
        if: steps.live.outputs.deploy == 'true'
        run: |
          cp scripts/ci/site-deploy-gate.mjs "$RUNNER_TEMP/reconcile.mjs"
          cp scripts/ci/reconcile-image.sh "$RUNNER_TEMP/reconcile-image.sh"
          cp scripts/ci/release-app.sh "$RUNNER_TEMP/release-app.sh"
          cp scripts/ci/fetch-ts-orch.sh "$RUNNER_TEMP/fetch-ts-orch.sh"
          git checkout --detach "$REVISION"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: steps.live.outputs.deploy == 'true'
        with:
          global-json-file: global.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.live.outputs.deploy == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: steps.live.outputs.deploy == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build or reuse the target image and publish its main tag
        if: steps.live.outputs.deploy == 'true'
        run: bash "$RUNNER_TEMP/reconcile-image.sh" auth
      - name: Release to every region
        if: steps.live.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/release-app.sh" ts-auth "$IMAGE"
      - name: Prove the live revision
        if: steps.live.outputs.deploy == 'true'
        run: node "$RUNNER_TEMP/reconcile.mjs" auth --prove
      - name: Record the released source for the production journey
        if: steps.live.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-revision
          overwrite: true
          path: ${{ runner.temp }}/deploy-revision
          if-no-files-found: error
          retention-days: 1
  test:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.native_artifacts && 'native-maintenance-unqualified' || 'test' }}
    needs: [changes, checks, libs, auth, terrabase, dashboard, sdk]
    if: >-
      ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.native_artifacts)
      && (needs.changes.result != 'success' || needs.checks.result != 'success'
      || needs.changes.outputs.dotnet != '[]' || needs.changes.outputs.sdks != '[]' || needs.dashboard.result != 'skipped'
      || needs.changes.outputs.main != '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Every selected leg passed
        env:
          LEGS: ${{ needs.changes.outputs.dotnet }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if grep -qE 'failure|cancelled' <<< '${{ join(needs.*.result, ' ') }}'; then exit 1; fi
          for leg in $(jq -r '.[]' <<< "$LEGS"); do
            [[ $(jq -r --arg leg "$leg" '.[$leg].result' <<< "$RESULTS") == success ]] || exit 1
          done

  dashboard:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.dashboard == 'true'
    uses: ./.github/workflows/dashboard-ci.yml

  sdk:
    needs: changes
    if: needs.changes.outputs.sdks != '[]'
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.changes.outputs.sdks) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AREA: ${{ matrix.area }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: matrix.area == 'sdk-dotnet'
        with:
          dotnet-version: |
            10.0.401
            11.0.100
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: matrix.area != 'sdk-dotnet'
        with:
          install: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: matrix.area == 'sdk-go'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: sdk-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/go/.go-version', 'sdk/go/go.sum') }}
      - name: Install the pinned SDK toolchain
        run: |
          set -euo pipefail
          case "$AREA" in
            sdk-go) mise use -g "go@$(cat sdk/go/.go-version)"; dirname "$(mise which go)" >> "$GITHUB_PATH" ;;
            sdk-python) mise use -g uv@0.13.7; dirname "$(mise which uv)" >> "$GITHUB_PATH" ;;
            sdk-rust) rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy ;;
          esac
      - name: Build and type-check the SDK
        run: make "$AREA-check"

  docs:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: docs-site/.node-version
          package-manager-cache: false
      - name: Build and check the docs site
        run: make docs-build

  landing:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: landing-site/.node-version
          cache: npm
          cache-dependency-path: landing-site/package-lock.json
      - name: Install dependencies
        working-directory: landing-site
        run: npm ci --no-audit --no-fund
      - name: Validate the static build
        working-directory: landing-site
        run: npm run build

  status:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.status == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: status-site/.node-version
          cache: npm
          cache-dependency-path: status-site/package-lock.json
      - name: Install dependencies
        working-directory: status-site
        run: npm ci --no-audit --no-fund
      - name: Check, lint and build
        working-directory: status-site
        run: |
          npm run check
          npm run lint
          npm run build

  journey:
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && (needs.changes.outputs.journey == 'true' || needs.changes.outputs.engine == 'true'))
      || (github.ref == 'refs/heads/main' && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && !inputs.reconcile_auth && !inputs.native_artifacts && inputs.publication == 'release')))
    uses: ./.github/workflows/journey.yml
    with:
      engine: ${{ needs.changes.outputs.engine == 'true' }}

  all-green:
    name: all-green
    if: always()
    needs: [changes, checks, libs, auth, terrabase, dashboard, sdk, docs, landing, status, journey, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
          test "${{ needs.changes.outputs.engine != 'true' || needs.journey.result == 'success' }}" = true
