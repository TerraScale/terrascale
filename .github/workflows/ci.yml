name: CI

# Repository-only files neither change the site nor deploy it.
on:
  pull_request:
    paths-ignore: &repo-only [AGENTS.md, CLAUDE.md, README.md, SECURITY.md, .github/workflows/codeql.yml, .github/dependabot.yml]
  push:
    branches: [main]
    paths-ignore: *repo-only
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR checks cancel; main publication and verification finish together.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # PRs reuse main's npm downloads without publishing their own cache.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: npm-cache
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('.node-version', '**/package-lock.json') }}
      - name: Audit every locked npm project
        shell: bash
        run: |
          while IFS= read -r -d '' lock; do
            echo "Auditing $lock"
            npm audit --prefix "$(dirname "$lock")" --package-lock-only --ignore-scripts --audit-level=high --registry=https://registry.npmjs.org
          done < <(git ls-files -z -- '**/package-lock.json' 'package-lock.json')
      - run: npm ci
      - run: npm run build
      - run: npm test
        if: github.event_name != 'push'
      - name: Validate prebuilt Workers publication
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          cf deploy --prebuilt --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the checked site to Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run deploy:site -- --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check hosted output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/check-hosted.mjs
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
