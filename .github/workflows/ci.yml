# Build, lint and test on every pull request and push to main. `check` (locked Release build, lint,
# `make test-fast`) and `slow` (`make test-slow`) together run the whole non-explicit TUnit E2E suite,
# `make test-e2e`, the merge gate. Hot reload, performance and live readiness are explicit journeys and
# do not run here (Makefile). This workflow pushes no image and deploys nothing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes a pull request's run; each main commit runs in its own group and keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

# Self-hosted alpha runners only: no hosted fallback. Node comes from alpha's tool cache and .NET from
# setup-dotnet's install directory on the runner; `check` keeps its
# NuGet packages under its own runner temp directory, and `slow` builds in a Dockerfile stage on alpha's
# BuildKit daemon. This workflow has no write permission and releases nothing.
jobs:
  check:
    runs-on: alpha
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0 # .mise.toml
      - run: echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: src/TerraScale.Dashboard/web
      - run: make build
      - run: make lint
      - run: make test-fast

  # The browser journeys need Chromium's system libraries, which the runner does not have: they run in the
  # Dockerfile's test-slow stage on alpha's BuildKit daemon. That stage is never taken from cache.
  slow:
    runs-on: alpha
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: unix:///run/buildkit/buildkitd.sock
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: test-slow
          no-cache-filters: test-slow
          push: false
