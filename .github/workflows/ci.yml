name: CI

# One required check: "test". It passes when every area job that ran passed. The area jobs run in parallel, each
# building one Dockerfile stage on a GitHub-hosted runner (format, Release build with analyzers as errors, the area's checks and Fast
# suite, plus the local three-node replication matrix and the local-only e2e category for TerraBase): test-libs, test-auth, test-terrabase. On pull requests an area runs only when its files or the shared files
# changed (`changes`); libs changes run every area. Pushes to main run every area. `make docker-test` runs all three.
# After it:
# - slow (main, workflow_dispatch, or a pull request labelled `full-ci`): the slow suites; never blocks. A failure
#   writes the job summary; on main it also opens (or comments on) one `slow-failure` issue per failed test.
# Images for ts-orch are published by images-ghcr.yml; ts-orch deploys them. CI does not deploy.

on:
  pull_request:
    # `labeled` lets the `full-ci` label start the slow suites; any label re-runs CI and cancels the running check.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Cancel superseded PR tests; main runs finish their rollout and live E2E.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # ts-dotnet revision ts-auth builds against (TerraScale/ts-dotnet is private; read-only deploy key).
  TS_DOTNET_REV: 78e311fe1dcb6dd603190800ed540d08e06de5fd

jobs:
  # Runs on every event: a skipped job would skip everything downstream of "test" (slow).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      libs: ${{ steps.filter.outputs.libs }}
      auth: ${{ steps.filter.outputs.auth }}
      terrabase: ${{ steps.filter.outputs.terrabase }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - Dockerfile
              - .dockerignore
              - Makefile
              - Directory.*
              - global.json
              - NuGet.config
              - .editorconfig
              - BannedSymbols.txt
              - TerraScale.slnx
              - src/TerraScale.Endpoints*/**
              - src/TerraScale.Logging/**
              - tests/TerraScale.Endpoints.Tests/**
              - tests/TerraScale.Logging.Tests/**
              # TerraBase's vendored driver also backs auth integration tests and vendor audits.
              - src/vendor/**
              - tests/Turso.Data.Sqlite.Tests/**
              - scripts/vendor/**
              - scripts/ci/**
            libs:
              - *shared
              - libs.slnf
              - src/TerraScale.CLI/**
              - benchmark/dotnet/**
              # The credential entry point and the scripts it runs (make handoff-test).
              - scripts/handoff/**
              - scripts/e2e/**
              - benchmark/scripts/repl-*-tenant.sh
            auth:
              - *shared
              - auth.slnf
              - src/TerraScale.Authentication*/**
              - tests/TerraScale.Authentication*/**
              - docs/auth/**
              - scripts/auth/**
              # ts-auth's tests run against the TerraBase built from the same commit and check the SDK's routes on it.
              - src/TerraBase/**
            terrabase:
              - *shared
              - terrabase.slnf
              - src/TerraBase*/**
              - tests/TerraBase*/**
              - scripts/terrabase/**

  libs:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || needs.changes.outputs.libs == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: terrascale
          persist-credentials: false
      - &checkout-ts-dotnet
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: TerraScale/ts-dotnet
          ref: ${{ env.TS_DOTNET_REV }}
          ssh-key: ${{ secrets.TS_DOTNET_DEPLOY_KEY }}
          path: ts-dotnet
          persist-credentials: false
      - name: Check out the path-filter matcher for regression fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dorny/paths-filter
          ref: 0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
          path: path-filter-action
          persist-credentials: false
      - name: Verify CI path filters
        run: python3 terrascale/scripts/ci/path-filter-test.py terrascale/.github/workflows/ci.yml path-filter-action/dist/index.js
      - &setup-builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
      # Only main writes shared area caches; PR/queue refs restore without evicting them with private copies.
      - &build-stage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=ts-dotnet
          target: build-${{ github.job }}
          build-args: &build-args |
            TERRABASE_REVISION=${{ github.sha }}
            TS_AUTH_REVISION=${{ github.sha }}
            DOTNET_PROCESSOR_COUNT=8
            DOTNET_GCHeapCount=8
          push: false
          cache-from: ${{ format('type=gha,scope={0}', github.job) }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', github.job) || '' }}
      - &build-area
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=ts-dotnet
          target: test-${{ github.job }}
          # TerraBase's tests check that /healthz reports the exact commit (unused by the other areas' stages).
          build-args: *build-args
          # The build stage is reused for identical inputs; the tests always run on the current head.
          no-cache-filters: test-${{ github.job }}
          push: false
          # Per-job layer cache: the base stage (apt, Playwright Chromium, ts-dotnet) is rebuilt only when it changes.
          cache-from: ${{ format('type=gha,scope={0}', github.job) }}

  auth:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || needs.changes.outputs.auth == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - *setup-builder
      - *build-stage
      - *build-area

  terrabase:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || needs.changes.outputs.terrabase == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - *setup-builder
      - *build-stage
      - *build-area

  test:
    needs: [changes, libs, auth, terrabase]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fork PRs cannot qualify without Fast
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Fast requires the private SDK checkout; fork PRs cannot receive its deploy key. Qualify the changes on a branch in this repository.' >&2
          exit 1
      - name: Every area that ran passed
        run: '! grep -qE "failure|cancelled" <<< "${{ join(needs.*.result, '' '') }}"'
      - *checkout
      # Production runs on OCI through ts-orch; the bracket keeps this line from matching itself.
      - name: Workflows name no retired hosting provider
        run: '! grep -rniI "fl[y]" terrascale/.github/workflows'
      - name: Slow report, cache policy, storage train, e2e summary and e2e credential self-checks
        run: |
          python3 terrascale/scripts/ci/slow-report-test.py
          python3 terrascale/scripts/ci/cache-policy-test.py
          bash terrascale/scripts/terrabase/storage-format-check-test.sh
          bash terrascale/scripts/terrabase/e2e-summary-test.sh
          bash terrascale/scripts/e2e/ci-oidc-credential-test.sh
      # Reads the labels live: after labelling, re-run this job (docs/terrabase/ci.md, storage train).
      - name: Storage train
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: terrascale/scripts/terrabase/storage-format-check.sh "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}"

  slow:
    needs: [changes, auth, terrabase]
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: auth
          - area: terrabase
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - *setup-builder
      - name: Supply bucket-scoped CI storage credentials
        if: matrix.area == 'terrabase'
        env:
          TIGRIS_CI_CREDENTIALS: ${{ secrets.TIGRIS_CI_CREDENTIALS }}
        run: |
          [[ -n $TIGRIS_CI_CREDENTIALS ]] || { echo 'TIGRIS_CI_CREDENTIALS is required' >&2; exit 1; }
          umask 077
          printf '%s\n' "$TIGRIS_CI_CREDENTIALS" > "$RUNNER_TEMP/tigris-ci.env"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=ts-dotnet
          target: test-slow-${{ matrix.area }}
          secret-files: ${{ matrix.area == 'terrabase' && format('tigris-ci={0}/tigris-ci.env', runner.temp) || '' }}
          build-args: *build-args
          # A rerun of the same commit runs the suites again instead of reusing the stored result.
          no-cache-filters: slow-${{ matrix.area }}-run
          outputs: type=local,dest=slow
          cache-from: ${{ format('type=gha,scope={0}', matrix.area) }}
      - name: Remove the CI credential file
        if: ${{ always() && matrix.area == 'terrabase' }}
        run: rm -f "$RUNNER_TEMP/tigris-ci.env"
      - name: Report the Slow result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ ! -f slow/exit || ! -f slow/log ]]; then
            mkdir -p slow
            echo "Slow ${{ matrix.area }} suites did not finish building: $RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY" > slow/log
            echo 1 > slow/exit
          fi
          code=$(<slow/exit)
          mapfile -t failed < <(sed -nE 's/^failed (.+) \([^)]*\)$/\1/p' slow/log | sort -u)
          {
            echo "## Slow suites: exit $code, ${#failed[@]} failed"
            echo '```'
            grep -E '^Test run summary|^  (total|failed|succeeded|skipped|duration):' slow/log || true
            echo '```'
            [[ ${#failed[@]} -eq 0 ]] || printf -- '- %s\n' "${failed[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          (( code != 0 )) || exit 0
          # Issues track main only; a `full-ci` pull request or a dispatched branch reports in the summary.
          [[ $GITHUB_REF == refs/heads/main ]] || exit "$code"
          [[ ${#failed[@]} -gt 0 ]] || failed=("Slow suites failed without a failed test (build or runner error)")
          gh label create slow-failure -R "$GITHUB_REPOSITORY" --color B60205 --description "A Slow test failed on main" --force
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label slow-failure --state open --limit 500 --json number,title)
          for test in "${failed[@]}"; do
            title="Slow: $test"
            # The exception and stack, without the captured server output; credentials redacted.
            excerpt=$(awk -v t="failed $test " 'index($0, t) == 1 { on = 1; next } on && (/^[^ ]/ || /^  Standard output/ || ++n > 80) { exit } on' slow/log \
              | sed -E 's/(Bearer|Basic) [^ "]+/\1 [redacted]/g; s/((api[_-]?key|token|secret|password)["=: ]+)[^ ",]+/\1[redacted]/Ig')
            # The suite that reported it: its area's make target runs only that suite.
            target=$(awk -v t="failed $test " 'index($0, t) == 1 { on = 1 } on && /^Test run summary/ { print; exit }' slow/log)
            case $target in *TerraBase.Slow*) target="terrabase-test-slow" ;; *Authentication.Slow*) target="auth-test-slow" ;; *) target="test-slow" ;; esac
            body=$(printf '%s\n' \
              "Failed on \`$GITHUB_SHA\` in the Slow job: $RUN_URL" "" \
              "Environment: \`slow (${{ matrix.area }})\` job on GitHub-hosted runner, Dockerfile stage \`test-slow-${{ matrix.area }}\`, Release build." \
              "Reproduce: \`nice -n 19 make $target TEST_ARGS=\"--treenode-filter '/*/*/*/${test%%(*}'\"\`" \
              "Expected: the test passes. Actual:" "" '```' "${excerpt:-see the run log}" '```')
            number=$(jq -r --arg t "$title" "first(.[] | select(.title == \$t) | .number) // empty" <<< "$open")
            if [[ -n $number ]]; then
              gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label slow-failure --body "$body"
            fi
          done
          exit "$code"
