name: CI

on:
  pull_request:
    # No `labeled`: a label must not re-run and cancel the running check.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      native_artifacts:
        description: 'Maintenance: prepare combined native release assets only (no Fast/images/publication)'
        type: boolean
        default: false
      # Cold maintenance pins the TerraBase digest into its fences before the window, then releases it to the fenced
      # regions: build-only qualifies and publishes the immutable images without releasing; release-only releases one
      # TerraBase arm64 digest this main revision built, to each region separately, without building.
      publication:
        description: 'release (default), build-only (TerraBase images, no release) or release-only (needs terrabase_arm64)'
        type: choice
        options: [release, build-only, release-only]
        default: release
      terrabase_arm64:
        description: 'release-only: the linux/arm64 child digest (sha256:...) a build-only run published for this main revision'
        type: string
        default: ''

# A new push cancels the older run of the same PR. Every other run has its own group: each main push publishes the
# images of the areas it changed, so none may be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # SDK source belongs to the same checked revision as its consumers.
  TS_DOTNET_DIR: sdk/dotnet
  TsDotnetRoot: ${{ github.workspace }}/terrascale/sdk/dotnet
  TERRABASE_REVISION: ${{ github.sha }}
  TS_AUTH_REVISION: ${{ github.sha }}
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  ASPNETCORE_HTTP_PORTS: ''
  # Keep CallerFilePath fixture lookups on disk, as in Docker (which excludes .git).
  # ContinuousIntegrationBuild and deterministic compilation remain enabled.
  DeterministicSourcePaths: false

jobs:
  # Runs on every event: a skipped job would skip "test".
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fast: ${{ steps.areas.outputs.fast }}
      main: ${{ steps.areas.outputs.main }}
      ordered: ${{ steps.areas.outputs.ordered }}
      sha: ${{ steps.source.outputs.sha }}
      journey: ${{ steps.journey.outputs.journey }}
    steps:
      # Pull requests list files through the API; pushes diff the checkout against the push's `before` commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          # Empty on pushes: the action then diffs against the push's `before` commit.
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - .github/actions/**
              - Dockerfile
              - .dockerignore
              - Makefile
              - Directory.*
              - global.json
              - NuGet.config
              - .editorconfig
              - BannedSymbols.txt
              - TerraScale.slnx
              # Both services reference the libraries; their tests and benchmarks build only in libs.slnf.
              - src/TerraScale.Endpoints*/**/!(AGENTS.md|CLAUDE.md)
              - src/TerraScale.Logging/**/!(AGENTS.md|CLAUDE.md)
            # Each area lists only inputs its own projects build.
            dotnet-sdk: &dotnet-sdk
              # The auth store and TerraBase E2E reference the .NET SDK from this revision.
              - sdk/dotnet/**/!(AGENTS.md|CLAUDE.md)
            libs:
              - *shared
              - libs.slnf
              - tests/TerraScale.Endpoints.Tests/**/!(AGENTS.md|CLAUDE.md)
              - tests/TerraScale.Logging.Tests/**/!(AGENTS.md|CLAUDE.md)
              - benchmark/dotnet/TerraScale.Endpoints.Benchmarks/**/!(AGENTS.md|CLAUDE.md)
              - benchmark/dotnet/TerraScale.Logging.Benchmarks/**/!(AGENTS.md|CLAUDE.md)
              # Self-check changes run in changes; executor changes still qualify both native Fast areas.
              - scripts/ci/image-payloads.sh
              - scripts/ci/test-area.sh
            auth:
              - *shared
              - *dotnet-sdk
              - scripts/ci/image-payloads.sh
              - auth.slnf
              - src/TerraScale.Authentication*/**/!(AGENTS.md|CLAUDE.md)
              - tests/TerraScale.Authentication*/**/!(AGENTS.md|CLAUDE.md)
              # The published platform contract (OpenApiTests, auth-openapi-check); the Markdown docs are not inputs.
              - docs/auth/*.yaml
              - scripts/auth/**/!(AGENTS.md|CLAUDE.md)
              - scripts/ci/auth-build.sh
            auth-server:
              - src/TerraBase/**/!(AGENTS.md|CLAUDE.md)
              # TerraBase's RPC surface and the contracts it implements.
              - src/TerraScale.TerraBase.*/**/!(AGENTS.md|CLAUDE.md)
              # The vendored driver TerraBase embeds; auth integration tests start that TerraBase.
              - src/vendor/**/!(AGENTS.md|CLAUDE.md)
            # What ts-auth runs against TerraBase: its own code and the SDK it calls TerraBase with.
            auth-client:
              - *dotnet-sdk
              - src/TerraScale.Authentication*/**/!(AGENTS.md|CLAUDE.md)
            terrabase:
              - *shared
              - *dotnet-sdk
              - src/vendor/**/!(AGENTS.md|CLAUDE.md)
              - tests/Turso.Data.Sqlite.Tests/**/!(AGENTS.md|CLAUDE.md)
              - scripts/vendor/**/!(AGENTS.md|CLAUDE.md)
              - scripts/ci/terrabase-*
              - terrabase.slnf
              - scripts/ci/image-payloads.sh
              - scripts/ci/test-area.sh
              - src/TerraBase*/**/!(AGENTS.md|CLAUDE.md)
              - src/TerraScale.TerraBase.*/**/!(AGENTS.md|CLAUDE.md)
              - tests/TerraBase*/**/!(AGENTS.md|CLAUDE.md)
              - scripts/terrabase/!(AGENTS.md|CLAUDE.md)
              - scripts/terrabase/**/!(AGENTS.md|CLAUDE.md)
      - id: journey
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          predicate-quantifier: every
          filters: |
            journey:
              - '!docs-site/**'
              - '!landing-site/**'
              - '!status-site/**'
              - '!docs/**'
              - '!**/*.md'
      - id: areas
        env:
          CHANGES: ${{ github.event_name == 'workflow_dispatch' && ((inputs.native_artifacts || inputs.publication == 'release-only') && '[]' || inputs.publication == 'build-only' && '["terrabase"]' || '["libs","auth","terrabase"]') || steps.filter.outputs.changes }}
        run: |
          # The ts-auth image does not contain TerraBase: main publishes and Slow-tests auth only for its own changes.
          echo "main=$(jq -c '[.[] | select(. == "auth" or . == "terrabase")]' <<< "$CHANGES")" >> "$GITHUB_OUTPUT"
          # A push changing both TerraBase's server and what ts-auth calls it with releases TerraBase first (scope
          # skew, 2026-11-04); every other push releases both services in parallel. Dispatches keep the order.
          ordered=$(jq 'index("auth-server") != null and index("auth-client") != null' <<< "$CHANGES")
          [[ $GITHUB_EVENT_NAME != workflow_dispatch ]] || ordered=true
          echo "ordered=$ordered" >> "$GITHUB_OUTPUT"
          [[ $GITHUB_EVENT_NAME == pull_request ]] || CHANGES=$(jq -c 'if index("auth-server") then . + ["auth"] else . end' <<< "$CHANGES")
          echo "fast=$(jq -c '[.[] | select(. == "libs" or . == "auth" or . == "terrabase")] | unique' <<< "$CHANGES")" >> "$GITHUB_OUTPUT"

  # Cheap policy checks run beside changes instead of before the Fast receipts; test (and so every release) requires
  # them.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      # The scan is the longest check: it runs while the path-filter fixtures and self-checks do.
      - name: Start the legacy scan
        run: |
          (status=0
            python3 scripts/legacy-scan/scan.py --repo terrascale --output legacy-hits.md > legacy-scan.log 2>&1 || status=$?
            echo "$status" > legacy-scan.exit.tmp && mv legacy-scan.exit.tmp legacy-scan.exit) > /dev/null 2>&1 &
      - name: Check out the path-filter matcher for regression fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dorny/paths-filter
          ref: 0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
          path: path-filter-action
          persist-credentials: false
      - name: Verify CI path filters
        run: python3 scripts/ci/path-filter-test.py .github/workflows/ci.yml path-filter-action/dist/index.js
      - name: Merged EF Core migrations stay unchanged
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/migrations-frozen.py HEAD^1
      # Production runs on OCI through ts-orch; only Tigris (its endpoint and `fly storage`) stays. The brackets keep
      # these lines from matching themselves.
      - name: Workflows name no retired hosting provider
        if: github.event_name != 'push'
        run: '! grep -rniI "fl[y]" .github/workflows | grep -viE "fl[y]\.storage\.tigris\.dev|fl[y] storage"'
      - name: Slow report, cache policy, storage train and e2e summary self-checks
        if: github.event_name != 'push'
        run: |
          python3 scripts/legacy-scan/process-test.py
          python3 scripts/ci/slow-report-test.py
          python3 scripts/ci/cache-policy-test.py
          python3 scripts/ci/fast-budget-test.py
          bash scripts/ci/release-app-test.sh
          python3 scripts/ci/migrations-frozen-test.py
          python3 scripts/vendor/turso-native-pipeline-test.py
          bash scripts/terrabase/storage-format-check-test.sh
          bash scripts/terrabase/e2e-summary-test.sh
      - name: all-green-rerun workflow list covers every pull_request workflow
        run: python3 scripts/ci/check-all-green-rerun.py
      # Reads the labels live: after labelling, re-run checks (docs/terrabase/ci.md, storage train).
      - name: Storage train
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/terrabase/storage-format-check.sh "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}"
      - name: Scan for legacy terms (fail)
        if: ${{ !cancelled() }}
        run: |
          until [ -f legacy-scan.exit ]; do sleep 1; done
          head -1 legacy-scan.log
          exit "$(cat legacy-scan.exit)"
      - name: Retain legacy hits
        if: ${{ !cancelled() && hashFiles('legacy-hits.md') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-hits
          path: |
            legacy-hits.md
            legacy-scan.log

  # Native Rust builds stay in explicit maintenance dispatches; every build verifies the pinned release bytes.
  native-build:
    if: github.event_name == 'workflow_dispatch' && inputs.native_artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            repeat: 1
          - arch: amd64
            runner: ubuntu-24.04
            repeat: 2
          - arch: arm64
            runner: ubuntu-24.04-arm
            repeat: 1
          - arch: arm64
            runner: ubuntu-24.04-arm
            repeat: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - &setup-builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build once on the real target architecture and run both native smokes
        run: scripts/vendor/build-turso-native.sh '${{ matrix.arch }}' native-output
      - name: Record this run's native SHA-256
        run: |
          cd native-output
          sha256sum --check SHA256SUMS-*
          grep 'runtimes/.*libturso_sdk_kit.so$' SHA256SUMS-* >> "$GITHUB_STEP_SUMMARY"
          (cd router-parser && sha256sum --check linux-*/SHA256SUMS && cat linux-*/SHA256SUMS >> "$GITHUB_STEP_SUMMARY")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turso-native-build-${{ matrix.arch }}-${{ matrix.repeat }}
          path: native-output/
          if-no-files-found: error

  native-release:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: turso-native-build-*
          path: native-builds
      - name: Assemble publication assets and source/patch receipts
        run: |
          for arch in amd64 arm64; do
            case "$arch" in amd64) rid=linux-x64 ;; arm64) rid=linux-arm64 ;; esac
            for repeat in 1 2; do
              (cd "native-builds/turso-native-build-$arch-$repeat" && sha256sum --check "SHA256SUMS-$rid")
            done
            cmp "native-builds/turso-native-build-$arch-1/runtimes/$rid/native/libturso_sdk_kit.so" \
                "native-builds/turso-native-build-$arch-2/runtimes/$rid/native/libturso_sdk_kit.so"
            for repeat in 1 2; do
              (cd "native-builds/turso-native-build-$arch-$repeat/router-parser" && sha256sum --check "$rid/SHA256SUMS")
            done
            cmp "native-builds/turso-native-build-$arch-1/router-parser/runtimes/$rid/native/libterrascale_sql_parser.so" \
                "native-builds/turso-native-build-$arch-2/router-parser/runtimes/$rid/native/libterrascale_sql_parser.so"
          done
          scripts/vendor/prepare-turso-native-release.sh native-builds/turso-native-build-amd64-1 native-builds/turso-native-build-arm64-1 native-release
          for arch in amd64 arm64; do
            case "$arch" in amd64) rid=linux-x64 ;; arm64) rid=linux-arm64 ;; esac
            cp "native-builds/turso-native-build-$arch-2/release/$rid-build-receipt.txt" "native-release/$rid-independent-build-receipt.txt"
          done
          (cd native-release && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > ../native-SHA256SUMS)
          mv native-SHA256SUMS native-release/SHA256SUMS
          cat native-release/NATIVE-SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turso-native-release
          path: native-release/
          if-no-files-found: error

  # Each affected area builds, checks and runs its Fast suite on a hosted runner for this exact commit.
  libs:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.fast), 'libs')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: terrascale
          persist-credentials: false
          ref: ${{ needs.changes.outputs.sha }}
      - &setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: terrascale/global.json
      # Restore the pinned native libraries from the Actions cache before make verifies them: with the
      # pins unchanged the release-CDN download is skipped entirely, so a CDN outage cannot fail every area.
      - &turso-native-cache
        name: Cached pinned Turso native libraries
        uses: ./terrascale/.github/actions/turso-native-cache
        with:
          dir: terrascale
      - &locked-restore
        name: Locked restore and pinned native libraries
        working-directory: terrascale
        run: make restore turso-native
      - name: Checked build and Libraries Fast
        working-directory: terrascale
        run: bash scripts/ci/test-area.sh fast libs

  auth:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.fast), 'auth')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *setup-dotnet
      - *turso-native-cache
      - *locked-restore
      - name: Checked Auth build
        working-directory: terrascale
        run: |
          npx --yes playwright@1.63.0 install --with-deps chromium >"$RUNNER_TEMP/playwright.log" 2>&1 &
          playwright=$!
          bash scripts/ci/auth-build.sh
          wait "$playwright" || { cat "$RUNNER_TEMP/playwright.log"; exit 1; }
      - name: Auth Fast
        working-directory: terrascale
        run: env -u DOTNET_PROCESSOR_COUNT -u DOTNET_GCHeapCount make -o restore -o auth-fast-build -o turso-native auth-test-fast CONFIGURATION=Release

  terrabase:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.fast), 'terrabase')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *setup-dotnet
      - *turso-native-cache
      - *locked-restore
      - name: Checked build, integration proofs and TerraBase Fast
        working-directory: terrascale
        run: bash scripts/ci/test-area.sh fast terrabase

  journey:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.journey == 'true'
    uses: ./.github/workflows/journey.yml

  main:
    needs: [changes, terrabase, test]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.terrabase.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      && contains(fromJSON(needs.changes.outputs.main), 'terrabase')
    concurrency:
      # A build-only dispatch releases nothing: it never waits on or cancels a pending release.
      group: ${{ inputs.publication == 'build-only' && format('build-{0}', github.run_id) || 'production-terrabase' }}
      cancel-in-progress: false
    env:
      AREA: terrabase
      SERVICE: terrabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # ts-orch accepts this job's OIDC token to release the image it just published.
      id-token: write
      # A failed release dispatches a fresh main run (a newer signed run) so the latest main still ends up live.
      actions: write
    steps: &production-steps
      - *checkout
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: terrascale/global.json
      # The publish step's make turso-native verifies these cached bytes (or downloads once on a miss).
      - name: Cached pinned Turso native libraries
        uses: ./terrascale/.github/actions/turso-native-cache
        with:
          dir: terrascale
      # Production runs linux/arm64 only: publish that runtime once, then wrap it in the image without another build.
      # The publish restores only its own project, locked, from nuget.org (8-12 s cold; the monorepo package cache took
      # 25 s to download plus 7 s to restore). The image builder boots meanwhile.
      - name: Publish the linux/arm64 runtime payload
        working-directory: terrascale
        run: |
          docker buildx create --use --driver docker-container --bootstrap > "$RUNNER_TEMP/builder.log" 2>&1 &
          builder=$!
          bash scripts/ci/image-payloads.sh publish "$AREA"
          bash scripts/ci/image-payloads.sh runtime-dockerfile "$AREA" > "$RUNNER_TEMP/image-payloads/Dockerfile"
          wait "$builder" || { cat "$RUNNER_TEMP/builder.log"; exit 1; }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Public images ts-orch runs: ghcr.io/terrascale/{terrabase,ts-auth}:<sha> and :main. Production runs linux/arm64
      # only, so that is the only platform built; ts-orch pins its child digest.
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/image-payloads
          file: ${{ runner.temp }}/image-payloads/Dockerfile
          platforms: linux/arm64
          tags: |
            ghcr.io/terrascale/${{ env.SERVICE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && inputs.publication != 'build-only' && format('ghcr.io/terrascale/{0}:main', env.SERVICE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
      - id: digest
        name: Verify the published linux/arm64 child
        env:
          INDEX: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/terrascale/${SERVICE}"
          { echo '```'; docker buildx imagetools inspect "${image}@${INDEX}"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          arm64=$(docker buildx imagetools inspect "${image}@${INDEX}" --format '{{json .Manifest}}' |
            jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          test -n "$arm64"
          docker buildx imagetools inspect "${image}@${arm64}" --format '{{json .Image}}' |
            jq -e --arg revision "$GITHUB_SHA" '.architecture == "arm64" and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision'
          echo "arm64=${arm64}" >> "$GITHUB_OUTPUT"
      - name: Record the build-only digest (no release)
        if: github.event_name == 'workflow_dispatch' && inputs.publication == 'build-only'
        env:
          INDEX: ${{ steps.image.outputs.digest }}
          ARM64: ${{ steps.digest.outputs.arm64 }}
        run: echo "BUILD_ONLY ${SERVICE} revision=${GITHUB_SHA} index=${INDEX} arm64=${ARM64}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Every region's ts-orch swaps to the linux/arm64 digest, waits for readiness and rolls back on failure. Both
      # services release; the production-<area> concurrency group keeps one release of each in flight.
      # Releases converge on the latest main. A run superseded by a newer signed run has nothing left to do. Any other
      # failure of a push run's release (bake, rollback, timeout, a rerun's rebuilt digest under its already-approved
      # run id) dispatches one fresh main run, a newer signed run that releases the latest main; dispatched runs never
      # dispatch again.
      # Temporary (zdt cold window, remove at cienable): no push run and no default dispatch (including the retry
      # dispatch below) may release TerraBase while the fleet still runs b443-era executors with no fence. TerraBase
      # releases only through the explicit release-only job; ts-auth releases as before.
      - name: Release to every region
        if: env.AREA != 'terrabase' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publication != 'build-only'))
        working-directory: terrascale
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/terrascale/${{ env.SERVICE }}@${{ steps.digest.outputs.arm64 }}
        run: |
          set -euo pipefail
          set +e
          bash scripts/ci/release-app.sh "$SERVICE" "$IMAGE"
          status=$?
          set -e
          [ "$status" -eq 0 ] && exit 0
          # Regions not yet on ts-orch #194 answer an older run with "deployment is stale"; a first attempt never
          # changes its own approved run, so there it can only mean superseded.
          if grep -q 'superseded by a newer signed run' "${RUNNER_TEMP}/release.log" ||
            { [ "$GITHUB_RUN_ATTEMPT" = 1 ] && grep -q 'deployment is stale' "${RUNNER_TEMP}/release.log"; }; then
            echo "Superseded: a newer main run released ${SERVICE}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Release failed; dispatched a fresh main run to release the latest main." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  # Cold maintenance: release a TerraBase digest that a build-only dispatch published for this exact main revision.
  # Each region separately: a fenced founder retains the candidate only from a release it serves itself. No build,
  # no other service, and a failure never dispatches another run.
  release-only:
    if: github.event_name == 'workflow_dispatch' && inputs.publication == 'release-only' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-terrabase
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      contents: read
      # Reads the private TerraBase image to check its revision label.
      packages: read
      # ts-orch accepts this job's OIDC token to release the pinned digest.
      id-token: write
    steps:
      - *setup-builder
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Release the pinned arm64 digest to each region
        env:
          GH_TOKEN: ${{ github.token }}
          ARM64: ${{ inputs.terrabase_arm64 }}
        run: |
          set -euo pipefail
          [[ "$ARM64" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'terrabase_arm64 must be sha256:<64 hex>' >&2; exit 1; }
          image="ghcr.io/terrascale/terrabase@${ARM64}"
          docker buildx imagetools inspect "$image" --format '{{json .Image}}' |
            jq -e --arg revision "$GITHUB_SHA" '.architecture == "arm64" and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision'
          tag=$(gh release list --repo TerraScale/ts-orchestrator --limit 30 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("ci-"))] | sort_by(.createdAt) | last | .tagName // ""')
          test -n "$tag"
          gh release download "$tag" --repo TerraScale/ts-orchestrator --dir "${RUNNER_TEMP}/ts-orch" --pattern terrascale-orchestrator-linux-amd64
          curl -fsSL https://raw.githubusercontent.com/TerraScale/ts-orchestrator/main/deploy/m1/regions.json -o "${RUNNER_TEMP}/regions.json"
          chmod +x "${RUNNER_TEMP}/ts-orch/terrascale-orchestrator-linux-amd64"
          status=0
          for i in $(jq -r 'keys[]' "${RUNNER_TEMP}/regions.json"); do
            jq -c "[.[$i]]" "${RUNNER_TEMP}/regions.json" > "${RUNNER_TEMP}/region.json"
            echo "Region $(jq -r '.[0].region' "${RUNNER_TEMP}/region.json")" | tee -a "$GITHUB_STEP_SUMMARY"
            out=$("${RUNNER_TEMP}/ts-orch/terrascale-orchestrator-linux-amd64" release app --service terrabase \
              --image "$image" --regions "${RUNNER_TEMP}/region.json" 2>&1) || status=1
            tee -a "$GITHUB_STEP_SUMMARY" <<< "$out"
            # A superseded release exits 0 without this digest: require this region's own done state.
            tail -1 <<< "$out" | jq -e '.state == "done" and (.error // "") == ""' > /dev/null || status=1
          done
          exit "$status"

  # ts-auth releases in parallel with TerraBase, except after it when one push changes both TerraBase's server and
  # what ts-auth calls it with (changes.outputs.ordered): shared scope and contract changes reach TerraBase first.
  main-auth:
    needs: [changes, auth, test]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.auth.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      && contains(fromJSON(needs.changes.outputs.main), 'auth') && needs.changes.outputs.ordered != 'true'
    concurrency:
      group: production-auth
      cancel-in-progress: false
    env: &auth-env
      AREA: auth
      SERVICE: ts-auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: &release-permissions
      contents: read
      packages: write
      id-token: write
      actions: write
    steps: *production-steps

  main-auth-ordered:
    needs: [changes, auth, test, main]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.auth.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      && contains(fromJSON(needs.changes.outputs.main), 'auth') && needs.changes.outputs.ordered == 'true'
      && (!contains(fromJSON(needs.changes.outputs.main), 'terrabase') || needs.main.result == 'success')
    concurrency:
      group: production-auth
      cancel-in-progress: false
    env: *auth-env
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: *release-permissions
    steps: *production-steps

  # A run that selects no core area (docs, SDKs, sites, dashboard) runs only changes. A failed changes job still
  # reaches test, so the rollup stays red.
  test:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.native_artifacts && 'native-maintenance-unqualified' || 'test' }}
    needs: [changes, checks, libs, auth, terrabase]
    if: >-
      ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.native_artifacts)
      && (needs.changes.result != 'success' || needs.checks.result != 'success'
      || needs.changes.outputs.fast != '[]' || needs.changes.outputs.main != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Every affected Fast area passed
        env:
          FAST_AREAS: ${{ needs.changes.outputs.fast }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if grep -qE 'failure|cancelled' <<< '${{ join(needs.*.result, ' ') }}'; then exit 1; fi
          for area in $(jq -r '.[]' <<< "$FAST_AREAS"); do
            [[ $(jq -r --arg area "$area" '.[$area].result' <<< "$RESULTS") == success ]] || exit 1
          done
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: terrascale
          persist-credentials: false
          ref: ${{ needs.changes.outputs.sha }}
      - name: Fast job times
        if: github.event_name == 'pull_request'
        working-directory: terrascale
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/run-budget.py "$GITHUB_RUN_ID"

  budget:
    name: Fast timing budget
    needs: [changes, libs, auth, terrabase, test, main, main-auth, main-auth-ordered]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.native_artifacts)
      && (needs.changes.result != 'success' || needs.changes.outputs.fast != '[]' || needs.changes.outputs.main != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - *checkout
      - name: Enforce Fast job budgets and report end-to-end CI time
        working-directory: terrascale
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/run-budget.py "$GITHUB_RUN_ID"
