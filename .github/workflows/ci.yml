name: CI

# One required check: "test".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded PR runs are cancelled; main runs always finish so main's cache and status stay current.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          # Module + build cache keyed on go.sum; a PR only saves when it changes go.sum.
          cache: true
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # -count=1: the build cache stays warm, but tests always run on the current head (no cached passes).
      - run: go test -race -count=1 ./...
