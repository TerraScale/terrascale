# Required formatting, build, security, contract/Fast and actual-application packaging. Main pushes the
# tested image; Deploy rolls it out to three regions. Slow runs independently in slow.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes a pull request's run; each main commit runs in its own group and keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Before setup-dotnet: its NuGet cache saves and restores the folder NUGET_PACKAGES names.
      - run: echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0 # .mise.toml
          cache: npm
          cache-dependency-path: src/TerraScale.Dashboard/web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: src/TerraScale.Dashboard/web
      - run: make check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fast-results
          path: test-results/tunit/fast.trx
          if-no-files-found: warn

  image:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Main deploys run one at a time; a newer pending main commit replaces an older pending one.
    concurrency:
      group: ${{ github.event_name == 'push' && 'ts-dashboard-deploy' || github.run_id }}
      cancel-in-progress: false
    env:
      IMAGE: registry.fly.io/ts-dashboard:${{ github.sha }}
    # ghcr.io/terrascale/ts-dashboard: the multi-arch image ts-orch runs.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          # Pull requests read main's layer cache; only main writes it (PR-scoped caches are invisible to other PRs).
          cache-from: type=gha,scope=dashboard-image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=dashboard-image' || '' }}
      # DEMO=true is ready without secrets; the deployed app's mode is its Fly secret (README).
      - name: Smoke-test the image's readiness and revision
        run: |
          docker run -d --name app -e DEMO=true -p 127.0.0.1:8080:8080 "$IMAGE"
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8080/health/ready -o ready.json && break; sleep 2; done
          jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and (.version | endswith("+" + $sha))' ready.json \
            || { docker logs app 2>&1 | tail -n 50; exit 1; }
      # linux/amd64 + linux/arm64 from the same cached build. Pushed before the Fly publish so a Fly failure cannot block it.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: ghcr
        if: github.event_name == 'push'
        with:
          context: .
          build-args: SOURCE_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/terrascale/ts-dashboard:${{ github.sha }}
            ghcr.io/terrascale/ts-dashboard:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=dashboard-image
          push: true
      - if: steps.ghcr.outputs.digest != ''
        run: echo "ghcr.io/terrascale/ts-dashboard@${{ steps.ghcr.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master (node24)
        if: github.event_name == 'push'
        with:
          version: 0.4.117
      - name: Publish the tested image for regional deployment
        if: github.event_name == 'push'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never roll back: a newer main commit deploys itself.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "main moved past $GITHUB_SHA; not deploying it."; exit 0
          fi
          flyctl auth docker
          docker push "$IMAGE"
