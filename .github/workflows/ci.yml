# Build and test on every pull request and push to main. The tests use HTTP fakes only: no TerraBase runs here (the
# monorepo checks TerraBase serves contracts/terrabase/routes.json).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes a pull request's run; each main commit runs in its own group and keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The pinned .NET 11 SDK builds both targets; .NET 10 installs its matching runtime.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Run release build and tests
        run: bash scripts/check-release.sh
