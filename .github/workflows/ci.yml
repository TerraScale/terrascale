name: CI

# Build/tests and Pages preflight must pass before merge. Tests require the built docs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: useblacksmith/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - if: github.event_name != 'pull_request'
        run: tar -C docs/.vitepress/dist -cf "$RUNNER_TEMP/docs-site.tar" .
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-site.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: ci
    # Same-repository PRs check access only; uploads run on main or manual previews.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: useblacksmith/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify the existing Pages project
        run: |
          npx --yes cf@1.0.0-beta.14 auth whoami > "$RUNNER_TEMP/cloudflare-auth.json"
          npx --yes cf@1.0.0-beta.14 pages get ts-docs > "$RUNNER_TEMP/pages-project.json"
          node scripts/check-pages.mjs project "$RUNNER_TEMP/pages-project.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/download-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          name: docs-site
          path: ${{ runner.temp }}
      - name: Restore the tested public site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p docs/.vitepress/dist
          tar -C docs/.vitepress/dist -xf "$RUNNER_TEMP/docs-site.tar"
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        run: npm run deploy:site -- --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/pages-deployment.jsonl
      - name: Check the deployed commit and hosted output
        if: github.event_name != 'pull_request'
        run: node scripts/check-pages.mjs deployment "$RUNNER_TEMP/pages-project.json" "$RUNNER_TEMP/pages-deployment.jsonl" "$GITHUB_REF_NAME" "$GITHUB_SHA"
