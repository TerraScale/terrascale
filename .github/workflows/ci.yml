name: CI

# One required check: "test". It builds the Dockerfile's `test` stage on Blacksmith: format, Release build with
# analyzers as errors, libs/auth/TerraBase checks and the Fast suites. `make docker-test` runs the same build locally.
# Next to it, without waiting for it:
# - preview (pull requests): TerraBase + ts-auth on one machine at https://ts-pr-<n>.fly.dev (scripts/fly/preview.sh);
#   previews.yml deletes it when the PR closes or after 24 hours.
# - deploy (main): the Dockerfile's chiseled images to Fly, TerraBase then ts-auth, each gru -> live check -> sjc
#   (scripts/fly/deploy.sh); ts-auth's image builds while TerraBase rolls out. Before the rollout,
#   scripts/fly/fast-gate.sh requires a passed `test` for this exact tree: the merged pull request's head when the merge
#   kept its tree (rebased before merging), else main's own `test`.
# After it:
# - slow (main): the slow suites; never blocks.
# - e2e (main, after deploy): tests/TerraBase.E2E against the Fly app, gru and sjc pinned with fly-prefer-region; never
#   blocks. Between replication slices R2a and R10a nothing replicates on Fly, so E1 to E7 fail there
#   (docs/terrabase/multi-region-replication.md, section 21).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a running check of the same branch. Every main push runs at once (its own group) and finishes;
# the deploy jobs queue per app instead, so a merge never waits behind the previous run's tests.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # ts-dotnet revision ts-auth builds against (TerraScale/ts-dotnet is private; read-only deploy key).
  TS_DOTNET_REV: 619fa979673635663cba98be5e25713806d11cd5

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - &checkout
        uses: actions/checkout@v5
        with:
          path: terrascale
          persist-credentials: false
      - &checkout-ts-dotnet
        uses: actions/checkout@v5
        with:
          repository: TerraScale/ts-dotnet
          ref: ${{ env.TS_DOTNET_REV }}
          ssh-key: ${{ secrets.TS_DOTNET_DEPLOY_KEY }}
          path: ts-dotnet
          persist-credentials: false
      - &download-terrabase
        name: Download the pinned TerraBase the ts-auth tests start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download auth-test-terrabase -R "$GITHUB_REPOSITORY" -p terrabase-linux-amd64 -D terrabase-pinned
      - &setup-builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: terrascale-ci
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: |
            ts-dotnet=ts-dotnet
            terrabase-pinned=terrabase-pinned
          target: test
          push: false

  slow:
    needs: test
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - *download-terrabase
      - *setup-builder
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: |
            ts-dotnet=ts-dotnet
            terrabase-pinned=terrabase-pinned
          target: test-slow

  preview:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_PREVIEWS }}
      APP: ts-pr-${{ github.event.pull_request.number }}
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - &setup-flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the preview app
        run: terrascale/scripts/fly/preview.sh app ${{ github.event.pull_request.number }}
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: terrascale-images
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_TOKEN_PREVIEWS }}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          target: terrabase
          tags: registry.fly.io/${{ env.APP }}:terrabase-${{ github.sha }}
          push: true
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=ts-dotnet
          target: ts-auth
          tags: registry.fly.io/${{ env.APP }}:ts-auth-${{ github.sha }}
          build-args: TS_AUTH_REVISION=${{ github.sha }}
          push: true
      - name: Start or update the preview machine
        run: >-
          terrascale/scripts/fly/preview.sh machine ${{ github.event.pull_request.number }}
          registry.fly.io/$APP:terrabase-${{ github.sha }} registry.fly.io/$APP:ts-auth-${{ github.sha }}
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --edit-last --create-if-none
          --body "Preview: https://$APP.fly.dev (TerraBase + ts-auth at ${{ github.sha }}; stops when idle, deleted on close or after 24 h)"

  # One deploy token per app; each can push only to its own app's repository.
  deploy-terrabase:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    concurrency:
      group: deploy-terrabase
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - *checkout
      - *setup-flyctl
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: terrascale-image-terrabase
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_TOKEN_TS_TERRABASE }}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          target: terrabase
          tags: registry.fly.io/ts-terrabase:${{ github.sha }}
          push: true
      # Fast must cover the exact tree being deployed (AGENTS.md): instant for a rebased, squash-merged pull request.
      - name: Wait for Fast on this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: terrascale/scripts/fly/fast-gate.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - name: Deploy TerraBase (gru, check, sjc)
        working-directory: terrascale
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_TS_TERRABASE }}
        run: scripts/fly/deploy.sh ts-terrabase src/TerraBase/fly.toml registry.fly.io/ts-terrabase:${{ github.sha }}

  image-ts-auth:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: terrascale-image-ts-auth
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_TOKEN_TS_AUTH }}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=ts-dotnet
          target: ts-auth
          tags: registry.fly.io/ts-auth:${{ github.sha }}
          build-args: TS_AUTH_REVISION=${{ github.sha }}
          push: true

  # ts-auth keeps its data in TerraBase, so it rolls out after TerraBase.
  deploy-ts-auth:
    needs: [deploy-terrabase, image-ts-auth]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    concurrency:
      group: deploy-ts-auth
      cancel-in-progress: false
    steps:
      - *checkout
      - *setup-flyctl
      - name: Deploy ts-auth (gru, check, sjc)
        working-directory: terrascale
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_TS_AUTH }}
        run: scripts/fly/deploy.sh ts-auth src/TerraScale.Authentication/fly.toml registry.fly.io/ts-auth:${{ github.sha }}

  e2e:
    needs: deploy
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      TERRABASE_E2E_FLY_URL: https://ts-terrabase.fly.dev
      TERRABASE_E2E_FLY_API_KEY: ${{ secrets.TERRABASE_E2E_FLY_API_KEY }}
      TERRABASE_E2E_FLY_PROJECT: ${{ secrets.TERRABASE_E2E_FLY_PROJECT }}
      TERRABASE_E2E_FLY_DATABASE: ${{ secrets.TERRABASE_E2E_FLY_DATABASE }}
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: terrascale/global.json
      - name: Replication e2e against Fly
        working-directory: terrascale
        run: make terrabase-e2e
