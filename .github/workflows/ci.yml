# Build and test on every pull request and push to main. The tests use HTTP fakes only: no TerraBase runs here (the
# monorepo checks TerraBase serves contracts/terrabase/routes.json).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted alpha runners only (HomeLab services/ci-runner.md): NuGet and the .NET SDKs persist in alpha's local
# caches, so no GitHub cache step and no paid hosted fallback.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The pinned .NET 11 SDK builds both targets; .NET 10 installs its matching runtime.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 10.0.401
      - name: Run release build and tests
        run: bash scripts/check-release.sh
