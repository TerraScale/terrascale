name: CI

# One required check: "test". It builds the Dockerfile's `test` stage on Blacksmith: format, Release build with
# analyzers as errors, libs/auth/TerraBase checks and the Fast suites. `make docker-test` runs the same build locally.
# After it, on the same warm layer cache:
# - preview (pull requests): TerraBase + ts-auth on one machine at https://ts-pr-<n>.fly.dev (scripts/fly/preview.sh);
#   previews.yml deletes it when the PR closes or after 24 hours.
# - deploy (main): both images to Fly, TerraBase then ts-auth, each gru -> live check -> sjc (scripts/fly/deploy.sh).
# - slow (main): the slow suites; never blocks.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a running check of the same branch; main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # ts-dotnet revision ts-auth builds against (TerraScale/ts-dotnet is private; read-only deploy key).
  TS_DOTNET_REV: 619fa979673635663cba98be5e25713806d11cd5

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - &checkout
        uses: actions/checkout@v5
        with:
          path: terrascale
          persist-credentials: false
      - &checkout-ts-dotnet
        uses: actions/checkout@v5
        with:
          repository: TerraScale/ts-dotnet
          ref: ${{ env.TS_DOTNET_REV }}
          ssh-key: ${{ secrets.TS_DOTNET_DEPLOY_KEY }}
          path: ts-dotnet
          persist-credentials: false
      - &download-terrabase
        name: Download the pinned TerraBase the ts-auth tests start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download auth-test-terrabase -R "$GITHUB_REPOSITORY" -p terrabase-linux-amd64 -D terrabase-pinned
      - &setup-builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: terrascale-ci
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: |
            ts-dotnet=ts-dotnet
            terrabase-pinned=terrabase-pinned
          target: test
          push: false

  slow:
    needs: test
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - *download-terrabase
      - *setup-builder
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: |
            ts-dotnet=ts-dotnet
            terrabase-pinned=terrabase-pinned
          target: test-slow

  preview:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_PREVIEWS }}
      APP: ts-pr-${{ github.event.pull_request.number }}
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - *download-terrabase
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the preview app
        run: terrascale/scripts/fly/preview.sh app ${{ github.event.pull_request.number }}
      - *setup-builder
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_TOKEN_PREVIEWS }}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: |
            ts-dotnet=ts-dotnet
            terrabase-pinned=terrabase-pinned
          target: terrabase
          tags: registry.fly.io/${{ env.APP }}:terrabase-${{ github.sha }}
          push: true
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: |
            ts-dotnet=ts-dotnet
            terrabase-pinned=terrabase-pinned
          target: ts-auth
          tags: registry.fly.io/${{ env.APP }}:ts-auth-${{ github.sha }}
          build-args: TS_AUTH_REVISION=${{ github.sha }}
          push: true
      - name: Start or update the preview machine
        run: >-
          terrascale/scripts/fly/preview.sh machine ${{ github.event.pull_request.number }}
          registry.fly.io/$APP:terrabase-${{ github.sha }} registry.fly.io/$APP:ts-auth-${{ github.sha }}
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --edit-last --create-if-none
          --body "Preview: https://$APP.fly.dev (TerraBase + ts-auth at ${{ github.sha }}; stops when idle, deleted on close or after 24 h)"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - *download-terrabase
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - *setup-builder
      # One deploy token per app; each can push only to its own app's repository.
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_TOKEN_TS_TERRABASE }}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: |
            ts-dotnet=ts-dotnet
            terrabase-pinned=terrabase-pinned
          target: terrabase
          tags: registry.fly.io/ts-terrabase:${{ github.sha }}
          push: true
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_TOKEN_TS_AUTH }}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: |
            ts-dotnet=ts-dotnet
            terrabase-pinned=terrabase-pinned
          target: ts-auth
          tags: registry.fly.io/ts-auth:${{ github.sha }}
          build-args: TS_AUTH_REVISION=${{ github.sha }}
          push: true
      - name: Deploy TerraBase (gru, check, sjc)
        working-directory: terrascale
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_TS_TERRABASE }}
        run: scripts/fly/deploy.sh ts-terrabase src/TerraBase/fly.toml registry.fly.io/ts-terrabase:${{ github.sha }}
      - name: Deploy ts-auth (gru, check, sjc)
        working-directory: terrascale
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_TS_AUTH }}
        run: scripts/fly/deploy.sh ts-auth src/TerraScale.Authentication/fly.toml registry.fly.io/ts-auth:${{ github.sha }}
