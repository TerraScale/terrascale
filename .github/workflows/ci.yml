name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reconcile_auth:
        description: Reconcile ts-auth with main
        type: boolean
        default: false
      publication:
        description: 'release (default), build-only (TerraBase images, no release) or release-only (needs terrabase_arm64)'
        type: choice
        options: [release, build-only, release-only]
        default: release
      terrabase_arm64:
        description: 'release-only: the linux/arm64 child digest (sha256:...) a build-only run published for this main revision'
        type: string
        default: ''
      pr_gate:
        description: Run every PR build leg on this ref without publication
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_gate && format('pr-gate-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr_gate == true }}

permissions:
  contents: read

env:
  OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
  TERRABASE_REVISION: ${{ github.sha }}
  TS_AUTH_REVISION: ${{ github.sha }}
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  ASPNETCORE_HTTP_PORTS: ''

jobs:
  changes:
    if: ${{ inputs.pr_gate || !inputs.reconcile_auth }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.areas.outputs.build }}
      sdks: ${{ steps.areas.outputs.sdks }}
      deploy: ${{ steps.areas.outputs.deploy }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          ref: ${{ github.event_name == 'push' && github.sha || '' }}
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - Makefile
              - Directory.*
              - global.json
              - NuGet.config
              - .editorconfig
              - BannedSymbols.txt
              - TerraScale.slnx
              - src/TerraScale.Endpoints*/**/!(AGENTS.md)
              - src/TerraScale.Logging/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
            dotnet-sdk: &dotnet-sdk
              - sdk/dotnet/**/!(AGENTS.md)
            image: &image
              - .github/scripts/ci/image-payloads.sh
              - .github/scripts/ci/deploy-v2.sh
              - .github/scripts/ci/publish-ocir.sh
              - .github/scripts/ci/publish-image.sh
              - .github/scripts/ci/ocir-repositories.sh
              - .github/scripts/ci/release-only.sh
            libs:
              - *shared
              - benchmark/dotnet/TerraScale.Endpoints.Benchmarks/**/!(AGENTS.md)
              - benchmark/dotnet/TerraScale.Logging.Benchmarks/**/!(AGENTS.md)
            auth:
              - *shared
              - *dotnet-sdk
              - *image
              - .github/docker/ts-auth.Dockerfile
              - .github/scripts/ci/{site-deploy-gate.mjs,reconcile-image.sh,inspect-app-image.sh}
              - .github/scripts/auth/**
              - src/TerraScale.Authentication*/**/!(AGENTS.md)
            terrabase:
              - *shared
              - *image
              - .github/actions/native-libs/**
              - .github/docker/terrabase.Dockerfile
              - .github/scripts/ci/check-live-ahead.sh
              - src/TerraBase*/**/!(AGENTS.md)
              - src/TerraScale.QuicRpc/**/!(AGENTS.md)
              - native/{build-native.sh,native-pin.env}
              - sites/landing/static/pricing.json
            platform:
              - *shared
              - *image
              - .github/actions/native-libs/**
              - .github/docker/ts-platform.Dockerfile
              - .github/scripts/ci/check-live-ahead.sh
              - src/TerraScale.Platform/**/!(AGENTS.md)
              - src/TerraScale.QuicRpc/**/!(AGENTS.md)
              - native/{build-native.sh,native-pin.env}
            aspire:
              - *shared
              - src/TerraScale.Aspire/**/!(AGENTS.md)
              - .github/scripts/check-aspire-host.py
              - .github/scripts/ci/release-only.sh
            sdk-dotnet:
              - sdk/dotnet/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-go:
              - sdk/go/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-js:
              - sdk/js/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-python:
              - sdk/python/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-rust:
              - sdk/rust/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
              - Makefile
              - .github/workflows/ci.yml
            docs:
              - sites/docs/**/!(AGENTS.md)
              - sites/landing/static/{pricing,regions}.json
              - Makefile
              - .github/workflows/ci.yml
            landing:
              - sites/landing/**/!(AGENTS.md)
              - .github/workflows/ci.yml
            status:
              - sites/status/**/!(AGENTS.md)
              - .github/workflows/ci.yml
            e2e:
              - e2e/**/!(AGENTS.md)
              - .github/workflows/ci.yml
            dashboard:
              - *shared
              - *dotnet-sdk
              - src/TerraScale.Dashboard*/**/!(AGENTS.md)
              - .github/docker/dashboard.Dockerfile
              - .github/scripts/dashboard/check-stripe-dependency.py
              - sites/landing/static/pricing.json
              - .github/scripts/ci/release-only.sh
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          PR_GATE: ${{ inputs.pr_gate == true }}
          PUBLICATION: ${{ inputs.publication }}
          CHANGES: ${{ steps.filter.outputs.changes || '[]' }}
        run: |
          case "$EVENT:$PR_GATE:$PUBLICATION" in
            pull_request:*) build=$CHANGES deploy='[]' ;;
            workflow_dispatch:true:*) build='["libs","auth","terrabase","dashboard","aspire","docs","landing","status","e2e","sdk-dotnet","sdk-go","sdk-js","sdk-python","sdk-rust"]' deploy='[]' ;;
            push:*) build='[]' deploy=$CHANGES ;;
            workflow_dispatch:false:release) build='[]' deploy='["terrabase","platform"]' ;;
            *) build='[]' deploy='[]' ;;
          esac
          {
            echo "build=$(jq -c '[.[] | if . == "platform" then "terrabase" else . end | select(IN("libs", "auth", "terrabase", "dashboard", "aspire", "docs", "landing", "status", "e2e"))] | unique' <<< "$build")"
            echo "sdks=$(jq -c '[.[] | select(startswith("sdk-"))]' <<< "$build")"
            echo "deploy=$(jq -c '[.[] | select(IN("terrabase", "platform", "auth"))]' <<< "$deploy")"
          } | tee -a "$GITHUB_OUTPUT"

  checks:
    if: ${{ github.event_name == 'pull_request' || inputs.pr_gate }}
    services:
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: [5000:5000]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Start the legacy scan
        run: |
          (status=0
            python3 .github/scripts/legacy-scan/scan.py --repo terrascale --output legacy-hits.md > legacy-scan.log 2>&1 || status=$?
            echo "$status" > legacy-scan.exit.tmp && mv legacy-scan.exit.tmp legacy-scan.exit) > /dev/null 2>&1 &
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: workflow-linter
        with:
          path: ~/.cache/terrascale-ci/actionlint
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-644076a59742c2d1540ebd4686eab3c308f0e562-${{ hashFiles('sdk/go/.go-version') }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: steps.workflow-linter.outputs.cache-hit != 'true'
        with:
          go-version-file: sdk/go/.go-version
          cache: false
      - name: Build the workflow linter
        if: steps.workflow-linter.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/archive/644076a59742c2d1540ebd4686eab3c308f0e562.tar.gz
          sha256sum --check --strict <<EOF
          747636d922cb81e66613ef80c5d08ff748de58d6d5250b9151853e8f680da3e1  $RUNNER_TEMP/actionlint.tar.gz
          EOF
          mkdir -p "$RUNNER_TEMP/actionlint-source" "$HOME/.cache/terrascale-ci/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-source" --strip-components=1
          cd "$RUNNER_TEMP/actionlint-source"
          CGO_ENABLED=0 GOTOOLCHAIN=local go build -mod=readonly -trimpath -ldflags="-s -w" -o "$HOME/.cache/terrascale-ci/actionlint/actionlint" ./cmd/actionlint
      - name: Lint workflows
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          sha256sum --check --strict <<EOF
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz
          EOF
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 shellcheck-v0.11.0/shellcheck
          "$HOME/.cache/terrascale-ci/actionlint/actionlint" -shellcheck "$RUNNER_TEMP/shellcheck"
      - uses: oras-project/setup-oras@6c7c53b4590464855840e6196435c3af71140f64
        with:
          version: 1.3.6
      - name: Prove OCI fallback publication and release ordering
        run: bash .github/scripts/ci/prove-image-transport.sh
      - name: No test file outside the journey
        run: |
          added=$(git diff --name-only --no-renames --diff-filter=A HEAD^1 HEAD)
          if grep -v '^e2e/' <<< "$added" | grep -E '(^|/)([Tt]ests?|[Tt]esting|__tests__|__mocks__|[^/]*-tests)/|\.(Test[^/]*|E2E)/|(^|/)(tests?|test_[^/]*|conftest)\.py$|(^|/)tests?\.rs$|_tests?\.(go|rs|py)$|\.(test|spec)\.[cm]?[jt]sx?$|([.-]t|T)ests?\.cs$|(^|/)test-[^/]*\.(sh|py|[cm]?js|ts)$|-tests?\.(sh|py|[cm]?js|ts)$|(^|/)(vitest|jest|playwright)[^/]*\.config\.[cm]?[jt]s$'; then
            echo '::error::This pull request adds the test files above. The journey in e2e/ is the only test.'
            exit 1
          fi
      - name: Workflows name no retired hosting provider
        run: '! grep -rniI "fl[y]" .github/workflows | grep -viE "fl[y]\.storage\.tigris\.dev|fl[y] storage"'
      - name: Storage format migrations
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/check-storage-format.sh HEAD^1 ${PR:+"$GITHUB_REPOSITORY" "$PR"}
      - name: Scan for legacy terms (fail)
        if: ${{ !cancelled() }}
        run: |
          until [ -f legacy-scan.exit ]; do sleep 1; done
          head -1 legacy-scan.log
          exit "$(cat legacy-scan.exit)"
      - name: Retain legacy hits
        if: ${{ !cancelled() && hashFiles('legacy-hits.md') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-hits
          path: |
            legacy-hits.md
            legacy-scan.log

  libs:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.build), 'libs')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - &setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-libs-${{ hashFiles('src/TerraScale.Contracts/packages.lock.json', 'src/TerraScale.Endpoints*/packages.lock.json', 'src/TerraScale.Logging/packages.lock.json', 'benchmark/dotnet/*/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-libs-
      - name: Release build
        run: |
          make libs-build CONFIGURATION=Release
          .github/scripts/ci/release-only.sh

  auth:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.build), 'auth')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup-dotnet
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-auth-${{ hashFiles('src/TerraScale.Authentication*/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-auth-
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - name: Release build with audit and OpenAPI checks
        run: make auth-restore && make -o auth-restore auth-check CONFIGURATION=Release && .github/scripts/ci/release-only.sh

  terrabase:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.build), 'terrabase')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup-dotnet
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-terrabase-${{ hashFiles('src/TerraBase*/packages.lock.json', 'src/TerraScale.QuicRpc/packages.lock.json', 'src/TerraScale.Platform/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-terrabase-
      - name: Pinned native libraries
        uses: ./.github/actions/native-libs
        with:
          runtimes: linux-arm64
      - name: Release build of TerraBase and ts-platform
        run: |
          make -o native-libs terrabase-build CONFIGURATION=Release
          make -o native-libs platform-build CONFIGURATION=Release
          .github/scripts/ci/release-only.sh

  dashboard:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.build), 'dashboard')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup-dotnet
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-dashboard-${{ hashFiles('src/TerraScale.Dashboard/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-dashboard-
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: src/TerraScale.Dashboard/web/package-lock.json
      - name: Release build with the web assets
        run: |
          npm ci --prefix src/TerraScale.Dashboard/web --no-audit --no-fund &
          web=$!
          make dashboard-restore
          wait "$web"
          make -o dashboard-restore dashboard-build CONFIGURATION=Release
          .github/scripts/ci/release-only.sh

  aspire:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.build), 'aspire')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup-dotnet
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-aspire-${{ hashFiles('src/TerraScale.Aspire/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-aspire-
      - name: Release build
        run: |
          make aspire-build CONFIGURATION=Release
          .github/scripts/ci/release-only.sh

  sdk:
    needs: changes
    if: needs.changes.outputs.sdks != '[]'
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.changes.outputs.sdks) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AREA: ${{ matrix.area }}
    steps:
      - *checkout
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: matrix.area == 'sdk-dotnet'
        with:
          dotnet-version: |
            10.0.401
            11.0.100
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: matrix.area == 'sdk-dotnet'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-sdk-dotnet-${{ hashFiles('sdk/dotnet/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-sdk-dotnet-
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        if: matrix.area != 'sdk-dotnet'
        with:
          install: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: matrix.area == 'sdk-go'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: sdk-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/go/.go-version', 'sdk/go/go.sum') }}
      - name: Install the pinned SDK toolchain
        run: |
          set -euo pipefail
          case "$AREA" in
            sdk-go) mise use -g "go@$(cat sdk/go/.go-version)"; dirname "$(mise which go)" >> "$GITHUB_PATH" ;;
            sdk-python) mise use -g uv@0.13.7; dirname "$(mise which uv)" >> "$GITHUB_PATH" ;;
            sdk-rust) rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy ;;
          esac
      - name: Build the SDK
        run: |
          if [[ $AREA == sdk-go ]]; then
            cd sdk/go && go build ./...
          else
            make "$AREA-check"
          fi

  docs:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.build), 'docs')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: sites/docs/.node-version
          cache: npm
          cache-dependency-path: sites/docs/package-lock.json
      - name: Build the docs site
        run: make docs-build

  landing:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.build), 'landing')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: sites/landing/.node-version
          cache: npm
          cache-dependency-path: sites/landing/package-lock.json
      - name: Build the static site
        working-directory: sites/landing
        run: |
          npm ci --no-audit --no-fund
          npm run build

  status:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.build), 'status')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: sites/status/.node-version
          cache: npm
          cache-dependency-path: sites/status/package-lock.json
      - name: Type-check and build the Worker
        working-directory: sites/status
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

  e2e:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.build), 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Type-check the journey
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npm run typecheck

  main:
    needs: changes
    if: github.ref == 'refs/heads/main' && contains(fromJSON(needs.changes.outputs.deploy), 'terrabase')
    concurrency:
      group: production-terrabase
      cancel-in-progress: false
      queue: max
    env:
      AREA: terrabase
      SERVICE: terrabase
      BUILD_ONLY: 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps: &production-steps
      - *checkout
      - uses: ./.github/actions/qualified-main
        if: env.BUILD_ONLY == 'true'
        with:
          revision: ${{ github.sha }}
          qualification: terrabase-maintenance
      - name: Authenticate to OCIR with GitHub OIDC
        uses: TerraScale/ts-orchestrator/.github/actions/ocir-login@623419d401570afd0d8bc172dc6245760a78d058
        with:
          regions: sa-saopaulo-1 eu-frankfurt-1 us-sanjose-1
          domain-url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          client-id: ${{ vars.OCI_TOKEN_EXCHANGE_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_TOKEN_EXCHANGE_CLIENT_SECRET }}
      - id: liveguard
        name: Skip when live is already at or ahead of this commit
        if: env.BUILD_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci/check-live-ahead.sh "$SERVICE"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: steps.liveguard.outputs.skip != 'true'
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.liveguard.outputs.skip != 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-publish-${{ env.AREA }}-${{ env.AREA == 'platform' && hashFiles('src/TerraScale.Platform/packages.lock.json') || hashFiles('src/TerraBase/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-publish-${{ env.AREA }}-
      - name: Pinned native libraries
        if: steps.liveguard.outputs.skip != 'true'
        uses: ./.github/actions/native-libs
        with:
          runtimes: linux-arm64
      - uses: oras-project/setup-oras@6c7c53b4590464855840e6196435c3af71140f64
        if: steps.liveguard.outputs.skip != 'true'
        with:
          version: 1.3.6
      - name: Publish the linux/arm64 runtime payload
        if: steps.liveguard.outputs.skip != 'true'
        run: |
          docker buildx create --use --driver docker-container --bootstrap > "$RUNNER_TEMP/builder.log" 2>&1 &
          builder=$!
          bash .github/scripts/ci/image-payloads.sh publish "$AREA"
          bash .github/scripts/ci/image-payloads.sh runtime-dockerfile "$AREA" > "$RUNNER_TEMP/image-payloads/Dockerfile"
          wait "$builder" || { cat "$RUNNER_TEMP/builder.log"; exit 1; }
      - id: image
        if: steps.liveguard.outputs.skip != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ runner.temp }}/image-payloads
          file: ${{ runner.temp }}/image-payloads/Dockerfile
          platforms: linux/arm64
          tags: sa-saopaulo-1.ocir.io/${{ vars.OCIR_NAMESPACE }}/terrascale/${{ env.SERVICE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
      - id: digest
        name: Verify the published linux/arm64 child
        if: steps.liveguard.outputs.skip != 'true'
        env:
          INDEX: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="sa-saopaulo-1.ocir.io/${OCIR_NAMESPACE:?}/terrascale/${SERVICE}"
          manifest=$(docker buildx imagetools inspect "${image}@${INDEX}" --format '{{json .Manifest}}')
          arm64=$(jq -r 'if .manifests then (.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest) else empty end' <<< "$manifest")
          arm64=${arm64:-$INDEX}
          [[ $arm64 =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "${image}@${arm64}" --format '{{json .Image}}' |
            jq -e --arg revision "$GITHUB_SHA" '.architecture == "arm64" and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision'
          echo "arm64=${arm64}" >> "$GITHUB_OUTPUT"
          echo "${SERVICE} revision=${GITHUB_SHA} index=${INDEX} arm64=${arm64} build_only=${BUILD_ONLY}" | tee -a "$GITHUB_STEP_SUMMARY"
      - id: provenance
        name: Attest build provenance of the linux/arm64 child
        if: steps.liveguard.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: sa-saopaulo-1.ocir.io/${{ vars.OCIR_NAMESPACE }}/terrascale/${{ env.SERVICE }}
          subject-digest: ${{ steps.digest.outputs.arm64 }}
          push-to-registry: false
      - id: mirror
        name: Mirror the image to every OCIR region
        if: steps.liveguard.outputs.skip != 'true'
        env:
          ARM64: ${{ steps.digest.outputs.arm64 }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          image="sa-saopaulo-1.ocir.io/${OCIR_NAMESPACE:?}/terrascale/${SERVICE}"
          tags=$GITHUB_SHA
          if [[ $BUILD_ONLY != true ]]; then tags+=,main; fi
          bash .github/scripts/ci/publish-ocir.sh "${image}@${ARM64}" "$tags"
          mkdir -p "$RUNNER_TEMP/attest-target"
          cp "$PROVENANCE" "$RUNNER_TEMP/attest-target/provenance.json"
          jq -n --arg service "$SERVICE" --arg image "$image" --arg arm64 "$ARM64" --arg revision "$GITHUB_SHA" --arg tags "$tags" \
            '{service: $service, image: $image, arm64: $arm64, revision: $revision, tags: ($tags | split(","))}' > "$RUNNER_TEMP/attest-target/attest-target.json"
      - name: Deploy through ts-orch
        if: steps.liveguard.outputs.skip != 'true' && env.BUILD_ONLY != 'true'
        env:
          ARM64: ${{ steps.digest.outputs.arm64 }}
        run: bash .github/scripts/ci/deploy-v2.sh "${SERVICE}" "sa-saopaulo-1.ocir.io/${OCIR_NAMESPACE:?}/terrascale/${SERVICE}@${ARM64}"
      - name: Hand the published image to the attestation workflow
        if: ${{ !cancelled() && steps.mirror.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attest-targets-${{ env.SERVICE }}
          path: ${{ runner.temp }}/attest-target
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  main-platform:
    needs: changes
    if: github.ref == 'refs/heads/main' && contains(fromJSON(needs.changes.outputs.deploy), 'platform')
    concurrency:
      group: production-platform
      cancel-in-progress: false
      queue: max
    env:
      AREA: platform
      SERVICE: ts-platform
      BUILD_ONLY: 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps: *production-steps

  main-build-only:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publication == 'build-only' && github.ref == 'refs/heads/main'
      && !inputs.pr_gate && !inputs.reconcile_auth
    concurrency:
      group: build-${{ github.run_id }}
      cancel-in-progress: false
    env:
      AREA: terrabase
      SERVICE: terrabase
      BUILD_ONLY: 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps: *production-steps

  release-only:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publication == 'release-only' && github.ref == 'refs/heads/main'
      && !inputs.pr_gate && !inputs.reconcile_auth
    concurrency:
      group: production-terrabase
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci
            .github/actions/qualified-main
      - uses: ./.github/actions/qualified-main
        with:
          revision: ${{ github.sha }}
          qualification: terrabase-maintenance
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Authenticate to OCIR with GitHub OIDC
        uses: TerraScale/ts-orchestrator/.github/actions/ocir-login@623419d401570afd0d8bc172dc6245760a78d058
        with:
          regions: sa-saopaulo-1 eu-frankfurt-1 us-sanjose-1
          domain-url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          client-id: ${{ vars.OCI_TOKEN_EXCHANGE_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_TOKEN_EXCHANGE_CLIENT_SECRET }}
      - name: Verify and deploy the pinned arm64 digest through ts-orch
        env:
          GH_TOKEN: ${{ github.token }}
          ARM64: ${{ inputs.terrabase_arm64 }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$ARM64" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'terrabase_arm64 must be sha256:<64 hex>' >&2; exit 1; }
          image="sa-saopaulo-1.ocir.io/${OCIR_NAMESPACE:?}/terrascale/terrabase@${ARM64}"
          docker buildx imagetools inspect "$image" --format '{{json .Image}}' |
            jq -e --arg revision "$REVISION" '.architecture == "arm64" and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision'
          gh attestation verify "oci://${image}" --owner TerraScale --signer-workflow TerraScale/terrascale/.github/workflows/ci.yml --source-ref refs/heads/main --source-digest "$REVISION"
          gh attestation verify "oci://${image}" --owner TerraScale --predicate-type https://spdx.dev/Document/v2.3 --cert-identity-regex '^https://github\.com/TerraScale/terrascale/\.github/workflows/(ci|attest-images)\.yml@refs/heads/main$' --source-ref refs/heads/main
          bash .github/scripts/ci/deploy-v2.sh terrabase "$image"

  main-auth:
    needs: changes
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && ((github.event_name == 'push' && needs.changes.result == 'success' && contains(fromJSON(needs.changes.outputs.deploy), 'auth'))
      || (github.event_name == 'workflow_dispatch' && inputs.reconcile_auth && !inputs.pr_gate))
    concurrency:
      group: production-auth
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: probe
        name: Validate live ts-auth readiness response
        run: node .github/scripts/ci/site-deploy-gate.mjs auth --probe
      - name: Note clean-slate or unavailable live ts-auth
        if: steps.probe.outputs.unavailable == 'true'
        run: echo 'Live ts-auth readiness is currently unavailable; proceeding with reconciliation'
      - id: live
        name: Reconcile main with live ts-auth
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_LIVE_REVISION: ${{ steps.probe.outputs.revision }}
        run: node .github/scripts/ci/site-deploy-gate.mjs auth --reconcile
      - name: Authenticate to OCIR with GitHub OIDC
        if: steps.live.outputs.deploy == 'true'
        uses: TerraScale/ts-orchestrator/.github/actions/ocir-login@623419d401570afd0d8bc172dc6245760a78d058
        with:
          regions: sa-saopaulo-1 eu-frankfurt-1 us-sanjose-1
          domain-url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          client-id: ${{ vars.OCI_TOKEN_EXCHANGE_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_TOKEN_EXCHANGE_CLIENT_SECRET }}
      - id: cached
        name: Inspect the immutable target image
        if: steps.live.outputs.deploy == 'true'
        run: bash .github/scripts/ci/inspect-app-image.sh auth
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-publish-auth-${{ hashFiles('src/TerraScale.Authentication/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-publish-auth-
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
      - uses: oras-project/setup-oras@6c7c53b4590464855840e6196435c3af71140f64
        if: steps.live.outputs.deploy == 'true'
        with:
          version: 1.3.6
      - id: image
        name: Build or reuse the target image
        if: steps.live.outputs.deploy == 'true'
        run: bash .github/scripts/ci/reconcile-image.sh auth
      - id: provenance
        name: Attest build provenance of the linux/arm64 child
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.arm64 }}
          push-to-registry: false
      - id: mirror
        name: Mirror the image to every OCIR region
        if: steps.live.outputs.deploy == 'true'
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bash .github/scripts/ci/publish-ocir.sh "$IMAGE" "${REVISION},main"
          if [[ $IMAGE_CACHED == false ]]; then
            mkdir -p "$RUNNER_TEMP/attest-target"
            cp "$PROVENANCE" "$RUNNER_TEMP/attest-target/provenance.json"
            jq -n --arg image "${IMAGE%@*}" --arg arm64 "${IMAGE#*@}" --arg revision "$REVISION" \
              '{service: "ts-auth", image: $image, arm64: $arm64, revision: $revision, tags: [$revision, "main"]}' > "$RUNNER_TEMP/attest-target/attest-target.json"
          fi
      - name: Deploy ts-auth through ts-orch
        if: steps.live.outputs.deploy == 'true'
        run: bash .github/scripts/ci/deploy-v2.sh ts-auth "$IMAGE"
      - name: Prove the live revision
        if: steps.live.outputs.deploy == 'true'
        run: node .github/scripts/ci/site-deploy-gate.mjs auth --prove
      - name: Hand the published image to the attestation workflow
        if: ${{ !cancelled() && steps.mirror.outcome == 'success' && steps.cached.outputs.cached == 'false' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attest-targets-ts-auth
          path: ${{ runner.temp }}/attest-target
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  all-green:
    name: all-green
    if: always()
    needs: [changes, checks, libs, auth, terrabase, dashboard, aspire, sdk, docs, landing, status, e2e, main, main-platform, main-build-only, release-only, main-auth]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check upstream results
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
