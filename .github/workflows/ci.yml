name: CI

on:
  pull_request:
    # No `labeled`: a label must not re-run and cancel the running check.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "47 2-23/3 * * *"
  workflow_dispatch:
    inputs:
      native_artifacts:
        description: 'Maintenance: prepare combined native release assets only (no Fast/images/publication)'
        type: boolean
        default: false

# A new push cancels the older run of the same PR. Every other run has its own group: each main push publishes the
# images of the areas it changed, so none may be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # SDK source belongs to the same checked revision as its consumers.
  TS_DOTNET_DIR: sdk/dotnet
  TsDotnetRoot: ${{ github.workspace }}/terrascale/sdk/dotnet
  TERRABASE_REVISION: ${{ github.sha }}
  TS_AUTH_REVISION: ${{ github.sha }}
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  ASPNETCORE_HTTP_PORTS: ''
  # Keep CallerFilePath fixture lookups on disk, as in Docker (which excludes .git).
  # ContinuousIntegrationBuild and deterministic compilation remain enabled.
  DeterministicSourcePaths: false

jobs:
  # Runs on every event: a skipped job would skip "test".
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fast: ${{ steps.areas.outputs.fast }}
      main: ${{ steps.areas.outputs.main }}
      slow: ${{ steps.slow.outputs.slow }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      # Pull requests list files through the API; the checkout also runs cheap checks before any build.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          # Empty on pushes: the action then diffs against the push's `before` commit.
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - Dockerfile
              - .dockerignore
              - Makefile
              - Directory.*
              - global.json
              - NuGet.config
              - .editorconfig
              - BannedSymbols.txt
              - TerraScale.slnx
              - src/TerraScale.Endpoints*/**
              - src/TerraScale.Logging/**
              - tests/TerraScale.Endpoints.Tests/**
              - tests/TerraScale.Logging.Tests/**
              # TerraBase's vendored driver also backs auth integration tests and vendor audits.
              - sdk/dotnet/**
              - src/vendor/**
              - tests/Turso.Data.Sqlite.Tests/**
              - scripts/vendor/**
            libs:
              - *shared
              - libs.slnf
              - src/TerraScale.CLI/**
              - benchmark/dotnet/**
              # Self-check changes run in changes; executor changes still qualify both native Fast areas.
              - scripts/ci/image-payloads.sh
              - scripts/ci/test-area.sh
              # The credential entry point and the scripts it runs (make handoff-test).
              - scripts/handoff/**
              - scripts/e2e/**
              - benchmark/scripts/repl-*-tenant.sh
            auth:
              - *shared
              - scripts/ci/image-payloads.sh
              - auth.slnf
              - src/TerraScale.Authentication*/**
              - tests/TerraScale.Authentication*/**
              # The published platform contract (OpenApiTests, auth-openapi-check); the Markdown docs are not inputs.
              - docs/auth/*.yaml
              - scripts/auth/**
              - scripts/ci/auth-build.sh
            auth-server:
              - src/TerraBase/**
            terrabase:
              - *shared
              - scripts/ci/terrabase-*
              - terrabase.slnf
              - scripts/ci/image-payloads.sh
              - scripts/ci/test-area.sh
              - src/TerraBase*/**
              - tests/TerraBase*/**
              - scripts/terrabase/*
              - scripts/terrabase/**
      - id: areas
        env:
          CHANGES: ${{ github.event_name == 'schedule' && '[]' || github.event_name == 'workflow_dispatch' && (inputs.native_artifacts && '[]' || '["libs","auth","terrabase"]') || steps.filter.outputs.changes }}
        run: |
          # The ts-auth image does not contain TerraBase: main publishes and Slow-tests auth only for its own changes.
          echo "main=$(jq -c '[.[] | select(. == "auth" or . == "terrabase")]' <<< "$CHANGES")" >> "$GITHUB_OUTPUT"
          [[ $GITHUB_EVENT_NAME == pull_request ]] || CHANGES=$(jq -c 'if index("auth-server") then . + ["auth"] else . end' <<< "$CHANGES")
          echo "fast=$(jq -c '[.[] | select(. == "libs" or . == "auth" or . == "terrabase")] | unique' <<< "$CHANGES")" >> "$GITHUB_OUTPUT"

      - id: slow
        name: Select changed scheduled Slow suites
        if: github.event_name == 'schedule'
        run: python3 scripts/ci/slow-state.py
      - name: Scan for legacy terms
        if: github.event_name != 'schedule'
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ -n $BASE_SHA && ! $BASE_SHA =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            args+=(--changed-from "$BASE_SHA")
          fi
          python3 scripts/legacy-scan/scan.py --repo terrascale --output legacy-hits.md "${args[@]}" > legacy-scan.log
          head -1 legacy-scan.log
      - name: Retain legacy hits
        if: ${{ !cancelled() && hashFiles('legacy-hits.md') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-hits
          path: |
            legacy-hits.md
            legacy-scan.log

      - name: Check out the path-filter matcher for regression fixtures
        if: github.event_name != 'push' && github.event_name != 'schedule'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dorny/paths-filter
          ref: 0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
          path: path-filter-action
          persist-credentials: false
      - name: Verify CI path filters
        if: github.event_name != 'push' && github.event_name != 'schedule'
        run: python3 scripts/ci/path-filter-test.py .github/workflows/ci.yml path-filter-action/dist/index.js
      # Production runs on OCI through ts-orch; only Tigris (its endpoint and `fly storage`) stays. The brackets keep
      # these lines from matching themselves.
      - name: Workflows name no retired hosting provider
        if: github.event_name != 'push' && github.event_name != 'schedule'
        run: '! grep -rniI "fl[y]" .github/workflows | grep -viE "fl[y]\.storage\.tigris\.dev|fl[y] storage"'
      - name: Slow report, cache policy, storage train and e2e summary self-checks
        if: github.event_name != 'push' && github.event_name != 'schedule'
        run: |
          python3 scripts/legacy-scan/process-test.py
          python3 scripts/ci/slow-report-test.py
          python3 scripts/ci/cache-policy-test.py
          python3 scripts/vendor/turso-native-pipeline-test.py
          bash scripts/terrabase/storage-format-check-test.sh
          bash scripts/terrabase/e2e-summary-test.sh
      # Reads the labels live: after labelling, re-run changes (docs/terrabase/ci.md, storage train).
      - name: Storage train
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/terrabase/storage-format-check.sh "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}"

  # Normal runs verify prebuilt release bytes; native Rust builds stay in explicit maintenance dispatches.
  native:
    needs: changes
    if: needs.changes.outputs.fast != '[]' || needs.changes.outputs.main != '[]' || (github.event_name == 'schedule' && needs.changes.outputs.slow != '[]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.changes.outputs.sha }}
      - name: Download and verify the pinned FTS + contract1 release
        run: scripts/vendor/download-turso-native.sh native-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turso-native-verified
          path: native-output/
          if-no-files-found: error

  native-build:
    if: github.event_name == 'workflow_dispatch' && inputs.native_artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            repeat: 1
          - arch: amd64
            runner: ubuntu-24.04
            repeat: 2
          - arch: arm64
            runner: ubuntu-24.04-arm
            repeat: 1
          - arch: arm64
            runner: ubuntu-24.04-arm
            repeat: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - &setup-builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build once on the real target architecture and run both native smokes
        run: scripts/vendor/build-turso-native.sh '${{ matrix.arch }}' native-output
      - name: Record this run's native SHA-256
        run: |
          cd native-output
          sha256sum --check SHA256SUMS-*
          grep 'runtimes/.*libturso_sdk_kit.so$' SHA256SUMS-* >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turso-native-build-${{ matrix.arch }}-${{ matrix.repeat }}
          path: native-output/
          if-no-files-found: error

  native-release:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: turso-native-build-*
          path: native-builds
      - name: Assemble publication assets and source/patch receipts
        run: |
          for arch in amd64 arm64; do
            case "$arch" in amd64) rid=linux-x64 ;; arm64) rid=linux-arm64 ;; esac
            for repeat in 1 2; do
              (cd "native-builds/turso-native-build-$arch-$repeat" && sha256sum --check "SHA256SUMS-$rid")
            done
            cmp "native-builds/turso-native-build-$arch-1/runtimes/$rid/native/libturso_sdk_kit.so" \
                "native-builds/turso-native-build-$arch-2/runtimes/$rid/native/libturso_sdk_kit.so"
          done
          scripts/vendor/prepare-turso-native-release.sh native-builds/turso-native-build-amd64-1 native-builds/turso-native-build-arm64-1 native-release
          for arch in amd64 arm64; do
            case "$arch" in amd64) rid=linux-x64 ;; arm64) rid=linux-arm64 ;; esac
            cp "native-builds/turso-native-build-$arch-2/release/$rid-build-receipt.txt" "native-release/$rid-independent-build-receipt.txt"
          done
          (cd native-release && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > ../native-SHA256SUMS)
          mv native-SHA256SUMS native-release/SHA256SUMS
          cat native-release/NATIVE-SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turso-native-release
          path: native-release/
          if-no-files-found: error

  libs:
    needs: [changes, native]
    if: >-
      contains(fromJSON(needs.changes.outputs.fast), 'libs')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      AREA: libs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: terrascale
          persist-credentials: false
          ref: ${{ needs.changes.outputs.sha }}
      - &native-artifacts
        name: Download this run's verified pinned release cores
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: turso-native-verified
          path: terrascale/src/vendor/Turso.Data.Sqlite/native
      - &setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: terrascale/global.json
      - &nuget-cache
        name: Restore locked NuGet packages
        id: nuget
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          restore-keys: ${{ runner.os }}-nuget-monorepo-
          key: ${{ runner.os }}-nuget-monorepo-${{ hashFiles('terrascale/Makefile', 'terrascale/global.json', 'terrascale/NuGet.config', 'terrascale/Directory.*', 'terrascale/**/packages.lock.json') }}
      - &locked-restore
        name: Locked restore
        working-directory: terrascale
        run: make restore
      - name: Checked build and Fast
        working-directory: terrascale
        run: bash scripts/ci/test-area.sh fast "$AREA"


  auth:
    needs: [changes, native]
    if: >-
      contains(fromJSON(needs.changes.outputs.fast), 'auth')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      AREA: auth
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: read
    steps:
      - *checkout
      - *native-artifacts
      - *setup-dotnet
      - *nuget-cache
      - *locked-restore
      - name: Restore Auth npm tooling cache
        id: npm
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-auth-npm-${{ hashFiles('terrascale/Makefile', 'terrascale/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-auth-npm-
      - id: fast-proof
        name: Verify exact-commit Auth Fast evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if statuses=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses") &&
             jq -e '[.[][] | select(.context == "ts-ship/auth")] | max_by(.id) | .state == "success" and ((.creator.login // "" | ascii_downcase) == "mariogk")' <<< "$statuses" > /dev/null; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
            echo "Auth Fast passed on the dev host for $GITHUB_SHA, verified through ts-ship/auth by MarioGK." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'verified=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Auth browser dependencies
        if: steps.fast-proof.outputs.verified != 'true'
        working-directory: terrascale
        run: npx --yes playwright@1.63.0 install --with-deps chromium
      - name: Checked Auth build
        working-directory: terrascale
        run: bash scripts/ci/auth-build.sh
      - name: Retain main Auth npm tooling cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.npm.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ steps.npm.outputs.cache-primary-key }}
      - name: Auth Fast
        if: steps.fast-proof.outputs.verified != 'true'
        working-directory: terrascale
        run: env -u DOTNET_PROCESSOR_COUNT -u DOTNET_GCHeapCount make -o restore auth-test-fast CONFIGURATION=Release

  auth-package:
    needs: [changes, native]
    if: >-
      contains(fromJSON(needs.changes.outputs.fast), 'auth')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      AREA: auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - *checkout
      - *native-artifacts
      - *setup-dotnet
      - *nuget-cache
      - *locked-restore
      - &save-nuget
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (env.AREA == 'terrabase' || !contains(fromJSON(needs.changes.outputs.main), 'terrabase')) && steps.nuget.outputs.cache-hit != 'true'
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}
      - name: Auth single-file packaging proof
        working-directory: terrascale
        run: env -u DOTNET_PROCESSOR_COUNT -u DOTNET_GCHeapCount make auth-publish RUNTIME=linux-x64 PUBLISH_DIR="$RUNNER_TEMP/auth-publish"
      - name: Retain both architectures from the required Auth packaging proof
        if: github.event_name != 'pull_request'
        working-directory: terrascale
        run: |
          bash scripts/ci/image-payloads.sh auth
          bash scripts/ci/image-payloads.sh pack auth
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request'
        with:
          name: image-payloads-auth
          path: ${{ runner.temp }}/image-payloads-auth.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  terrabase-build:
    needs: [changes, native]
    if: >-
      contains(fromJSON(needs.changes.outputs.fast), 'terrabase')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      AREA: terrabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - *checkout
      - *native-artifacts
      - *setup-dotnet
      - *nuget-cache
      - *locked-restore
      - *save-nuget
      - name: Checked build and single-file packaging proof
        working-directory: terrascale
        run: bash scripts/ci/test-area.sh build terrabase
      - name: Reuse the checked TerraBase build for both runtime payloads
        if: github.event_name != 'pull_request'
        working-directory: terrascale
        run: |
          bash scripts/ci/image-payloads.sh terrabase
          bash scripts/ci/image-payloads.sh pack terrabase
      - name: Retain TerraBase runtime payloads
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-payloads-terrabase
          path: ${{ runner.temp }}/image-payloads-terrabase.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - name: Pack this commit's build outputs
        working-directory: terrascale
        # Only shard executables are consumed: their output directories contain every referenced assembly and native asset.
        # RID-specific publish outputs are packaging proofs, not shard inputs. Fast gzip avoids spending a runner CPU on them.
        run: >-
          tar --exclude='*/net11.0/linux-*' -cf -
          tests/TerraBase.Fast/bin/Release/net11.0
          tests/Turso.Data.Sqlite.Tests/bin/Release/net11.0
          tests/TerraBase.E2E/bin/Release/net11.0
          | gzip -1 > "$RUNNER_TEMP/terrabase-build.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terrabase-build
          path: ${{ runner.temp }}/terrabase-build.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  terrabase:
    needs: [changes, terrabase-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - *checkout
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: terrascale/global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: terrabase-build
          path: ${{ runner.temp }}
      - name: Unpack this commit's build outputs
        working-directory: terrascale
        run: tar -xzf "$RUNNER_TEMP/terrabase-build.tar.gz"
      - name: Fast shard and assigned integration proofs
        working-directory: terrascale
        run: make terrabase-test-shard SHARD=${{ matrix.shard }}
      - name: Retain test durations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terrabase-results-${{ matrix.shard }}
          path: terrascale/artifacts/test-results/
          if-no-files-found: error
          retention-days: 7

  main:
    needs: [changes, native, terrabase]
    if: >-
      !cancelled() && needs.terrabase.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      && contains(fromJSON(needs.changes.outputs.main), 'terrabase')
    concurrency:
      group: production-terrabase
      cancel-in-progress: false
    env:
      AREA: terrabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # ts-orch accepts this job's OIDC token to release the image it just published.
      id-token: write
      # A failed release dispatches a fresh main run (a newer signed run) so the latest main still ends up live.
      actions: write
    steps: &production-steps
      - *checkout
      - name: Download this area's checked runtime payloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image-payloads-${{ env.AREA }}
          path: ${{ runner.temp }}
      - name: Prepare the runtime-only image context
        working-directory: terrascale
        run: |
          mkdir -p "$RUNNER_TEMP/image-payloads"
          tar -C "$RUNNER_TEMP/image-payloads" -xf "$RUNNER_TEMP/image-payloads-$AREA.tar"
          bash scripts/ci/image-payloads.sh runtime-dockerfile "$AREA" > "$RUNNER_TEMP/image-payloads/Dockerfile"
      - *setup-builder
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Public multi-arch images ts-orch runs: ghcr.io/terrascale/{terrabase,ts-auth}:<sha> and :main, linux/amd64 +
      # linux/arm64 (both architectures cross-published from the build platform, Dockerfile publish-* stages).
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/image-payloads
          file: ${{ runner.temp }}/image-payloads/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/terrascale/${{ env.AREA == 'auth' && 'ts-auth' || 'terrabase' }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/terrascale/{0}:main', env.AREA == 'auth' && 'ts-auth' || 'terrabase') || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
      # Index digest plus each platform's child digest (ts-orch specs pin the linux/arm64 child).
      - env:
          IMAGE: ghcr.io/terrascale/${{ env.AREA == 'auth' && 'ts-auth' || 'terrabase' }}@${{ steps.image.outputs.digest }}
        run: |
          { echo '```'; docker buildx imagetools inspect "$IMAGE"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      # Every region's ts-orch swaps to the linux/arm64 digest, waits for readiness and rolls back on failure. Both
      # services release; the production-<area> concurrency group keeps one release of each in flight.
      # Releases converge on the latest main. A run superseded by a newer signed run has nothing left to do. Any other
      # failure of a push run's release (bake, rollback, a rerun's rebuilt digest under its already-approved run id)
      # dispatches one fresh main run, a newer signed run that releases the latest main; dispatched runs never
      # dispatch again.
      - name: Release to every region
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ env.AREA == 'auth' && 'ts-auth' || 'terrabase' }}
          INDEX: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/terrascale/${SERVICE}"
          arm64=$(docker buildx imagetools inspect "${image}@${INDEX}" --format '{{json .Manifest}}' |
            jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          test -n "$arm64"
          tag=$(gh release list --repo TerraScale/ts-orchestrator --limit 30 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("ci-"))] | sort_by(.createdAt) | last | .tagName // ""')
          test -n "$tag"
          gh release download "$tag" --repo TerraScale/ts-orchestrator --dir "${RUNNER_TEMP}/ts-orch" --pattern terrascale-orchestrator-linux-amd64
          curl -fsSL https://raw.githubusercontent.com/TerraScale/ts-orchestrator/main/deploy/m1/regions.json -o "${RUNNER_TEMP}/regions.json"
          chmod +x "${RUNNER_TEMP}/ts-orch/terrascale-orchestrator-linux-amd64"
          set +e
          "${RUNNER_TEMP}/ts-orch/terrascale-orchestrator-linux-amd64" release app --service "$SERVICE" \
            --image "${image}@${arm64}" --regions "${RUNNER_TEMP}/regions.json" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" "${RUNNER_TEMP}/release.log"
          status=${PIPESTATUS[0]}
          set -e
          [ "$status" -eq 0 ] && exit 0
          # Regions not yet on ts-orch #194 answer an older run with "deployment is stale"; a first attempt never
          # changes its own approved run, so there it can only mean superseded.
          if grep -q 'superseded by a newer signed run' "${RUNNER_TEMP}/release.log" ||
            { [ "$GITHUB_RUN_ATTEMPT" = 1 ] && grep -q 'deployment is stale' "${RUNNER_TEMP}/release.log"; }; then
            echo "Superseded: a newer main run released ${SERVICE}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Release failed; dispatched a fresh main run to release the latest main." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  main-auth:
    needs: [changes, native, auth, auth-package]
    if: >-
      !cancelled() && needs.auth.result == 'success' && needs.auth-package.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      && contains(fromJSON(needs.changes.outputs.main), 'auth')
    concurrency:
      group: production-auth
      cancel-in-progress: false
    env:
      AREA: auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    steps: *production-steps

  # Slow is independent of Fast/publication: PRs and changed main on a three-hour schedule.
  slow-auth:
    needs: [changes, native]
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON(needs.changes.outputs.main), 'auth')
    concurrency:
      group: ${{ github.workflow }}-slow-${{ github.event.pull_request.number || github.ref_name }}-auth
      cancel-in-progress: true
    env:
      AREA: auth
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps: &slow-steps
      - *checkout
      - *native-artifacts
      - *setup-builder
      - name: Supply bucket-scoped CI storage credentials
        if: env.AREA == 'terrabase'
        continue-on-error: true
        env:
          TIGRIS_CI_CREDENTIALS: ${{ secrets.TIGRIS_CI_CREDENTIALS }}
        run: |
          [[ -n $TIGRIS_CI_CREDENTIALS ]] || { echo 'TIGRIS_CI_CREDENTIALS is required' >&2; exit 1; }
          umask 077
          printf '%s\n' "$TIGRIS_CI_CREDENTIALS" > "$RUNNER_TEMP/tigris-ci.env"
      - name: Cache shared Docker base layers
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && env.AREA == 'auth'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=terrascale/sdk/dotnet
          target: restored
          build-args: &build-args |
            TERRABASE_REVISION=${{ needs.changes.outputs.sha }}
            TS_AUTH_REVISION=${{ needs.changes.outputs.sha }}
            DOTNET_PROCESSOR_COUNT=8
            DOTNET_GCHeapCount=8
          cache-from: &cache-from type=gha,scope=ci-base
          cache-to: type=gha,mode=min,scope=ci-base
      # Slow restores packages directly over main's cached base layers and builds its test graph independently of required Fast.
      - continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=terrascale/sdk/dotnet
          target: test-slow-${{ env.AREA }}
          secret-files: ${{ env.AREA == 'terrabase' && format('tigris-ci={0}/tigris-ci.env', runner.temp) || '' }}
          build-args: *build-args
          # A rerun of the same commit runs the suites again instead of reusing the stored result.
          no-cache-filters: slow-${{ env.AREA }}-run
          outputs: type=local,dest=slow
          cache-from: *cache-from
      - name: Remove the CI credential file
        if: ${{ always() && env.AREA == 'terrabase' }}
        run: rm -f "$RUNNER_TEMP/tigris-ci.env"
      - name: Record the actual scheduled suite inputs
        id: slow-record
        if: ${{ always() && github.event_name == 'schedule' && hashFiles('slow/exit') != '' }}
        working-directory: terrascale
        run: |
          mkdir -p slow
          python3 scripts/ci/slow-state.py record "$AREA"
      - name: Retain last actual scheduled suite inputs
        if: ${{ always() && github.event_name == 'schedule' && hashFiles('terrascale/slow/fingerprint') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: slow-state-${{ env.AREA }}-${{ steps.slow-record.outputs.fingerprint }}
          path: terrascale/slow/fingerprint
          retention-days: 90
      - name: Report the Slow result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.changes.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ ! -f slow/exit || ! -f slow/log ]]; then
            mkdir -p slow
            echo "Slow ${{ env.AREA }} suites did not finish building: $RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY" > slow/log
            echo 1 > slow/exit
          fi
          code=$(<slow/exit)
          mapfile -t failed < <(sed -nE 's/^failed (.+) \([^)]*\)$/\1/p' slow/log | sort -u)
          {
            echo "## Slow suites: exit $code, ${#failed[@]} failed"
            echo '```'
            grep -E '^Test run summary|^  (total|failed|succeeded|skipped|duration):' slow/log || true
            echo '```'
            [[ ${#failed[@]} -eq 0 ]] || printf -- '- %s\n' "${failed[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          (( code != 0 )) || exit 0
          # Issues track main only; a pull request or a dispatched branch reports in the summary.
          [[ $GITHUB_REF == refs/heads/main ]] || exit "$code"
          [[ ${#failed[@]} -gt 0 ]] || failed=("Slow suites failed without a failed test (build or runner error)")
          gh label create slow-failure -R "$GITHUB_REPOSITORY" --color B60205 --description "A Slow test failed on main" --force
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label slow-failure --state open --limit 500 --json number,title)
          for test in "${failed[@]}"; do
            title="Slow: $test"
            # The exception and stack, without the captured server output; credentials redacted.
            excerpt=$(awk -v t="failed $test " 'index($0, t) == 1 { on = 1; next } on && (/^[^ ]/ || /^  Standard output/ || ++n > 80) { exit } on' slow/log \
              | sed -E 's/(Bearer|Basic) [^ "]+/\1 [redacted]/g; s/((api[_-]?key|token|secret|password)["=: ]+)[^ ",]+/\1[redacted]/Ig')
            # The suite that reported it: its area's make target runs only that suite.
            target=$(awk -v t="failed $test " 'index($0, t) == 1 { on = 1 } on && /^Test run summary/ { print; exit }' slow/log)
            case $target in *TerraBase.Slow*) target="terrabase-test-slow" ;; *Authentication.Slow*) target="auth-test-slow" ;; *) target="test-slow" ;; esac
            body=$(printf '%s\n' \
              "Failed on \`${SOURCE_SHA:-$GITHUB_SHA}\` in the Slow job: $RUN_URL" "" \
              "Environment: \`${{ github.job }} (${{ env.AREA }})\` job on GitHub-hosted runner, Dockerfile stage \`test-slow-${{ env.AREA }}\`, Release build." \
              "Reproduce: \`nice -n 19 make $target TEST_ARGS=\"--treenode-filter '/*/*/*/${test%%(*}'\"\`" \
              "Expected: the test passes. Actual:" "" '```' "${excerpt:-see the run log}" '```')
            number=$(jq -r --arg t "$title" "first(.[] | select(.title == \$t) | .number) // empty" <<< "$open")
            if [[ -n $number ]]; then
              gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label slow-failure --body "$body"
            fi
          done
          exit "$code"

  slow-terrabase:
    needs: [changes, native]
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON(needs.changes.outputs.main), 'terrabase')
    concurrency:
      group: ${{ github.workflow }}-slow-${{ github.event.pull_request.number || github.ref_name }}-terrabase
      cancel-in-progress: true
    env:
      AREA: terrabase
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps: *slow-steps

  slow-auth-main:
    needs: [changes, native]
    concurrency:
      group: scheduled-slow-auth
      cancel-in-progress: false
    if: >-
      !cancelled() && github.event_name == 'schedule'
      && github.ref == 'refs/heads/main' && contains(fromJSON(needs.changes.outputs.slow), 'auth')
    env:
      AREA: auth
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps: *slow-steps

  slow-terrabase-main:
    needs: [changes, native]
    concurrency:
      group: scheduled-slow-terrabase
      cancel-in-progress: false
    if: >-
      !cancelled() && github.event_name == 'schedule'
      && github.ref == 'refs/heads/main' && contains(fromJSON(needs.changes.outputs.slow), 'terrabase')
    env:
      AREA: terrabase
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps: *slow-steps

  test:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.native_artifacts && 'native-maintenance-unqualified' || 'test' }}
    needs: [changes, native, libs, auth, auth-package, terrabase-build, terrabase]
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.native_artifacts) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fork PRs cannot qualify without Fast
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Fast qualification currently runs for branches in this repository. Qualify these changes on a repository branch.' >&2
          exit 1
      - name: Native and every affected Fast area passed
        env:
          FAST_AREAS: ${{ needs.changes.outputs.fast }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if grep -qE 'failure|cancelled' <<< '${{ join(needs.*.result, ' ') }}'; then exit 1; fi
          for area in $(jq -r '.[]' <<< "$FAST_AREAS"); do
            [[ $(jq -r --arg area "$area" '.[$area].result' <<< "$RESULTS") == success ]] || exit 1
            [[ $area != auth || $(jq -r '.["auth-package"].result' <<< "$RESULTS") == success ]] || exit 1
          done
