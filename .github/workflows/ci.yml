name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

  schedule:
    # Compatibility for the other supported runtime stays weekly.
    - cron: '31 5 * * 3'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Superseded PR runs cancel; main runs finish and save caches.
concurrency:
  group: ${{ github.workflow }}-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Draft PRs run nothing; marking the PR ready runs it.
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      # Preserve the proof output contract without reusing a previous run's tests.
      - name: Require fresh test proof for this run
        id: proof
        run: echo 'proven=false' >> "$GITHUB_OUTPUT"
      - name: Require the owner-approved 0.0.x version policy
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [[ ! "$version" =~ ^0\.0\.[0-9]+$ ]]; then
            echo "TS-528: 0.0.x is required until the owner lifts it; got $version" >&2
            exit 1
          fi
      - name: Set up the reviewed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '22.23.2' || '24.21.0' }}
      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
      - name: Provision the reviewed npm CLI
        run: node scripts/provision-reviewed-npm.js
      - name: Audit every committed npm graph
        run: npm run check:vulnerabilities
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        if: steps.proof.outputs.proven != 'true'
        run: npm run typecheck
      - name: Generate SDK type declarations
        if: steps.proof.outputs.proven != 'true'
        run: npm run build
      - name: Check C# route drift
        if: steps.proof.outputs.proven != 'true'
        run: npm run check:v1-route-manifest
      - name: Run SDK tests
        if: steps.proof.outputs.proven != 'true'
        run: npm test
      - name: SDK validation passed
        run: echo 'All checks passed for this Git tree.'
      - name: Save main npm cache
        if: github.event_name == 'push' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
