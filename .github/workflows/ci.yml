name: ci

on:
  pull_request:
  merge_group:
  schedule:
    # Recheck every supported interpreter and refresh main caches weekly.
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            requirements-ci.txt
            requirements-audit.txt
      - run: 'uv pip sync --require-hashes --only-binary :all: requirements-ci.txt'
      - name: validate active build requirements on every supported interpreter
        run: python scripts/check-build-requirements.py
      - name: check resolved graph
        if: matrix.python == '3.12'
        run: bash scripts/check-ci-lock.sh
      - uses: actions/cache@v6
        if: matrix.python == '3.12'
        with:
          path: ~/.cache/pip-audit
          key: pip-audit-${{ runner.os }}-${{ hashFiles('requirements-ci.txt', 'requirements-audit.txt') }}
          restore-keys: pip-audit-${{ runner.os }}-
      - name: install isolated audit toolchain
        if: matrix.python == '3.12'
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/ts-audit"
          uv pip sync --python "$RUNNER_TEMP/ts-audit"/bin/python --require-hashes --only-binary :all: requirements-audit.txt
      - name: audit runtime, dev, build and audit graphs (all severities)
        if: matrix.python == '3.12'
        run: |
          "$RUNNER_TEMP/ts-audit"/bin/pip-audit --strict --disable-pip --require-hashes -r requirements-ci.txt -r requirements-audit.txt --cache-dir ~/.cache/pip-audit
      - run: uv pip install --no-deps --no-build-isolation -e '.[dev]' && uv pip check
      # Both tools target Python 3.10 in pyproject.toml; their result is interpreter-independent.
      - run: ruff check src tests
        if: matrix.python == '3.12'
      - run: mypy
        if: matrix.python == '3.12'
      - run: pytest -q
      - name: build
        if: matrix.python == '3.12'
        run: uv build --no-build-isolation && twine check dist/*
