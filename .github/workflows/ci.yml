name: CI

# One required check: "test".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing deploys from here, so superseded runs are cancelled everywhere, main included.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Repo variable CI_RUNNER=alpha selects the self-hosted alpha runners (persistent local
# caches, so GitHub cache steps are skipped there); unset = GitHub-hosted.
jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: ${{ !vars.CI_RUNNER }}
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
