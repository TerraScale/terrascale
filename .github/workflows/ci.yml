name: CI

# One required check: "test".

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # Markdown and docs never change what CI checks.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A newer PR push cancels the older run. Main runs finish (so main's caches get saved); a newer main push replaces only
# a pending one. merge_group runs keep their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Draft PRs run nothing; marking the PR ready runs it.
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          # Module + build cache keyed on go.sum; a PR only saves when it changes go.sum.
          cache: true
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # -count=1: the build cache stays warm, but tests always run on the current head (no cached passes).
      - run: go test -race -count=1 ./...
