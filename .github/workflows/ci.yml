# Required formatting, build, security, contract/Fast and actual-application packaging (image build and
# readiness smoke test). images-ghcr.yml publishes main's image for ts-orch; Slow runs independently in slow.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes a pull request's run; each main commit runs in its own group and keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Before setup-dotnet: its NuGet cache saves and restores the folder NUGET_PACKAGES names.
      - run: echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0 # .mise.toml
          cache: npm
          cache-dependency-path: src/TerraScale.Dashboard/web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: src/TerraScale.Dashboard/web
      - run: make check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fast-results
          path: test-results/tunit/fast.trx
          if-no-files-found: warn

  image:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ts-dashboard:${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          # Pull requests read main's layer cache; only main writes it (PR-scoped caches are invisible to other PRs).
          cache-from: type=gha,scope=dashboard-image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=dashboard-image' || '' }}
      # DEMO=true is ready without secrets (README).
      - name: Smoke-test the image's readiness and revision
        run: |
          docker run -d --name app -e DEMO=true -p 127.0.0.1:8080:8080 "$IMAGE"
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8080/health/ready -o ready.json && break; sleep 2; done
          jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and (.version | endswith("+" + $sha))' ready.json \
            || { docker logs app 2>&1 | tail -n 50; exit 1; }
