name: CI

# One required check: "test". It passes when every area job that ran passed. The area jobs run in parallel, each
# building one Dockerfile stage on a GitHub-hosted runner (format, Release build with analyzers as errors, the area's checks and Fast
# suite, plus the local three-node replication matrix and the local-only e2e category for TerraBase): test-libs, test-auth, test-terrabase. On pull requests an area runs only when its files or the shared files
# changed (`changes`); libs changes run every area. Pushes to main run every area. `make docker-test` runs all three.
# Next to it, without waiting for it:
# - preview (pull requests): TerraBase + ts-auth on one machine at https://ts-pr-<n>.fly.dev (scripts/fly/preview.sh);
#   previews.yml deletes it when the PR closes or after 24 hours.
# - deploy (main): the Dockerfile's chiseled images to Fly, TerraBase then ts-auth, each gru -> sjc -> fra with a live
#   check after each region (scripts/fly/deploy.sh), only for the newest main; both app images build in parallel.
#   Deploy requires the Fast `test` gate in the same workflow run and checks current main before rollout.
# After it:
# - slow (main, workflow_dispatch, or a pull request labelled `full-ci`): the slow suites; never blocks. A failure
#   writes the job summary; on main it also opens (or comments on) one `slow-failure` issue per failed test.
# - e2e (main, after deploy): tests/TerraBase.E2E except its local-only category against the Fly app, gru, sjc and fra pinned with fly-prefer-region;
#   failures fail CI and retain evidence after the completed rollout.

on:
  pull_request:
    # `labeled` lets the `full-ci` label start the slow suites; any label re-runs CI and cancels the running check.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Cancel superseded PR tests; main runs finish without interrupting a regional rollout.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # ts-dotnet revision ts-auth builds against (TerraScale/ts-dotnet is private; read-only deploy key).
  TS_DOTNET_REV: 78e311fe1dcb6dd603190800ed540d08e06de5fd

jobs:
  # Runs on every event: a skipped job would skip everything downstream of "test" (deploy, slow).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      libs: ${{ steps.filter.outputs.libs }}
      auth: ${{ steps.filter.outputs.auth }}
      terrabase: ${{ steps.filter.outputs.terrabase }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - Dockerfile
              - .dockerignore
              - Makefile
              - Directory.*
              - global.json
              - NuGet.config
              - .editorconfig
              - BannedSymbols.txt
              - TerraScale.slnx
              - src/TerraScale.Endpoints*/**
              - src/TerraScale.Logging/**
              - tests/TerraScale.Endpoints.Tests/**
              - tests/TerraScale.Logging.Tests/**
              # TerraBase's vendored driver also backs auth integration tests and vendor audits.
              - src/vendor/**
              - tests/Turso.Data.Sqlite.Tests/**
              - scripts/vendor/**
              - scripts/ci/**
            libs:
              - *shared
              - libs.slnf
              - src/TerraScale.CLI/**
              - benchmark/dotnet/**
              # The credential entry point and the scripts it runs (make handoff-test).
              - scripts/handoff/**
              - scripts/e2e/**
              - benchmark/scripts/repl-fly-tenant.sh
            auth:
              - *shared
              - auth.slnf
              - src/TerraScale.Authentication*/**
              - tests/TerraScale.Authentication*/**
              - docs/auth/**
              - scripts/auth/**
              # ts-auth's tests run against the TerraBase built from the same commit and check the SDK's routes on it.
              - src/TerraBase/**
            terrabase:
              - *shared
              - terrabase.slnf
              - src/TerraBase*/**
              - tests/TerraBase*/**
              - scripts/terrabase/**

  libs:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || needs.changes.outputs.libs == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: terrascale
          persist-credentials: false
      - &checkout-ts-dotnet
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: TerraScale/ts-dotnet
          ref: ${{ env.TS_DOTNET_REV }}
          ssh-key: ${{ secrets.TS_DOTNET_DEPLOY_KEY }}
          path: ts-dotnet
          persist-credentials: false
      - name: Check out the path-filter matcher for regression fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dorny/paths-filter
          ref: 0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
          path: path-filter-action
          persist-credentials: false
      - name: Verify CI path filters
        run: python3 terrascale/scripts/ci/path-filter-test.py terrascale/.github/workflows/ci.yml path-filter-action/dist/index.js
      - &setup-builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
      # Only main writes shared area caches; PR/queue refs restore without evicting them with private copies.
      - &build-stage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=ts-dotnet
          target: build-${{ github.job }}
          build-args: &build-args |
            TERRABASE_REVISION=${{ github.sha }}
            TS_AUTH_REVISION=${{ github.sha }}
            DOTNET_PROCESSOR_COUNT=8
            DOTNET_GCHeapCount=8
          push: false
          cache-from: ${{ format('type=gha,scope={0}', github.job) }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', github.job) || '' }}
      - &build-area
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=ts-dotnet
          target: test-${{ github.job }}
          # TerraBase's tests check that /healthz reports the exact commit (unused by the other areas' stages).
          build-args: *build-args
          # The build stage is reused for identical inputs; the tests always run on the current head.
          no-cache-filters: test-${{ github.job }}
          push: false
          # Per-job layer cache: the base stage (apt, Playwright Chromium, ts-dotnet) is rebuilt only when it changes.
          cache-from: ${{ format('type=gha,scope={0}', github.job) }}

  auth:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || needs.changes.outputs.auth == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - *setup-builder
      - *build-stage
      - *build-area

  terrabase:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || needs.changes.outputs.terrabase == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - *setup-builder
      - *build-stage
      - *build-area

  test:
    needs: [changes, libs, auth, terrabase]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fork PRs cannot qualify without Fast
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Fast requires the private SDK checkout; fork PRs cannot receive its deploy key. Qualify the changes on a branch in this repository.' >&2
          exit 1
      - name: Every area that ran passed
        run: '! grep -qE "failure|cancelled" <<< "${{ join(needs.*.result, '' '') }}"'
      - *checkout
      - name: Fly deploy, volume reset, storage train, e2e summary and e2e credential self-checks
        run: |
          python3 terrascale/scripts/ci/slow-report-test.py
          python3 terrascale/scripts/ci/e2e-status-test.py
          python3 terrascale/scripts/ci/latest-main-test.py
          python3 terrascale/scripts/ci/cache-policy-test.py
          python3 terrascale/scripts/ci/deploy-status-test.py
          bash terrascale/scripts/fly/deploy-test.sh
          bash terrascale/scripts/fly/preview-test.sh
          bash terrascale/scripts/fly/volume-reset-test.sh
          bash terrascale/scripts/terrabase/storage-format-check-test.sh
          bash terrascale/scripts/terrabase/e2e-summary-test.sh
          bash terrascale/scripts/e2e/ci-oidc-credential-test.sh
      # Reads the labels live: after labelling, re-run this job (docs/terrabase/ci.md, storage train).
      - name: Storage train
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: terrascale/scripts/terrabase/storage-format-check.sh "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}"

  slow:
    needs: [changes, auth, terrabase]
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: auth
          - area: terrabase
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - *setup-builder
      - name: Supply bucket-scoped CI storage credentials
        if: matrix.area == 'terrabase'
        env:
          TIGRIS_CI_CREDENTIALS: ${{ secrets.TIGRIS_CI_CREDENTIALS }}
        run: |
          [[ -n $TIGRIS_CI_CREDENTIALS ]] || { echo 'TIGRIS_CI_CREDENTIALS is required' >&2; exit 1; }
          umask 077
          printf '%s\n' "$TIGRIS_CI_CREDENTIALS" > "$RUNNER_TEMP/tigris-ci.env"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=ts-dotnet
          target: test-slow-${{ matrix.area }}
          secret-files: ${{ matrix.area == 'terrabase' && format('tigris-ci={0}/tigris-ci.env', runner.temp) || '' }}
          build-args: *build-args
          # A rerun of the same commit runs the suites again instead of reusing the stored result.
          no-cache-filters: slow-${{ matrix.area }}-run
          outputs: type=local,dest=slow
          cache-from: ${{ format('type=gha,scope={0}', matrix.area) }}
      - name: Remove the CI credential file
        if: ${{ always() && matrix.area == 'terrabase' }}
        run: rm -f "$RUNNER_TEMP/tigris-ci.env"
      - name: Report the Slow result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ ! -f slow/exit || ! -f slow/log ]]; then
            mkdir -p slow
            echo "Slow ${{ matrix.area }} suites did not finish building: $RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY" > slow/log
            echo 1 > slow/exit
          fi
          code=$(<slow/exit)
          mapfile -t failed < <(sed -nE 's/^failed (.+) \([^)]*\)$/\1/p' slow/log | sort -u)
          {
            echo "## Slow suites: exit $code, ${#failed[@]} failed"
            echo '```'
            grep -E '^Test run summary|^  (total|failed|succeeded|skipped|duration):' slow/log || true
            echo '```'
            [[ ${#failed[@]} -eq 0 ]] || printf -- '- %s\n' "${failed[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          (( code != 0 )) || exit 0
          # Issues track main only; a `full-ci` pull request or a dispatched branch reports in the summary.
          [[ $GITHUB_REF == refs/heads/main ]] || exit "$code"
          [[ ${#failed[@]} -gt 0 ]] || failed=("Slow suites failed without a failed test (build or runner error)")
          gh label create slow-failure -R "$GITHUB_REPOSITORY" --color B60205 --description "A Slow test failed on main" --force
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label slow-failure --state open --limit 500 --json number,title)
          for test in "${failed[@]}"; do
            title="Slow: $test"
            # The exception and stack, without the captured server output; credentials redacted.
            excerpt=$(awk -v t="failed $test " 'index($0, t) == 1 { on = 1; next } on && (/^[^ ]/ || /^  Standard output/ || ++n > 80) { exit } on' slow/log \
              | sed -E 's/(Bearer|Basic) [^ "]+/\1 [redacted]/g; s/((api[_-]?key|token|secret|password)["=: ]+)[^ ",]+/\1[redacted]/Ig')
            # The suite that reported it: its area's make target runs only that suite.
            target=$(awk -v t="failed $test " 'index($0, t) == 1 { on = 1 } on && /^Test run summary/ { print; exit }' slow/log)
            case $target in *TerraBase.Slow*) target="terrabase-test-slow" ;; *Authentication.Slow*) target="auth-test-slow" ;; *) target="test-slow" ;; esac
            body=$(printf '%s\n' \
              "Failed on \`$GITHUB_SHA\` in the Slow job: $RUN_URL" "" \
              "Environment: \`slow (${{ matrix.area }})\` job on GitHub-hosted runner, Dockerfile stage \`test-slow-${{ matrix.area }}\`, Release build." \
              "Reproduce: \`nice -n 19 make $target TEST_ARGS=\"--treenode-filter '/*/*/*/${test%%(*}'\"\`" \
              "Expected: the test passes. Actual:" "" '```' "${excerpt:-see the run log}" '```')
            number=$(jq -r --arg t "$title" "first(.[] | select(.title == \$t) | .number) // empty" <<< "$open")
            if [[ -n $number ]]; then
              gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label slow-failure --body "$body"
            fi
          done
          exit "$code"

  # Build each app once with its own scoped token; every region reuses that SHA-tagged image.
  images:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ts-terrabase
            target: terrabase
            area: terrabase
            token: FLY_TOKEN_TS_TERRABASE
          - app: ts-auth
            target: ts-auth
            area: auth
            token: FLY_TOKEN_TS_AUTH
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - *checkout
      - name: Skip a superseded main before building
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: terrascale/scripts/fly/current-main.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - *checkout-ts-dotnet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.current.outputs.current == 'true'
        with:
          driver: docker-container
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.current.outputs.current == 'true'
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets[matrix.token] }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.current.outputs.current == 'true'
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=ts-dotnet
          target: ${{ matrix.target }}
          tags: registry.fly.io/${{ matrix.app }}:${{ github.sha }}
          cache-from: ${{ format('type=gha,scope={0}', matrix.area) }}
          build-args: *build-args
          push: true

  preview:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_PREVIEWS }}
      APP: ts-pr-${{ github.event.pull_request.number }}
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - &setup-flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - name: Create the preview app
        run: terrascale/scripts/fly/preview.sh app ${{ github.event.pull_request.number }}
      - *setup-builder
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_TOKEN_PREVIEWS }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=ts-dotnet
          target: terrabase
          tags: registry.fly.io/${{ env.APP }}:terrabase-${{ github.sha }}
          cache-from: type=gha,scope=terrabase
          build-args: *build-args
          push: true
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: terrascale
          file: terrascale/Dockerfile
          build-contexts: ts-dotnet=ts-dotnet
          target: ts-auth
          tags: registry.fly.io/${{ env.APP }}:ts-auth-${{ github.sha }}
          cache-from: type=gha,scope=auth
          build-args: *build-args
          push: true
      - name: Start or update the preview machine
        run: >-
          terrascale/scripts/fly/preview.sh machine ${{ github.event.pull_request.number }}
          "registry.fly.io/$APP:terrabase-${{ github.sha }}" "registry.fly.io/$APP:ts-auth-${{ github.sha }}"
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --edit-last --create-if-none
          --body "Preview: https://$APP.fly.dev (TerraBase + ts-auth at ${{ github.sha }}; stops when idle, deleted on close or after 24 h)"

  # The shared deploy group prevents overlapping rollouts; ts-auth rolls out after TerraBase.
  deploy:
    needs: [images, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      deployed: ${{ steps.deploy-auth.outcome == 'success' }}
    steps:
      - *checkout
      - name: Skip a superseded main before building
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: terrascale/scripts/fly/current-main.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - *setup-flyctl
      # TerraBase's storage-format inspection pulls the published image with its scoped token.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.current.outputs.current == 'true'
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_TOKEN_TS_TERRABASE }}
      # Recheck freshness after this run's Fast gate and image builds finish.
      - name: Require current main before rollout
        id: qualified
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          terrascale/scripts/fly/current-main.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - name: Deploy TerraBase (gru, sjc, fra)
        if: steps.qualified.outputs.current == 'true'
        working-directory: terrascale
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_TS_TERRABASE }}
        run: scripts/fly/deploy.sh ts-terrabase src/TerraBase/fly.toml registry.fly.io/ts-terrabase:${{ github.sha }}
      - name: Deploy ts-auth (gru, sjc, fra)
        id: deploy-auth
        if: steps.qualified.outputs.current == 'true'
        working-directory: terrascale
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_TS_AUTH }}
        run: scripts/fly/deploy.sh ts-auth src/TerraScale.Authentication/fly.toml registry.fly.io/ts-auth:${{ github.sha }}

  deploy-status:
    needs: [test, deploy, e2e]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - *checkout
      - name: Require deployment and live E2E for current green main
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 terrascale/scripts/ci/deploy-status.py

  e2e:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: the GitHub OIDC token each Fly step exchanges at ts-auth for a 15-minute token of the bound e2e project
    # (scripts/e2e/ci-oidc-credential.sh, docs/auth/github-actions-oidc.md); no e2e credential is stored in GitHub.
    permissions:
      contents: read
      id-token: write
    env:
      TERRABASE_E2E_FLY_URL: https://ts-terrabase.fly.dev
    steps:
      - *checkout
      - *checkout-ts-dotnet
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: terrascale/global.json
          cache: true
          cache-dependency-path: |
            terrascale/**/packages.lock.json
            terrascale/src/vendor/Turso.Data.Sqlite/locks/*.packages.lock.json
            ts-dotnet/**/packages.lock.json
      - name: Six-direction replication matrix against Fly (gru, sjc, fra)
        shell: bash
        working-directory: terrascale
        # Build first, then mint: the 15-minute token's clock starts after the build; -o keeps make from building again.
        run: |
          make terrabase-build
          source scripts/e2e/ci-oidc-credential.sh
          make -o terrabase-build terrabase-e2e E2E_LABEL=fly-replication-matrix E2E_RESULTS="$PWD/replication-matrix-results.jsonl" \
            TEST_ARGS='-- --treenode-filter "/*/*/*/*[Category=replication-matrix-live]" --minimum-expected-tests 13 --output detailed --no-ansi' \
            2>&1 | tee replication-matrix.log
          jq -se 'length == 13 and all(.[]; .category == "pass" and .nodes == "Fly machines")' replication-matrix-results.jsonl
      - name: Replication e2e against Fly
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: terrascale
        # The local-only category (whole-database backups, every node stopped, a cursor's issuer stopped) runs in the
        # required test-terrabase stage on local nodes; the deploy run never stops a production machine. It writes only the
        # bound e2e project: its fixed ci-e2e (created once, later runs reuse it) and the databases each test creates and deletes.
        # 138 = the 165 test cases in tests/TerraBase.E2E (one per [Arguments] row) minus the 27 local-only ones; skipped cases
        # (fly-outage, hosts, local processes) count. A narrower filter or lost tests fail the run.
        run: |
          make terrabase-build
          source scripts/e2e/ci-oidc-credential.sh
          make -o terrabase-build terrabase-e2e E2E_LABEL=fly TEST_ARGS='-- --treenode-filter "/*/*/*/*[Category!=local-only]" --minimum-expected-tests 138 --output detailed --no-ansi' 2>&1 | tee replication-e2e.log
      - name: Preserve replication proof and per-direction lag
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replication-e2e-${{ github.sha }}
          path: |
            terrascale/replication-matrix.log
            terrascale/replication-matrix-results.jsonl
            terrascale/replication-e2e.log
            terrascale/tests/TerraBase.E2E/bin/e2e-results.jsonl
