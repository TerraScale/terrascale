name: CI

# One required check: "test".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer run for the same PR or branch, main included, cancels the older one; merge_group runs keep their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          # Module + build cache keyed on go.sum; a PR only saves when it changes go.sum.
          cache: true
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # -count=1: the build cache stays warm, but tests always run on the current head (no cached passes).
      - run: go test -race -count=1 ./...
