name: CI

on:
  pull_request:
    # No `labeled`: a label must not re-run and cancel the running check.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reconcile_auth:
        description: Reconcile ts-auth with the newest journey-qualified main commit
        type: boolean
        default: false
      publication:
        description: 'release (default), build-only (TerraBase images, no release) or release-only (needs terrabase_arm64)'
        type: choice
        options: [release, build-only, release-only]
        default: release
      terrabase_arm64:
        description: 'release-only: the linux/arm64 child digest (sha256:...) a build-only run published for this main revision'
        type: string
        default: ''
      pr_gate:
        description: Run the full PR gate on this ref without publication
        type: boolean
        default: false

# A new push cancels the older run of the same PR. Every other run has its own group: each main push publishes the
# images of the areas it changed, so none may be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_gate && format('pr-gate-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr_gate == true }}

permissions:
  contents: read

env:
  TERRABASE_REVISION: ${{ github.sha }}
  TS_AUTH_REVISION: ${{ github.sha }}
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  ASPNETCORE_HTTP_PORTS: ''

jobs:
  changes:
    if: ${{ inputs.pr_gate || !inputs.reconcile_auth }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.areas.outputs.dotnet }}
      main: ${{ steps.areas.outputs.main }}
      sha: ${{ github.sha }}
      sdks: ${{ steps.areas.outputs.sdks }}
      docs: ${{ inputs.pr_gate && 'true' || steps.filter.outputs.docs }}
      landing: ${{ inputs.pr_gate && 'true' || steps.filter.outputs.landing }}
      status: ${{ inputs.pr_gate && 'true' || steps.filter.outputs.status }}
      dashboard: ${{ inputs.pr_gate && 'true' || steps.filter.outputs.dashboard }}
      aspire: ${{ inputs.pr_gate && 'true' || steps.filter.outputs.aspire }}
      journey: ${{ steps.areas.outputs.journey }}
      shards: ${{ steps.areas.outputs.shards }}
      services: ${{ steps.areas.outputs.services }}
      keyring: ${{ inputs.pr_gate && 'true' || steps.filter.outputs.keyring }}
      engine: ${{ inputs.pr_gate && 'true' || steps.filter.outputs.engine }}
      frontier: ${{ inputs.pr_gate && 'true' || steps.filter.outputs.frontier }}
    steps:
      # Pull requests list files through the API; pushes diff the checkout against the push's `before` commit.
      - if: github.event_name == 'push'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          ref: ${{ github.event_name == 'push' && github.sha || '' }}
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - Makefile
              - Directory.*
              - global.json
              - NuGet.config
              - .editorconfig
              - BannedSymbols.txt
              - TerraScale.slnx
              - src/TerraScale.Endpoints*/**/!(AGENTS.md)
              - src/TerraScale.Logging/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
            dotnet-sdk: &dotnet-sdk
              - sdk/dotnet/Directory.*
              - sdk/dotnet/NuGet.config
              - sdk/dotnet/BannedSymbols.txt
              - sdk/dotnet/contracts/auth/error-codes.json
              - sdk/dotnet/src/**/!(AGENTS.md)
            libs:
              - *shared
              - benchmark/dotnet/TerraScale.Endpoints.Benchmarks/**/!(AGENTS.md)
              - benchmark/dotnet/TerraScale.Logging.Benchmarks/**/!(AGENTS.md)
            auth:
              - *shared
              - *dotnet-sdk
              - .github/docker/ts-auth.Dockerfile
              - .github/scripts/ci/image-payloads.sh
              - .github/scripts/ci/deploy-v2.sh
              - src/TerraScale.Authentication*/**/!(AGENTS.md)
              - src/TerraScale.Authentication/platform-api.openapi.yaml
              - .github/scripts/auth/export-openapi.sh
              - sdk/dotnet/scripts/{check-nuget-vulnerabilities{,.lib}.cs,packages.lock.json}
            auth-server:
              - src/TerraBase*/**/!(AGENTS.md)
              - src/TerraScale.QuicRpc/**/!(AGENTS.md)
              - src/TerraScale.Platform/**/!(AGENTS.md)
              - native/{build-native.sh,native-pin.env}
            auth-client:
              - *dotnet-sdk
              - src/TerraScale.Authentication*/**/!(AGENTS.md)
            terrabase: &terrabase
              - *shared
              - .github/actions/**
              - .github/docker/terrabase.Dockerfile
              - .github/scripts/ci/image-payloads.sh
              - .github/scripts/ci/deploy-v2.sh
              - src/TerraBase*/**/!(AGENTS.md)
              - src/TerraScale.QuicRpc/**/!(AGENTS.md)
              - native/{build-native.sh,native-pin.env}
              - sites/landing/static/pricing.json
            platform:
              - *shared
              - .github/actions/**
              - .github/docker/ts-platform.Dockerfile
              - .github/scripts/ci/image-payloads.sh
              - .github/scripts/ci/deploy-v2.sh
              - src/TerraScale.Platform/**/!(AGENTS.md)
              - src/TerraScale.QuicRpc/**/!(AGENTS.md)
              - native/{build-native.sh,native-pin.env}
            aspire:
              - *shared
              - src/TerraScale.Aspire/**/!(AGENTS.md)
              - .github/scripts/check-aspire-host.py
              - .github/scripts/ci/release-only.sh
            journey-shared: &journey-shared
              - .github/workflows/{ci,journey}.yml
              - .github/actions/**
              - e2e/env/**
              - e2e/support/**
              - e2e/*.{json,ts}
              - Makefile
              - Directory.*
              - global.json
              - NuGet.config
              - .editorconfig
              - BannedSymbols.txt
              - TerraScale.slnx
              - native/{build-native.sh,native-pin.env}
              - src/TerraScale.Endpoints*/**/!(AGENTS.md)
              - src/TerraScale.Logging/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
            journey-server: &journey-server
              - *journey-shared
              - src/TerraBase*/**/!(AGENTS.md)
              - src/TerraScale.QuicRpc/**/!(AGENTS.md)
              - src/TerraScale.Platform/**/!(AGENTS.md)
            journey-browser: &journey-browser
              - *journey-server
              - src/TerraScale.Authentication*/**/!(AGENTS.md)
              - src/TerraScale.Dashboard*/**/!(AGENTS.md)
              - sdk/dotnet/**/!(AGENTS.md)
              - sites/landing/static/pricing.json
              - e2e/journey/{setup,close}.spec.ts
              - e2e/pages/inventory.ts
            journey-desktop:
              - *journey-browser
              - e2e/pages/**
              - e2e/journey/{paid*,invitation}.spec.ts
              - e2e/usage/**
              - e2e/billing/**
              - e2e/sdk/**
              - sdk/{go,js,python,rust}/**/!(AGENTS.md)
            journey-phone:
              - *journey-browser
              - e2e/pages/**
              - e2e/hosted/**
              - e2e/interactions/**
              - e2e/clock/**
              - e2e/storage/**
              - sites/status/**/!(AGENTS.md)
              - e2e/social/**
              - e2e/billing/**
              - e2e/journey/{finish,invitation}.spec.ts
              - e2e/sdk/**
              - sdk/{go,js,python,rust}/**/!(AGENTS.md)
            journey-session:
              - *journey-browser
              - e2e/placement/{support,fleet}.ts
              - e2e/placement/{session-limits,close}.spec.ts
            journey-write:
              - *journey-browser
              - e2e/placement/{support,fleet}.ts
              - e2e/placement/{write-guarantees,region-restore,close}.spec.ts
              - e2e/fault/support.ts
            journey-faults:
              - *journey-browser
              - e2e/placement/{support,fleet}.ts
              - e2e/placement/{close,regions}.spec.ts
              - e2e/placement/forwarding.ts
              - e2e/clock/replay.c
              - e2e/fault/**
            engine:
              - *journey-shared
              - src/TerraBase/Engine/**/!(AGENTS.md)
              - src/TerraBase.Storage/**/!(AGENTS.md)
              - src/TerraBase.Cluster/**/!(AGENTS.md)
              - src/TerraBase.Continuity/**/!(AGENTS.md)
              - src/TerraBase/Features/Backup/**/!(AGENTS.md)
              - src/TerraBase/Hosting/ApplicationRunCompletion.cs
              - src/TerraBase/Hosting/Listeners.cs
              - src/TerraBase/Features/Health/ReadyzEndpoint.cs
              - src/TerraBase/Configuration/TerraBaseOptions.cs
              - src/TerraBase/Features/Qos/QosAdmission.cs
              - src/TerraBase/Program.cs
              - src/TerraBase/TerraBase.csproj
              - src/TerraBase/Features/Sql/SqlSocket.cs
              - src/TerraBase/Features/Management/CreateDatabaseEndpoint.cs
            frontier:
              - *journey-server
              - e2e/replication/**
            keyring:
              - *journey-server
              - e2e/keyring/**
            sdk-dotnet:
              - sdk/dotnet/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-go:
              - sdk/go/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-js:
              - sdk/js/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-python:
              - sdk/python/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
              - Makefile
              - .github/workflows/ci.yml
            sdk-rust:
              - sdk/rust/**/!(AGENTS.md)
              - src/TerraScale.Contracts/**/!(AGENTS.md)
              - Makefile
              - .github/workflows/ci.yml
            docs:
              - sites/docs/**/!(AGENTS.md)
              - sites/landing/static/{pricing,regions}.json
              - Makefile
              - .github/workflows/ci.yml
            landing:
              - sites/landing/**/!(AGENTS.md)
              - .github/workflows/ci.yml
            status:
              - sites/status/**/!(AGENTS.md)
              - .github/workflows/ci.yml
            dashboard:
              - src/TerraScale.Dashboard*/**/!(AGENTS.md)
              - .github/docker/dashboard.Dockerfile
              - src/TerraScale.Contracts/**/!(AGENTS.md)
              - src/TerraScale.Endpoints/**/!(AGENTS.md)
              - src/TerraScale.Endpoints.Generators/**/!(AGENTS.md)
              - sites/landing/static/pricing.json
              - .github/scripts/dashboard/{check-simple-ui.py,check-stripe-dependency.py,verify-sdk.py,format.sh}
              - .github/scripts/ci/release-only.sh
              - *dotnet-sdk
              - Directory.*
              - .editorconfig
              - BannedSymbols.txt
              - global.json
              - NuGet.config
              - Makefile
              - .github/workflows/ci.yml
      - id: areas
        env:
          ALL_LANES: ${{ github.event_name != 'pull_request' }}
          DESKTOP: ${{ steps.filter.outputs.journey-desktop }}
          PHONE: ${{ steps.filter.outputs.journey-phone }}
          SESSION: ${{ steps.filter.outputs.journey-session }}
          WRITE: ${{ steps.filter.outputs.journey-write }}
          FAULTS: ${{ steps.filter.outputs.journey-faults }}
          ENGINE: ${{ steps.filter.outputs.engine }}
          FRONTIER: ${{ steps.filter.outputs.frontier }}
          KEYRING: ${{ steps.filter.outputs.keyring }}
          CHANGES: ${{ github.event_name == 'workflow_dispatch' && (inputs.pr_gate && '["libs","auth","terrabase","platform","sdk-dotnet","sdk-go","sdk-js","sdk-python","sdk-rust"]' || inputs.publication == 'release-only' && '[]' || inputs.publication == 'build-only' && '["terrabase","platform"]' || '["libs","auth","terrabase","platform"]') || steps.filter.outputs.changes }}
        run: |
          {
            echo "main=$(jq -c '[.[] | select(. == "auth" or . == "terrabase" or . == "platform")]' <<< "$CHANGES")"
            echo "dotnet=$(jq -c '[.[] | if . == "platform" then "terrabase" else . end | select(. == "libs" or . == "auth" or . == "terrabase")] | unique' <<< "$CHANGES")"
            echo "sdks=$(jq -c '[.[] | select(startswith("sdk-"))]' <<< "$CHANGES")"
          } >> "$GITHUB_OUTPUT"
          jq -cn '
            [
              {shard: "desktop and paid", projects: "--project pages-desktop --project paid-invitation", selected: env.DESKTOP},
              {shard: "phone and flows", projects: "--project pages-mobile --project hosted --project interactions --project invitation", selected: env.PHONE},
              {shard: "session limits", projects: "placement/session-limits.spec.ts --project placement --workers 1", regions: 2, nodes: 2, selected: env.SESSION},
              {shard: "write guarantees", projects: "placement/database-functions.spec.ts placement/write-guarantees.spec.ts placement/region-restore.spec.ts --project placement --workers 1", regions: 2, nodes: 1, selected: env.WRITE},
              {shard: "multi-region faults", projects: "--project fault", regions: 2, nodes: 2, selected: env.FAULTS}
            ] | map(select(env.ALL_LANES == "true" or .selected == "true") | del(.selected)) as $shards
            | ($shards | length > 0) as $browser
            | ($browser or env.ALL_LANES == "true" or env.ENGINE == "true" or env.FRONTIER == "true" or env.KEYRING == "true") as $journey
            | "shards=\($shards | tojson)\nservices=\((if $browser then ["terrabase", "ts-platform", "ts-auth", "dashboard"] elif $journey then ["terrabase"] else [] end) | tojson)\njourney=\($journey)"
          ' -r >> "$GITHUB_OUTPUT"

  checks:
    services:
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: [5000:5000]
    if: ${{ inputs.pr_gate || !inputs.reconcile_auth }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Start the legacy scan
        run: |
          (status=0
            python3 .github/scripts/legacy-scan/scan.py --repo terrascale --output legacy-hits.md > legacy-scan.log 2>&1 || status=$?
            echo "$status" > legacy-scan.exit.tmp && mv legacy-scan.exit.tmp legacy-scan.exit) > /dev/null 2>&1 &
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: workflow-linter
        if: github.event_name == 'pull_request'
        with:
          path: ~/.cache/terrascale-ci/actionlint
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-644076a59742c2d1540ebd4686eab3c308f0e562-${{ hashFiles('sdk/go/.go-version') }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: github.event_name == 'pull_request' && steps.workflow-linter.outputs.cache-hit != 'true'
        with:
          go-version-file: sdk/go/.go-version
          cache: false
      - name: Build the workflow linter
        if: github.event_name == 'pull_request' && steps.workflow-linter.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/archive/644076a59742c2d1540ebd4686eab3c308f0e562.tar.gz
          sha256sum --check --strict <<EOF
          747636d922cb81e66613ef80c5d08ff748de58d6d5250b9151853e8f680da3e1  $RUNNER_TEMP/actionlint.tar.gz
          EOF
          mkdir -p "$RUNNER_TEMP/actionlint-source" "$HOME/.cache/terrascale-ci/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-source" --strip-components=1
          cd "$RUNNER_TEMP/actionlint-source"
          CGO_ENABLED=0 GOTOOLCHAIN=local go build -mod=readonly -trimpath -ldflags="-s -w" -o "$HOME/.cache/terrascale-ci/actionlint/actionlint" ./cmd/actionlint
      - name: Lint workflows
        if: github.event_name == 'pull_request' || inputs.pr_gate
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          sha256sum --check --strict <<EOF
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz
          EOF
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 shellcheck-v0.11.0/shellcheck
          "$HOME/.cache/terrascale-ci/actionlint/actionlint" -shellcheck "$RUNNER_TEMP/shellcheck"
      - uses: oras-project/setup-oras@6c7c53b4590464855840e6196435c3af71140f64
        if: github.event_name == 'pull_request' || inputs.pr_gate
        with:
          version: 1.3.6
      - name: Prove OCI fallback publication and release ordering
        if: github.event_name == 'pull_request' || inputs.pr_gate
        run: bash .github/scripts/ci/prove-image-transport.sh
      - name: No test file outside the journey
        if: github.event_name == 'pull_request' || inputs.pr_gate
        run: |
          added=$(git diff --name-only --no-renames --diff-filter=A HEAD^1 HEAD)
          if grep -v '^e2e/' <<< "$added" | grep -E '(^|/)([Tt]ests?|[Tt]esting|__tests__|__mocks__|[^/]*-tests)/|\.(Test[^/]*|E2E)/|(^|/)(tests?|test_[^/]*|conftest)\.py$|(^|/)tests?\.rs$|_tests?\.(go|rs|py)$|\.(test|spec)\.[cm]?[jt]sx?$|([.-]t|T)ests?\.cs$|(^|/)test-[^/]*\.(sh|py|[cm]?js|ts)$|-tests?\.(sh|py|[cm]?js|ts)$|(^|/)(vitest|jest|playwright)[^/]*\.config\.[cm]?[jt]s$'; then
            echo '::error::This pull request adds the test files above. The journey in e2e/ is the only test.'
            exit 1
          fi
      # Production runs on OCI through ts-orch; only Tigris (its endpoint and `fly storage`) stays. The brackets keep
      # these lines from matching themselves.
      - name: Workflows name no retired hosting provider
        if: github.event_name != 'push'
        run: '! grep -rniI "fl[y]" .github/workflows | grep -viE "fl[y]\.storage\.tigris\.dev|fl[y] storage"'
      - name: Storage format migrations
        if: github.event_name == 'pull_request' || inputs.pr_gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/check-storage-format.sh HEAD^1 ${PR:+"$GITHUB_REPOSITORY" "$PR"}
      - name: Scan for legacy terms (fail)
        if: ${{ !cancelled() }}
        run: |
          until [ -f legacy-scan.exit ]; do sleep 1; done
          head -1 legacy-scan.log
          exit "$(cat legacy-scan.exit)"
      - name: Retain legacy hits
        if: ${{ !cancelled() && hashFiles('legacy-hits.md') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-hits
          path: |
            legacy-hits.md
            legacy-scan.log

  libs:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.dotnet), 'libs')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: terrascale
          persist-credentials: false
          ref: ${{ needs.changes.outputs.sha }}
      - &setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: terrascale/global.json
      - name: Locked restore
        working-directory: terrascale
        run: make libs-restore
      - name: Checked build, whitespace and style
        working-directory: terrascale
        run: |
          make -o libs-restore libs-fmt-check libs-build CONFIGURATION=Release
          make -o libs-restore -o libs-build libs-check CONFIGURATION=Release
          .github/scripts/ci/release-only.sh

  auth:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.dotnet), 'auth')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *setup-dotnet
      - name: Locked restore
        working-directory: terrascale
        run: make auth-restore
      - name: Checked build, whitespace, NuGet audit and OpenAPI contract
        working-directory: terrascale
        run: |
          make -o auth-restore auth-fmt-check CONFIGURATION=Release
          make -o auth-restore auth-check CONFIGURATION=Release
          .github/scripts/ci/release-only.sh

  terrabase:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.dotnet), 'terrabase')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - *checkout
      - *setup-dotnet
      - name: Pinned native libraries
        uses: ./terrascale/.github/actions/native-libs
        with:
          dir: terrascale
          runtimes: linux-arm64
      - name: Locked restore
        working-directory: terrascale
        run: make terrabase-restore platform-restore
      - name: Whitespace
        working-directory: terrascale
        run: make -o terrabase-restore -o platform-restore terrabase-fmt-check CONFIGURATION=Release
      - name: Checked ts-platform build
        working-directory: terrascale
        run: make -o platform-restore -o native-libs platform-build CONFIGURATION=Release
      - name: Checked release publish keeps the natives inside the single file
        working-directory: terrascale
        run: |
          make terrabase-publish RUNTIME=linux-arm64 PUBLISH_DIR="$RUNNER_TEMP/terrabase-publish"
          make platform-publish RUNTIME=linux-arm64 PUBLISH_DIR="$RUNNER_TEMP/platform-publish"
          .github/scripts/ci/release-only.sh

  aspire:
    needs: changes
    if: (github.event_name == 'pull_request' || inputs.pr_gate) && needs.changes.outputs.aspire == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup-dotnet
      - name: Locked restore
        working-directory: terrascale
        run: make aspire-restore
      - name: Checked build and whitespace
        working-directory: terrascale
        run: |
          make -o aspire-restore aspire-fmt-check aspire-build CONFIGURATION=Release
          .github/scripts/ci/release-only.sh

  main:
    needs: [changes, checks]
    if: >-
      !cancelled() && needs.checks.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      && contains(fromJSON(needs.changes.outputs.main), 'terrabase') && inputs.publication != 'build-only' && inputs.publication != 'release-only' && !inputs.pr_gate
    concurrency:
      group: production-terrabase
      cancel-in-progress: false
    env:
      AREA: terrabase
      SERVICE: terrabase
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      # ts-orch accepts this job's OIDC token to release the image it just published.
      id-token: write
      actions: read
    steps: &production-steps
      - *checkout
      - name: Verify commit tree passed PR CI (all-green + journey)
        if: github.event_name != 'workflow_dispatch' || inputs.publication != 'build-only'
        working-directory: terrascale
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci/site-deploy-gate.mjs "$AREA" --qualify-main
      - uses: ./terrascale/.github/actions/qualified-main
        if: github.event_name == 'workflow_dispatch' && inputs.publication == 'build-only'
        with:
          revision: ${{ github.sha }}
          qualification: terrabase-maintenance
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: terrascale/global.json
      - name: Pinned native libraries
        uses: ./terrascale/.github/actions/native-libs
        with:
          dir: terrascale
          runtimes: linux-arm64
      # Production runs linux/arm64 natively on ubuntu-24.04-arm: publish once, wrap in the chiseled image, attest, and roll out via ts-orch.
      - name: Publish the linux/arm64 runtime payload
        working-directory: terrascale
        run: |
          docker buildx create --use --driver docker-container --bootstrap > "$RUNNER_TEMP/builder.log" 2>&1 &
          builder=$!
          bash .github/scripts/ci/image-payloads.sh publish "$AREA"
          bash .github/scripts/ci/image-payloads.sh runtime-dockerfile "$AREA" > "$RUNNER_TEMP/image-payloads/Dockerfile"
          wait "$builder" || { cat "$RUNNER_TEMP/builder.log"; exit 1; }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Public images ts-orch runs: ghcr.io/terrascale/{terrabase,ts-platform,ts-auth}:<sha> and :main.
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/image-payloads
          file: ${{ runner.temp }}/image-payloads/Dockerfile
          platforms: linux/arm64
          tags: |
            ghcr.io/terrascale/${{ env.SERVICE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && inputs.publication != 'build-only' && format('ghcr.io/terrascale/{0}:main', env.SERVICE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
      - id: digest
        name: Verify the published linux/arm64 child
        env:
          INDEX: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/terrascale/${SERVICE}"
          { echo '```'; docker buildx imagetools inspect "${image}@${INDEX}"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          arm64=$(docker buildx imagetools inspect "${image}@${INDEX}" --format '{{json .Manifest}}' |
            jq -r 'if .manifests then (.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest) else empty end')
          if [[ -z "$arm64" ]]; then
            arm64=$INDEX
          fi
          test -n "$arm64"
          docker buildx imagetools inspect "${image}@${arm64}" --format '{{json .Image}}' |
            jq -e --arg revision "$GITHUB_SHA" '.architecture == "arm64" and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision'
          echo "arm64=${arm64}" >> "$GITHUB_OUTPUT"
      - name: Record the build-only digest (no release)
        if: github.event_name == 'workflow_dispatch' && inputs.publication == 'build-only'
        env:
          INDEX: ${{ steps.image.outputs.digest }}
          ARM64: ${{ steps.digest.outputs.arm64 }}
        run: echo "BUILD_ONLY ${SERVICE} revision=${GITHUB_SHA} index=${INDEX} arm64=${ARM64}" | tee -a "$GITHUB_STEP_SUMMARY"
      - id: provenance
        name: Attest build provenance (linux/arm64 child)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/terrascale/${{ env.SERVICE }}
          subject-digest: ${{ steps.digest.outputs.arm64 }}
          push-to-registry: true
      - name: Generate the linux/arm64 child SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/terrascale/${{ env.SERVICE }}@${{ steps.digest.outputs.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
      - id: sbom
        name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/terrascale/${{ env.SERVICE }}
          subject-digest: ${{ steps.digest.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
          ARM64: ${{ steps.digest.outputs.arm64 }}
        run: gh attestation verify "oci://ghcr.io/terrascale/${SERVICE}@${ARM64}" --owner TerraScale --signer-workflow TerraScale/terrascale/.github/workflows/ci.yml --source-ref refs/heads/main --bundle-from-oci
      - name: Deploy through ts-orch
        if: github.event_name != 'workflow_dispatch' || inputs.publication != 'build-only'
        working-directory: terrascale
        env:
          ARM64: ${{ steps.digest.outputs.arm64 }}
        run: bash .github/scripts/ci/deploy-v2.sh "${SERVICE}" "ghcr.io/terrascale/${SERVICE}@${ARM64}"

  main-platform:
    needs: [changes, checks]
    if: >-
      !cancelled() && needs.checks.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      && contains(fromJSON(needs.changes.outputs.main), 'platform') && inputs.publication != 'build-only' && inputs.publication != 'release-only' && !inputs.pr_gate
    concurrency:
      group: production-platform
      cancel-in-progress: false
    env:
      AREA: platform
      SERVICE: ts-platform
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      actions: read
    steps: *production-steps

  main-build-only:
    needs: [changes, checks, terrabase, test]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.terrabase.result == 'success'
      && github.event_name == 'workflow_dispatch' && inputs.publication == 'build-only' && github.ref == 'refs/heads/main'
      && !inputs.pr_gate
    concurrency:
      group: build-${{ github.run_id }}
      cancel-in-progress: false
    env:
      AREA: terrabase
      SERVICE: terrabase
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      actions: read
    steps: *production-steps

  release-only:
    needs: checks
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publication == 'release-only' && github.ref == 'refs/heads/main'
      && !inputs.pr_gate
    concurrency:
      group: production-terrabase
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci
            .github/actions/qualified-main
      - uses: ./.github/actions/qualified-main
        with:
          revision: ${{ github.sha }}
          qualification: terrabase-maintenance
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify and deploy the pinned arm64 digest through ts-orch
        env:
          GH_TOKEN: ${{ github.token }}
          ARM64: ${{ inputs.terrabase_arm64 }}
        run: |
          set -euo pipefail
          [[ "$ARM64" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'terrabase_arm64 must be sha256:<64 hex>' >&2; exit 1; }
          image="ghcr.io/terrascale/terrabase@${ARM64}"
          docker buildx imagetools inspect "$image" --format '{{json .Image}}' |
            jq -e --arg revision "$GITHUB_SHA" '.architecture == "arm64" and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision'
          gh attestation verify "oci://${image}" --owner TerraScale --signer-workflow TerraScale/terrascale/.github/workflows/ci.yml --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --bundle-from-oci
          bash .github/scripts/ci/deploy-v2.sh terrabase "$image"

  main-auth:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.reconcile_auth && !inputs.pr_gate))
    concurrency:
      group: production-auth
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      issues: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: probe
        name: Validate live ts-auth readiness response
        run: node .github/scripts/ci/site-deploy-gate.mjs auth --probe
      - name: Note clean-slate or unavailable live ts-auth
        if: steps.probe.outputs.unavailable == 'true'
        run: echo 'Live ts-auth readiness is currently unavailable; proceeding with reconciliation'
      - id: live
        name: Reconcile qualified main with live ts-auth
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_LIVE_REVISION: ${{ steps.probe.outputs.revision }}
        run: node .github/scripts/ci/site-deploy-gate.mjs auth --reconcile
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: steps.live.outputs.deploy == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: cached
        name: Inspect the immutable target image
        if: steps.live.outputs.deploy == 'true'
        run: bash .github/scripts/ci/inspect-app-image.sh auth
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
      - name: Build or reuse the target image and publish its main tag
        if: steps.live.outputs.deploy == 'true'
        run: bash .github/scripts/ci/reconcile-image.sh auth
      - id: authdigest
        name: Extract the released arm64 child digest
        if: steps.live.outputs.deploy == 'true'
        env:
          IMAGE: ${{ env.IMAGE }}
        run: echo "arm64=${IMAGE#*@}" >> "$GITHUB_OUTPUT"
      - id: provenance
        name: Attest build provenance (linux/arm64 child)
        if: steps.live.outputs.deploy == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/terrascale/ts-auth
          subject-digest: ${{ steps.authdigest.outputs.arm64 }}
          push-to-registry: true
      - name: Generate the linux/arm64 child SBOM
        if: steps.live.outputs.deploy == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/terrascale/ts-auth@${{ steps.authdigest.outputs.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
      - id: sbom
        name: Attest the SBOM
        if: steps.live.outputs.deploy == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-name: ghcr.io/terrascale/ts-auth
          subject-digest: ${{ steps.authdigest.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
      - name: Verify the attestations
        if: steps.live.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARM64: ${{ steps.authdigest.outputs.arm64 }}
        run: gh attestation verify "oci://ghcr.io/terrascale/ts-auth@${ARM64}" --owner TerraScale --signer-workflow TerraScale/terrascale/.github/workflows/ci.yml --source-ref refs/heads/main --bundle-from-oci
      - name: Deploy ts-auth through ts-orch
        if: steps.live.outputs.deploy == 'true'
        run: bash .github/scripts/ci/deploy-v2.sh ts-auth "$IMAGE"
      - name: Prove the live revision
        if: steps.live.outputs.deploy == 'true'
        run: node .github/scripts/ci/site-deploy-gate.mjs auth --prove
      - name: Record the released source for the production journey
        if: steps.live.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-revision
          overwrite: true
          path: ${{ runner.temp }}/deploy-revision
          if-no-files-found: error
          retention-days: 1
  test:
    name: test
    needs: [changes, checks, libs, auth, terrabase, dashboard, aspire, sdk]
    if: >-
      ${{ !cancelled()
      && (needs.changes.result != 'success' || needs.checks.result != 'success'
      || needs.changes.outputs.dotnet != '[]' || needs.changes.outputs.sdks != '[]' || needs.dashboard.result != 'skipped'
      || needs.aspire.result != 'skipped' || needs.changes.outputs.main != '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check upstream results
        env:
          LEGS: ${{ needs.changes.outputs.dotnet }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if grep -qE 'failure|cancelled' <<< '${{ join(needs.*.result, ' ') }}'; then exit 1; fi
          for leg in $(jq -r '.[]' <<< "$LEGS"); do
            [[ $(jq -r --arg leg "$leg" '.[$leg].result' <<< "$RESULTS") == success ]] || exit 1
          done

  dashboard:
    needs: changes
    if: (github.event_name == 'pull_request' || inputs.pr_gate) && needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Restore the dashboard
        run: make dashboard-restore
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: src/TerraScale.Dashboard/web/package-lock.json
      - name: Install the web asset build
        run: npm ci --prefix src/TerraScale.Dashboard/web
      - name: Checked build
        run: |
          make -o dashboard-restore dashboard-build CONFIGURATION=Release
          .github/scripts/ci/release-only.sh
      - name: Dashboard lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then git fetch --no-tags --depth=1 origin "$BASE_SHA"; fi
          make dashboard-lint CONFIGURATION=Release

  sdk:
    needs: changes
    if: needs.changes.outputs.sdks != '[]'
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.changes.outputs.sdks) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AREA: ${{ matrix.area }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: matrix.area == 'sdk-dotnet'
        with:
          dotnet-version: |
            10.0.401
            11.0.100
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: matrix.area != 'sdk-dotnet'
        with:
          install: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: matrix.area == 'sdk-go'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: sdk-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/go/.go-version', 'sdk/go/go.sum') }}
      - name: Install the pinned SDK toolchain
        run: |
          set -euo pipefail
          case "$AREA" in
            sdk-go) mise use -g "go@$(cat sdk/go/.go-version)"; dirname "$(mise which go)" >> "$GITHUB_PATH" ;;
            sdk-python) mise use -g uv@0.13.7; dirname "$(mise which uv)" >> "$GITHUB_PATH" ;;
            sdk-rust) rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy ;;
          esac
      - name: Build and type-check the SDK
        run: make "$AREA-check"

  docs:
    needs: changes
    if: (github.event_name == 'pull_request' || inputs.pr_gate) && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: sites/docs/.node-version
          package-manager-cache: false
      - name: Build and check the docs site
        run: make docs-build

  landing:
    needs: changes
    if: (github.event_name == 'pull_request' || inputs.pr_gate) && needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: sites/landing/.node-version
          cache: npm
          cache-dependency-path: sites/landing/package-lock.json
      - name: Install dependencies
        working-directory: sites/landing
        run: npm ci --no-audit --no-fund
      - name: Validate the static build
        working-directory: sites/landing
        run: npm run build

  status:
    needs: changes
    if: (github.event_name == 'pull_request' || inputs.pr_gate) && needs.changes.outputs.status == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: sites/status/.node-version
          cache: npm
          cache-dependency-path: sites/status/package-lock.json
      - name: Install dependencies
        working-directory: sites/status
        run: npm ci --no-audit --no-fund
      - name: Check, lint and build
        working-directory: sites/status
        run: |
          npm run check
          npm run lint
          npm run build
          if grep -n ROUND_NOW wrangler.jsonc dist/*/wrangler.json; then
            echo "ROUND_NOW is not a production binding" >&2
            exit 1
          fi

  journey:
    permissions:
      contents: read
      issues: read
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.journey == 'true')
      || (github.ref == 'refs/heads/main' && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && !inputs.reconcile_auth && inputs.publication == 'release')))
      || (github.event_name == 'workflow_dispatch' && inputs.pr_gate)
    uses: ./.github/workflows/journey.yml
    with:
      shards: ${{ needs.changes.outputs.shards }}
      services: ${{ needs.changes.outputs.services }}
      keyring: ${{ github.event_name != 'pull_request' || needs.changes.outputs.keyring == 'true' }}
      engine: ${{ github.event_name != 'pull_request' || needs.changes.outputs.engine == 'true' }}
      frontier: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontier == 'true' }}

  all-green:
    name: all-green
    if: always()
    needs: [changes, checks, libs, auth, terrabase, dashboard, aspire, sdk, docs, landing, status, journey, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check upstream results
        run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
          test "${{ needs.changes.outputs.engine != 'true' || needs.journey.result == 'success' }}" = true
