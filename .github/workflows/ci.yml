# Required formatting, build, security, contract/Fast and actual-application packaging.
# Slow runs independently in slow.yml. This workflow pushes no image and deploys nothing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes a pull request's run; each main commit runs in its own group and keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0 # .mise.toml
      - run: echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: src/TerraScale.Dashboard/web
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-results
          path: test-results/tunit/fast.trx
          if-no-files-found: warn

  image:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SOURCE_REVISION=${{ github.sha }}
          push: false
