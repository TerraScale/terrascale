name: Sites

on:
  workflow_run:
    workflows: [CI, 'Images (GHCR)']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy-docs:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - id: live
        name: Reconcile qualified main with the live Worker revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/site-deploy-gate.mjs docs ts-docs
      - name: Check out the target
        if: steps.live.outputs.deploy == 'true'
        run: |
          cp scripts/ci/prove-worker-deploy.mjs "$RUNNER_TEMP/prove-worker-deploy.mjs"
          git checkout --detach "$REVISION"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version-file: docs-site/.node-version
          package-manager-cache: false
      - name: Install dependencies
        if: steps.live.outputs.deploy == 'true'
        working-directory: docs-site
        run: npm ci --no-audit --no-fund
      - name: Build the checked-out revision
        if: steps.live.outputs.deploy == 'true'
        working-directory: docs-site
        run: npm run build
      - name: Deploy the site to Workers
        if: steps.live.outputs.deploy == 'true'
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploys.ndjson
        run: npm run deploy:site -- --message "$REVISION"
      - name: Prove the deployed revision
        if: steps.live.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$RUNNER_TEMP/prove-worker-deploy.mjs" "$RUNNER_TEMP/deploys.ndjson" ts-docs

  deploy-landing:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: landing-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - id: live
        name: Reconcile qualified main with the live Worker revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/site-deploy-gate.mjs landing ts-landing
      - name: Check out the target
        if: steps.live.outputs.deploy == 'true'
        run: |
          cp scripts/ci/prove-worker-deploy.mjs "$RUNNER_TEMP/prove-worker-deploy.mjs"
          git checkout --detach "$REVISION"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version-file: landing-site/.node-version
          cache: npm
          cache-dependency-path: landing-site/package-lock.json
      - name: Install dependencies
        if: steps.live.outputs.deploy == 'true'
        working-directory: landing-site
        run: npm ci --no-audit --no-fund
      - name: Validate the static build
        if: steps.live.outputs.deploy == 'true'
        working-directory: landing-site
        run: npm run build
      - name: Deploy static assets
        if: steps.live.outputs.deploy == 'true'
        working-directory: landing-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploys.ndjson
        run: npx wrangler deploy --message "$REVISION"
      - name: Prove the deployed revision
        if: steps.live.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$RUNNER_TEMP/prove-worker-deploy.mjs" "$RUNNER_TEMP/deploys.ndjson" ts-landing

  deploy-status:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: status-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - id: live
        name: Reconcile qualified main with the live Worker revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/site-deploy-gate.mjs status ts-status-vantage-sfo ts-status-vantage-gru ts-status
      - name: Check out the target
        if: steps.live.outputs.deploy == 'true'
        run: |
          cp scripts/ci/prove-worker-deploy.mjs "$RUNNER_TEMP/prove-worker-deploy.mjs"
          git checkout --detach "$REVISION"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version-file: status-site/.node-version
          cache: npm
          cache-dependency-path: status-site/package-lock.json
      - name: Install dependencies
        if: steps.live.outputs.deploy == 'true'
        working-directory: status-site
        run: npm ci --no-audit --no-fund
      - name: Build the checked-out revision
        if: steps.live.outputs.deploy == 'true'
        working-directory: status-site
        run: npm run build
      - name: Deploy the status Workers
        if: steps.live.outputs.deploy == 'true'
        working-directory: status-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploys.ndjson
          WORKERS: ${{ steps.live.outputs.workers }}
        run: |
          for worker in $WORKERS; do
            npx wrangler deploy -c "dist/${worker//-/_}/wrangler.json" --experimental-provision=false --experimental-auto-create=false --message "$REVISION"
          done
      - name: Prove the deployed revision
        if: steps.live.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS: ${{ steps.live.outputs.workers }}
        run: |
          read -ra workers <<< "$WORKERS"
          node "$RUNNER_TEMP/prove-worker-deploy.mjs" "$RUNNER_TEMP/deploys.ndjson" "${workers[@]}"

  reconcile-services:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      matrix:
        thing: [auth, dashboard]
    concurrency:
      group: reconcile-request-${{ matrix.thing }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - id: live
        name: Reconcile the current service and qualified main
        env:
          GH_TOKEN: ${{ github.token }}
          THING: ${{ matrix.thing }}
        run: node scripts/ci/site-deploy-gate.mjs "$THING"
      - name: Request a release reconcile with a main dispatch identity
        if: steps.live.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          THING: ${{ matrix.thing }}
        run: |
          if [ "$THING" = auth ]; then
            gh workflow run ci.yml --ref main -f reconcile_auth=true
          else
            gh workflow run images-ghcr.yml --ref main
          fi
