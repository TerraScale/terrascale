name: Sites

on:
  workflow_run:
    workflows: [CI, 'Images (GHCR)']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      reset_thing:
        description: Reset one thing's deployment attempts without deploying
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  reset-check:
    if: github.ref == 'refs/heads/main' && inputs.reset_thing != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      thing: ${{ steps.check.outputs.thing }}
      group: ${{ steps.check.outputs.group }}
    steps:
      - id: check
        name: Accept only an exact known thing
        env:
          RESET_THING: ${{ inputs.reset_thing }}
        run: |
          case "$RESET_THING" in
            auth) group=production-auth ;;
            dashboard) group=dashboard-release ;;
            ts-docs) group=docs-deploy ;;
            ts-landing) group=landing-deploy ;;
            ts-status|ts-status-vantage-sfo|ts-status-vantage-gru) group="status-deploy-$RESET_THING" ;;
            *) echo "::error::reset_thing is not a known thing"; exit 1 ;;
          esac
          printf 'thing=%s\ngroup=%s\n' "$RESET_THING" "$group" >> "$GITHUB_OUTPUT"

  reset:
    needs: reset-check
    if: github.ref == 'refs/heads/main' && inputs.reset_thing != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: ${{ needs.reset-check.outputs.group }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: main
      - name: Reset the validated state under the deployment lock
        env:
          GH_TOKEN: ${{ github.token }}
          RESET_THING: ${{ needs.reset-check.outputs.thing }}
        run: node scripts/ci/site-deploy-gate.mjs all --reset

  decide:
    if: github.ref == 'refs/heads/main' && !inputs.reset_thing && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: read
    concurrency:
      group: deploy-reconcile
      cancel-in-progress: false
    outputs:
      docs: ${{ steps.live.outputs.docs }}
      landing: ${{ steps.live.outputs.landing }}
      status: ${{ steps.live.outputs.status }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - id: live
        name: Decide all deployments once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/site-deploy-gate.mjs all

  deploy-docs:
    needs: decide
    if: ${{ !cancelled() && needs.decide.outputs.docs == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - id: live
        name: Reconcile qualified main with the live Worker revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/site-deploy-gate.mjs docs ts-docs
      - name: Check out the target
        if: steps.live.outputs.deploy == 'true'
        run: |
          cp scripts/ci/prove-worker-deploy.mjs "$RUNNER_TEMP/prove-worker-deploy.mjs"
          git checkout --detach "$REVISION"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version-file: docs-site/.node-version
          package-manager-cache: false
      - name: Install dependencies
        if: steps.live.outputs.deploy == 'true'
        working-directory: docs-site
        run: npm ci --no-audit --no-fund
      - name: Build the checked-out revision
        if: steps.live.outputs.deploy == 'true'
        working-directory: docs-site
        run: npm run build
      - name: Deploy the site to Workers
        if: steps.live.outputs.deploy == 'true'
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploys.ndjson
        run: npm run deploy:site -- --message "$REVISION"
      - name: Prove the deployed revision
        if: steps.live.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$RUNNER_TEMP/prove-worker-deploy.mjs" "$RUNNER_TEMP/deploys.ndjson" ts-docs

  deploy-landing:
    needs: decide
    if: ${{ !cancelled() && needs.decide.outputs.landing == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: landing-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - id: live
        name: Reconcile qualified main with the live Worker revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/site-deploy-gate.mjs landing ts-landing
      - name: Check out the target
        if: steps.live.outputs.deploy == 'true'
        run: |
          cp scripts/ci/prove-worker-deploy.mjs "$RUNNER_TEMP/prove-worker-deploy.mjs"
          git checkout --detach "$REVISION"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version-file: landing-site/.node-version
          cache: npm
          cache-dependency-path: landing-site/package-lock.json
      - name: Install dependencies
        if: steps.live.outputs.deploy == 'true'
        working-directory: landing-site
        run: npm ci --no-audit --no-fund
      - name: Validate the static build
        if: steps.live.outputs.deploy == 'true'
        working-directory: landing-site
        run: npm run build
      - name: Deploy static assets
        if: steps.live.outputs.deploy == 'true'
        working-directory: landing-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploys.ndjson
        run: npx wrangler deploy --message "$REVISION"
      - name: Prove the deployed revision
        if: steps.live.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$RUNNER_TEMP/prove-worker-deploy.mjs" "$RUNNER_TEMP/deploys.ndjson" ts-landing

  deploy-status:
    needs: decide
    if: ${{ !cancelled() && startsWith(needs.decide.outputs.status, '["') }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.decide.outputs.status) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: status-deploy-${{ matrix.worker }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - id: live
        name: Reconcile qualified main with the live Worker revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          WORKER: ${{ matrix.worker }}
        run: node scripts/ci/site-deploy-gate.mjs status "$WORKER"
      - name: Check out the target
        if: steps.live.outputs.deploy == 'true'
        run: |
          cp scripts/ci/prove-worker-deploy.mjs "$RUNNER_TEMP/prove-worker-deploy.mjs"
          git checkout --detach "$REVISION"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version-file: status-site/.node-version
          cache: npm
          cache-dependency-path: status-site/package-lock.json
      - name: Install dependencies
        if: steps.live.outputs.deploy == 'true'
        working-directory: status-site
        run: npm ci --no-audit --no-fund
      - name: Build the checked-out revision
        if: steps.live.outputs.deploy == 'true'
        working-directory: status-site
        run: npm run build
      - name: Deploy the status Workers
        if: steps.live.outputs.deploy == 'true'
        working-directory: status-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploys.ndjson
          WORKER: ${{ matrix.worker }}
        run: npx wrangler deploy -c "dist/${WORKER//-/_}/wrangler.json" --experimental-provision=false --experimental-auto-create=false --message "$REVISION"
      - name: Prove the deployed revision
        if: steps.live.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ matrix.worker }}
        run: node "$RUNNER_TEMP/prove-worker-deploy.mjs" "$RUNNER_TEMP/deploys.ndjson" "$WORKER"
