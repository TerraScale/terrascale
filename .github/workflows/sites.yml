name: Sites

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  changes:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/qualified-main
        with:
          revision: ${{ github.event.workflow_run.head_sha || github.sha }}

  deploy-docs:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/qualified-main
        with:
          revision: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Record the checked-out revision
        run: echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - id: live
        name: Select changes since the live Worker revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/site-deploy-gate.mjs docs ts-docs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version-file: docs-site/.node-version
          package-manager-cache: false
      - name: Install dependencies
        if: steps.live.outputs.deploy == 'true'
        working-directory: docs-site
        run: npm ci --no-audit --no-fund
      - name: Build the checked-out revision
        if: steps.live.outputs.deploy == 'true'
        working-directory: docs-site
        run: npm run build
      - name: Deploy the site to Workers
        if: steps.live.outputs.deploy == 'true'
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploys.ndjson
        run: npm run deploy:site -- --message "$REVISION"
      - name: Prove the deployed revision
        if: steps.live.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/prove-worker-deploy.mjs "$RUNNER_TEMP/deploys.ndjson" ts-docs

  deploy-landing:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: landing-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/qualified-main
        with:
          revision: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Record the checked-out revision
        run: echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - id: live
        name: Select changes since the live Worker revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/site-deploy-gate.mjs landing ts-landing
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version-file: landing-site/.node-version
          cache: npm
          cache-dependency-path: landing-site/package-lock.json
      - name: Install dependencies
        if: steps.live.outputs.deploy == 'true'
        working-directory: landing-site
        run: npm ci --no-audit --no-fund
      - name: Validate the static build
        if: steps.live.outputs.deploy == 'true'
        working-directory: landing-site
        run: npm run build
      - name: Deploy static assets
        if: steps.live.outputs.deploy == 'true'
        working-directory: landing-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploys.ndjson
        run: npx wrangler deploy --message "$REVISION"
      - name: Prove the deployed revision
        if: steps.live.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/prove-worker-deploy.mjs "$RUNNER_TEMP/deploys.ndjson" ts-landing

  deploy-status:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: status-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/qualified-main
        with:
          revision: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Record the checked-out revision
        run: echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - id: live
        name: Select changes since the live Worker revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/site-deploy-gate.mjs status ts-status-vantage-sfo ts-status-vantage-gru ts-status
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version-file: status-site/.node-version
          cache: npm
          cache-dependency-path: status-site/package-lock.json
      - name: Install dependencies
        if: steps.live.outputs.deploy == 'true'
        working-directory: status-site
        run: npm ci --no-audit --no-fund
      - name: Build the checked-out revision
        if: steps.live.outputs.deploy == 'true'
        working-directory: status-site
        run: npm run build
      - name: Deploy the status Workers
        if: steps.live.outputs.deploy == 'true'
        working-directory: status-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploys.ndjson
          WORKERS: ${{ steps.live.outputs.workers }}
        run: |
          for worker in $WORKERS; do
            npx wrangler deploy -c "dist/${worker//-/_}/wrangler.json" --experimental-provision=false --experimental-auto-create=false --message "$REVISION"
          done
      - name: Prove the deployed revision
        if: steps.live.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS: ${{ steps.live.outputs.workers }}
        run: |
          read -ra workers <<< "$WORKERS"
          node scripts/ci/prove-worker-deploy.mjs "$RUNNER_TEMP/deploys.ndjson" "${workers[@]}"
