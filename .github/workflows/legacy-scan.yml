name: Legacy scan

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-scan:
    name: Legacy scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: target
          persist-credentials: false

      - name: Check out legacy scanner
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: TerraScale/terrascale
          ref: a2e200187ffe32084a10f2a81c9e3e1f59b49a29
          path: legacy-scanner
          persist-credentials: false

      - name: Scan for legacy terms
        run: python3 legacy-scanner/scripts/legacy-scan/scan.py --repo ts-js --root target --output legacy-hits.md

      - name: Upload legacy hits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-hits
          path: legacy-hits.md
