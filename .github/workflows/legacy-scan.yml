name: Legacy scan

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Run process integration tests
        run: python3 scripts/legacy-scan/process-test.py
      - name: Scan for legacy terms
        run: python3 scripts/legacy-scan/scan.py --repo terrascale --output legacy-hits.md
      - name: Upload legacy hits report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-hits
          path: legacy-hits.md
