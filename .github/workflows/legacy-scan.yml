name: Legacy scan

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-scan-weekly
  cancel-in-progress: false

jobs:
  legacy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Scan for legacy terms
        run: python3 scripts/legacy-scan/scan.py --repo terrascale --output legacy-hits.md
      - name: Retain legacy hits
        if: ${{ !cancelled() && hashFiles('legacy-hits.md') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-hits
          path: legacy-hits.md
          if-no-files-found: error
