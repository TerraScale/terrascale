# Public multi-arch image ts-orch runs (REFACTOR.md W10): ghcr.io/terrascale/ts-dashboard:<sha> and :main,
# linux/amd64 + linux/arm64 (portable publish on the builder's platform). Independent of CI's Fly image;
# the digest goes to the job summary.
name: Images (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: push
        with:
          context: .
          build-args: SOURCE_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/terrascale/ts-dashboard:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/terrascale/ts-dashboard:main' || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Reads CI's main layer cache; never writes it.
          cache-from: type=gha,scope=dashboard-image
          push: true
      # Index digest plus each platform's child digest (ts-orch specs pin the linux/arm64 child).
      - run: |
          { echo '```'; docker buildx imagetools inspect "ghcr.io/terrascale/ts-dashboard@${{ steps.push.outputs.digest }}"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
