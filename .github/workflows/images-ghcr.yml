# Public multi-arch image ts-orch runs (REFACTOR.md W10): ghcr.io/terrascale/ts-dashboard:<sha> and :main,
# linux/amd64 + linux/arm64 (portable publish on the builder's platform). Writes the layer cache CI's
# pull request image builds read; the digest goes to the job summary.
name: Images (GHCR)

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

# Every publish runs to completion in its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: push
        with:
          context: .
          build-args: SOURCE_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/terrascale/ts-dashboard:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/terrascale/ts-dashboard:main' || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Only main writes the layer cache; CI's pull request builds read it.
          cache-from: type=gha,scope=dashboard-image
          cache-to: type=gha,mode=max,scope=dashboard-image
          push: true
      # Index digest plus each platform's child digest (ts-orch specs pin the linux/arm64 child).
      - run: |
          { echo '```'; docker buildx imagetools inspect "ghcr.io/terrascale/ts-dashboard@${{ steps.push.outputs.digest }}"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      # W22: release the linux/arm64 digest to every region's ts-orch; rolls back on failed readiness.
      - name: Release to every region
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ts-dashboard
          INDEX: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/terrascale/${SERVICE}"
          arm64=$(docker buildx imagetools inspect "${image}@${INDEX}" --format '{{json .Manifest}}' |
            jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          test -n "$arm64"
          tag=$(gh release list --repo TerraScale/ts-orchestrator --limit 30 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("ci-"))] | sort_by(.createdAt) | last | .tagName // ""')
          test -n "$tag"
          gh release download "$tag" --repo TerraScale/ts-orchestrator --dir "${RUNNER_TEMP}/ts-orch" --pattern terrascale-orchestrator-linux-amd64
          curl -fsSL https://raw.githubusercontent.com/TerraScale/ts-orchestrator/main/deploy/m1/regions.json -o "${RUNNER_TEMP}/regions.json"
          chmod +x "${RUNNER_TEMP}/ts-orch/terrascale-orchestrator-linux-amd64"
          "${RUNNER_TEMP}/ts-orch/terrascale-orchestrator-linux-amd64" release app --service "$SERVICE" \
            --image "${image}@${arm64}" --regions "${RUNNER_TEMP}/regions.json" | tee -a "$GITHUB_STEP_SUMMARY"
