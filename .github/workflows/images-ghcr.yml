name: Images (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}

jobs:
  image:
    name: Publish and release
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: dashboard-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: [5000:5000]
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      issues: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: live
        name: Reconcile qualified main with the live dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci/site-deploy-gate.mjs dashboard
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
        if: steps.live.outputs.deploy == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: steps.live.outputs.deploy == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: cached
        name: Inspect the immutable target image
        if: steps.live.outputs.deploy == 'true'
        run: bash .github/scripts/ci/inspect-app-image.sh dashboard
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
        with:
          node-version: '24.21.0'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
      - name: Build or reuse the target image and publish its main tag
        if: steps.live.outputs.deploy == 'true'
        run: bash .github/scripts/ci/reconcile-image.sh dashboard
      - id: dashboarddigest
        name: Extract the released arm64 child digest
        if: steps.live.outputs.deploy == 'true'
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          echo "arm64=${IMAGE#*@}" >> "$GITHUB_OUTPUT"
          echo "name=${IMAGE%@*}" >> "$GITHUB_OUTPUT"
      - id: provenance
        name: Attest build provenance (linux/arm64 child)
        if: steps.live.outputs.deploy == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.dashboarddigest.outputs.name }}
          subject-digest: ${{ steps.dashboarddigest.outputs.arm64 }}
          push-to-registry: true
      - name: Generate the linux/arm64 child SBOM
        if: steps.live.outputs.deploy == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.dashboarddigest.outputs.name }}@${{ steps.dashboarddigest.outputs.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
      - id: sbom
        name: Attest the SBOM
        if: steps.live.outputs.deploy == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-name: ${{ steps.dashboarddigest.outputs.name }}
          subject-digest: ${{ steps.dashboarddigest.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
      - name: Verify the attestations
        if: steps.live.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARM64: ${{ steps.dashboarddigest.outputs.arm64 }}
          NAME: ${{ steps.dashboarddigest.outputs.name }}
        run: gh attestation verify "oci://${NAME}@${ARM64}" --owner TerraScale --signer-workflow TerraScale/terrascale/.github/workflows/images-ghcr.yml --source-ref refs/heads/main --bundle-from-oci
      - uses: oras-project/setup-oras@6c7c53b4590464855840e6196435c3af71140f64
        if: steps.live.outputs.deploy == 'true'
        with:
          version: 1.3.6
      - name: Authenticate to OCIR with GitHub OIDC
        if: steps.live.outputs.deploy == 'true'
        uses: TerraScale/ts-orchestrator/.github/actions/ocir-login@0142407115eb66e6487764644b97ab1ec859a79d
        with:
          regions: sa-saopaulo-1 eu-frankfurt-1 us-sanjose-1
          domain-url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          client-id: ${{ vars.OCI_TOKEN_EXCHANGE_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_TOKEN_EXCHANGE_CLIENT_SECRET }}
      - name: Publish and verify the same image and bundles in every OCIR region
        if: steps.live.outputs.deploy == 'true'
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: bash .github/scripts/ci/app-image-regions.sh publish "$IMAGE" "$PROVENANCE" "$SBOM"
      - name: Select the signed release
        if: steps.live.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci/release-app.sh ts-dashboard "$IMAGE"
      - name: Wait for rollout
        if: steps.live.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci/wait-app-rollout.sh ts-dashboard "$IMAGE"
      - name: Prove the live revision
        if: steps.live.outputs.deploy == 'true'
        run: node .github/scripts/ci/site-deploy-gate.mjs dashboard --prove
      - name: Record the released source for the production journey
        if: steps.live.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-revision
          overwrite: true
          path: ${{ runner.temp }}/deploy-revision
          if-no-files-found: error
          retention-days: 1
