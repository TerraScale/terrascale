name: Images (OCIR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}

jobs:
  image:
    name: Publish and release
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: dashboard-release
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: live
        name: Reconcile main with the live dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci/site-deploy-gate.mjs dashboard
      - name: Authenticate to OCIR with GitHub OIDC
        if: steps.live.outputs.deploy == 'true'
        uses: TerraScale/ts-orchestrator/.github/actions/ocir-login@623419d401570afd0d8bc172dc6245760a78d058
        with:
          regions: sa-saopaulo-1 eu-frankfurt-1 us-sanjose-1
          domain-url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          client-id: ${{ vars.OCI_TOKEN_EXCHANGE_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_TOKEN_EXCHANGE_CLIENT_SECRET }}
      - id: cached
        name: Inspect the immutable target image
        if: steps.live.outputs.deploy == 'true'
        run: bash .github/scripts/ci/inspect-app-image.sh dashboard
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-publish-dashboard-${{ hashFiles('src/TerraScale.Dashboard/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-publish-dashboard-
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: src/TerraScale.Dashboard/web/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.live.outputs.deploy == 'true' && steps.cached.outputs.cached == 'false'
      - uses: oras-project/setup-oras@6c7c53b4590464855840e6196435c3af71140f64
        if: steps.live.outputs.deploy == 'true'
        with:
          version: 1.3.6
      - id: image
        name: Build or reuse the target image
        if: steps.live.outputs.deploy == 'true'
        run: bash .github/scripts/ci/reconcile-image.sh dashboard
      - id: provenance
        name: Attest build provenance of the linux/arm64 child
        if: steps.live.outputs.deploy == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.arm64 }}
          push-to-registry: false
      - id: mirror
        name: Mirror the image to every OCIR region
        if: steps.live.outputs.deploy == 'true'
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bash .github/scripts/ci/publish-ocir.sh "$IMAGE" "${REVISION},main"
          mkdir -p "$RUNNER_TEMP/attest-target"
          cp "$PROVENANCE" "$RUNNER_TEMP/attest-target/provenance.json"
          jq -n --arg image "${IMAGE%@*}" --arg arm64 "${IMAGE#*@}" --arg revision "$REVISION" \
            '{service: "ts-dashboard", image: $image, arm64: $arm64, revision: $revision, tags: [$revision, "main"]}' > "$RUNNER_TEMP/attest-target/attest-target.json"
      - name: Deploy ts-dashboard through ts-orch
        if: steps.live.outputs.deploy == 'true'
        run: bash .github/scripts/ci/deploy-v2.sh ts-dashboard "$IMAGE"
      - name: Prove the live revision
        if: steps.live.outputs.deploy == 'true'
        run: node .github/scripts/ci/site-deploy-gate.mjs dashboard --prove
      - name: Record the released source for the production journey
        if: steps.live.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-revision
          overwrite: true
          path: ${{ runner.temp }}/deploy-revision
          if-no-files-found: error
          retention-days: 1
      - name: Hand the published image to the attestation workflow
        if: ${{ !cancelled() && steps.mirror.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attest-targets-ts-dashboard
          path: ${{ runner.temp }}/attest-target
          if-no-files-found: error
          overwrite: true
          retention-days: 7
