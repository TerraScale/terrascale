# ts-orch permits this exact workflow path to release only ts-dashboard.
name: Images (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraScale.Dashboard*/**'
      # The dashboard calls TerraBase through these MagicOnion contracts.
      - 'src/TerraScale.TerraBase.Contracts/**'
      # The dashboard's endpoints and their source generator.
      - 'src/TerraScale.Endpoints/**'
      - 'src/TerraScale.Endpoints.Generators/**'
      - 'tests/TerraScale.Dashboard*/**'
      - 'scripts/dashboard/**'
      - 'sdk/dotnet/**'
      - 'Directory.*'
      - '.editorconfig'
      - 'BannedSymbols.txt'
      - 'global.json'
      - 'NuGet.config'
      - 'Makefile'
      - '.github/workflows/dashboard-ci.yml'
      - '.github/workflows/images-ghcr.yml'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
      - '!.cos/**'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  # The release token's sha claim must equal the image's revision label, so each
  # qualified commit is released by its own push run even after main moves on,
  # or by a recovery dispatch while it remains the real main head:
  # pushes outside the dashboard never block it. ts-orch orders signed runs, and
  # the gate only admits the newest qualified, not-failed main commit. It starts
  # as soon as the dev-host release proof exists: it never waits for CI to finish.
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # The CI completion heal reruns Images or dispatches a missing main-head run.
      actions: write
      contents: read
      statuses: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: gate
        name: Release only the newest qualified green main commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # The regions' verifier accepts only push and dispatch tokens; after CI
          # completes, heal recovers a qualified push/dispatch run, creating a
          # main-head dispatch when GitHub never emitted the push event.
          if [ "$EVENT_NAME" = workflow_run ]; then
            python3 scripts/dashboard/ci/release-gate.py heal
            echo deploy=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deploy=$(python3 scripts/dashboard/ci/release-gate.py release "$GITHUB_SHA")
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$deploy" != true ]; then
            echo 'Qualify current green main on a dev host before dispatching deployment' >&2
            exit 1
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
  # Dashboard Fast: every push and dispatch requires its exact-commit dev-host proof, released or not.
  test:
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/dashboard-ci.yml

  image:
    needs: [ready, test]
    name: Publish and release
    # One release at a time; a newer pending run replaces an older one.
    concurrency:
      group: dashboard-release
      cancel-in-progress: false
    if: >-
      needs.ready.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: read
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Download and verify the application qualified on a dev host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dashboard-qualified" "$RUNNER_TEMP/dashboard-publish"
          python3 scripts/ci/proof_release.py download "$GITHUB_SHA" dashboard \
            "$RUNNER_TEMP/dashboard-qualified" dashboard-publish.tar.gz dashboard-qualification.json
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import tarfile

          temporary = Path(os.environ["RUNNER_TEMP"])
          qualified = temporary / "dashboard-qualified"
          output = temporary / "dashboard-publish"
          manifest = json.loads((qualified / "dashboard-qualification.json").read_text())
          assert manifest["schema"] == "terrascale.dashboard-qualification/v1"
          assert manifest["revision"] == os.environ["GITHUB_SHA"]
          assert manifest["archive"] == "dashboard-publish.tar.gz"
          archive = qualified / manifest["archive"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest["sha256"]
          with tarfile.open(archive, "r:gz") as package:
              files = {}
              for member in package.getmembers():
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert member.isdir() or member.isfile(), "Only regular application files are permitted"
                  if member.isfile():
                      name = path.as_posix()
                      assert name not in files, "Duplicate application file"
                      files[name] = hashlib.sha256(package.extractfile(member).read()).hexdigest()
              assert files and files == manifest["files"]
              assert "TerraScale.Dashboard.dll" in files
              package.extractall(output, filter="data")
          print(f"Verified {len(files)} application files from {manifest['revision']}")
          PYTHON
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: push
        with:
          context: ${{ runner.temp }}/dashboard-publish
          file: scripts/dashboard/ci/Dockerfile.runtime
          # Production runs linux/arm64 only; ts-orch pins its child digest.
          platforms: linux/arm64
          tags: |
            ghcr.io/terrascale/terrascale-dashboard:${{ github.sha }}
            ghcr.io/terrascale/terrascale-dashboard:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dashboard-runtime
          cache-to: type=gha,mode=max,scope=dashboard-runtime
          push: true
      - id: digest
        name: Verify the published linux/arm64 child
        env:
          IMAGE: ghcr.io/terrascale/terrascale-dashboard
          INDEX: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          { echo '```'; docker buildx imagetools inspect "${IMAGE}@${INDEX}"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          arm64=$(docker buildx imagetools inspect "${IMAGE}@${INDEX}" --format '{{json .Manifest}}' |
            jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          test -n "$arm64"
          docker buildx imagetools inspect "${IMAGE}@${arm64}" --format '{{json .Image}}' |
            jq -e --arg revision "$GITHUB_SHA" '.architecture == "arm64" and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision'
          echo "arm64=${arm64}" >> "$GITHUB_OUTPUT"
      # The gate runs again just before release: a newer qualified commit supersedes this one.
      - name: Release to every region
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/terrascale/terrascale-dashboard@${{ steps.digest.outputs.arm64 }}
        run: |
          set -euo pipefail
          test "$(python3 scripts/dashboard/ci/release-gate.py release "$GITHUB_SHA")" = true
          # ts-orch normally finishes a dashboard release in 133-141 s.
          bash scripts/ci/release-app.sh ts-dashboard "$IMAGE" 180
      - name: Verify live readiness and deployed source revision
        run: python3 scripts/dashboard/verify-live.py "$GITHUB_SHA"
