name: Images (GHCR)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  image:
    name: Publish and release
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: dashboard-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      issues: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - id: live
        name: Reconcile qualified main with the live dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/site-deploy-gate.mjs dashboard
      - name: Prepare the qualified target
        if: steps.live.outputs.deploy == 'true'
        run: |
          cp scripts/ci/deploy-alert.mjs "$RUNNER_TEMP/deploy-alert.mjs"
          cp scripts/ci/site-deploy-gate.mjs "$RUNNER_TEMP/reconcile.mjs"
          cp scripts/ci/reconcile-image.sh "$RUNNER_TEMP/reconcile-image.sh"
          cp scripts/ci/release-app.sh "$RUNNER_TEMP/release-app.sh"
          cp scripts/ci/fetch-ts-orch.sh "$RUNNER_TEMP/fetch-ts-orch.sh"
          git checkout --detach "$REVISION"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: steps.live.outputs.deploy == 'true'
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version: '24.21.0'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.live.outputs.deploy == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: steps.live.outputs.deploy == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build or reuse the target image and publish its main tag
        if: steps.live.outputs.deploy == 'true'
        run: bash "$RUNNER_TEMP/reconcile-image.sh" dashboard
      - name: Release to every region
        if: steps.live.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/release-app.sh" ts-dashboard "$IMAGE"
      - name: Prove the live revision
        if: steps.live.outputs.deploy == 'true'
        run: node "$RUNNER_TEMP/reconcile.mjs" dashboard --prove
      - name: Record the released source for the production journey
        if: steps.live.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-revision
          overwrite: true
          path: ${{ runner.temp }}/deploy-revision
          if-no-files-found: error
          retention-days: 1
      - name: Record deployment outcome
        if: always() && steps.live.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: node "$RUNNER_TEMP/deploy-alert.mjs" dashboard "$RESULT" "$REVISION"
