name: SDK go Fast

on:
  push:
    branches: [main]
    paths:
      - 'sdk/go/**'
      - '!.github/workflows/sdk-go-release.yml'
      - '!.github/workflows/sdk-go-publish.yml'
      - '.github/workflows/sdk-fast.yml'
      - 'scripts/sdk/**'
      - '!sdk/go/docs/**'
      - '!sdk/go/contracts/**'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/go/**'
      - '!.github/workflows/sdk-go-release.yml'
      - '!.github/workflows/sdk-go-publish.yml'
      - '.github/workflows/sdk-fast.yml'
      - 'scripts/sdk/**'
      - '!sdk/go/docs/**'
      - '!sdk/go/contracts/**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  fast:
    uses: ./.github/workflows/sdk-fast.yml
    with:
      area: sdk-go
