name: SDK go Fast

on:
  push:
    branches: [main]
    paths:
      - 'sdk/go/**'
      - '.github/workflows/sdk-go-*.yml'
      - '.github/workflows/sdk-fast.yml'
      - 'scripts/sdk/**'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
      - '!.cos/**'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/go/**'
      - '.github/workflows/sdk-go-*.yml'
      - '.github/workflows/sdk-fast.yml'
      - 'scripts/sdk/**'
      - '!**/AGENTS.md'
      - '!**/CLAUDE.md'
      - '!.cos/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    uses: ./.github/workflows/sdk-fast.yml
    with:
      area: sdk-go
