name: Qualify the exact main revision
description: Require a successful completed main push CI run whose changes and all-green jobs succeeded for the exact revision.
inputs:
  revision:
    description: Exact source revision being published or deployed.
    required: true
runs:
  using: composite
  steps:
    - name: Require a successful main push CI run for the exact revision
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REVISION: ${{ inputs.revision }}
      run: |
        set -euo pipefail
        [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
        run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REVISION&branch=main&event=push&per_page=100" \
          --jq '.workflow_runs | max_by(.id) // empty')
        jq -e --arg sha "$REVISION" --arg repo "$GITHUB_REPOSITORY" '
          .head_sha == $sha and .head_branch == "main" and .event == "push"
          and .head_repository.full_name == $repo and .repository.full_name == $repo
          and .path == ".github/workflows/ci.yml"
          and .status == "completed" and .conclusion == "success"
        ' <<< "$run" > /dev/null || { echo "::error::No successful completed main CI run for $REVISION"; exit 1; }
        id=$(jq -r .id <<< "$run")
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=100" | \
          jq -e '
            [.[].jobs[]] as $jobs
            | all($jobs[]; .status == "completed" and (.conclusion == "success" or .conclusion == "skipped"))
              and any($jobs[]; .name == "changes" and .conclusion == "success")
              and any($jobs[]; .name == "all-green" and .conclusion == "success")
          ' > /dev/null || { echo "::error::Main CI run $id lacks successful qualification for $REVISION"; exit 1; }
        echo "Qualified $REVISION with main CI run $id" >> "$GITHUB_STEP_SUMMARY"
