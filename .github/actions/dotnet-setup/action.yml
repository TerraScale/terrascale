name: .NET setup
description: >-
  Install the .NET SDK that global.json pins with the NuGet packages of one solution from the Actions cache, then
  restore the pinned native libraries from the Actions cache.

inputs:
  dir:
    description: The repository's checkout directory inside the workspace (ci.yml checks out into `terrascale`).
    required: false
    default: "."
  solution:
    description: The solution the job restores, relative to `dir`; each solution keeps its own NuGet package cache.
    required: true
  dotnet-version:
    description: SDK versions to install beside the global.json SDK.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        global-json-file: ${{ inputs.dir }}/global.json
        cache: true
        cache-dependency-path: |
          ${{ inputs.dir }}/**/packages.lock.json
          ${{ inputs.dir }}/${{ inputs.solution }}
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.dir }}/src/vendor/Turso.Data.Sqlite/native
        key: turso-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/src/vendor/Turso.Native/SHA256SUMS', inputs.dir), format('{0}/scripts/vendor/download-turso-native.sh', inputs.dir)) }}
