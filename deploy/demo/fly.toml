# Public synthetic demo: in-memory test providers, no TerraBase, ts-auth or Stripe.
# Temporary occupant of ts-dashboard (dash.terrascale.tech) until ../../fly.toml deploys production.
app = "ts-dashboard"
primary_region = "gru"
swap_size_mb = 4096

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/readyz"
  protocol = "http"
  timeout = "5s"
