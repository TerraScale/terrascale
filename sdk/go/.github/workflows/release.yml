name: CLI release
on:
  pull_request:
    paths: ['cmd/ts/**', 'scripts/install.sh', 'scripts/test-release.py', '.goreleaser.yaml', '.github/workflows/release.yml', 'go.mod', 'go.sum', 'v1/**', 'tsauth/**']
  push:
    tags: ['v0.0.*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.19.0
          args: release --snapshot --clean
      - run: python3 scripts/test-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/homebrew/Formula/ts.rb
          retention-days: 3
  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and main ancestry
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v0\.0\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  homebrew:
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v0\.0\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: TerraScale/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Publish generated formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION=${GITHUB_REF_NAME#v}
          gh release download "v$RELEASE_VERSION" --repo TerraScale/ts-go --pattern ts.rb --dir "$RUNNER_TEMP"
          mkdir -p Formula
          cp "$RUNNER_TEMP/ts.rb" Formula/ts.rb
          git config user.name 'TerraScale'
          git config user.email 'releases@terrascale.tech'
          git add Formula/ts.rb
          git diff --cached --quiet && exit 0
          git commit -m "Update ts to $RELEASE_VERSION"
          git push
