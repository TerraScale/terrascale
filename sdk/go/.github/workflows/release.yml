name: CLI release
on:
  pull_request:
    paths: ['cmd/ts/**', 'scripts/install.sh', 'scripts/test-release.py', 'scripts/check-release-binary.sh', 'scripts/check-advisory-report.py', 'scripts/install-govulncheck.sh', 'scripts/audit-dependencies.sh', '.go-version', '.goreleaser.yaml', '.github/workflows/release.yml', 'go.mod', 'go.sum', 'v1/**', 'tsauth/**']
  push:
    tags: ['v0.0.*']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
      - name: Restore advisory scanner
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/terrascale/govulncheck-v1.9.0-go1.27.3
          key: ${{ runner.os }}-${{ runner.arch }}-govulncheck-v1.9.0-${{ hashFiles('.go-version', 'scripts/install-govulncheck.sh') }}
      - name: Check module advisories and source reachability
        run: bash scripts/audit-dependencies.sh
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.19.0
          args: release --snapshot --clean
      - run: python3 scripts/test-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/homebrew/Formula/ts.rb
          retention-days: 3
  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and main ancestry
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v0\.0\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
      - name: Restore advisory scanner
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/terrascale/govulncheck-v1.9.0-go1.27.3
          key: ${{ runner.os }}-${{ runner.arch }}-govulncheck-v1.9.0-${{ hashFiles('.go-version', 'scripts/install-govulncheck.sh') }}
      - name: Check module advisories and source reachability
        run: bash scripts/audit-dependencies.sh
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
