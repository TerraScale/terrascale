name: ts-libs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Run ts-libs checks and publish packages
    runs-on: terrascale-builder
    timeout-minutes: 15
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build ts-libs with strict diagnostics
        shell: bash
        run: |
          set -euo pipefail
          dotnet build TerraScale.Libs.slnx \
            --configuration Release \
            --nologo \
            -p:EnableNETAnalyzers=true \
            -p:Nullable=enable \
            -p:TreatWarningsAsErrors=true \
            -p:AnalysisLevel=latest-recommended

      - name: Verify ts-libs formatting
        shell: bash
        run: |
          set -euo pipefail
          dotnet format style TerraScale.Libs.slnx \
            --verify-no-changes \
            --no-restore

      - name: Run every test project under tests/
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          test_projects=(tests/**/*.csproj)
          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "No test projects found under tests/" >&2
            exit 1
          fi
          for proj in "${test_projects[@]}"; do
            echo "== Running $proj =="
            dotnet run \
              --project "$proj" \
              --configuration Release \
              --no-build \
              --no-restore \
              -- \
              --minimum-expected-tests 1
          done

      - name: Pack every packable project in the solution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- artifacts/packages
          dotnet pack TerraScale.Libs.slnx \
            --configuration Release \
            --no-build \
            --nologo \
            --output artifacts/packages
          echo "Packed packages:"
          ls -1 artifacts/packages
          if ! compgen -G "artifacts/packages/*.nupkg" > /dev/null; then
            echo "No packages were produced; every project must be non-packable or a library is missing IsPackable" >&2
            exit 1
          fi

      - name: Publish packages to the Forgejo NuGet registry
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        shell: bash
        env:
          TERRASCALE_BOT_TOKEN: ${{ secrets.TERRASCALE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # The job token cannot write packages; the organization bot token
          # carries the package write grant for the registry.
          dotnet nuget push artifacts/packages/*.nupkg \
            --source "https://git.terrascale.tech/api/packages/TerraScale/nuget/index.json" \
            --api-key "${TERRASCALE_BOT_TOKEN:?organization bot token is required}" \
            --skip-duplicate
