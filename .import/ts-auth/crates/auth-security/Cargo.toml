[package]
name = "auth-security"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
blake2 = "0.10"
ciborium = "0.2"
data-encoding = "2"
hex = "0.4"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
ring = "0.17"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
signature = "2"
subtle = "2"
thiserror = "2"
x509-parser = "0.18"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
