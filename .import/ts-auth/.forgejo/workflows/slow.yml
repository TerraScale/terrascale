name: ts-auth slow suite

# The slow integration suite: concurrency, recovery and expensive browser
# scenarios. It runs after pushes, nightly and on demand, is never a required
# check and never blocks merges or releases. A failure files or updates the
# open "Slow test suite failed" issue with fj (scripts/ci/report-slow-failure.sh).

on:
  push:
    branches: [main, refactor/csharp-port]
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

# One slow run at a time across every ref, so two failures can never both
# find no open report and file duplicate issues.
concurrency:
  group: ts-auth-slow
  cancel-in-progress: false

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # The runner mounts one /cache into every job and NUGET_PACKAGES lives there,
  # but NuGet keeps its package-extraction locks under the per-container temp
  # directory. Concurrent jobs restoring a package new to the cache then race
  # ("Could not find file .../<random>"). Keeping the locks on the shared mount
  # serializes extraction across jobs.
  NUGET_SCRATCH: /cache/nuget-scratch
  TS_DOTNET_REV: bdea1e8f4926e46367b751d8f633dcec04d760e9
  TS_LIBS_REV: 55b260872f8d4fb1cfa0975576632b4e022e4c91

jobs:
  slow:
    name: Slow suite
    runs-on: terrascale-builder
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the pinned ts-dotnet and ts-libs revisions
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: bash scripts/ci/checkout-dotnet-deps.sh

      # The reporter only runs after a failure, so prove now that it can: fj is
      # installed, and a dry-run report renders without any log text.
      - name: Check the failure reporter
        run: |
          set -euo pipefail
          fj version
          printf '%s\n' 'failed Example (1s)' 'Authorization: Bearer reporter-check-secret' > "$RUNNER_TEMP/reporter-check.log"
          REPORT_DRY_RUN=1 scripts/ci/report-slow-failure.sh "$RUNNER_TEMP/reporter-check.log" > "$RUNNER_TEMP/reporter-check.md"
          grep -q '^# Slow test suite failed' "$RUNNER_TEMP/reporter-check.md"
          ! grep -q 'reporter-check-secret' "$RUNNER_TEMP/reporter-check.md"

      - name: Slow integration suite
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          TS_AUTH_CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          export TS_AUTH_CHROMIUM_PATH
          make test-slow CONFIGURATION=Release 2>&1 | tee artifacts/slow.log

      - name: File the failure as a Forgejo issue
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: scripts/ci/report-slow-failure.sh artifacts/slow.log
