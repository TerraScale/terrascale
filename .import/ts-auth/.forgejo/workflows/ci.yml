name: ts-auth CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Check and build Rust ts-auth
    runs-on: terrascale-builder
    timeout-minutes: 60
    env:
      FORGEJO_SHA: ${{ forgejo.sha }}
      FORGEJO_TOKEN: ${{ forgejo.token }}
      TS_RUST_REV: c590cd41eabf05bbd5982a1580c1bb01880c346a
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pinned Rust SDK
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://oauth2:${ORG_READ_TOKEN:?org read token is required}@git.terrascale.tech/TerraScale/ts-rust.git" ../ts-rust
          git -C ../ts-rust checkout --detach "${TS_RUST_REV}"
          test "$(git -C ../ts-rust rev-parse HEAD)" = "${TS_RUST_REV}"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
          rustup run 1.98.1 cargo --version

      - name: Check formatting and run Rust tests
        run: |
          set -euo pipefail
          export RUSTC="$(rustup which rustc --toolchain 1.98.1)"
          rustup run 1.98.1 cargo fmt --all -- --check
          rustup run 1.98.1 cargo clippy --workspace --all-targets --locked -- -D warnings
          mkdir -p artifacts/ci/tests
          rustup run 1.98.1 cargo test --workspace --all-targets --locked 2>&1 | tee artifacts/ci/tests/auth-tests.log
          grep -Fq 'test result: ok.' artifacts/ci/tests/auth-tests.log
          (cd artifacts/ci/tests && sha256sum auth-tests.log > SHA256SUMS)
          (cd artifacts/ci/tests && sha256sum --check --strict SHA256SUMS)
          jq -n \
            --arg sourceCommit "${FORGEJO_SHA:?event SHA is required}" \
            --arg sdkCommit "${TS_RUST_REV}" \
            --arg testLog "auth-tests.log" \
            --arg digests "SHA256SUMS" \
            '{schemaVersion: 1, sourceCommit: $sourceCommit, sdkCommit: $sdkCommit, testLog: $testLog, digests: $digests}' \
            > artifacts/ci/tests/test-receipt.json

      - name: Audit locked Rust dependencies
        run: |
          set -euo pipefail
          export RUSTC="$(rustup which rustc --toolchain 1.98.1)"
          audit_root="${RUNNER_TEMP:-/tmp}/ts-auth-cargo-audit"
          CARGO_TARGET_DIR="${RUNNER_TEMP:-/tmp}/ts-auth-cargo-audit-target" \
            rustup run 1.98.1 cargo install cargo-audit --version 0.22.2 --locked --root "${audit_root}"
          # RUSTSEC-2023-0071 affects RSA private-key operations. Current RSA
          # use is public verification only; revisit before adding private RSA
          # signing/decryption. Keep all other advisory failures enabled.
          "${audit_root}/bin/cargo-audit" audit --file Cargo.lock --ignore RUSTSEC-2023-0071

      - name: Build and inspect the release image
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "${source_commit}" = "${FORGEJO_SHA:?event SHA is required}"
          # Build against Debian's older glibc so the binary runs in the
          # distroless Debian 13 runtime even when the host runner is newer.
          podman run --rm --userns=keep-id --security-opt label=disable \
            --volume "$PWD:/work/ts-auth" \
            --volume "$(realpath ../ts-rust):/work/ts-rust:ro" \
            --workdir /work/ts-auth \
            --env CARGO_HOME=/tmp/ts-auth-cargo \
            --env CARGO_TARGET_DIR=/work/ts-auth/target/ci-debian \
            docker.io/library/rust:1.98.1-bookworm \
            cargo build --release --locked -p auth-app
          mkdir -p artifacts/ci/container-publish
          cp -- target/ci-debian/release/auth-app artifacts/ci/container-publish/ts-auth
          test -s artifacts/ci/container-publish/ts-auth
          podman build \
            --pull=missing \
            --platform linux/amd64 \
            --tag "localhost/terrascale/ts-auth:${source_commit}" \
            --file Containerfile .
          image="localhost/terrascale/ts-auth:${source_commit}"
          podman image inspect "${image}"
          test "$(podman image inspect "${image}" --format '{{.Architecture}}')" = amd64
          test "$(podman image inspect "${image}" --format '{{.Os}}')" = linux

          # Exercise the packaged binary and composed router without a live
          # TerraBase implementation; readiness must fail closed.
          port="$(python3 - <<'PY'
          import socket
          with socket.socket() as listener:
              listener.bind(('127.0.0.1', 0))
              print(listener.getsockname()[1])
          PY
          )"
          container="ts-auth-ci-${source_commit:0:12}"
          podman run --detach --rm --name "${container}" --network host \
            --env TS_AUTH_ENVIRONMENT=Development \
            --env "TS_AUTH_LISTEN=http://127.0.0.1:${port}" \
            --env "TS_AUTH_PUBLIC_ORIGIN=http://127.0.0.1:${port}" \
            --env TS_AUTH_TERRASCALE_API_URL=http://127.0.0.1:1 \
            --env TS_AUTH_TERRASCALE_API_KEY=ci-contract-key \
            --env TS_AUTH_DATABASE=ci-contract-db \
            --env TS_AUTH_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env TS_AUTH_OPERATOR_KEY=ci-operator \
            --env TS_AUTH_METRICS_KEY=ci-metrics \
            "${image}"
          trap 'podman stop "${container}" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl --silent --fail --max-time 2 "http://127.0.0.1:${port}/healthz" >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if test "${ready}" != 1; then podman logs "${container}"; exit 1; fi
          curl --silent --fail "http://127.0.0.1:${port}/openapi/v1.json" | jq -e '.info.title == "TerraScale Auth API" and .paths["/healthz"] != null'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/readyz")" = 503
