name: ts-auth CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Check and build ts-auth
    runs-on: terrascale-builder
    # The browser-driven hosted-UI suite needs the headroom (serialized E2E classes).
    timeout-minutes: 60
    env:
      FORGEJO_SHA: ${{ forgejo.sha }}
      FORGEJO_TOKEN: ${{ forgejo.token }}
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Clone sibling sources (TerraScale SDK + TerraBase engine)
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          set -euo pipefail
          # ts-auth builds against the sibling checkouts of ts-dotnet and terrabase
          # (the same layout developers use locally). The job token cannot read
          # sibling org repos, so the clones use the org read token.
          parent="$(pwd)/.."
          git clone --depth 1 "https://oauth2:${ORG_READ_TOKEN:?org read token is required}@git.terrascale.tech/TerraScale/ts-dotnet.git" "${parent}/ts-dotnet"
          git clone --depth 1 "https://oauth2:${ORG_READ_TOKEN}@git.terrascale.tech/TerraScale/terrabase.git" "${parent}/terrabase"
          # TerraBase builds TerraScale.Endpoints from the ts-libs sibling when present.
          git clone --depth 1 "https://oauth2:${ORG_READ_TOKEN}@git.terrascale.tech/TerraScale/ts-libs.git" "${parent}/ts-libs"
          # TerraBase main is .NET 11 only; pin to the first net11 commit until
          # ts-auth tracks its tip deliberately.
          git clone --no-checkout "https://oauth2:${ORG_READ_TOKEN}@git.terrascale.tech/TerraScale/terrabase.git" "${parent}/terrabase-pin"
          git -C "${parent}/terrabase-pin" checkout --detach fadef600
          rm -rf "${parent}/terrabase" && mv "${parent}/terrabase-pin" "${parent}/terrabase"

      - name: Restore ts-auth tests
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="${RUNNER_TEMP:-/tmp}/ts-auth-nuget"
          mkdir -p -- "${NUGET_PACKAGES}"
          dotnet restore \
            tests/TerraScale.Auth.Tests/TerraScale.Auth.Tests.csproj \
            --runtime linux-x64 --nologo
          dotnet restore \
            src/TerraScale.Auth/TerraScale.Auth.csproj \
            --runtime linux-x64 --nologo

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-msft-1.62.0-chromium

      # Browser-driven hosted-UI tests need Chromium; the Microsoft.Playwright
      # NuGet package pins 1.62 (the baked image engines are 1.63), so install
      # the matching engine from the package's bundled node.
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="${RUNNER_TEMP:-/tmp}/ts-auth-nuget"
          playwright_root="${NUGET_PACKAGES}/microsoft.playwright/1.62.0/.playwright"
          node_bin="${playwright_root}/node/linux-x64/node"
          test -x "${node_bin}"
          "${node_bin}" "${playwright_root}/package/cli.js" install chromium

      - name: Build ts-auth tests and service
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="${RUNNER_TEMP:-/tmp}/ts-auth-nuget"
          exec dotnet build \
            tests/TerraScale.Auth.Tests/TerraScale.Auth.Tests.csproj \
            --configuration Release --no-restore --nologo

      - name: Verify dependency audit failure handling
        run: dotnet run scripts/check-nuget-vulnerabilities.tests.cs -- --minimum-expected-tests 13

      - name: Fail closed on vulnerable NuGet packages
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="${RUNNER_TEMP:-/tmp}/ts-auth-nuget"
          dotnet run scripts/check-nuget-vulnerabilities.cs \
            src/TerraScale.Auth/TerraScale.Auth.csproj \
            tests/TerraScale.Auth.Tests/TerraScale.Auth.Tests.csproj

      - name: Run ts-auth tests
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="${RUNNER_TEMP:-/tmp}/ts-auth-nuget"
          mkdir -p -- artifacts/ci/tests
          test_log="artifacts/ci/tests/auth-tests.log"
          dotnet run \
            --project tests/TerraScale.Auth.Tests/TerraScale.Auth.Tests.csproj \
            --configuration Release --no-build -- \
            --minimum-expected-tests 50 \
            --maximum-parallel-tests 1 \
            --log-level None 2>&1 | tee "${test_log}"
          grep -Fq 'Test run summary: Passed!' "${test_log}"
          grep -Eq 'failed: 0' "${test_log}"
          report="$(find tests/TerraScale.Auth.Tests -type f -path '*/TestResults/*-report.html' -print -quit)"
          test -n "${report}"
          cp -- "${report}" artifacts/ci/tests/ts-auth-tunit-report.html
          (cd artifacts/ci/tests && sha256sum auth-tests.log ts-auth-tunit-report.html) \
            > artifacts/ci/tests/SHA256SUMS
          (cd artifacts/ci/tests && sha256sum --check --strict SHA256SUMS)
          jq -n \
            --arg sourceCommit "${FORGEJO_SHA:?event SHA is required}" \
            --arg testLog "auth-tests.log" \
            --arg report "ts-auth-tunit-report.html" \
            --arg digests "SHA256SUMS" \
            '{schemaVersion: 1, sourceCommit: $sourceCommit, testLog: $testLog, report: $report, digests: $digests}' \
            > artifacts/ci/tests/test-receipt.json
          echo 'Generated test evidence receipt:'
          cat artifacts/ci/tests/test-receipt.json
          echo 'Generated test evidence checksums:'
          cat artifacts/ci/tests/SHA256SUMS

      - name: Build and inspect the release image
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="${RUNNER_TEMP:-/tmp}/ts-auth-nuget"

          source_commit="$(git rev-parse HEAD)"
          test "${source_commit}" = "${FORGEJO_SHA:?event SHA is required}"
          mkdir -p -- artifacts/ci/container-publish
          dotnet restore \
            src/TerraScale.Auth/TerraScale.Auth.csproj \
            --runtime linux-x64 --nologo
          dotnet publish \
            src/TerraScale.Auth/TerraScale.Auth.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            --output artifacts/ci/container-publish \
            --nologo \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None
          test -s artifacts/ci/container-publish/TerraScale.Auth
          podman build \
            --pull=missing \
            --platform linux/amd64 \
            --tag "localhost/terrascale/ts-auth:${source_commit}" \
            --file Containerfile .
          image="localhost/terrascale/ts-auth:${source_commit}"
          podman image inspect "${image}"
          test "$(podman image inspect "${image}" --format '{{.Architecture}}')" = amd64
          test "$(podman image inspect "${image}" --format '{{.Os}}')" = linux

      - name: Publish immutable container on protected main
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
          REPOSITORY_OWNER: ${{ forgejo.repository_owner }}
        run: |
          set -euo pipefail
          source_commit="${FORGEJO_SHA:?event SHA is required}"
          local_image="localhost/terrascale/ts-auth:${source_commit}"
          # Container repository names must be lowercase; the org ("TerraScale") maps to "terrascale".
          remote_image="git.terrascale.tech/$(printf '%s' "${REPOSITORY_OWNER:?owner is required}" | tr '[:upper:]' '[:lower:]')/ts-auth:${source_commit}"
          # The runner exports REGISTRY_AUTH_FILE as a bind-mounted file under
          # /etc/containers; podman login rewrites its auth file via rename,
          # which fails with EBUSY on a bind mount. Use a job-local auth file.
          export REGISTRY_AUTH_FILE="${RUNNER_TEMP:-/tmp}/ts-auth-podman-auth.json"
          # The job token authenticates but cannot write packages: the layer
          # upload fails with 'authentication required'. A user/org token with
          # the package write grant is required.
          printf '%s\n' "${REGISTRY_PUSH_TOKEN:?registry push token is required}" | \
            podman login git.terrascale.tech --username "${REPOSITORY_OWNER}" --password-stdin >/dev/null
          podman tag "${local_image}" "${remote_image}"
          podman push "${remote_image}"
          podman image inspect "${remote_image}"
