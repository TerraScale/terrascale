name: ts-auth CI

# fast and release run in parallel and keep compiled dependencies in per-job
# Cargo target directories on the runner's persistent /cache volume, compiling
# through the shared kache store there (scripts/ci/cargo-cache.sh). publish
# never reads either cache: it builds the released binary from a clean target
# directory and Cargo home, without kache.
# Release binaries are static x86_64 musl executables built with the job
# image's musl toolchain, like TerraBase's.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-auth-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

env:
  FORGEJO_SHA: ${{ forgejo.sha }}
  TS_RUST_REV: 764b92808848cb74fe1cc92d41357614fa4e5e42

jobs:
  fast:
    name: Check and test Rust ts-auth
    runs-on: terrascale-builder
    timeout-minutes: 60
    env:
      TS_AUTH_CARGO_CACHE_DIR: /cache/cargo-target/ts-auth/fast
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the pinned Rust SDK and select the toolchain
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: bash scripts/ci/checkout-sdk.sh

      - name: Check formatting and run Rust tests
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          bash scripts/ci/cargo-cache.sh cargo clippy --workspace --all-targets --locked -- -D warnings
          mkdir -p artifacts/ci/tests
          bash scripts/ci/cargo-cache.sh cargo test --workspace --all-targets --locked 2>&1 | tee artifacts/ci/tests/auth-tests.log
          bash scripts/check-rust-test-results.sh artifacts/ci/tests/auth-tests.log
          (cd artifacts/ci/tests && sha256sum auth-tests.log > SHA256SUMS)
          (cd artifacts/ci/tests && sha256sum --check --strict SHA256SUMS)
          jq -n \
            --arg sourceCommit "${FORGEJO_SHA:?event SHA is required}" \
            --arg sdkCommit "${TS_RUST_REV}" \
            --arg testLog "auth-tests.log" \
            --arg digests "SHA256SUMS" \
            '{schemaVersion: 1, sourceCommit: $sourceCommit, sdkCommit: $sdkCommit, testLog: $testLog, digests: $digests}' \
            > artifacts/ci/tests/test-receipt.json

      - name: Audit locked Rust dependencies
        run: |
          set -euo pipefail
          # This advisory affects RSA private-key operations. Production auth-
          # security code uses RSA public keys for verification; the private
          # keys in security_vectors.rs only create test signatures. Guard that
          # production boundary before keeping this single-advisory exception.
          bash scripts/check-rsa-private-usage.sh
          cargo audit --file Cargo.lock --ignore RUSTSEC-2023-0071

      # Playwright and Chromium are baked into the ts-builder job image.
      - name: Run admin browser acceptance
        env:
          TS_AUTH_PLAYWRIGHT_MODULE: /usr/lib/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          TS_AUTH_CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          export TS_AUTH_CHROMIUM_PATH
          bash scripts/ci/cargo-cache.sh cargo test --locked -p auth-app --test admin_browser -- --ignored --nocapture
          bash scripts/ci/cargo-cache.sh cargo test --locked -p auth-app --test device_authorization -- --ignored --nocapture

  release:
    name: Build and inspect the static release image
    runs-on: terrascale-builder
    timeout-minutes: 60
    env:
      TS_AUTH_CARGO_CACHE_DIR: /cache/cargo-target/ts-auth/release
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the pinned Rust SDK and select the toolchain
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: bash scripts/ci/checkout-sdk.sh

      - name: Build the static release binary
        run: bash scripts/ci/cargo-cache.sh bash scripts/ci/stage-release.sh artifacts/ci/container-publish

      - name: Package and smoke-check the release image
        run: bash scripts/ci/package-image.sh

  publish:
    name: Publish the immutable container on protected main
    needs: [fast, release]
    if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
    runs-on: terrascale-builder
    timeout-minutes: 60
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the pinned Rust SDK and select the toolchain
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: bash scripts/ci/checkout-sdk.sh

      - name: Build the static release binary from a clean cache
        run: |
          set -euo pipefail
          export CARGO_HOME="${RUNNER_TEMP:?}/cargo-home" CARGO_TARGET_DIR="${RUNNER_TEMP:?}/cargo-target"
          bash scripts/ci/stage-release.sh artifacts/ci/container-publish

      - name: Package and smoke-check the release image
        run: bash scripts/ci/package-image.sh

      - name: Push the image
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
          REPOSITORY_OWNER: ${{ forgejo.repository_owner }}
        run: |
          set -euo pipefail
          source_commit="${FORGEJO_SHA:?event SHA is required}"
          local_image="localhost/terrascale/ts-auth:${source_commit}"
          remote_image="git.terrascale.tech/$(printf '%s' "${REPOSITORY_OWNER:?owner is required}" | tr '[:upper:]' '[:lower:]')/ts-auth:${source_commit}"
          export REGISTRY_AUTH_FILE="${RUNNER_TEMP:-/tmp}/ts-auth-podman-auth.json"
          printf '%s\n' "${REGISTRY_PUSH_TOKEN:?registry push token is required}" | \
            podman login git.terrascale.tech --username "${REPOSITORY_OWNER}" --password-stdin >/dev/null
          podman tag "${local_image}" "${remote_image}"
          podman push "${remote_image}"
          podman image inspect "${remote_image}"
