name: ts-auth staging registry retention

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

concurrency:
  # Serialize with protected-main CI so no candidate is staged during pruning.
  group: ts-auth-refs/heads/main
  cancel-in-progress: false

jobs:
  prune:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: terrascale-builder
    timeout-minutes: 15
    steps:
      - name: Check out protected main
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: 'https://git.terrascale.tech'
          ref: main
          persist-credentials: false
      - name: Remove expired staging candidates
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
          REPOSITORY_OWNER: ${{ forgejo.repository_owner }}
        run: bash scripts/ci/transfer-image.sh prune
