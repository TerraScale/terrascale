name: TerraBase protected candidate promotion

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Trusted main-branch release workflow run containing the exact unsigned native packages.
        required: true
        type: string
      capability_run_id:
        description: Protected qualification run containing signed production capability evidence.
        required: true
        type: string
      capability_workflow_id:
        description: Exact protected qualification workflow file name, for example qualification.yml.
        required: true
        type: string
      confirm_release:
        description: Confirm promotion of the exact main-branch packages without rebuilding.
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: terrabase-protected-promotion
  cancel-in-progress: false

jobs:
  sign-amd64:
    name: promote/amd64-native
    if: ${{ inputs.confirm_release && forgejo.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, protected, terrabase-release-amd64]
    timeout-minutes: 60
    environment: terrabase-release-signing
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact AMD64 promotion checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse '${{ forgejo.sha }}^{tree}')"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Authenticate selected Forgejo workflow runs
        env:
          FORGEJO_API_URL: ${{ forgejo.server_url }}/api/v1
          FORGEJO_API_TOKEN: ${{ secrets.TERRABASE_RELEASE_ARTIFACT_TOKEN }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CAPABILITY_RUN_ID: ${{ inputs.capability_run_id }}
          EXPECTED_REVISION: ${{ forgejo.sha }}
          EXPECTED_REPOSITORY: ${{ forgejo.repository }}
          CAPABILITY_WORKFLOW_ID: ${{ inputs.capability_workflow_id }}
        run: >-
          deploy/release/verify-workflow-runs.sh
          "$CANDIDATE_RUN_ID" "$CAPABILITY_RUN_ID" "$EXPECTED_REVISION"
          "$EXPECTED_REPOSITORY" refs/heads/main "$CAPABILITY_WORKFLOW_ID"
      - name: Download the exact unsigned AMD64 packages
        uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: terrabase-unsigned-amd64
          path: artifacts/unsigned
          github-token: ${{ secrets.TERRABASE_RELEASE_ARTIFACT_TOKEN }}
          repository: ${{ forgejo.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download independently signed production capability evidence
        uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: terrabase-production-capability
          path: artifacts/capability
          github-token: ${{ secrets.TERRABASE_RELEASE_ARTIFACT_TOKEN }}
          repository: ${{ forgejo.repository }}
          run-id: ${{ inputs.capability_run_id }}
      - name: Bind downloaded bytes and capability evidence to this commit
        env:
          EXPECTED_REVISION: ${{ forgejo.sha }}
        run: |
          set -euo pipefail
          expected_tree=$(git rev-parse "${EXPECTED_REVISION}^{tree}")
          for package_dir in artifacts/unsigned/terrabase-server-amd64 artifacts/unsigned/terrabase-studio-amd64; do
            manifests=("$package_dir"/*.release.json)
            test "${#manifests[@]}" -eq 1
            test "$(jq -er '.source.revision' "${manifests[0]}")" = "$EXPECTED_REVISION"
            test "$(jq -er '.source.tree' "${manifests[0]}")" = "$expected_tree"
            test "$(jq -er '.source.dirty' "${manifests[0]}")" = false
          done
          statement=artifacts/capability/PRODUCTION-CAPABILITY.json
          test "$(jq -er '.subject.revision' "$statement")" = "$EXPECTED_REVISION"
          test "$(jq -er '.subject.tree' "$statement")" = "$expected_tree"
          for evidence in cluster-composition encryption-at-rest; do
            test "$(jq -er '.source.revision' "artifacts/capability/$evidence.evidence.json")" = "$EXPECTED_REVISION"
            test "$(jq -er '.source.tree' "artifacts/capability/$evidence.evidence.json")" = "$expected_tree"
          done
      - name: Admit, sign, and verify the exact AMD64 package bytes
        env:
          TERRABASE_RELEASE_SIGNING_KEY_PEM: ${{ secrets.TERRABASE_RELEASE_SIGNING_KEY_PEM }}
          TERRABASE_RELEASE_VERIFY_KEY_PEM: ${{ secrets.TERRABASE_RELEASE_VERIFY_KEY_PEM }}
          TERRABASE_PRODUCTION_CAPABILITY_VERIFY_KEY_PEM: ${{ secrets.TERRABASE_PRODUCTION_CAPABILITY_VERIFY_KEY_PEM }}
          TERRABASE_PRODUCTION_CAPABILITY_STATEMENT: artifacts/capability/PRODUCTION-CAPABILITY.json
          TERRABASE_PRODUCTION_CAPABILITY_SIGNATURE: artifacts/capability/PRODUCTION-CAPABILITY.sig
          TERRABASE_PRODUCTION_CAPABILITY_EVIDENCE_DIRECTORY: artifacts/capability
        run: |
          deploy/release/verify-source-binding.sh --target x86_64-unknown-linux-gnu artifacts/unsigned/terrabase-server-amd64 artifacts/unsigned/terrabase-studio-amd64
          deploy/release/sign.sh artifacts/unsigned/terrabase-server-amd64
          deploy/release/sign.sh artifacts/unsigned/terrabase-studio-amd64
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: terrabase-signed-amd64-${{ forgejo.sha }}
          path: |
            artifacts/unsigned/terrabase-server-amd64
            artifacts/unsigned/terrabase-studio-amd64
          if-no-files-found: error
          retention-days: 30

  sign-arm64:
    name: promote/arm64-native
    if: ${{ inputs.confirm_release && forgejo.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, protected, terrabase-release-arm64]
    timeout-minutes: 60
    environment: terrabase-release-signing
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact ARM64 promotion checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse '${{ forgejo.sha }}^{tree}')"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Authenticate selected Forgejo workflow runs
        env:
          FORGEJO_API_URL: ${{ forgejo.server_url }}/api/v1
          FORGEJO_API_TOKEN: ${{ secrets.TERRABASE_RELEASE_ARTIFACT_TOKEN }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CAPABILITY_RUN_ID: ${{ inputs.capability_run_id }}
          EXPECTED_REVISION: ${{ forgejo.sha }}
          EXPECTED_REPOSITORY: ${{ forgejo.repository }}
          CAPABILITY_WORKFLOW_ID: ${{ inputs.capability_workflow_id }}
        run: >-
          deploy/release/verify-workflow-runs.sh
          "$CANDIDATE_RUN_ID" "$CAPABILITY_RUN_ID" "$EXPECTED_REVISION"
          "$EXPECTED_REPOSITORY" refs/heads/main "$CAPABILITY_WORKFLOW_ID"
      - name: Download the exact unsigned ARM64 packages
        uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: terrabase-unsigned-arm64
          path: artifacts/unsigned
          github-token: ${{ secrets.TERRABASE_RELEASE_ARTIFACT_TOKEN }}
          repository: ${{ forgejo.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download independently signed production capability evidence
        uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: terrabase-production-capability
          path: artifacts/capability
          github-token: ${{ secrets.TERRABASE_RELEASE_ARTIFACT_TOKEN }}
          repository: ${{ forgejo.repository }}
          run-id: ${{ inputs.capability_run_id }}
      - name: Bind downloaded bytes and capability evidence to this commit
        env:
          EXPECTED_REVISION: ${{ forgejo.sha }}
        run: |
          set -euo pipefail
          expected_tree=$(git rev-parse "${EXPECTED_REVISION}^{tree}")
          for package_dir in artifacts/unsigned/terrabase-server-arm64 artifacts/unsigned/terrabase-studio-arm64; do
            manifests=("$package_dir"/*.release.json)
            test "${#manifests[@]}" -eq 1
            test "$(jq -er '.source.revision' "${manifests[0]}")" = "$EXPECTED_REVISION"
            test "$(jq -er '.source.tree' "${manifests[0]}")" = "$expected_tree"
            test "$(jq -er '.source.dirty' "${manifests[0]}")" = false
          done
          statement=artifacts/capability/PRODUCTION-CAPABILITY.json
          test "$(jq -er '.subject.revision' "$statement")" = "$EXPECTED_REVISION"
          test "$(jq -er '.subject.tree' "$statement")" = "$expected_tree"
          for evidence in cluster-composition encryption-at-rest; do
            test "$(jq -er '.source.revision' "artifacts/capability/$evidence.evidence.json")" = "$EXPECTED_REVISION"
            test "$(jq -er '.source.tree' "artifacts/capability/$evidence.evidence.json")" = "$expected_tree"
          done
      - name: Admit, sign, and verify the exact ARM64 package bytes
        env:
          TERRABASE_RELEASE_SIGNING_KEY_PEM: ${{ secrets.TERRABASE_RELEASE_SIGNING_KEY_PEM }}
          TERRABASE_RELEASE_VERIFY_KEY_PEM: ${{ secrets.TERRABASE_RELEASE_VERIFY_KEY_PEM }}
          TERRABASE_PRODUCTION_CAPABILITY_VERIFY_KEY_PEM: ${{ secrets.TERRABASE_PRODUCTION_CAPABILITY_VERIFY_KEY_PEM }}
          TERRABASE_PRODUCTION_CAPABILITY_STATEMENT: artifacts/capability/PRODUCTION-CAPABILITY.json
          TERRABASE_PRODUCTION_CAPABILITY_SIGNATURE: artifacts/capability/PRODUCTION-CAPABILITY.sig
          TERRABASE_PRODUCTION_CAPABILITY_EVIDENCE_DIRECTORY: artifacts/capability
        run: |
          deploy/release/verify-source-binding.sh --target aarch64-unknown-linux-gnu artifacts/unsigned/terrabase-server-arm64 artifacts/unsigned/terrabase-studio-arm64
          deploy/release/sign.sh artifacts/unsigned/terrabase-server-arm64
          deploy/release/sign.sh artifacts/unsigned/terrabase-studio-arm64
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: terrabase-signed-arm64-${{ forgejo.sha }}
          path: |
            artifacts/unsigned/terrabase-server-arm64
            artifacts/unsigned/terrabase-studio-arm64
          if-no-files-found: error
          retention-days: 30

  publish-multiarch:
    name: promote/publish-multiarch
    if: ${{ inputs.confirm_release && forgejo.ref == 'refs/heads/main' }}
    needs: [sign-amd64, sign-arm64]
    runs-on: [self-hosted, protected, terrabase-release-publisher]
    timeout-minutes: 60
    environment: terrabase-release-signing
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact publication checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse '${{ forgejo.sha }}^{tree}')"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Download signed AMD64 packages from this promotion
        uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: terrabase-signed-amd64-${{ forgejo.sha }}
          path: artifacts/signed-amd64
      - name: Download signed ARM64 packages from this promotion
        uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: terrabase-signed-arm64-${{ forgejo.sha }}
          path: artifacts/signed-arm64
      - name: Verify and publish immutable multi-architecture images
        env:
          TERRABASE_RELEASE_VERIFY_KEY_PEM: ${{ secrets.TERRABASE_RELEASE_VERIFY_KEY_PEM }}
          TERRABASE_RELEASE_REGISTRY: ${{ vars.TERRABASE_RELEASE_REGISTRY }}
          TERRABASE_RELEASE_REGISTRY_USERNAME: ${{ secrets.TERRABASE_RELEASE_REGISTRY_USERNAME }}
          TERRABASE_RELEASE_REGISTRY_TOKEN: ${{ secrets.TERRABASE_RELEASE_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/publication
          {
            deploy/release/publish-oci.sh artifacts/signed-amd64/terrabase-server-amd64 artifacts/signed-arm64/terrabase-server-arm64
            deploy/release/publish-oci.sh artifacts/signed-amd64/terrabase-studio-amd64 artifacts/signed-arm64/terrabase-studio-arm64
          } >artifacts/publication/immutable-oci-references.txt
          cat artifacts/publication/immutable-oci-references.txt
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: terrabase-immutable-oci-references-${{ forgejo.sha }}
          path: artifacts/publication/immutable-oci-references.txt
          if-no-files-found: error
          retention-days: 30
