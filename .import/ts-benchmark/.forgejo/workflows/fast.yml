name: Fast
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ts-benchmark-fast-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}
env:
  CI: "true"
jobs:
  protocol:
    name: Protocol and runner
    runs-on: terrascale-builder
    timeout-minutes: 10
    container:
      image: git.terrascale.tech/terrascale/ts-builder:latest
      options: --memory=2g
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate workload, scheduler and aggregation contracts
        run: make check
