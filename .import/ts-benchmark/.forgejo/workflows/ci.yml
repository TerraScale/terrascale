name: terrabase CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  ci:
    uses: TerraScale/ts-deploy/.forgejo/workflows/deploy.yml@main
    with:
      repo: terrabase
    secrets: inherit
    runs-on: terrascale-builder
