name: Rust benchmark build and guest environment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-driver:
    name: Format, check, and build Rust SQLite driver
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          persist-credentials: false

      - name: Build at lowest CPU and I/O priority
        run: nice -n 19 ionice -c 3 make fmt check build

      - name: Build the guest executable
        run: |
          rustup target add x86_64-unknown-linux-musl --toolchain 1.98.1
          nice -n 19 ionice -c 3 make build-guest

  firecracker-environment:
    name: Verify pinned guest and boot smoke
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          persist-credentials: false

      - name: Verify Firecracker, KVM, images, and effective guest limits
        run: nice -n 19 ionice -c 3 make vm-preflight vm-smoke
