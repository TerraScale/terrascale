name: Rust benchmark driver validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-benchmark-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

jobs:
  rust-driver:
    name: Check Rust driver against published TerraBase source
    runs-on: terrascale-builder
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CI: "true"
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          path: ts-benchmark
          persist-credentials: false

      - name: Require a published TerraBase commit
        env:
          ENGINE_SHA: ${{ vars.TERRABASE_CI_SHA }}
        run: |
          if [ "${#ENGINE_SHA}" -ne 40 ]; then
            echo 'TERRABASE_CI_SHA must be a published 40-character commit SHA' >&2
            exit 2
          fi
          case "$ENGINE_SHA" in
            *[!0123456789abcdef]*) echo 'TERRABASE_CI_SHA must be lowercase hexadecimal' >&2; exit 2 ;;
          esac

      - name: Check out the paired TerraBase source
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/terrabase
          ref: ${{ vars.TERRABASE_CI_SHA }}
          path: terrabase
          token: ${{ secrets.TERRABASE_READ_TOKEN || forgejo.token }}
          persist-credentials: false

      - name: Verify paired source layout and revision
        env:
          ENGINE_SHA: ${{ vars.TERRABASE_CI_SHA }}
          BENCHMARK_SHA: ${{ forgejo.sha }}
        run: |
          test "$(git -C ts-benchmark rev-parse HEAD)" = "$BENCHMARK_SHA" || { echo 'Benchmark checkout differs from the event revision' >&2; exit 2; }
          test "$(git -C terrabase rev-parse HEAD)" = "$ENGINE_SHA" || { echo 'TerraBase checkout revision differs from TERRABASE_CI_SHA' >&2; exit 2; }
          test -f terrabase/crates/tb-core/Cargo.toml || { echo 'Published TerraBase source lacks crates/tb-core' >&2; exit 2; }
          test -f terrabase/crates/tb-storage/Cargo.toml || { echo 'Published TerraBase source lacks crates/tb-storage' >&2; exit 2; }
          printf 'Benchmark commit: %s\nTerraBase commit: %s\n' "$BENCHMARK_SHA" "$ENGINE_SHA"

      - name: Validate Rust driver modes and build the host SQLite driver
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          unset RUSTUP_TOOLCHAIN
          make -C ts-benchmark fmt check lint build check-engine lint-engine

      - name: Validate and build the HTTPS diagnostic driver
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          unset RUSTUP_TOOLCHAIN
          make -C ts-benchmark/https-document fmt check lint build
