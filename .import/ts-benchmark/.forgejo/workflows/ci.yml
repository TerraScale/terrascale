name: foundation checks

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo check --workspace --locked
      - name: Test
        run: cargo test --workspace --locked --release
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
      - name: Parity schema
        run: python3 scripts/validate_parity.py --check
      - name: Parity tooling tests
        run: python3 scripts/test_parity_tooling.py
      - name: V1 citation qualification
        env:
          TERRABASE_V1_ROOT: ${{ vars.TERRABASE_V1_ROOT }}
        run: |
          if [[ -z "${TERRABASE_V1_ROOT:-}" || ! -d "$TERRABASE_V1_ROOT" ]]; then
            echo "V1 citation audit UNRUN: configure a pinned TerraBase V1 checkout for qualification"
            exit 1
          fi
          python3 scripts/validate_v1_citations.py \
            --mode strict \
            --v1-root "$TERRABASE_V1_ROOT" \
            --workspace-root "$GITHUB_WORKSPACE" \
            --gap-report parity/v1-test-gaps.json
      - name: License metadata
        run: python3 scripts/check_license.py
      - name: Secret scan
        run: ./scripts/check_secrets.sh
      - name: Dependency, license, and advisory audit
        run: |
          if command -v cargo-deny >/dev/null 2>&1; then
            cargo deny check
          else
            echo "cargo-deny unavailable on this runner; audit recorded as unrun"
          fi
