name: terrabase checks

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  # Forgejo's runner provides the GitHub-compatible context for workflow and
  # ref values; using it also keeps this file portable to local act runs.
  group: terrabase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: gcc
  CXX: g++
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTDOCFLAGS: "-D warnings"

jobs:
  checks:
    runs-on: terrascale-builder
    timeout-minutes: 120
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checks checkout revision
        run: |
          event_sha='${{ forgejo.sha }}'
          checked_out_head="$(git rev-parse --verify HEAD)"
          [[ "$event_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$event_sha" == "$checked_out_head" ]]
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: terrabase-go/go.mod
          cache: false
      - name: Install pinned Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Select explicit GCC host linker
        run: |
          host_triple="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host_triple"
          linker_env="CARGO_TARGET_$(printf '%s' "$host_triple" | LC_ALL=C tr '[:lower:]-' '[:upper:]_')_LINKER"
          printf '%s=gcc\n' "$linker_env" >> "$GITHUB_ENV"
      - name: Cache Cargo dependencies
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            bench/target
            crates/terrabase-studio/target
          key: ${{ runner.os }}-rust-1.97.1-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.1-
      - name: Workspace metadata (locked)
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build (debug)
        run: cargo check --workspace --all-targets --locked
      - name: Build (release)
        run: cargo build --workspace --locked --release
      - name: Build production server with AWS-LC FIPS
        run: cargo build -p terrabase-server --locked --release --no-default-features --features production-fips
      # Dev profile first: debug_assert! contracts compile out under
      # --release, so a release-only run cannot gate them (SE-07 warden
      # repair: an off-by-one frame-header assertion was green in every
      # release gate and deterministically red in dev).
      - name: Test (dev profile)
        run: |
          cargo test --workspace --locked -- \
            --skip benchmarks::lane_run::tests::probe_lane_operation_costs \
            --skip benchmarks::lane_run::tests::probe_read_subcall_costs \
            --skip benchmarks::lane_run::tests::probe_write_durability_costs \
            --skip benchmarks::lane_run::tests::probe_concurrent_synced_writes
      - name: Test
        run: |
          cargo test --workspace --locked --release -- \
            --skip benchmarks::lane_run::tests::probe_lane_operation_costs \
            --skip benchmarks::lane_run::tests::probe_read_subcall_costs \
            --skip benchmarks::lane_run::tests::probe_write_durability_costs \
            --skip benchmarks::lane_run::tests::probe_concurrent_synced_writes
      - name: Test AWS-LC FIPS selection
        run: cargo test -p terrabase --locked --no-default-features --features production-fips --test encryption production_profile_links_an_operational_aws_lc_fips_module
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy production server with AWS-LC FIPS
        run: cargo clippy -p terrabase-server --all-targets --locked --no-default-features --features production-fips -- -D warnings
      - name: Served benchmark binary feature gate
        run: |
          cargo check --locked --features bench-tools --bin terrabase-bench-served
          cargo test --locked --features bench-tools --bin terrabase-bench-served
          cargo clippy --locked --features bench-tools --bin terrabase-bench-served -- -D warnings
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
      # The benchmark-lane driver is a standalone workspace so the engine
      # core stays zero-dependency; it builds and its unit tests run in the
      # same gate. Reference lanes (PostgreSQL, RavenDB) are
      # operator-provisioned and never run here — a CI reference run could
      # never be a fair timing claim.
      - name: Benchmark lane driver
        run: |
          cargo fmt --manifest-path bench/Cargo.toml -- --check
          cargo check --manifest-path bench/Cargo.toml --locked
          cargo build --manifest-path bench/Cargo.toml --locked --release
          cargo test --manifest-path bench/Cargo.toml --locked
          cargo clippy --manifest-path bench/Cargo.toml --all-targets --locked -- -D warnings
          cargo doc --manifest-path bench/Cargo.toml --no-deps --locked
          history_check="$(mktemp -d)"
          trap 'rm -rf -- "$history_check"' EXIT
          cargo run --manifest-path bench/Cargo.toml --locked -- --render-history --history-dir "$history_check"
          history_files=("$history_check"/*.md)
          test "${#history_files[@]}" -eq 1
          grep -Fq '# Benchmark history' "${history_files[0]}"
          grep -Fq '| workload | side | status |' "${history_files[0]}"
          git diff --exit-code -- docs/evidence/benchmarks/benchmark-history.md
      # Studio owns a separate workspace so the engine's dependency budget
      # remains explicit. It is nevertheless a release deliverable and gets
      # the same format, build, test, Clippy, and documentation gates.
      - name: Standalone Studio
        run: |
          scripts/validate-studio-assets.sh
          cargo fmt --manifest-path crates/terrabase-studio/Cargo.toml -- --check
          cargo check --manifest-path crates/terrabase-studio/Cargo.toml --locked
          cargo build --manifest-path crates/terrabase-studio/Cargo.toml --locked --release
          cargo test --manifest-path crates/terrabase-studio/Cargo.toml --locked
          cargo clippy --manifest-path crates/terrabase-studio/Cargo.toml --all-targets --locked -- -D warnings
          cargo doc --manifest-path crates/terrabase-studio/Cargo.toml --no-deps --locked
      - name: Install pinned yq
        env:
          GOBIN: ${{ github.workspace }}/.ci-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/mikefarah/yq/v4@v4.45.1
          "$GOBIN/yq" --version | grep -F 'version v4.45.1'
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Release packaging definitions
        run: |
          jq --exit-status . .terrascale/deploy.json >/dev/null
          bash -n deploy/release/candidate.sh deploy/release/package.sh deploy/release/reproduce.sh deploy/release/require-fips-toolchain.sh deploy/release/require-production-capability.sh deploy/release/sign.sh deploy/release/test-boundary.sh deploy/release/test-oci.sh deploy/release/test-sbom.sh deploy/release/test-workflow-runs.sh deploy/release/verify-oci.sh deploy/release/verify-source-binding.sh deploy/release/verify-workflow-runs.sh deploy/release/verify.sh scripts/validate-release-contracts.sh scripts/validate-studio-assets.sh
          scripts/validate-release-contracts.sh
          deploy/release/test-boundary.sh
          grep -q '@sha256:' deploy/release/Containerfile.server
          grep -q '@sha256:' deploy/release/Containerfile.studio
          ! grep -q 'target-cpu=native' .terrascale/deploy.json deploy/release/Containerfile.*
          ! grep -q 'tbep-production-harness' .terrascale/deploy.json deploy/release/Containerfile.*
      - name: Release SBOM generator
        run: |
          cargo fmt --manifest-path deploy/release/sbom/Cargo.toml -- --check
          cargo test --manifest-path deploy/release/sbom/Cargo.toml --locked
          cargo clippy --manifest-path deploy/release/sbom/Cargo.toml --all-targets --locked -- -D warnings
          cargo doc --manifest-path deploy/release/sbom/Cargo.toml --no-deps --locked
          cargo build --manifest-path deploy/release/sbom/Cargo.toml --locked --release
          TERRABASE_SBOM_TOOL=deploy/release/sbom/target/release/terrabase-release-sbom deploy/release/test-sbom.sh
      - name: Observability assets
        run: |
          scripts/validate-structured-assets.sh
          jq -e '
            ([.panels[].title] | index("Requests / second")) != null and
            ([.panels[].title] | index("Storage utilization by tier")) != null and
            ([.panels[].title] | index("Queue utilization")) != null and
            ([.panels[].title] | index("Committed durability p99")) != null and
            ([.panels[].title] | index("Backup age")) != null and
            ([.. | strings | select(contains("terrabase_requests_total"))] | length) > 0 and
            ([.. | strings | select(contains("terrabase_storage_capacity_bytes"))] | length) > 0
          ' deploy/observability/grafana-dashboard.json >/dev/null
          yq -e '
            [.groups[].rules[] | select(.alert == "TerraBaseReadinessLost")] | length == 1
          ' deploy/observability/prometheus-rules.yml >/dev/null
          yq -e '
            [.groups[].rules[] | select(.alert == "TerraBaseStorageUtilizationCritical")] | length == 1
          ' deploy/observability/prometheus-rules.yml >/dev/null
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Dependency, license, and advisory audits
        run: |
          cargo deny --all-features --locked check
          cargo deny --manifest-path bench/Cargo.toml --config bench/deny.toml --locked check
          cargo deny --manifest-path crates/terrabase-studio/Cargo.toml --config crates/terrabase-studio/deny.toml --locked check

      # The protobuf is the TBEP contract of record. Regeneration must be
      # clean, so a schema edit cannot silently ship stale Go bindings.
      - name: Schema and generated-binding drift
        env:
          GOBIN: ${{ github.workspace }}/.ci-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          protoc_version=34.1
          protoc_sha256=af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904
          schema_temp_root="$(mktemp -d)"
          cleanup_schema_temp() { rm -rf -- "$schema_temp_root"; }
          trap cleanup_schema_temp EXIT
          protoc_archive="$schema_temp_root/protoc.zip"
          curl --fail --silent --show-error --location \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-x86_64.zip" \
            --output "$protoc_archive"
          printf '%s  %s\n' "$protoc_sha256" "$protoc_archive" | sha256sum --check --strict
          protoc_root="$schema_temp_root/protoc"
          mkdir -p "$protoc_root"
          unzip -q "$protoc_archive" -d "$protoc_root"
          export PATH="$protoc_root/bin:$GOBIN:$PATH"
          protoc --version | grep -F 'libprotoc 34.1'
          schema_digest="$(bash scripts/tbep_schema_digest.sh)"
          printf 'TBEP schema digest: %s\n' "$schema_digest"
          expected_schema_digest="$(tr -d '[:space:]' < scripts/tbep_schema.sha256)"
          [[ "$expected_schema_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$schema_digest" == "$expected_schema_digest" ]]
          buf lint
          if against_commit="$(git rev-parse --verify HEAD^ 2>/dev/null)"; then
            :
          else
            against_commit=
          fi
          if [ -z "$against_commit" ]; then
            printf 'cannot resolve the previous commit for breaking-change comparison\n' >&2
            exit 1
          fi
          buf breaking --against ".git#ref=$against_commit"
          # Direct protoc reports its compiler version while buf reports it as
          # unknown. Generate into separate roots, canonicalize only that
          # nonsemantic header line, then require complete inventories and
          # every other byte to agree.
          direct_dir="$schema_temp_root/direct"
          buf_dir="$schema_temp_root/buf"
          mkdir -p "$direct_dir" "$buf_dir"
          protoc \
            --proto_path=crates/terrabase-tbep/proto \
            --go_out=paths=source_relative:"$direct_dir" \
            --go-grpc_out=paths=source_relative:"$direct_dir" \
            crates/terrabase-tbep/proto/terrabase/v1/engine.proto \
            crates/terrabase-tbep/proto/terrabase/v1/family.proto
          buf generate \
            --template buf.gen.yaml \
            --output "$buf_dir" \
            --path crates/terrabase-tbep/proto/terrabase/v1/engine.proto \
            --path crates/terrabase-tbep/proto/terrabase/v1/family.proto
          scripts/normalize-generated-protoc-version.sh "$direct_dir"
          scripts/normalize-generated-protoc-version.sh "$buf_dir/terrabase-go"
          expected_generated_inventory="$(printf '%s\n' engine.pb.go engine_grpc.pb.go family.pb.go)"
          for generated_root in \
            "$direct_dir/terrabase/v1" \
            "$buf_dir/terrabase-go/terrabase/v1" \
            terrabase-go/terrabase/v1; do
            [[ -d "$generated_root" && ! -L "$generated_root" ]]
            generated_inventory="$(find "$generated_root" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
            [[ "$generated_inventory" == "$expected_generated_inventory" ]]
            while IFS= read -r generated_file; do
              [[ -f "$generated_root/$generated_file" && ! -L "$generated_root/$generated_file" ]]
            done <<<"$expected_generated_inventory"
          done
          for generated_file in engine.pb.go engine_grpc.pb.go family.pb.go; do
            diff -u "$direct_dir/terrabase/v1/$generated_file" \
              "$buf_dir/terrabase-go/terrabase/v1/$generated_file"
            diff -u "$direct_dir/terrabase/v1/$generated_file" \
              "terrabase-go/terrabase/v1/$generated_file"
          done

      # The checked-in Go client must interoperate with the real Rust server,
      # not only with fake gRPC peers. The test owns its loopback PKI and
      # storage directory and fails if the harness is absent or skips.
      - name: Live Rust-Go integration
        run: |
          cargo build -p terrabase-tbep --bin tbep-production-harness --release --locked
          (
            cd terrabase-go
            TERRABASE_HARNESS="$GITHUB_WORKSPACE/target/release/tbep-production-harness" \
              go test -mod=readonly -tags integration ./...
          )

  # The Go client (terrabase-go) is the only client allowed to communicate
  # with the engine (AGENTS.md). Its build and tests gate with the engine.
  go-client:
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Go client checkout revision
        run: |
          event_sha='${{ forgejo.sha }}'
          checked_out_head="$(git rev-parse --verify HEAD)"
          [[ "$event_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$event_sha" == "$checked_out_head" ]]
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: terrabase-go/go.mod
          cache: true
      - name: Module integrity
        run: go mod verify
        working-directory: terrabase-go
      - name: Build, vet, and test
        run: |
          go list -mod=readonly ./...
          test -z "$(gofmt -d -e $(git ls-files '*.go'))"
          go vet -mod=readonly ./...
          go test -mod=readonly ./...
          go test -mod=readonly -race ./...
        working-directory: terrabase-go
