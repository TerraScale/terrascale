name: foundation checks

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo check --workspace --locked
      - name: Test
        run: cargo test --workspace --locked --release
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
      - name: Parity schema
        run: python3 scripts/validate_parity.py --check
      - name: Parity tooling tests
        run: python3 scripts/test_parity_tooling.py
      - name: License metadata
        run: python3 scripts/check_license.py
      - name: Secret scan
        run: ./scripts/check_secrets.sh
      - name: Dependency, license, and advisory audit
        run: |
          if command -v cargo-deny >/dev/null 2>&1; then
            cargo deny check
          else
            echo "cargo-deny unavailable on this runner; audit recorded as unrun"
          fi
