name: TerraBase unsigned native release validation

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: terrabase-unsigned-${{ forgejo.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  unsigned-amd64:
    name: unsigned/amd64-native
    runs-on: [self-hosted, protected, terrabase-release-amd64]
    timeout-minutes: 360
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - name: Require the native AMD64 package environment
        run: |
          test "$(uname -m)" = x86_64
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
          command -v buildah
          command -v cmake
          command -v go
          command -v jq
          command -v openssl
          command -v perl
          command -v skopeo
      - name: Build byte-reproducible unsigned AMD64 packages
        run: |
          deploy/release/reproduce.sh server x86_64-unknown-linux-gnu artifacts/unsigned/terrabase-server-amd64
          deploy/release/reproduce.sh studio x86_64-unknown-linux-gnu artifacts/unsigned/terrabase-studio-amd64
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: terrabase-unsigned-amd64
          path: |
            artifacts/unsigned/terrabase-server-amd64
            artifacts/unsigned/terrabase-studio-amd64
          if-no-files-found: error
          retention-days: 30

  unsigned-arm64:
    name: unsigned/arm64-native
    runs-on: [self-hosted, protected, terrabase-release-arm64]
    timeout-minutes: 360
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      - name: Require the native ARM64 package environment
        run: |
          test "$(uname -m)" = aarch64
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-unknown-linux-gnu
          command -v buildah
          command -v cmake
          command -v go
          command -v jq
          command -v openssl
          command -v perl
          command -v skopeo
      - name: Build byte-reproducible unsigned ARM64 packages
        run: |
          deploy/release/reproduce.sh server aarch64-unknown-linux-gnu artifacts/unsigned/terrabase-server-arm64
          deploy/release/reproduce.sh studio aarch64-unknown-linux-gnu artifacts/unsigned/terrabase-studio-arm64
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: terrabase-unsigned-arm64
          path: |
            artifacts/unsigned/terrabase-server-arm64
            artifacts/unsigned/terrabase-studio-arm64
          if-no-files-found: error
          retention-days: 30
