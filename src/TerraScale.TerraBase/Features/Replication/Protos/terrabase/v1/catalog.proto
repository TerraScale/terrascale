syntax = "proto3";

package terrabase.v1;

import "terrabase/v1/replication.proto";

option csharp_namespace = "TerraBase.Features.Replication.V1";

// Internal: a catalog follower replicates TerraBase's own database (management catalog, API key hashes,
// dashboard documents) from its catalog primary, the only member that writes it (docs/decisions/0009).
// TerraBase C# only; terrabase-rust has no equivalent. Pages are TBDCG001 change groups inside a
// TBLZ4E01 LZ4 application envelope, as in Replication.Sync; gRPC transport compression stays disabled.
service CatalogReplication {
  // One request, then the primary streams until the follower cancels. A member that is not a
  // catalog primary answers FAILED_PRECONDITION.
  rpc Follow(FollowRequest) returns (stream FollowResponse);
}

message FollowRequest {
  // Catalog protocol version: 1.
  uint32 protocol = 1;
  // Accepted payload codecs; must include PAYLOAD_CODEC_LZ4_BLOCK_V1.
  repeated PayloadCodec codecs = 2;
  // The follower's journal head: its 16-byte origin (the primary's, once it took a snapshot), sequence
  // and 32-byte prefix digest. The primary resumes after it only when it is a prefix of its own journal.
  bytes origin = 3;
  uint64 sequence = 4;
  bytes digest = 5;
  // Descriptive follower region, TERRABASE_REGION syntax.
  string region = 6;
}

message FollowResponse {
  oneof frame {
    // Always first.
    CatalogWelcome welcome = 1;
    // A snapshot: SnapshotBegin, documents pages, the groups committed meanwhile, SnapshotEnd.
    SnapshotBegin snapshot_begin = 2;
    CatalogPage documents = 3;
    SnapshotEnd snapshot_end = 4;
    // A group: GroupBegin, its changes pages, GroupEnd.
    GroupBegin group_begin = 5;
    CatalogPage changes = 6;
    GroupEnd group_end = 7;
    // At least every 5 seconds once the follower has every group.
    CatalogHeartbeat heartbeat = 8;
  }
}

message CatalogWelcome {
  uint32 protocol = 1;
  // The primary's 16-byte journal origin.
  bytes origin = 2;
  // Its last committed group.
  uint64 head = 3;
  string region = 4;
}

// The snapshot starts at journal position `sequence`; its pages are live documents read after it.
message SnapshotBegin {
  uint64 sequence = 1;
  bytes digest = 2;
}

// The snapshot is complete at `sequence`, the last group sent inside it.
message SnapshotEnd {
  uint64 sequence = 1;
  bytes digest = 2;
  // The primary's commit offset, at least the version of every write through `sequence`.
  uint64 commit_offset = 3;
}

message GroupBegin {
  uint64 sequence = 1;
  // Changes in the whole group, across its pages.
  uint32 change_count = 2;
}

message GroupEnd {
  // Prefix digest through this group.
  bytes digest = 1;
}

// At most 4096 changes and 2 MiB of collection, id and JSON bytes, except one larger document alone.
message CatalogPage {
  PayloadCodec codec = 1;
  bytes envelope = 2;
}

message CatalogHeartbeat {
  // The primary's last committed group.
  uint64 head = 1;
}

// Internal: a catalog follower forwards the client-listener requests its catalog primary serves
// (Management API requests, and a data-plane database creation the follower cannot write) once it
// authenticated them, as they arrived. The primary serves them through its own HTTP pipeline as if its
// client listener had accepted them, authenticating and authorizing them again, and serves only those
// endpoints. TerraBase C# only (docs/decisions/0009).
service CatalogForwarding {
  // One ForwardHead, then the response body in ForwardResponse.body envelopes. A member that is not a
  // catalog primary answers FAILED_PRECONDITION; a request no HTTP server would have accepted
  // INVALID_ARGUMENT; a primary at capacity RESOURCE_EXHAUSTED, all before serving it.
  rpc Forward(ForwardRequest) returns (stream ForwardResponse);
}

message ForwardRequest {
  // Forwarding protocol version: 1.
  uint32 protocol = 1;
  string method = 2;
  // The request path as the follower's server decoded it, and the raw query string ("" or "?…").
  string path = 3;
  string query = 4;
  // Request headers except connection-specific ones and the region pin the follower checked;
  // Content-Length is the body's length when there is a body.
  repeated ForwardedHeader headers = 5;
  // Empty, or one TBLZ4E01 LZ4 application envelope of at most 4 MiB of body.
  bytes body = 6;
  // The follower's region, TERRABASE_REGION syntax: the primary answers as that responding node.
  string region = 7;
}

message ForwardedHeader {
  string name = 1;
  string value = 2;
}

message ForwardResponse {
  oneof frame {
    // Always first and once.
    ForwardHead head = 1;
    // Then body_length bytes of body, in envelopes of at most 1 MiB each.
    bytes body = 2;
  }
}

message ForwardHead {
  uint32 status = 1;
  repeated ForwardedHeader headers = 2;
  uint64 body_length = 3;
  // The primary's catalog journal head once it served the request (16-byte origin and sequence): the
  // follower answers once it applied it, so it serves what the request wrote.
  bytes origin = 4;
  uint64 sequence = 5;
}

// Internal: a catalog follower writes no catalog, so it sends the document reads and writes it counted to its
// catalog primary, which saves them with its own (docs/management-api.md#usage). TerraBase C# only.
service CatalogUsage {
  // A member that is not a catalog primary answers FAILED_PRECONDITION; an invalid batch INVALID_ARGUMENT.
  rpc Add(UsageBatch) returns (UsageAck);
}

message UsageBatch {
  // Usage protocol version: 1.
  uint32 protocol = 1;
  // 16 bytes, random for each follower process.
  bytes epoch = 2;
  // At most 4096.
  repeated UsageCount counts = 3;
  // The follower's node name, 1 to 128 characters.
  string sender = 4;
  // 1 for the process's first batch, one more for each next one, the same on every retry: a follower sends its
  // next batch only once this one was acknowledged. The primary adds a batch of the sender's epoch only past the
  // highest sequence it added for it, so a retry, or an attempt that arrives late, is added once.
  uint64 sequence = 5;
}

message UsageCount {
  string organization_id = 1;
  string project_id = 2;
  string database_id = 3;
  // The UTC hour the operations happened in, in hours since the Unix epoch; at most a day ahead of the
  // primary's clock.
  int64 hour = 4;
  // At most 10^12 each.
  uint64 reads = 5;
  uint64 writes = 6;
  // Which buckets the counts belong in: counts the follower held past the kept hours or days were folded.
  UsageScope scope = 7;
}

enum UsageScope {
  // The hour `hour`, and its day.
  USAGE_SCOPE_HOUR = 0;
  // Only the day that starts at `hour`.
  USAGE_SCOPE_DAY = 1;
  // Only the lifetime totals; `hour` is 0.
  USAGE_SCOPE_LIFETIME = 2;
}

message UsageAck {
}
