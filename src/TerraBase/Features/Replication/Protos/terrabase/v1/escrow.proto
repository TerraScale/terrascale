syntax = "proto3";

package terrabase.v1;

option csharp_namespace = "TerraBase.Features.Replication.V1";

// Internal: transfers of an organization's plan database allowance between regions (docs/terrabase/decisions/0016).
// Every peer RPC requires X-TerraBase-Peer-Credential from TERRABASE_PEER_SECRET.
service DatabaseEscrow {
  // Grants the requesting region units the receiver holds, after its durable catalog commit. Idempotent: the reply is the
  // receiver's cumulative grant to the requester, and a request whose received is below it grants nothing more.
  rpc Transfer(EscrowTransferRequest) returns (EscrowTransferReply);
}

message EscrowTransferRequest {
  string organization = 1;
  // The requesting region.
  string region = 2;
  // The receiver's cumulative grant to the requester that the requester already counts.
  int64 received = 3;
  // Units the requester lacks; at least 1.
  int32 want = 4;
}

message EscrowTransferReply {
  // The receiver's cumulative grant to the requester, after this request.
  int64 granted = 1;
}
