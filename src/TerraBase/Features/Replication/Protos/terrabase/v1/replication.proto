syntax = "proto3";

package terrabase.v1;

option csharp_namespace = "TerraBase.Features.Replication.V1";

// Internal: peer streams of client databases (docs/terrabase/multi-region-replication.md sections 8 and 9). Each machine
// pushes only the change groups of its own local writes, directly to every other machine whose region holds the database,
// so nothing is forwarded and nothing echoes. Every peer RPC requires X-TerraBase-Peer-Credential from
// TERRABASE_PEER_SECRET.
service Replication {
  // One stream per (sender, receiver) machine pair, for every database they share. The sender opens it with a Hello,
  // the receiver answers with a Welcome, then acks every batch after its durable commit.
  rpc Push(stream PushFrame) returns (stream AckFrame);

  // Anti-entropy (section 10): the digests of a database's 4096 buckets, and the states of chosen buckets, paged. A machine
  // compares a peer's digests with its own and joins the states of every bucket that differs, as repairs (origin 0).
  rpc Digest(DigestRequest) returns (DigestReply);
  rpc ReadBucket(BucketRequest) returns (stream StatePage);
  // One read transaction for all states and its applied vector. Only the terminal frame certifies coverage; callers
  // must durably join every state before importing that vector. No digest equality substitutes for reading the states.
  rpc ReadSnapshot(DigestRequest) returns (stream SnapshotPage);
}

message SnapshotPage {
  StatePage page = 1;
  repeated SnapshotCut applied = 2;
  bool complete = 3;
  fixed64 collected_before = 4;
}

message SnapshotCut {
  fixed64 replica = 1;
  fixed64 stamp = 2;
}

// A receiver ignores a frame of a kind it does not know (a newer sender's): a sender sends a new kind only to a receiver
// whose Welcome names a protocol that has it.
message PushFrame {
  oneof kind {
    Hello hello = 1;
    Batch batch = 2;
    Heartbeat heartbeat = 3;
    Refill refill = 4;
    Frontier frontier = 5;
  }
}

// Sent for a database whose groups the receiver has all acknowledged (at most every 30 s): the receiver holds every event
// of the origin stamped below hlc, so its applied stamp for the origin moves there even while the origin writes nothing
// (section 11). hlc was taken before the read that found nothing left to send.
message Frontier {
  Database database = 1;
  fixed64 hlc = 2;
  optional fixed64 expect = 3;
}

// The first frame: the sending machine's replica id (the origin of every group on this stream), its clock and region, and
// its name in the machine list, where the receiver reaches it for a refill; and the newest protocol it speaks
// (ReplicationProtocol.Version; 0 from a build before the field, which speaks 1).
message Hello {
  fixed64 node = 1;
  fixed64 hlc = 2;
  string region = 3;
  string machine = 4;
  uint32 protocol = 5;
}

// The sender no longer holds the change groups after the receiver's last ack (retention cut a silent or far-behind peer,
// or the receiver is new): the receiver joins every bucket that differs from the sender's, then acks change_id, the
// sender's newest change, from which the stream goes on.
message Refill {
  Database database = 1;
  uint64 change_id = 2;
  // The sender's GC horizon (section 11): a state the receiver holds below it that the sender lacks was collected there,
  // so the refill drops it instead of keeping it (a refill copies; it does not merge collected deletions back).
  fixed64 horizon = 3;
  // Source clock sampled before its snapshot/head read; successful refill durably covers this frontier.
  optional fixed64 coverage = 4;
}

// A client database: its organization, project and database ULIDs; and the incarnation (the 16-byte ULID of one database
// file, renewed by every copy, restore and rebuild) of the sender's copy that a frame's change ids, acks and states belong
// to. Batch, Refill and Frontier carry the sender's; Ack and StableReport echo the frame they answer; a DigestRequest names
// the answering copy's expected incarnation, or none to discover it; a BucketRequest always names it.
message Database {
  string organization_id = 1;
  string project_id = 2;
  string database_id = 3;
  bytes incarnation = 4;
}

// Consecutive change groups of one database, the last one's change id, and the groups: a GroupList inside a TBLZ4E01 LZ4
// application envelope (decision 0007). At most 1024 groups and 2 MiB of encoded groups. Protocol 1: one batch per
// database in flight. Protocol 2: up to ReplicationProtocol.Window, each naming in after the change id it follows (the
// previous batch's last_change_id, or the sender's resume position); the receiver applies them in that chain only.
// With a chunk, groups is empty: the receiver reads the same envelope from the shared object store (LogChunks). Only a
// receiver whose Welcome set chunks gets one.
message Batch {
  Database database = 1;
  uint64 last_change_id = 2;
  bytes groups = 3;
  optional fixed64 expect = 4;
  LogChunk chunk = 5;
  uint64 after = 6;
}

// A batch's envelope sealed in the object store: its key, the AES-256-GCM key it was sealed with (only ever sent on the
// peer stream), the sealed object's length and the envelope's decoded length, which bounds the receiver's admission.
message LogChunk {
  string key = 1;
  bytes seal = 2;
  uint32 length = 3;
  uint32 decoded = 4;
}

// Sent every second while nothing else is.
message Heartbeat {
  fixed64 hlc = 1;
}

message GroupList {
  repeated Group groups = 1;
}

// The deltas of one committed transaction of the origin, in commit order of change ids. At most 1024 deltas.
message Group {
  uint64 change_id = 1;
  repeated Delta deltas = 2;
}

// One document operation: the entries it wrote at (stamp, origin), in DocumentStateEncoding's full form.
message Delta {
  string collection = 1;
  string id = 2;
  fixed64 stamp = 3;
  bytes state = 4;
}

message AckFrame {
  oneof kind {
    Welcome welcome = 1;
    Ack ack = 2;
    StableReport stable = 3;
    Applying applying = 4;
  }
}

// Actual work on an in-flight batch, not an ACK: it never confirms durability.
message Applying {
  Database database = 1;
  uint64 change_id = 2;
  uint64 progress = 3;
}

// The answer to a Frontier: the receiver's stable stamp of the database (section 11), so a horizon moves while nothing is
// written and no batch is acknowledged.
message StableReport {
  Database database = 1;
  fixed64 stable = 2;
  bool refill_required = 3;
}

// The first answer: the receiving machine's replica id, under which the sender keeps its cursor, and the newest protocol it
// speaks (0 from a build before the field, which speaks 1). The stream uses the lower of the two versions.
// Chunks: the receiver reads batches' log chunks from the object store (absent from older builds: none is sent to them).
message Welcome {
  fixed64 node = 1;
  uint32 protocol = 2;
  bool chunks = 3;
}

// A batch committed durably (change_id = its last_change_id), with the highest stamp of the origin joined. Refused: the
// receiver does not hold the database (yet); nothing was applied, and the sender retries later. Chunk unread: the refusal
// is a log chunk the receiver could not read from the object store, so the sender sends that peer's batches inline for a while.
// A protocol 2 receiver answers a database's batches in the order they arrived, refusals included; after a refusal its
// later batches of the database are refused until one follows the last applied batch again.
message Ack {
  Database database = 1;
  uint64 change_id = 2;
  fixed64 applied = 3;
  bool refused = 4;
  // The receiver's stable stamp for the database (section 11): every origin it hears from is applied up to it.
  fixed64 stable = 5;
  // A refused batch crossed missing coverage after a failed refill. Request a pinned refill even when the sender's
  // renewed copy has no scoped peer row. Ordinary catalog-lag and in-progress-refill refusals do not request one.
  bool refill_required = 6;
  bool chunk_unread = 7;
}

message DigestRequest {
  Database database = 1;
  // The digests the engine maintains instead of ones recomputed from every state row: a catalog gate's pull at start, which
  // must not scan the whole catalog on both machines. A machine that predates the field answers from the rows.
  bool maintained = 2;
}

// Held: the machine holds the database, as the requested incarnation when the request named one. Buckets: a TBLZ4E01
// envelope of 4096 x (h1, h2), each a little-endian 64-bit integer: the XOR of the digests of the bucket's document states.
// Incarnation: the held copy's, which a following BucketRequest names; head_change_id: its newest change id, read in the
// same snapshot as the digests.
message DigestReply {
  bool held = 1;
  bytes buckets = 2;
  bytes incarnation = 3;
  uint64 head_change_id = 4;
  optional fixed64 collected_before = 5;
}

// At most 4096 distinct buckets, each 0 to 4095, of the named incarnation: the stream fails with FAILED_PRECONDITION once
// the answering copy is another.
message BucketRequest {
  Database database = 1;
  repeated uint32 buckets = 2;
}

// A TBLZ4E01 envelope of a StateList: at most 1024 states and 2 MiB of encoded states; and the incarnation the request
// named, which every page echoes.
message StatePage {
  bytes states = 1;
  bytes incarnation = 2;
}

message StateList {
  repeated StateEntry states = 1;
}

// A document's whole state, in DocumentStateEncoding's full form.
message StateEntry {
  string collection = 1;
  string id = 2;
  bytes state = 3;
}
