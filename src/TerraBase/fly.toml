# TerraBase on Fly. CI deploys the image built from the root Dockerfile
# (`--target terrabase`), gru, then sjc, then fra: .github/workflows/ci.yml.
app = "ts-terrabase"
primary_region = "gru"
# 512 MB RAM; the 4 GB swap only absorbs spikes (it pages at a few MB/s).
swap_size_mb = 4096

[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"

[[mounts]]
  source = "terrabase_data"
  # The image runs in /data and keeps its databases in /data/data: the volume root holds lost+found.
  destination = "/data"
  initial_size = "1gb"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1gb"
  auto_extend_size_limit = "100gb"

# Public API. The internal listener (8081, fly-local-6pn) needs no entry here.
[http_service]
  internal_port = 8080
  force_https = true
  # "off" is what keeps one machine running in every region; min_machines_running only covers primary_region.
  auto_stop_machines = "off"
  auto_start_machines = true

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    # Ready ~4 s after start on shared-cpu-2x (docs/fly/spike-1a.md); flyctl deploy waits for the first passing check.
    interval = "5s"
    timeout = "2s"
    grace_period = "5s"

# Fly's scraper connects over the private IPv4, so /metrics listens on all interfaces (not public: no service).
[[metrics]]
  port = 9091
  path = "/metrics"
