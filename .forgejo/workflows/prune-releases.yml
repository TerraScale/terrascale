name: Prune old CI pre-releases

# TS-608: every main run publishes a ~250 MB CI pre-release, so Forgejo
# storage (the ts-forgejo bucket) grows without bound. Daily, delete the CI
# pre-releases past the newest 20 that are older than 7 days, except those
# the regions pin: the terrabase digest each head bucket's status.json
# serves, read with ts-orch release fleet-status --role terrabase, and the
# repository variable TS_RELEASE_PINS (revisions, digests or tags: rollback
# targets and hand deployments). Git tags stay. ts-orchestrator
# docs/continuous-delivery.md, "CI pre-release retention", has the rules.
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

concurrency:
  group: terrabase-prune-releases
  cancel-in-progress: false

jobs:
  zero-config:
    name: Reject new configuration switches
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the exact change with its history
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared TerraScale policy
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          repository: TerraScale/ts-builder
          ref: 4abae826a08090c4505d7c8f3d7adcd78be616ef
          path: .zero-config-policy
          token: ${{ secrets.TERRASCALE_BOT_TOKEN }}
          persist-credentials: false
      - name: Check the added lines
        env:
          ZERO_CONFIG_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
          ZERO_CONFIG_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 .zero-config-policy/scripts/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"

  prune:
    needs: [zero-config]
    if: ${{ forgejo.ref == 'refs/heads/main' }}
    name: prune
    runs-on: terrascale-builder
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check retention against an isolated release API
        run: bash scripts/ci/check-prune.sh

      # TS_PRUNE_ORCH_RELEASE and TS_PRUNE_ORCH_SHA256 name a ts-orch build
      # with fleet-status --role; without them the deployment's pinned build
      # runs, which fails closed when it predates --role.
      - name: Read the regions' pinned releases
        shell: bash
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          TS_RELEASE_OCI_KEY: ${{ secrets.TS_RELEASE_OCI_KEY }}
          TS_ORCH_RELEASE: ${{ vars.TS_PRUNE_ORCH_RELEASE || vars.TS_ORCH_RELEASE }}
          TS_ORCH_SHA256: ${{ vars.TS_PRUNE_ORCH_RELEASE && vars.TS_PRUNE_ORCH_SHA256 || vars.TS_ORCH_SHA256 }}
          TS_OBJECT_NAMESPACE: ${{ vars.TS_OBJECT_NAMESPACE }}
          TS_RELEASE_PINS: ${{ vars.TS_RELEASE_PINS }}
          TS_RELEASE_OCI_USER: ${{ vars.TS_RELEASE_OCI_USER }}
          TS_RELEASE_OCI_TENANCY: ${{ vars.TS_RELEASE_OCI_TENANCY }}
          TS_RELEASE_OCI_FINGERPRINT: ${{ vars.TS_RELEASE_OCI_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          work="${RUNNER_TEMP}/prune"
          mkdir -p "${work}"
          printf 'header = "Authorization: token %s"\n' "${ORG_READ_TOKEN}" > "${work}/auth"
          printf '%s\n' "${TS_RELEASE_OCI_KEY}" > "${work}/oci-key.pem"
          curl -sSfL --proto =https --proto-redir =https --retry 3 -K "${work}/auth" -o "${work}/ts-orch" \
            "${GITHUB_SERVER_URL}/TerraScale/ts-orchestrator/releases/download/${TS_ORCH_RELEASE}/terrascale-orchestrator-linux-amd64"
          test "$(sha256sum < "${work}/ts-orch" | cut -d' ' -f1)" = "${TS_ORCH_SHA256}"
          chmod 0700 "${work}/ts-orch"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=sa-saopaulo-1\nkey_file=%s\n' \
            "${TS_RELEASE_OCI_USER}" "${TS_RELEASE_OCI_FINGERPRINT}" "${TS_RELEASE_OCI_TENANCY}" \
            "${work}/oci-key.pem" > "${work}/oci-config"
          OCI_CONFIG_FILE="${work}/oci-config" "${work}/ts-orch" release fleet-status --role terrabase \
            --namespace "${TS_OBJECT_NAMESPACE}" > "${RUNNER_TEMP}/pins"
          rm -rf -- "${work}"
          # The real ts-auth Slow fixture uses its qualified storage dependency.
          printf '%s\n' 'ci-ff256067015433c8c40b59879f1282d2a40480ce-run-13258' >> "${RUNNER_TEMP}/pins"
          printf '%s\n' "${TS_RELEASE_PINS}" >> "${RUNNER_TEMP}/pins"
          cat "${RUNNER_TEMP}/pins"

      - name: Delete unpinned CI pre-releases past the retention window
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
        run: bash scripts/ci/prune-releases.sh "${GITHUB_REPOSITORY}" "${RUNNER_TEMP}/pins"
