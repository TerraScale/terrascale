name: Slow integration

# The slow suites run nightly, on demand, and for auth after a push that changes
# auth or ts-libs. They are never required checks and never block merges or releases.
# A failure files or comments on the open "Slow test suite failed: <area>" issue
# (scripts/ci/report-slow-failure.sh).

on:
  push:
    branches: [main]
  schedule:
    # One nightly run for both suites. Each job has no per-cron filter, so two
    # cron lines would run both suites twice a night.
    - cron: '17 3 * * *'
  workflow_dispatch:

# One Slow run at a time, so two failures cannot both find no open report and
# file duplicate issues.
concurrency:
  group: terrascale-slow
  cancel-in-progress: false

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TS_DOTNET_REV: a4ff285c051e63e72cb01c4a94173c91da1dd69a

jobs:
  changes:
    runs-on: terrascale-builder
    timeout-minutes: 10
    outputs:
      auth: ${{ steps.areas.outputs.auth }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          fetch-depth: 0
          persist-credentials: false

      - name: Find whether auth or ts-libs changed
        id: areas
        env:
          EVENT_NAME: ${{ forgejo.event_name }}
          PUSH_BEFORE: ${{ forgejo.event.before }}
          HEAD_SHA: ${{ forgejo.sha }}
        run: |
          set -euo pipefail
          # Only a push is filtered; a schedule or a manual run always runs auth.
          if [[ $EVENT_NAME == push ]]; then
            bash scripts/ci/changed-areas.sh "$PUSH_BEFORE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo auth=true >> "$GITHUB_OUTPUT"
          fi

  auth:
    name: Slow suite (auth)
    needs: [changes]
    if: needs.changes.outputs.auth == 'true'
    runs-on: terrascale-builder
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Use the persistent NuGet cache
        run: bash scripts/ci/nuget-cache.sh

      - name: Check out the pinned ts-dotnet revision
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: bash scripts/auth/ci/checkout-dotnet-deps.sh

      # The reporter only runs after a failure, so prove now that it can: fj is
      # installed, and a dry-run report renders without any log text.
      - name: Check the failure reporter
        run: |
          set -euo pipefail
          fj version
          printf '%s\n' 'failed Example (1s)' 'Authorization: Bearer reporter-check-secret' > "$RUNNER_TEMP/reporter-check.log"
          REPORT_DRY_RUN=1 scripts/ci/report-slow-failure.sh auth "$RUNNER_TEMP/reporter-check.log" > "$RUNNER_TEMP/reporter-check.md"
          grep -q '^# Slow test suite failed: auth' "$RUNNER_TEMP/reporter-check.md"
          ! grep -q 'reporter-check-secret' "$RUNNER_TEMP/reporter-check.md"

      - name: Slow integration suite
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          TS_AUTH_CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          export TS_AUTH_CHROMIUM_PATH
          make auth-test-slow CONFIGURATION=Release 2>&1 | tee artifacts/slow.log

      - name: File the failure as a Forgejo issue
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: bash scripts/ci/report-slow-failure.sh auth artifacts/slow.log

  terrabase:
    name: Slow suite (terrabase)
    if: forgejo.event_name != 'push'
    runs-on: terrascale-builder
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Use the persistent NuGet cache
        run: bash scripts/ci/nuget-cache.sh

      # The reporter only runs after a failure, so prove now that it can: fj is
      # installed, and a dry-run report renders without any log text.
      - name: Check the failure reporter
        run: |
          set -euo pipefail
          fj version
          printf '%s\n' 'failed Example (1s)' 'Authorization: Bearer reporter-check-secret' > "$RUNNER_TEMP/reporter-check.log"
          REPORT_DRY_RUN=1 scripts/ci/report-slow-failure.sh terrabase "$RUNNER_TEMP/reporter-check.log" > "$RUNNER_TEMP/reporter-check.md"
          grep -q '^# Slow test suite failed: terrabase' "$RUNNER_TEMP/reporter-check.md"
          ! grep -q 'reporter-check-secret' "$RUNNER_TEMP/reporter-check.md"

      - name: Slow integration suite
        env:
          FORGEJO_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          timeout --signal=TERM --kill-after=2m 75m make terrabase-test-slow CONFIGURATION=Release 2>&1 | tee artifacts/slow.log

      - name: File the failure as a Forgejo issue
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: bash scripts/ci/report-slow-failure.sh terrabase artifacts/slow.log
