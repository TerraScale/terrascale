name: Slow integration

# The Slow suite runs beside every main push (in parallel with fast.yml),
# nightly and on demand. It is never a required check and never blocks merges,
# deployments or releases. A failure files the open "Slow test suite failed"
# issue, or comments on it, with fj (scripts/ci/report-slow-failure.sh).

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# One Slow run at a time, so two failures cannot both find no open report and
# file duplicate issues.
concurrency:
  group: terrabase-slow
  cancel-in-progress: false

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # Keep in sync with fast.yml.
  TS_LIBS_REV: 14674be372abd4809392343084f2de9238aff919

jobs:
  slow:
    name: slow
    runs-on: terrascale-builder
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the pinned ts-libs revision
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: bash scripts/ci/checkout-deps.sh

      - name: Use the persistent NuGet cache
        run: bash scripts/ci/nuget-cache.sh

      # The reporter only runs after a failure, so prove now that it can: fj is
      # installed and a dry-run report renders and redacts.
      - name: Check the failure reporter
        run: |
          set -euo pipefail
          fj version
          printf '%s\n' 'failed Example (1s)' 'Authorization: Bearer reporter-check-secret' > "$RUNNER_TEMP/reporter-check.log"
          REPORT_DRY_RUN=1 bash scripts/ci/report-slow-failure.sh "$RUNNER_TEMP/reporter-check.log" > "$RUNNER_TEMP/reporter-check.md"
          grep -q '^# Slow test suite failed' "$RUNNER_TEMP/reporter-check.md"
          ! grep -q 'reporter-check-secret' "$RUNNER_TEMP/reporter-check.md"
          # A runaway log must not exhaust memory: a 256 MiB log renders with a small peak RSS.
          { yes 'noise line from a runaway test' | head -c 268435456; printf '\n%s\n' 'failed Late (1s)'; } > "$RUNNER_TEMP/reporter-large.log"
          python3 scripts/ci/peak-rss.py 131072 "$RUNNER_TEMP/reporter-large.md" \
            env REPORT_DRY_RUN=1 bash scripts/ci/report-slow-failure.sh "$RUNNER_TEMP/reporter-large.log"
          grep -q '^failed Late' "$RUNNER_TEMP/reporter-large.md"
          rm -f "$RUNNER_TEMP/reporter-large.log"

      - name: Slow integration suite
        run: |
          set -euo pipefail
          mkdir -p artifacts
          timeout --signal=TERM --kill-after=2m 75m make test-slow CONFIGURATION=Release 2>&1 | tee artifacts/slow.log

      - name: File the failure as a Forgejo issue
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: bash scripts/ci/report-slow-failure.sh artifacts/slow.log
