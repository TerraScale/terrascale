name: Slow integration

# The Slow suite runs nightly and on demand. It is never a required check and never blocks merges,
# deployments or releases. A failure files the open "Slow test suite failed"
# issue, or comments on it, with fj (scripts/ci/report-slow-failure.sh).

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# One Slow run at a time, so two failures cannot both find no open report and
# file duplicate issues.
concurrency:
  group: terrabase-slow
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  zero-config:
    name: Reject new configuration switches
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the exact change with its history
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared TerraScale policy
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          repository: TerraScale/ts-builder
          ref: 4abae826a08090c4505d7c8f3d7adcd78be616ef
          path: .zero-config-policy
          token: ${{ secrets.TERRASCALE_BOT_TOKEN }}
          persist-credentials: false
      - name: Check the added lines
        env:
          ZERO_CONFIG_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
          ZERO_CONFIG_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 .zero-config-policy/scripts/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"

  slow:
    needs: [zero-config]
    name: slow
    runs-on: terrascale-builder
    timeout-minutes: 90
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use the persistent NuGet cache
        run: bash scripts/ci/nuget-cache.sh

      # The reporter only runs after a failure, so prove now that it can: fj is
      # installed, and a report through the test's fake fj redacts and stays bounded.
      - name: Check the failure reporter
        run: |
          fj version
          bash scripts/ci/check-reporter.sh

      - name: Slow integration suite
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          timeout --signal=TERM --kill-after=2m 75m make test-slow CONFIGURATION=Release 2>&1 | tee artifacts/slow.log

      - name: File the failure as a Forgejo issue
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: bash scripts/ci/report-slow-failure.sh artifacts/slow.log
