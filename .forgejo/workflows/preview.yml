name: preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: terrascale-builder
    steps:
      - uses: actions/checkout@v4
      - name: Install flyctl
        run: curl -sL https://fly.io/install.sh | sh -s -- 0.4.52
      - name: Deploy PR preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PR_APP: ts-dashboard-2-pr-${{ github.event.number }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          # One ephemeral single-machine app per PR; provision idempotently so a
          # partially-created app (cancelled run, transient API error) self-heals.
          fly apps create "$PR_APP" -o personal 2>/dev/null || true
          fly ips list -a "$PR_APP" | grep -q " v6 " || fly ips allocate-v6 -a "$PR_APP"
          fly ips list -a "$PR_APP" | grep -q "shared" || fly ips allocate-v4 -a "$PR_APP" --shared
          sed -i "s/^app = .*/app = \"$PR_APP\"/" fly.toml
          fly deploy -a "$PR_APP" --strategy immediate
          # Fresh apps get a second HA machine; previews are single-machine.
          # Best-effort: a failed scale must not fail the deployed preview.
          fly scale count 1 -a "$PR_APP" --yes || true
      - name: Comment preview URL
        if: success()
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          PR_APP: ts-dashboard-2-pr-${{ github.event.number }}
        run: |
          curl -sf -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"body": "🚀 PR preview: https://'"$PR_APP"'.fly.dev"}' \
            "$GITHUB_API_URL/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.number }}/comments"
  cleanup:
    if: github.event.action == 'closed'
    runs-on: terrascale-builder
    steps:
      - name: Install flyctl
        run: curl -sL https://fly.io/install.sh | sh -s -- 0.4.52
      - name: Destroy PR preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PR_APP: ts-dashboard-2-pr-${{ github.event.number }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          # Succeed iff the app is gone afterwards; a failed destroy must fail the job.
          fly apps destroy "$PR_APP" --yes || ! fly status -a "$PR_APP" >/dev/null 2>&1
