name: preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: terrascale-builder
    steps:
      - uses: actions/checkout@v4
      # A single unbalanced brace silently nests every following rule into a
      # dead selector and whole pages render unstyled — fail fast, no deps.
      - name: Verify CSS brace balance
        run: awk 'BEGIN{d=0}{for(i=1;i<=length($0);i++){c=substr($0,i,1);if(c=="{")d++;else if(c=="}"){d--;if(d<0){print "extra } at line "NR;exit 1}}}}END{if(d!=0){print d" unclosed brace(s)";exit 1}}' src/TerraScale.Dashboard/wwwroot/css/terrascale.css
      - name: Deploy PR preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PR_APP: terra-scale-dashboard-pr-${{ github.event.number }}
        run: |
          # One ephemeral single-machine app per PR; provision idempotently so a
          # partially-created app (cancelled run, transient API error) self-heals.
          # NB: match table rows, not fly's "shared and dedicated" footer line.
          fly apps create "$PR_APP" -o personal 2>/dev/null || true
          fly ips list -a "$PR_APP" | grep -q " v6 " || fly ips allocate-v6 -a "$PR_APP"
          fly ips list -a "$PR_APP" | grep -q "(shared)" || fly ips allocate-v4 -a "$PR_APP" --shared
          # The in-memory demo backend is process-local: two machines would
          # split accounts and sessions, so account creation would appear to
          # vanish between steps. --ha=false skips the spare machine and the
          # scale is mandatory (no best-effort fallback) so a preview can never
          # silently run two stores.
          fly deploy -a "$PR_APP" --config fly.preview.toml --strategy immediate --ha=false
          fly scale count 1 -a "$PR_APP" --yes
      - name: Configure Stripe sandbox
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PR_APP: terra-scale-dashboard-pr-${{ github.event.number }}
          STRIPE_SANDBOX_ENV: ${{ secrets.STRIPE_SANDBOX_ENV }}
        run: |
          # Optional: without the repo secret the preview deploys without
          # Stripe and keeps the in-memory payment flow.
          [ -n "$STRIPE_SANDBOX_ENV" ] || { echo 'STRIPE_SANDBOX_ENV not set — skipping Stripe setup.'; exit 0; }
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT
          printf '%s\n' "$STRIPE_SANDBOX_ENV" > "$ENV_FILE"
          set -a; . "$ENV_FILE"; set +a
          : "${Payments__Stripe__SecretKey:?STRIPE_SANDBOX_ENV must define Payments__Stripe__SecretKey}"
          # fly rejects empty secret values, so every id must be present.
          for VAR in StarterMonthlyPriceId StarterAnnualPriceId ProMonthlyPriceId ProAnnualPriceId BusinessMonthlyPriceId BusinessAnnualPriceId; do
            eval "VAL=\${Payments__Stripe__$VAR:-}"
            [ -n "$VAL" ] || { echo "STRIPE_SANDBOX_ENV must define Payments__Stripe__$VAR" >&2; exit 1; }
          done
          HOOK_URL="https://$PR_APP.fly.dev/api/auth/stripe/webhook"
          # The signing secret is write-only in Stripe's API — an endpoint
          # created on an earlier push cannot be re-read — so drop every
          # endpoint bound to this URL and mint a fresh one each run. That
          # keeps the step idempotent and leaves no orphans behind.
          for EP in $(curl -sf -u "$Payments__Stripe__SecretKey:" 'https://api.stripe.com/v1/webhook_endpoints?limit=100' \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{for(const e of JSON.parse(d).data)if(e.url===process.argv[1])console.log(e.id)})' "$HOOK_URL"); do
            curl -sf -X DELETE -u "$Payments__Stripe__SecretKey:" "https://api.stripe.com/v1/webhook_endpoints/$EP" >/dev/null
          done
          WHSEC="$(curl -sf -u "$Payments__Stripe__SecretKey:" https://api.stripe.com/v1/webhook_endpoints \
            -d "url=$HOOK_URL" \
            -d 'enabled_events[]=checkout.session.completed' \
            -d 'enabled_events[]=customer.subscription.created' \
            -d 'enabled_events[]=customer.subscription.updated' \
            -d 'enabled_events[]=customer.subscription.deleted' \
            -d 'enabled_events[]=customer.subscription.trial_will_end' \
            -d 'enabled_events[]=invoice.paid' \
            -d 'enabled_events[]=invoice.payment_failed' \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const s=JSON.parse(d).secret;if(!s){console.error("Stripe returned no signing secret");process.exit(1)}console.log(s)})')"
          fly secrets set -a "$PR_APP" \
            Payments__Stripe__Mode=test \
            Payments__Stripe__SecretKey="$Payments__Stripe__SecretKey" \
            Payments__Stripe__WebhookSecret="$WHSEC" \
            Payments__Stripe__PublicOrigin="https://$PR_APP.fly.dev" \
            Payments__Stripe__StarterMonthlyPriceId="$Payments__Stripe__StarterMonthlyPriceId" \
            Payments__Stripe__StarterAnnualPriceId="$Payments__Stripe__StarterAnnualPriceId" \
            Payments__Stripe__ProMonthlyPriceId="$Payments__Stripe__ProMonthlyPriceId" \
            Payments__Stripe__ProAnnualPriceId="$Payments__Stripe__ProAnnualPriceId" \
            Payments__Stripe__BusinessMonthlyPriceId="$Payments__Stripe__BusinessMonthlyPriceId" \
            Payments__Stripe__BusinessAnnualPriceId="$Payments__Stripe__BusinessAnnualPriceId"
      - name: Install JS deps
        run: npm ci
      - name: Run browser E2E suite against the deployed preview
        env:
          PR_APP: terra-scale-dashboard-pr-${{ github.event.number }}
        run: DASHBOARD_E2E_BASE_URL="https://$PR_APP.fly.dev" npx playwright test
      - name: Comment preview URL
        if: success()
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          PR_APP: terra-scale-dashboard-pr-${{ github.event.number }}
        run: |
          # One comment per PR: the URL never changes, so skip if it's already posted.
          COMMENTS_URL="$GITHUB_API_URL/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.number }}/comments"
          COMMENTS_FILE="$(mktemp)"
          trap 'rm -f "$COMMENTS_FILE"' EXIT
          # Do not pipe curl into grep -q: with pipefail, grep can close the
          # pipe after its match and make curl report a false failure. That
          # would issue a duplicate comment and fail the preview with curl 22.
          curl -sf -H "Authorization: token $FORGEJO_TOKEN" "$COMMENTS_URL" > "$COMMENTS_FILE"
          if ! grep -Fq "PR preview:" "$COMMENTS_FILE"; then
            curl -sf -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"body": "🚀 PR preview: https://'"$PR_APP"'.fly.dev"}' \
              "$COMMENTS_URL"
          fi
  cleanup:
    if: github.event.action == 'closed'
    runs-on: terrascale-builder
    steps:
      - name: Destroy PR preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PR_APP: terra-scale-dashboard-pr-${{ github.event.number }}
        run: |
          # Succeed iff the app is gone afterwards; a failed destroy must fail the job.
          fly apps destroy "$PR_APP" --yes || ! fly status -a "$PR_APP" >/dev/null 2>&1
      - name: Delete PR Stripe webhook endpoint
        env:
          STRIPE_SANDBOX_ENV: ${{ secrets.STRIPE_SANDBOX_ENV }}
          PR_APP: terra-scale-dashboard-pr-${{ github.event.number }}
        run: |
          [ -n "$STRIPE_SANDBOX_ENV" ] || exit 0
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT
          printf '%s\n' "$STRIPE_SANDBOX_ENV" > "$ENV_FILE"
          set -a; . "$ENV_FILE"; set +a
          HOOK_URL="https://$PR_APP.fly.dev/api/auth/stripe/webhook"
          for EP in $(curl -sf -u "$Payments__Stripe__SecretKey:" 'https://api.stripe.com/v1/webhook_endpoints?limit=100' \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{for(const e of JSON.parse(d).data)if(e.url===process.argv[1])console.log(e.id)})' "$HOOK_URL"); do
            curl -sf -X DELETE -u "$Payments__Stripe__SecretKey:" "https://api.stripe.com/v1/webhook_endpoints/$EP" >/dev/null
          done
