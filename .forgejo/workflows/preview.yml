name: preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flyctl
        run: curl -sL https://fly.io/install.sh | sh
      - name: Deploy PR preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PR_APP: ts-dashboard-2-pr-${{ github.event.number }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          # One ephemeral single-machine app per PR.
          if ! fly status -a "$PR_APP" >/dev/null 2>&1; then
            fly apps create "$PR_APP" -o personal
          fi
          sed -i "s/^app = .*/app = \"$PR_APP\"/" fly.toml
          fly deploy -a "$PR_APP" --strategy immediate
      - name: Comment preview URL
        if: success()
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          PR_APP: ts-dashboard-2-pr-${{ github.event.number }}
        run: |
          curl -sf -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"body": "🚀 PR preview: https://'"$PR_APP"'.fly.dev"}' \
            "$GITHUB_API_URL/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.number }}/comments"
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        run: curl -sL https://fly.io/install.sh | sh
      - name: Destroy PR preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PR_APP: ts-dashboard-2-pr-${{ github.event.number }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          fly apps destroy "$PR_APP" --yes || echo "preview app already gone"
