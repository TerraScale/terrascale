name: preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
permissions:
  contents: read
  issues: write
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          persist-credentials: false
      - name: Build on Fly and deploy PR preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PR_APP: terra-scale-dashboard-pr-${{ github.event.number }}
          VERSION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/check-fly-deployment.mjs preview-config fly.preview.toml
          fly config validate --strict -c fly.preview.toml -a "$PR_APP"
          # One ephemeral single-machine app per PR; provision idempotently so a
          # partially-created app (cancelled run, transient API error) self-heals.
          # NB: match table rows, not fly's "shared and dedicated" footer line.
          fly apps create "$PR_APP" -o personal 2>/dev/null || true
          ips=$(fly ips list -a "$PR_APP")
          grep -q " v6 " <<<"$ips" || fly ips allocate-v6 -a "$PR_APP"
          grep -q "(shared)" <<<"$ips" || fly ips allocate-v4 -a "$PR_APP" --shared
          # The in-memory demo backend is process-local: two machines would
          # split accounts and sessions, so account creation would appear to
          # vanish between steps. --ha=false skips the spare machine and the
          # scale is mandatory (no best-effort fallback) so a preview can never
          # silently run two stores. Fly Proxy can start existing Machines but
          # does not create them; the post-deploy check enforces this workflow's
          # one-Machine cap (manual/API changes outside this workflow remain possible).
          fly deploy -a "$PR_APP" --config fly.preview.toml --remote-only --strategy immediate --ha=false \
            --build-arg VERSION="$VERSION"
          fly scale count 1 -a "$PR_APP" --yes
          machines_json=$(mktemp)
          volumes_json=$(mktemp)
          trap 'rm -f "$machines_json" "$volumes_json"' EXIT
          fly machine list -a "$PR_APP" --json > "$machines_json"
          fly volumes list -a "$PR_APP" --json > "$volumes_json"
          node scripts/check-fly-deployment.mjs preview "$machines_json" "$volumes_json"
          # A newly provisioned Fly hostname can close the first TLS handshake.
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --retry-max-time 90 \
            "https://${PR_APP}.fly.dev/health/ready"
      - name: Comment preview URL
        if: success()
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          PR_APP: terra-scale-dashboard-pr-${{ github.event.number }}
        run: |
          # One comment per PR: the URL never changes, so skip if it's already posted.
          COMMENTS_URL="$GITHUB_API_URL/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.number }}/comments"
          COMMENTS_FILE="$(mktemp)"
          trap 'rm -f "$COMMENTS_FILE"' EXIT
          # Do not pipe curl into grep -q: with pipefail, grep can close the
          # pipe after its match and make curl report a false failure. That
          # would issue a duplicate comment and fail the preview with curl 22.
          curl --fail-with-body --silent --show-error -H "Authorization: token $FORGEJO_TOKEN" "$COMMENTS_URL" > "$COMMENTS_FILE"
          if ! grep -Fq "PR preview:" "$COMMENTS_FILE"; then
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"body": "🚀 PR preview: https://'"$PR_APP"'.fly.dev"}' \
              "$COMMENTS_URL"
          fi
  cleanup:
    if: github.event.action == 'closed'
    runs-on: terrascale-builder
    steps:
      - name: Destroy PR preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PR_APP: terra-scale-dashboard-pr-${{ github.event.number }}
        run: |
          # Succeed iff the app is gone afterwards; a failed destroy must fail the job.
          fly apps destroy "$PR_APP" --yes || ! fly status -a "$PR_APP" >/dev/null 2>&1
