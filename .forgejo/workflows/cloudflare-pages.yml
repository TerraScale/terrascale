name: Cloudflare Pages

on:
  push:
    branches:
      - '**'
    paths:
      - ".forgejo/workflows/cloudflare-pages.yml"
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "src/**"
      - "static/**"
      - "svelte.config.js"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "wrangler.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: terrascale-builder
    container:
      image: terrascale-builder
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: vp install

      - name: Validate project
        run: vp run check

      - name: Ensure Pages project exists
        run: vp run cf:project:create

      - name: Deploy production
        if: ${{ forgejo.ref_name == 'main' }}
        run: vp run cf:deploy

      - name: Deploy preview
        if: ${{ forgejo.ref_name != 'main' }}
        run: vp run cf:deploy:preview
