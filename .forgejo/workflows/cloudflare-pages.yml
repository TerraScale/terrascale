name: Cloudflare Pages

on:
  push:
    branches:
      - '**'
    paths:
      - ".forgejo/workflows/cloudflare-pages.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/cloudflare-pages-deploy.mjs"
      - "scripts/cloudflare-pages-project-create.mjs"
      - "scripts/inline-prerendered-css.mjs"
      - "src/components/**"
      - "src/lib/**"
      - "src/pages/**"
      - "src/routes/**"
      - "static/fonts/**"
      - "static/icon-black.svg"
      - "static/icon-blue.svg"
      - "static/icon-white.svg"
      - "static/icons/**"
      - "static/language-icons/**"
      - "static/logo-black.svg"
      - "static/logo-blue.svg"
      - "static/logo-principal.svg"
      - "static/logo-white.svg"
      - "static/world-map.svg"
      - "svelte.config.js"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "wrangler.toml"
      - "!src/**/.DS_Store"
      - "!src/**/Thumbs.db"
      - "!src/**/.idea/**"
      - "!src/**/.vscode/**"
      - "!src/**/.gitignore"
      - "!src/**/.gitattributes"
      - "!src/**/node_modules/**"
      - "!src/**/dist/**"
      - "!src/**/build/**"
      - "!src/**/coverage/**"
      - "!static/**/.DS_Store"
      - "!static/**/Thumbs.db"
      - "!static/**/.gitignore"
      - "!static/**/.gitattributes"
      - "!static/**/node_modules/**"
      - "!static/**/dist/**"
      - "!static/**/build/**"
      - "!**/*~"
      - "!**/*.tmp"
      - "!**/*.bak"
      - "!**/*.orig"
      - "!**/*.rej"
      - "!**/*.swp"
jobs:
  deploy:
    runs-on: terrascale-builder
    container:
      image: terrascale-builder
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install dependencies
        run: vp install

      - name: Validate project
        run: vp run check

      - name: Ensure Pages project exists
        run: vp run cf:project:create

      - name: Deploy production
        if: ${{ forgejo.ref_name == 'main' }}
        run: vp run cf:deploy

      - name: Deploy preview
        if: ${{ forgejo.ref_name != 'main' }}
        run: vp run cf:deploy:preview
