name: Cloudflare Pages

on:
  push:
    branches:
      - '**'
    paths:
      - ".forgejo/workflows/cloudflare-pages.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/cloudflare-pages-deploy.mjs"
      - "scripts/cloudflare-pages-project-create.mjs"
      - "scripts/inline-prerendered-css.mjs"
      - "src/components/**"
      - "src/lib/**"
      - "src/pages/**"
      - "src/routes/**"
      - "static/fonts/**"
      - "static/icon-black.svg"
      - "static/icon-blue.svg"
      - "static/icon-white.svg"
      - "static/icons/**"
      - "static/language-icons/**"
      - "static/logo-black.svg"
      - "static/logo-blue.svg"
      - "static/logo-principal.svg"
      - "static/logo-white.svg"
      - "static/world-map.svg"
      - "svelte.config.js"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "wrangler.toml"
      - "!src/**/.DS_Store"
      - "!src/**/Thumbs.db"
      - "!src/**/.idea/**"
      - "!src/**/.vscode/**"
      - "!src/**/.gitignore"
      - "!src/**/.gitattributes"
      - "!src/**/node_modules/**"
      - "!src/**/dist/**"
      - "!src/**/build/**"
      - "!src/**/coverage/**"
      - "!static/**/.DS_Store"
      - "!static/**/Thumbs.db"
      - "!static/**/.gitignore"
      - "!static/**/.gitattributes"
      - "!static/**/node_modules/**"
      - "!static/**/dist/**"
      - "!static/**/build/**"
      - "!**/*~"
      - "!**/*.tmp"
      - "!**/*.bak"
      - "!**/*.orig"
      - "!**/*.rej"
      - "!**/*.swp"

concurrency:
  group: landingpage-cloudflare-pages-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: terrascale-builder
    container:
      image: terrascale-builder
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          github-server-url: https://git.mariogk.com

      - name: Deploy Cloudflare Pages
        run: |
          set -euo pipefail
          if [ -n "${REGISTRY_TOKEN:-}" ]; then
            nuget_config_dir="$(mktemp -d)"
            trap 'rm -rf "${nuget_config_dir}"' EXIT
            dotnet new nugetconfig --output "${nuget_config_dir}" --force >/dev/null
            dotnet nuget add source "https://git.mariogk.com/api/packages/TerraScale/nuget/index.json" \
              --name terrascale-forgejo \
              --username forgejo-actions \
              --password "${REGISTRY_TOKEN}" \
              --store-password-in-clear-text \
              --configfile "${nuget_config_dir}/nuget.config" >/dev/null
            rm -rf .tools
            dotnet tool install TerraScale.Deploy.Cli \
              --tool-path .tools \
              --configfile "${nuget_config_dir}/nuget.config"
            ./.tools/terrascale-deploy pages deploy --repository-root .
          else
            echo "::warning::REGISTRY_TOKEN is unavailable; falling back to repo-local Cloudflare Pages commands."
            vp install
            vp run check
            vp run cf:project:create
            if [ "${FORGEJO_REF_NAME:-}" = "main" ]; then
              vp run cf:deploy
            else
              vp run cf:deploy:preview
            fi
          fi
