name: Cloudflare Pages

on:
  push:
    branches:
      - '**'
    paths:
      - ".forgejo/workflows/cloudflare-pages.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/cloudflare-pages-deploy.mjs"
      - "scripts/cloudflare-pages-project-create.mjs"
      - "scripts/inline-prerendered-css.mjs"
      - "src/components/**"
      - "src/lib/**"
      - "src/pages/**"
      - "src/routes/**"
      - "static/fonts/**"
      - "static/icon-black.svg"
      - "static/icon-blue.svg"
      - "static/icon-white.svg"
      - "static/icons/**"
      - "static/language-icons/**"
      - "static/logo-black.svg"
      - "static/logo-blue.svg"
      - "static/logo-principal.svg"
      - "static/logo-white.svg"
      - "static/world-map.svg"
      - "svelte.config.js"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "wrangler.toml"
      - "!src/**/.DS_Store"
      - "!src/**/Thumbs.db"
      - "!src/**/.idea/**"
      - "!src/**/.vscode/**"
      - "!src/**/.gitignore"
      - "!src/**/.gitattributes"
      - "!src/**/node_modules/**"
      - "!src/**/dist/**"
      - "!src/**/build/**"
      - "!src/**/coverage/**"
      - "!static/**/.DS_Store"
      - "!static/**/Thumbs.db"
      - "!static/**/.gitignore"
      - "!static/**/.gitattributes"
      - "!static/**/node_modules/**"
      - "!static/**/dist/**"
      - "!static/**/build/**"
      - "!**/*~"
      - "!**/*.tmp"
      - "!**/*.bak"
      - "!**/*.orig"
      - "!**/*.rej"
      - "!**/*.swp"

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: terrascale-builder
    timeout-minutes: 20
    container:
      image: terrascale-builder
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Install TerraScale Deploy CLI
        run: |
          set -euo pipefail
          : "${REGISTRY_TOKEN:?REGISTRY_TOKEN is required to install TerraScale.Deploy.Cli.}"
          nuget_config_dir="$(mktemp -d)"
          trap 'rm -rf "${nuget_config_dir}"' EXIT
          nuget_user="${REGISTRY_USER:-forgejo-actions}"
          dotnet new nugetconfig --output "${nuget_config_dir}" --force >/dev/null
          dotnet nuget add source "https://git.mariogk.com/api/packages/TerraScale/nuget/index.json" \
            --name terrascale-forgejo \
            --username "${nuget_user}" \
            --password "${REGISTRY_TOKEN}" \
            --store-password-in-clear-text \
            --configfile "${nuget_config_dir}/nuget.config" >/dev/null
          rm -rf .tools
          dotnet tool install TerraScale.Deploy.Cli --version 1.0.72 \
            --tool-path .tools \
            --configfile "${nuget_config_dir}/nuget.config"
          ./.tools/terrascale-deploy version

      - name: Publish Pages application
        run: ./.tools/terrascale-deploy publish-application --checkout --repository-root LandingPage
