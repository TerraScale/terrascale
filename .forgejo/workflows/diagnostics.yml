name: CI diagnostics

on:
  workflow_dispatch:

jobs:
  probe-own-buildpack:
    runs-on: terrascale-builder
    timeout-minutes: 10
    container:
      image: git.terrascale.tech/terrascale/probe:buildpack
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - run: sleep 5 && echo own-buildpack-ok
