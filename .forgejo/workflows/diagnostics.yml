name: ts-landing diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: terrascale-builder
    timeout-minutes: 20
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
      TS_DEPLOY_READ_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -eu
          report="${RUNNER_TEMP:-/tmp}/diagnostics.txt"
          {
            echo "arch=$(uname -m) user=$(id -un) fj=$(command -v fj || echo missing)"
            echo "version_len=${#TS_DEPLOY_VERSION} sha_len=${#TS_DEPLOY_SHA256} sig_len=${#TS_DEPLOY_SIGNATURE_SHA256}"
            echo "read_token_len=${#TS_DEPLOY_READ_TOKEN} cf_token_len=${#CLOUDFLARE_API_TOKEN} cf_account_len=${#CLOUDFLARE_ACCOUNT_ID}"
            echo "version=${TS_DEPLOY_VERSION}"
            echo "=== fj auth add-token ==="
          } > "${report}" 2>&1
          set +e
          fj auth add-token "${TS_DEPLOY_READ_TOKEN}" --host git.terrascale.tech >> "${report}" 2>&1
          echo "auth exit=$?" >> "${report}"
          fj release view "${TS_DEPLOY_VERSION}" --repo TerraScale/ts-deploy >> "${report}" 2>&1
          echo "view exit=$?" >> "${report}"
          fj release asset download "${TS_DEPLOY_VERSION}" ts-deploy-linux-amd64 --repo TerraScale/ts-deploy --output /tmp/ts-deploy-probe >> "${report}" 2>&1
          echo "download exit=$?" >> "${report}"
          ls -la /tmp/ts-deploy-probe >> "${report}" 2>&1
          set -e
          if command -v curl >/dev/null 2>&1; then
            curl --silent --show-error --max-time 60 --data-binary "@${report}" http://100.89.133.91:8099 >/dev/null || true
          fi
          cat "${report}"
