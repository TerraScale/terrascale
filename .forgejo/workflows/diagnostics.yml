name: CI diagnostics

on:
  workflow_dispatch:

jobs:
  probe-dh-node22:
    runs-on: terrascale-builder
    timeout-minutes: 10
    container:
      image: docker.io/library/node:22
    steps:
      - run: sleep 5 && echo node22-ok

  probe-dh-buildpack:
    runs-on: terrascale-builder
    timeout-minutes: 10
    container:
      image: docker.io/library/buildpack-deps:bookworm
    steps:
      - run: sleep 5 && echo buildpack-ok
