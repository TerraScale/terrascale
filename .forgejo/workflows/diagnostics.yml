name: CI diagnostics

on:
  workflow_dispatch:

jobs:
  probe-public-sdk:
    runs-on: terrascale-builder
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/dotnet/sdk@sha256:b8cc28b501af233e51be59583a41bf3ebde7fc8656418a7dd305b90b21a7f3f9
    steps:
      - run: sleep 5 && echo public-sdk-ok

  probe-public-python:
    runs-on: terrascale-builder
    timeout-minutes: 5
    container:
      image: docker.io/library/python:3.13-slim
    steps:
      - run: sleep 5 && echo python-ok
