name: CI diagnostics

on:
  workflow_dispatch:

jobs:
  probe-host:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: uname -a && id && which docker || true

  probe-container-pinned:
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    timeout-minutes: 5
    steps:
      - run: dotnet --version

  probe-container-untagged:
    runs-on: terrascale-builder
    container: { image: "terrascale-builder" }
    timeout-minutes: 5
    steps:
      - run: dotnet --version

  probe-feed-token:
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    timeout-minutes: 5
    env:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Feed must answer 200 with the CI registry token
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: token ${REGISTRY_TOKEN}" https://git.terrascale.tech/api/packages/TerraScale/nuget/index.json || true)"
          echo "feed status: ${code}"
          test "${code}" = 200

  probe-tool-install:
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    timeout-minutes: 10
    env:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Replicate the bootstrap CLI install
        run: |
          set -euo pipefail
          config="$(mktemp -d)"
          dotnet new nugetconfig --output "${config}" --force >/dev/null
          dotnet nuget add source https://git.terrascale.tech/api/packages/TerraScale/nuget/index.json --name terrascale --username forgejo-actions --password "${REGISTRY_TOKEN}" --store-password-in-clear-text --configfile "${config}/nuget.config" >/dev/null
          dotnet tool install TerraScale.Deploy.Cli --tool-path .tools --configfile "${config}/nuget.config"
          .tools/terrascale-deploy version
