name: CI diagnostics

on:
  workflow_dispatch:

jobs:
  probe-sleep:
    runs-on: terrascale-builder
    timeout-minutes: 5
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - run: sleep 20 && echo slept

  probe-dotnet-only:
    runs-on: terrascale-builder
    timeout-minutes: 5
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - run: dotnet --version

  probe-node-only:
    runs-on: terrascale-builder
    timeout-minutes: 5
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - run: node --version
