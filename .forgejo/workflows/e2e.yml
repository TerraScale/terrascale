name: e2e
on:
  pull_request:
  push:
    branches: [main]
# The browser suite shares a builder across refs; queue runs instead of overlapping.
concurrency:
  group: dashboard-e2e
  cancel-in-progress: false
# The ts-builder job image supplies the pinned Go and Node.js toolchains, a
# library-patched Chromium with fonts and a 1777 /tmp, and npm and Go caches on
# the runner's persistent /cache, so each parallel job sets up in seconds.
env:
  E2E_SHARDS: "4"
jobs:
  modules:
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          persist-credentials: false
      # This checks downloads only and needs neither npm nor browser assets.
      - name: Verify public Go module resolution
        run: make check-modules
  lint:
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          persist-credentials: false
      - name: Install dashboard JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Check generated assets, lint, and browser shard coverage
        run: make lint check-css check-e2e-shards E2E_SHARDS=${{ env.E2E_SHARDS }}
  unit:
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          persist-credentials: false
      - name: Install dashboard JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Go unit tests
        run: make test-unit
  # Each shard is its own process with an in-process dashboard and Chromium,
  # still serial inside, so together the shards run make test-slow's browser
  # half: every test runs in exactly one shard.
  browser:
    runs-on: terrascale-builder
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          persist-credentials: false
      - name: Install dashboard JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Go browser and account-to-ts-go tests (shard ${{ matrix.shard }}/${{ env.E2E_SHARDS }})
        run: make test-browser E2E_SHARD=${{ matrix.shard }}/${{ env.E2E_SHARDS }}
