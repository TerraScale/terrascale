name: e2e
on:
  push:
    branches: [main]
  pull_request:
jobs:
  e2e:
    runs-on: terrascale-builder
    timeout-minutes: 20
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Build solution (app + test projects)
        run: dotnet build TerraScale.Dashboard.slnx
      - name: Fast tests (user-blocking critical paths)
        run: dotnet run --project tests/TerraScale.Dashboard.FastTests --no-build
      - name: Install JS deps
        run: npm ci
      - name: Run browser E2E suite
        run: npx playwright test
