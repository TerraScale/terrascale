name: e2e
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: dashboard-slow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Go and Node.js toolchains
        run: scripts/setup-ci-toolchains.sh
      - name: Install dashboard JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Check generated Templ and lint
        run: make lint
      # terrascale-builder already supplies the pinned, library-patched Chromium.
      - name: Run Go browser and account-to-ts-go tests
        env:
          CI: "1"
        run: |
          . scripts/prepare-ci-browser.sh || exit 1
          make test-slow
