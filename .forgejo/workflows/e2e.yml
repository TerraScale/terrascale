name: e2e
on:
  pull_request:
  push:
    branches: [main]
# The browser suite shares a builder across refs; queue runs instead of overlapping.
concurrency:
  group: dashboard-e2e
  cancel-in-progress: false
jobs:
  test:
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          persist-credentials: false
      - name: Install dashboard JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Check generated Templ and lint
        run: make lint
      # The ts-builder job image supplies the pinned Go and Node.js toolchains
      # and a library-patched Chromium with fonts and a 1777 /tmp.
      - name: Run Go browser and account-to-ts-go tests
        run: make test-slow
