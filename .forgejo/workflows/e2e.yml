name: e2e
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: dashboard-slow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Go and Node.js toolchains
        run: scripts/setup-ci-toolchains.sh
      - name: Install dashboard JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Check out pinned TypeScript SDK for the account journey
        uses: actions/checkout@v4
        with:
          repository: TerraScale/ts-typescript
          ref: d1021878d0d0dfeb5639ea3dd0f1ed7f0a9eee19
          path: node_modules/.cache/ts-typescript
      # terrascale-builder already supplies the pinned, library-patched Chromium.
      - name: Check Chromium navigation in the runner
        env:
          CI: "1"
          DEBUG: "pw:browser"
        run: |
          . scripts/prepare-ci-browser.sh || exit 1
          node scripts/browser-preflight.mjs
      - name: Run browser and account-to-TypeScript-SDK tests
        env:
          CI: "1"
          DEBUG: "pw:browser"
        run: |
          . scripts/prepare-ci-browser.sh || exit 1
          make test-slow
