name: e2e
on:
  pull_request:
jobs:
  test:
    runs-on: terrascale-builder
    timeout-minutes: 30
    concurrency:
      group: dashboard-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Go and Node.js toolchains
        run: scripts/setup-ci-toolchains.sh
      - name: Install dashboard JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Lint, bundle, and run fast Go tests
        run: make lint css test-fast build
      - name: Run slow browser and SDK contract tests
        env:
          CI: "1"
        run: make test-slow
