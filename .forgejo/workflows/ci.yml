name: check

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download latest ts-deploy release
        run: curl -fsSL --proto '=https' --tlsv1.2 -o ts-deploy https://git.terrascale.tech/TerraScale/ts-deploy/releases/download/latest/ts-deploy-linux-arm64 && chmod +x ts-deploy
      - run: ./ts-deploy ci --repo ts-typescript
