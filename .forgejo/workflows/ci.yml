name: ts-go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-go-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Run ts-go checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the native producer artifacts and metadata
        run: python3 scripts/native_contracts.py --check

      # Go and govulncheck are baked into the ts-builder job image.
      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Go vet
        run: go vet ./...

      - name: Run the pinned Go vulnerability scanner
        run: govulncheck ./...

      - name: Build all Go packages
        run: go build ./...

      - name: Run the race-enabled test suite
        run: go test -race ./...
