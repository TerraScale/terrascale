name: ts-rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-rust-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

jobs:
  zero-config:
    name: Reject new configuration switches
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the exact change with its history
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared TerraScale policy
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          repository: TerraScale/ts-builder
          ref: deb6b6011710d8d80f8482f636406ca1390983f0
          path: .zero-config-policy
          token: ${{ secrets.TERRASCALE_BOT_TOKEN }}
          persist-credentials: false
      - name: Check the added lines
        env:
          ZERO_CONFIG_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
          ZERO_CONFIG_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 .zero-config-policy/scripts/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"

  ci:
    needs: [zero-config]
    name: Native SDK checks
    runs-on: terrascale-builder
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: /cache/cargo-target/ts-rust
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify native producer contract
        run: |
          python3 scripts/check-native-contract.py
          python3 scripts/check-atlas-contract.py
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build and lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run locked tests
        run: cargo test --locked --all-features
      - name: Run SDK against pinned real C# TerraBase release
        env:
          TERRABASE_RELEASE_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: python3 scripts/terrabase/run.py
      - name: Verify distributable package
        run: cargo package --locked
