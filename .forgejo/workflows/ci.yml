name: ts-rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-rust-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Run ts-rust checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      # Incremental build state survives across jobs on the shared cache.
      CARGO_TARGET_DIR: /cache/cargo-target/ts-rust
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the pinned contract bundle
        run: |
          set -eu
          dotnet run scripts/contracts.cs --version v1 --source contracts/v1
          git diff --exit-code -- contracts/v1 src/generated_contract.rs

      # The toolchain (rust-toolchain.toml) and cargo-audit are baked into
      # the ts-builder job image.
      - name: Audit Rust dependencies
        run: cargo audit

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Build and lint all workspace targets and features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run the locked workspace test suite
        run: cargo test --locked --workspace --all-features
