name: ts-dotnet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-dotnet-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_USE_MSBUILDSERVER: "0"
  SOURCE_REVISION: ${{ forgejo.sha }}

jobs:
  # TS-795 switch guard: fails when the change adds an on/off setting.
  # Same text in every repo; ts-builder's scripts/bump-ci-ref.sh moves the pinned ref.
  guard:
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          repository: TerraScale/ts-builder
          ref: 8dacab451c3c16924622ff512d7aa17501b70ecc # guard ref
          path: .zero-config-policy
          token: ${{ secrets.TERRASCALE_BOT_TOKEN }}
          persist-credentials: false
      - env:
          ZERO_CONFIG_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
          ZERO_CONFIG_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 .zero-config-policy/scripts/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"

  build:
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Verify dependency audit failure handling
        run: dotnet run scripts/check-nuget-vulnerabilities.tests.cs -- --minimum-expected-tests 18

      - name: Fail closed on vulnerable NuGet packages
        run: dotnet run scripts/check-nuget-vulnerabilities.cs src/TerraScale.DotNet/TerraScale.DotNet.csproj

      - run: dotnet build TerraScale.DotNet.slnx --configuration Release --nologo -p:SourceRevisionId="$SOURCE_REVISION"

      - run: dotnet format style TerraScale.DotNet.slnx --verify-no-changes --no-restore

      # The TerraBase tests download the release pinned in TerraBaseRelease.Pinned
      # (terrabase is private) and verify its SHA-256 before running it.
      - name: Run native, ts-auth and TerraBase TUnit tests
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          # The pinned server clears host configuration; inherited logging cannot hide its ports.
          Logging__LogLevel__Default: "None"
          Logging__LogLevel__Microsoft.Hosting.Lifetime: "None"
          Logging__Console__FormatterName: "json"
        run: |
          for framework in net10.0 net11.0; do
            dotnet run \
              --project tests/TerraScale.DotNet.Tests/TerraScale.DotNet.Tests.csproj \
              --framework "$framework" \
              --configuration Release --no-build --no-restore -- \
              --minimum-expected-tests 487
          done

      - name: Pack and bind the exact source revision
        run: |
          candidate_version="0.1.0-native.g${SOURCE_REVISION}"
          dotnet pack src/TerraScale.DotNet/TerraScale.DotNet.csproj \
            --configuration Release --no-build --no-restore --nologo \
            --output .ci-package/pack \
            -p:PackageVersion="$candidate_version" -p:SourceRevisionId="$SOURCE_REVISION"
          python3 scripts/native_package_artifact.py create \
            --package ".ci-package/pack/TerraScale.DotNet.${candidate_version}.nupkg" \
            --version "$candidate_version" --source-revision "$SOURCE_REVISION" \
            --directory .ci-package/export

      - name: Verify both installed package consumers
        run: |
          candidate_version="0.1.0-native.g${SOURCE_REVISION}"
          candidate_sha="$(python3 -c 'import json; print(json.load(open(".ci-package/export/native-package.json"))["package_sha256"])')"
          for framework in net10.0 net11.0; do
            python3 scripts/qualification/check_native_package.py \
              --package ".ci-package/export/TerraScale.DotNet.${candidate_version}.nupkg" \
              --sha256 "$candidate_sha" --version "$candidate_version" --framework "$framework" \
              --receipt ".ci-package/export/${framework}-consumer.json"
          done

      - name: Export qualified package bytes and metadata
        # Forgejo's fork, v3-node20: legacy artifact protocol, not GitHub v4.
        uses: https://data.forgejo.org/forgejo/upload-artifact@ed48a7bb0c8a9079492c354d37994c413423c83e
        with:
          name: terrascale-dotnet-native-${{ forgejo.sha }}-${{ forgejo.run_id }}
          path: .ci-package/export/
          if-no-files-found: error
          retention-days: 30
