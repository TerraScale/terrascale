name: ts-go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Run ts-go checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      FORGEJO_SHA: ${{ forgejo.sha }}
      CONTRACT_URL: ${{ vars.CONTRACT_URL }}
      GOTOOLCHAIN: local
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Report the image Go toolchain
        run: nice -n 10 go version

      - name: Verify the checked out source revision
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${FORGEJO_SHA:?event SHA is required}"

      - name: Verify the immutable producer contract
        run: |
          set -eu
          nice -n 10 python3 - <<'PY'
          import hashlib
          import os
          import tempfile
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from scripts.contracts import unpack_url, validate_bundle

          url = os.environ.get("CONTRACT_URL", "")
          if not url:
              raise SystemExit("contracts: CONTRACT_URL is required in CI")
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("contracts: CONTRACT_URL must be an absolute HTTPS URL")

          version = Path("CONTRACT_VERSION").read_text(encoding="utf-8").strip()
          archive_sha256 = "".join(Path("CONTRACT_ARCHIVE_SHA256").read_text(encoding="utf-8").split())
          if len(archive_sha256) != 64 or any(character not in "0123456789abcdefABCDEF" for character in archive_sha256):
              raise SystemExit("contracts: CONTRACT_ARCHIVE_SHA256 must be a 64-character hexadecimal digest")

          with tempfile.TemporaryDirectory(prefix="terrascale-contract-ci-") as directory:
              archive = Path(directory) / "contract.tar"
              total = 0
              request = urllib.request.Request(url, headers={"User-Agent": "terrascale-ci/1"})
              with urllib.request.urlopen(request, timeout=30) as response, archive.open("wb") as output:
                  while chunk := response.read(1024 * 1024):
                      total += len(chunk)
                      if total > 80 * 1024 * 1024:
                          raise SystemExit("contracts: downloaded contract archive is too large")
                      output.write(chunk)
              actual_sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
              if actual_sha256.lower() != archive_sha256.lower():
                  raise SystemExit(
                      f"contracts: archive SHA-256 {actual_sha256} does not match CONTRACT_ARCHIVE_SHA256"
                  )

              unpack_root = Path(directory) / "unpack"
              unpack_root.mkdir()
              producer = unpack_url(archive.as_uri(), unpack_root)
              producer_manifest, producer_digests = validate_bundle(producer, version)
              committed = Path("contracts") / version
              committed_manifest, committed_digests = validate_bundle(committed, version)
              if producer_manifest != committed_manifest or producer_digests != committed_digests:
                  raise SystemExit("contracts: downloaded producer bundle differs from the committed bundle")

              def regular_files(root: Path) -> set[str]:
                  return {
                      str(path.relative_to(root))
                      for path in root.rglob("*")
                      if path.is_file()
                  }

              if regular_files(producer) != regular_files(committed):
                  raise SystemExit("contracts: downloaded producer file set differs from the committed bundle")
              for relative in regular_files(producer):
                  if (producer / relative).read_bytes() != (committed / relative).read_bytes():
                      raise SystemExit(f"contracts: downloaded producer artifact differs: {relative}")

          print(f"contracts: verified immutable {version} producer bundle ({archive_sha256})")
          PY

      - name: Verify the committed contract bundle
        run: nice -n 10 python3 scripts/verify_contracts.py

      - name: Verify Go formatting
        run: |
          set -eu
          test -z "$(nice -n 10 gofmt -l .)"

      - name: Run Go vet
        run: nice -n 10 go vet ./...

      - name: Build all Go packages
        run: nice -n 10 go build ./...

      - name: Run the race-enabled test suite
        run: nice -n 10 go test -race ./...
