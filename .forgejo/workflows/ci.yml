name: ts-landing CI

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  ci:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
      TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
      FORGEJO_TOKEN: ${{ forgejo.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.forgejo/actions/ts-deploy
        with:
          repo: ts-landing
      - name: debug stream
        if: always()
        run: |
          set -eu
          cli="$(find "${RUNNER_TEMP:-/tmp}" -maxdepth 2 -name ts-deploy -type f 2>/dev/null | head -1)"
          test -n "${cli}"
          rm -rf .terrascale-develop-release
          set +e
          "${cli}" ci --repo ts-landing > /tmp/ci-out.txt 2>&1
          code=$?
          set -e
          { echo "ci exit=${code}"; tail -c 15000 /tmp/ci-out.txt; } > /tmp/stream.txt
          curl --silent --show-error --max-time 120 --data-binary "@/tmp/stream.txt" http://100.89.133.91:8099 >/dev/null || true
