name: ts-rust CI

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  ci:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
      TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
      FORGEJO_TOKEN: ${{ forgejo.token }}
      TS_DEPLOY_RELEASE_SIGNING_KEY: ${{ secrets.TS_DEPLOY_RELEASE_SIGNING_KEY }}
      CONTRACT_SOURCE: ../terrabase/contracts
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/terrabase
          ref: 9d2ba8e13013e3a4040b84f512bf922a0129583f
          path: terrabase
          fetch-depth: 1
          persist-credentials: false
      - run: |
          set -eu
          test "$(git -C terrabase rev-parse HEAD)" = "9d2ba8e13013e3a4040b84f512bf922a0129583f"
          test "$(sha256sum terrabase/contract-archives/v1.tar | cut -d " " -f1)" = "$(tr -d "[:space:]" < CONTRACT_ARCHIVE_SHA256)"
          test -d terrabase/contracts
          # The SDK tooling accepts only the workspace layout
          # ../terrabase/contracts, so lift the verified sibling beside
          # this checkout where that path resolves.
          rm -rf ../terrabase
          mv terrabase ../terrabase
          test -d ../terrabase/contracts
      - uses: ./.forgejo/actions/ts-deploy
        with:
          repo: ts-rust
