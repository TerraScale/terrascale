name: TerraScale delivery

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

concurrency:
  group: ${{ forgejo.event_name == 'pull_request' && format('pr-{0}-{1}', forgejo.repository, forgejo.event.pull_request.number) || format('delivery-{0}-{1}', forgejo.repository, forgejo.ref) }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

env:
  TERRASCALE_TOOLBOX_REVISION: "2026.08.26"

jobs:
  bootstrap:
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    timeout-minutes: 30
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      version: ${{ steps.cli.outputs.version }}
    steps:
      - name: Resolve approved Deploy CLI pin
        id: cli
        shell: bash
        env:
          DEPLOY_CLI_READ_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          config="$(mktemp -d)"
          trap 'rm -rf -- "${config}"' EXIT
          dotnet new nugetconfig --output "${config}" --force >/dev/null
          dotnet nuget add source https://git.terrascale.tech/api/packages/TerraScale/nuget/index.json --name terrascale --username forgejo-actions --password "${DEPLOY_CLI_READ_TOKEN}" --store-password-in-clear-text --configfile "${config}/nuget.config" >/dev/null
          dotnet tool install TerraScale.Deploy.Cli --version 1.0.80 --tool-path .tools --configfile "${config}/nuget.config"
          .tools/terrascale-deploy ci resolve-cli
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with: { name: deploy-cli, path: .tools }

  plan:
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    timeout-minutes: 30
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    needs: bootstrap
    outputs:
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      tree: ${{ steps.plan.outputs.tree }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0 }
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - id: plan
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci plan --repository-root . --output artifacts/plan.json

  pr-static:
    name: pr/static
    if: ${{ forgejo.event_name == 'pull_request' }}
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          persist-credentials: false
      - run: git -c credential.helper= clone --depth 1 --branch develop https://git.terrascale.tech/TerraScale/ts-dashboard.git Dashboard
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  pr-build:
    name: pr/build
    if: ${{ forgejo.event_name == 'pull_request' }}
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          persist-credentials: false
      - run: npm ci
      - run: npm run build

  runtime-matrix:
    name: runtime/node-${{ matrix.node }}
    if: ${{ forgejo.event_name == 'pull_request' || (forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main') }}
    strategy:
      fail-fast: true
      matrix:
        node: ["22", "24"]
    runs-on: terrascale-untrusted
    container: { image: "node:${{ matrix.node }}-bookworm-slim" }
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          persist-credentials: false
      - name: Provision reviewed npm 11.18.0
        run: node scripts/provision-reviewed-npm.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  browser-matrix:
    name: source/browser-smoke-current-engines
    if: ${{ forgejo.event_name == 'pull_request' || (forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main') }}
    runs-on: terrascale-untrusted
    container: { image: "mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e" }
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          persist-credentials: false
      - run: npm ci
      - run: npm run build
      - run: npm run test:browser

  promotion-admission:
    name: promotion/admission
    if: ${{ forgejo.event_name == 'pull_request' && forgejo.base_ref == 'main' }}
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - run: |
          test "${{ forgejo.base_ref }}" = main
          test "${{ forgejo.head_ref }}" = develop
          test "${{ forgejo.event.pull_request.head.repo.full_name }}" = "${{ forgejo.repository }}"

  release-tests:
    name: release/tests
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [plan]
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", persist-credentials: false }
      - run: npm ci
      - run: npm run build
      - run: npm test

  release-e2e:
    name: release/e2e
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [release-artifacts]
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        run: node scripts/provision-reviewed-npm.mjs
      - run: npm ci
      - run: npm run build
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: candidate-npm, path: artifacts/handoff }
      - run: node scripts/promote-npm-candidate.mjs --build-receipt artifacts/handoff/evidence/npm.build-receipt.json --artifacts artifacts/handoff/candidate --registry https://registry.npmjs.org/ --verify-only
      - env:
          TERRASCALE_API_BASE_URL: ${{ vars.TERRASCALE_API_BASE_URL }}
          TERRASCALE_E2E_ACCESS_TOKEN: ${{ secrets.TERRASCALE_E2E_ACCESS_TOKEN }}
          TERRASCALE_E2E_PROJECT_ID: ${{ vars.TERRASCALE_E2E_PROJECT_ID }}
          TERRASCALE_E2E_ORGANIZATION_ID: ${{ vars.TERRASCALE_E2E_ORGANIZATION_ID }}
          TERRASCALE_E2E_SAVED_QUERIES_PROJECT_ID: ${{ vars.TERRASCALE_E2E_SAVED_QUERIES_PROJECT_ID }}
        run: |
          node scripts/require-release-e2e-config.mjs
          node scripts/run-packed-release-e2e.mjs --tarball "artifacts/handoff/candidate/terrascale-sdk-$(node -p 'require(\"./package.json\").version').tgz"
          npm test

  release-artifacts:
    name: release/artifacts (${{ matrix.profile }})
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [bootstrap, plan]
    strategy:
      fail-fast: true
      matrix: { include: "${{ fromJSON(needs.plan.outputs.build_matrix) }}" }
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22.23.2", check-latest: false }
      - name: Bind exact Node 22 executable
        run: |
          test "$(node --version)" = v22.23.2
          printf 'TERRASCALE_NODE_22=%s\n' "$(node -p 'process.execPath')" >> "${GITHUB_ENV}"
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Bind exact Node 24 executable
        run: |
          test "$(node --version)" = v24.20.0
          printf 'TERRASCALE_NODE_24=%s\n' "$(node -p 'process.execPath')" >> "${GITHUB_ENV}"
      - name: Provision reviewed npm 11.18.0
        run: node scripts/provision-reviewed-npm.mjs
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - name: Build exact npm candidate and receipt
        env:
          BUILD_TARGET: ${{ matrix.profile }}
          EXPECTED_TREE: ${{ needs.plan.outputs.tree }}
        run: |
          chmod +x .tools/terrascale-deploy
          .tools/terrascale-deploy ci build-candidate --repository-root . --target "${BUILD_TARGET}" --expected-tree "${EXPECTED_TREE}" --receipt "artifacts/evidence/${BUILD_TARGET}.build-receipt.json"
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with: { name: "candidate-${{ matrix.profile }}", path: artifacts }

  release-browser-candidate:
    name: release/candidate-browser-engines
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [release-artifacts]
    runs-on: terrascale-builder
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        run: node scripts/provision-reviewed-npm.mjs
      - run: npm ci
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: candidate-npm, path: artifacts/handoff }
      - run: node scripts/promote-npm-candidate.mjs --build-receipt artifacts/handoff/evidence/npm.build-receipt.json --artifacts artifacts/handoff/candidate --registry https://registry.npmjs.org/ --verify-only
      - name: Test the verified candidate tarball
        shell: bash
        run: |
          set -euo pipefail
          candidate="artifacts/handoff/candidate/terrascale-sdk-$(node -p 'require("./package.json").version').tgz"
          test -f "${candidate}"
          TERRASCALE_BROWSER_CANDIDATE_TARBALL="${candidate}" npm run test:browser

  release-contract-fixture:
    name: release/contract-fixture
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [bootstrap, plan]
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech" }
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/ts-dashboard
          ref: develop
          path: Dashboard
      - run: npm ci && npm run typecheck && npm run build && npm test

  release-version-availability:
    name: release/version-availability
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [bootstrap, plan]
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech" }
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        run: node scripts/provision-reviewed-npm.mjs
      - run: |
          version="$(node -p 'require("./package.json").version')"
          node scripts/promote-npm-candidate.mjs --check-availability --package @terrascale/sdk --version "${version}" --registry https://registry.npmjs.org/

  candidate:
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [bootstrap, plan, runtime-matrix, release-tests, release-e2e, release-artifacts, release-browser-candidate, release-contract-fixture, release-version-availability]
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        run: node scripts/provision-reviewed-npm.mjs
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: candidate-npm, path: artifacts/handoff }
      - run: node scripts/promote-npm-candidate.mjs --build-receipt artifacts/handoff/evidence/npm.build-receipt.json --artifacts artifacts/handoff/candidate --registry https://registry.npmjs.org/ --verify-only
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with: { name: admitted-npm-candidate, path: artifacts/handoff }

  promote:
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [candidate]
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder:2026.08.26
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        run: node scripts/provision-reviewed-npm.mjs
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: admitted-npm-candidate, path: artifacts/handoff }
      - run: node scripts/promote-npm-candidate.mjs --build-receipt artifacts/handoff/evidence/npm.build-receipt.json --artifacts artifacts/handoff/candidate --registry https://registry.npmjs.org/ --verify-only
      - env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/promote-npm-candidate.mjs --build-receipt artifacts/handoff/evidence/npm.build-receipt.json --artifacts artifacts/handoff/candidate --registry https://registry.npmjs.org/
