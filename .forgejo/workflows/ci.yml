name: TypeScript SDK checks and npm release

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.repository }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

jobs:
  bootstrap:
    name: deploy-cli
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - name: Block until the replacement Deploy CLI passes DEP-1
        shell: bash
        run: |
          echo "X-10 fail-closed: DEP-1 is reopened and no ts-deploy commit is authorized for consumers. Add the source checkout with TERRASCALE_DEPLOY_REPOSITORY_READ_TOKEN only after the replacement full commit and tree are independently green and Forgejo-qualified." >&2
          exit 1

  plan:
    name: plan
    needs: bootstrap
    runs-on: terrascale-builder
    timeout-minutes: 30
    outputs:
      tree: ${{ steps.plan.outputs.tree }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
          path: ts-typescript
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - id: plan
        name: Plan SDK verification and candidate profiles
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci plan --repository-root ts-typescript --require-clean-source --output ts-typescript/artifacts/plan.json

  verify-static:
    name: verify/static
    needs: [bootstrap, plan]
    runs-on: terrascale-untrusted
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
          path: ts-typescript
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        working-directory: ts-typescript
        run: node scripts/provision-reviewed-npm.mjs
      - name: Check out the current public API contract
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/ts-dashboard
          path: ts-typescript/Dashboard
          fetch-depth: 0
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - name: Run the static SDK profile
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci pr --repository-root ts-typescript --profile static

  verify-node-22:
    name: verify/node-22
    needs: [bootstrap, plan]
    runs-on: terrascale-untrusted
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
          path: ts-typescript
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22.23.2", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        working-directory: ts-typescript
        run: node scripts/provision-reviewed-npm.mjs
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - name: Run the complete SDK test profile on Node 22
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci pr --repository-root ts-typescript --profile tests

  verify-node-24:
    name: verify/node-24
    needs: [bootstrap, plan]
    runs-on: terrascale-untrusted
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
          path: ts-typescript
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        working-directory: ts-typescript
        run: node scripts/provision-reviewed-npm.mjs
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - name: Run the complete SDK test profile on Node 24
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci pr --repository-root ts-typescript --profile tests

  verify-browser:
    name: verify/browser-current-engines
    needs: [bootstrap, plan]
    runs-on: terrascale-untrusted
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
          path: ts-typescript
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        working-directory: ts-typescript
        run: node scripts/provision-reviewed-npm.mjs
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - name: Run the browser SDK profile
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci pr --repository-root ts-typescript --profile browser

  candidate-build:
    name: candidate/build
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [bootstrap, plan, verify-static, verify-node-22, verify-node-24, verify-browser]
    runs-on: terrascale-untrusted
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
          path: ts-typescript
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22.23.2", check-latest: false }
      - name: Bind exact Node 22 executable
        run: |
          test "$(node --version)" = v22.23.2
          printf 'TERRASCALE_NODE_22=%s\n' "$(node -p 'process.execPath')" >> "${GITHUB_ENV}"
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Bind exact Node 24 executable
        run: |
          test "$(node --version)" = v24.20.0
          printf 'TERRASCALE_NODE_24=%s\n' "$(node -p 'process.execPath')" >> "${GITHUB_ENV}"
      - name: Provision reviewed npm 11.18.0
        working-directory: ts-typescript
        run: node scripts/provision-reviewed-npm.mjs
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - name: Build the exact npm candidate and receipt
        env:
          EXPECTED_TREE: ${{ needs.plan.outputs.tree }}
        run: |
          set -euo pipefail
          chmod +x .tools/terrascale-deploy
          candidate_command=(ci build-candidate)
          .tools/terrascale-deploy "${candidate_command[@]}" --repository-root ts-typescript --target npm --expected-tree "${EXPECTED_TREE}" --receipt ts-typescript/artifacts/evidence/npm.build-receipt.json
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: candidate-npm
          path: ts-typescript/artifacts
          if-no-files-found: error
          retention-days: 7

  candidate-browser:
    name: candidate/browser-current-engines
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [candidate-build]
    runs-on: terrascale-untrusted
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
          path: ts-typescript
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        working-directory: ts-typescript
        run: node scripts/provision-reviewed-npm.mjs
      - name: Install browser test dependencies
        working-directory: ts-typescript
        run: npm ci
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: candidate-npm, path: ts-typescript/artifacts/handoff }
      - name: Verify and test the immutable npm candidate
        working-directory: ts-typescript
        run: |
          node scripts/promote-npm-candidate.mjs --build-receipt artifacts/handoff/evidence/npm.build-receipt.json --artifacts artifacts/handoff/candidate --registry https://registry.npmjs.org/ --verify-only
          candidate="artifacts/handoff/candidate/terrascale-sdk-$(node -p 'require("./package.json").version').tgz"
          test -f "${candidate}"
          TERRASCALE_BROWSER_CANDIDATE_TARBALL="${candidate}" npm run test:browser

  candidate-e2e:
    name: candidate/live-api
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [candidate-build]
    runs-on: terrascale-builder
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
          path: ts-typescript
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        working-directory: ts-typescript
        run: node scripts/provision-reviewed-npm.mjs
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: candidate-npm, path: ts-typescript/artifacts/handoff }
      - name: Verify the immutable npm candidate
        working-directory: ts-typescript
        run: node scripts/promote-npm-candidate.mjs --build-receipt artifacts/handoff/evidence/npm.build-receipt.json --artifacts artifacts/handoff/candidate --registry https://registry.npmjs.org/ --verify-only
      - name: Run the packed live API journey
        working-directory: ts-typescript
        env:
          TERRASCALE_API_BASE_URL: ${{ vars.TERRASCALE_API_BASE_URL }}
          TERRASCALE_E2E_ACCESS_TOKEN: ${{ secrets.TERRASCALE_E2E_ACCESS_TOKEN }}
          TERRASCALE_E2E_PROJECT_ID: ${{ vars.TERRASCALE_E2E_PROJECT_ID }}
          TERRASCALE_E2E_ORGANIZATION_ID: ${{ vars.TERRASCALE_E2E_ORGANIZATION_ID }}
          TERRASCALE_E2E_SAVED_QUERIES_PROJECT_ID: ${{ vars.TERRASCALE_E2E_SAVED_QUERIES_PROJECT_ID }}
        run: |
          node scripts/require-release-e2e-config.mjs
          node scripts/run-packed-release-e2e.mjs --tarball "artifacts/handoff/candidate/terrascale-sdk-$(node -p 'require("./package.json").version').tgz"

  candidate-version:
    name: candidate/version-availability
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [candidate-build]
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
          path: ts-typescript
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        working-directory: ts-typescript
        run: node scripts/provision-reviewed-npm.mjs
      - name: Refuse an already-published version
        working-directory: ts-typescript
        run: |
          version="$(node -p 'require("./package.json").version')"
          node scripts/promote-npm-candidate.mjs --check-availability --package @terrascale/sdk --version "${version}" --registry https://registry.npmjs.org/

  candidate:
    name: candidate/admit
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [candidate-build, candidate-browser, candidate-e2e, candidate-version]
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
          path: ts-typescript
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        working-directory: ts-typescript
        run: node scripts/provision-reviewed-npm.mjs
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: candidate-npm, path: ts-typescript/artifacts/handoff }
      - name: Admit the unchanged candidate
        working-directory: ts-typescript
        run: node scripts/promote-npm-candidate.mjs --build-receipt artifacts/handoff/evidence/npm.build-receipt.json --artifacts artifacts/handoff/candidate --registry https://registry.npmjs.org/ --verify-only
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: admitted-npm-candidate
          path: ts-typescript/artifacts/handoff
          if-no-files-found: error
          retention-days: 1

  publish:
    name: npm/publish
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [candidate]
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
          path: ts-typescript
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.20.0", check-latest: false }
      - name: Provision reviewed npm 11.18.0
        working-directory: ts-typescript
        run: node scripts/provision-reviewed-npm.mjs
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: admitted-npm-candidate, path: ts-typescript/artifacts/handoff }
      - name: Reverify the admitted candidate
        working-directory: ts-typescript
        run: node scripts/promote-npm-candidate.mjs --build-receipt artifacts/handoff/evidence/npm.build-receipt.json --artifacts artifacts/handoff/candidate --registry https://registry.npmjs.org/ --verify-only
      - name: Publish the admitted candidate to npm
        working-directory: ts-typescript
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/promote-npm-candidate.mjs --build-receipt artifacts/handoff/evidence/npm.build-receipt.json --artifacts artifacts/handoff/candidate --registry https://registry.npmjs.org/
