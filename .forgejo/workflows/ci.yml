name: ts-docs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-docs-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Run ts-docs checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - name: Check out the exact event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install locked dependencies
        run: npm ci
      - name: Build the VitePress site
        run: npm run build
      - name: Run docs and starter verification
        run: npm test
