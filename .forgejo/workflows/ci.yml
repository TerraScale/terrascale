name: TypeScript SDK native checks

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-typescript-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

env:
  # Provision these exact immutable producer files on the reviewed builder.
  # A final accepted producer revision/artifact must replace this provisioning seam.
  TERRASCALE_CURRENT_OPENAPI: ${{ vars.TERRASCALE_CURRENT_OPENAPI }}
  TERRASCALE_ATOMIC_VECTORS: ${{ vars.TERRASCALE_ATOMIC_VECTORS }}
  PLAYWRIGHT_CHROME_EXECUTABLE_PATH: ${{ vars.PLAYWRIGHT_CHROME_EXECUTABLE_PATH }}
  PLAYWRIGHT_EDGE_EXECUTABLE_PATH: ${{ vars.PLAYWRIGHT_EDGE_EXECUTABLE_PATH }}

# Node.js 24 (.node-version) and the Playwright 1.63 Chromium and Firefox
# engines are baked into the ts-builder job image. Chrome and Edge must be
# provisioned as actual stable vendor binaries at the declared runner paths.
jobs:
  static:
    name: verify/static-contracts
    runs-on: terrascale-builder
    timeout-minutes: 45
    steps:
      - name: Check out the exact event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          token: "${{ secrets.REGISTRY_TOKEN }}"
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm the repository Node.js version
        run: test "$(node --version)" = "v$(cat .node-version)"

      - name: Provision the reviewed npm CLI
        run: node scripts/provision-reviewed-npm.ts

      - name: Require the exact current producer contract inputs
        run: npm run check:current-contract-inputs

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck the SDK
        run: npm run typecheck

      - name: Build the SDK
        run: npm run build

      - name: Check native OpenAPI and canonical effect vectors
        run: npm run check:current-contract

      - name: Check the public contract fixture
        run: npm run check:public-contract-fixture

      - name: Check native OpenAPI contract identity
        run: npm run check:openapi-contract-descriptor

      - name: Check the route manifest
        run: npm run check:route-manifest

      - name: Check the forbidden SDK surface
        run: npm run check:forbidden-surface

      - name: Generate and validate the locked dependency SBOM
        run: npm run check:sbom -- --output ts-typescript-sbom.json

      - name: Fail closed on high or critical dependency vulnerabilities
        run: npm run check:vulnerabilities

  node:
    name: verify/node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22.23.2"
            sha256: d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307
          # The job image's Node.js (.node-version); nothing to download.
          - node: "24.21.0"
    runs-on: terrascale-builder
    timeout-minutes: 45
    steps:
      - name: Check out the exact event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          token: "${{ secrets.REGISTRY_TOKEN }}"
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js ${{ matrix.node }}
        if: ${{ matrix.sha256 }}
        env:
          NODE_VERSION: ${{ matrix.node }}
          NODE_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP:-/tmp}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          install_dir="${RUNNER_TEMP:-/tmp}/node-v${NODE_VERSION}"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" --output "${archive}"
          echo "${NODE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p -- "${install_dir}"
          tar -xJf "${archive}" --strip-components=1 -C "${install_dir}"
          # The job image's loader has no default /lib search path; tests
          # spawn this node with a scrubbed environment, so bake the path in.
          patchelf --set-rpath /lib "${install_dir}/bin/node"
          printf '%s/bin\n' "${install_dir}" >> "${GITHUB_PATH:?GITHUB_PATH is required}"

      - name: Confirm the selected Node.js runtime
        env:
          NODE_VERSION: ${{ matrix.node }}
          NODE_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          if [ -z "${NODE_SHA256}" ] && [ "${NODE_VERSION}" != "$(cat .node-version)" ]; then
            echo "The image-backed matrix leg ${NODE_VERSION} differs from .node-version $(cat .node-version)" >&2
            exit 1
          fi

      - name: Provision the reviewed npm CLI
        run: node scripts/provision-reviewed-npm.ts

      - name: Require the exact current producer contract inputs
        run: npm run check:current-contract-inputs

      - name: Install locked dependencies
        run: npm ci

      - name: Check native OpenAPI and canonical effect vectors
        run: npm run check:current-contract

      - name: Build the SDK
        run: npm run build

      - name: Run the complete SDK test suite
        run: npm test

      - name: Run actual framework lifecycle regressions
        run: npm run check:frameworks

      - name: Validate the locked dependency SBOM
        run: npm run check:sbom

      - name: Fail closed on high or critical dependency vulnerabilities
        run: npm run check:vulnerabilities

  browser:
    name: verify/browser-current-engines
    runs-on: terrascale-builder
    timeout-minutes: 60
    steps:
      - name: Check out the exact event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          token: "${{ secrets.REGISTRY_TOKEN }}"
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm the repository Node.js version
        run: test "$(node --version)" = "v$(cat .node-version)"

      - name: Provision the reviewed npm CLI
        run: node scripts/provision-reviewed-npm.ts

      - name: Install locked dependencies
        run: npm ci

      - name: Build the SDK
        run: npm run build

      # Chromium and Firefox are baked for this Playwright version; only
      # WebKit is fetched.
      - name: Install the pinned Playwright browsers
        run: npx playwright install chromium firefox webkit

      - name: Run browser qualification against the current package
        run: npm run test:browser
