name: ts-landing CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-landing-${{ forgejo.workflow }}-${{ forgejo.repository }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: verify/ts-landing
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the locked dependencies
        run: npm ci
      - name: Run the build, validators, and type checks
        run: npm run check
      - name: Check formatting and lint rules
        run: npm run lint
      # A merged push publishes what verification just approved: the check
      # step above leaves `build/` populated, so the exact verified output is
      # what gets uploaded. Pull requests never take this step.
      - name: Publish the production Cloudflare Pages deployment
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORGEJO_SHA: ${{ forgejo.sha }}
        run: |
          set -eu
          # Fail closed before Wrangler starts: a missing credential must
          # never let a main push report green without publishing.
          : "${CLOUDFLARE_API_TOKEN:?deploy: CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?deploy: CLOUDFLARE_ACCOUNT_ID is required}"
          output="$(npx wrangler pages deploy build \
            --project-name ts-landing \
            --branch main \
            --commit-hash "${FORGEJO_SHA:?deploy: the event SHA is required}" 2>&1)" \
            || { printf '%s\n' "${output}" >&2; exit 1; }
          printf '%s\n' "${output}"
      - name: Smoke check the production site
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        run: |
          set -eu
          # Give the promoted deployment a moment to answer on the custom
          # domain, then require it to serve the site.
          for _ in 1 2 3 4 5; do
            if curl -fsS -o /dev/null https://terrascale.tech/; then
              echo "deploy: https://terrascale.tech/ answers after publish"
              exit 0
            fi
            sleep 5
          done
          echo "deploy: https://terrascale.tech/ did not answer after publish" >&2
          exit 1
