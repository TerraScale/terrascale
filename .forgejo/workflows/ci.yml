name: ts-dotnet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build and test ts-dotnet
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      # The contract bundle is pinned by CONTRACT_VERSION + CONTRACT_ARCHIVE_SHA256
      # and downloaded from the organization CONTRACT_URL, exactly as the retired
      # central ts-deploy workflow did via the old Makefile contracts target.
      - name: Materialize the pinned contract bundle
        env:
          CONTRACT_URL: ${{ vars.CONTRACT_URL }}
        run: >-
          CONTRACT_ARCHIVE_SHA256="$(tr -d '[:space:]' < CONTRACT_ARCHIVE_SHA256)"
          python3 scripts/contracts.py --version "$(tr -d '[:space:]' < CONTRACT_VERSION)"

      - name: Build the Release solution
        run: dotnet build TerraScale.DotNet.slnx --configuration Release --nologo

      - name: Check .NET formatting
        run: dotnet format style TerraScale.DotNet.slnx --verify-no-changes --no-restore

      - name: Run TerraScale.DotNet TUnit tests
        run: >-
          dotnet run
          --project tests/TerraScale.DotNet.Tests/TerraScale.DotNet.Tests.csproj
          --configuration Release --no-build --no-restore --
          --minimum-expected-tests 1

      - name: Run Entity Framework Core TUnit tests
        run: >-
          dotnet run
          --project tests/TerraScale.EntityFrameworkCore.Tests/TerraScale.EntityFrameworkCore.Tests.csproj
          --configuration Release --no-build --no-restore --
          --minimum-expected-tests 1
