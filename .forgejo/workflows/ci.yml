name: ts-rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-rust-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Native SDK checks
    runs-on: terrascale-builder
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: /cache/cargo-target/ts-rust
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify native producer contract
        run: |
          python3 scripts/check-native-contract.py
          python3 scripts/check-atlas-contract.py
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build and lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run locked tests
        run: cargo test --locked --all-features
      - name: Run SDK against pinned real C# TerraBase release
        env:
          TERRABASE_RELEASE_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: python3 scripts/terrabase/run.py
      - name: Verify distributable package
        run: cargo package --locked
