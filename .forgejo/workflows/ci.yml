name: SDK CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  sdk:
    runs-on: terrascale-builder
    container:
      image: terrascale-builder
    permissions:
      contents: read
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout OpenAPI snapshot
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          {
            printf 'machine git.mariogk.com\n'
            printf 'login %s\n' "${REGISTRY_USER:?REGISTRY_USER missing}"
            printf 'password %s\n' "${REGISTRY_TOKEN:?REGISTRY_TOKEN missing}"
          } > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          rm -rf Documentation
          git clone --branch main --depth 1 https://git.mariogk.com/TerraScale/Documentation.git Documentation

      - name: Record checkout diagnostic (sanitized)
        if: always()
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set +e
          redact() { sed -E 's/[A-Za-z0-9+/_=-]{24,}/<redacted>/g'; }
          {
            echo "stage=checkout-doc-via-netrc"
            echo "doc_snapshot_present=$([ -f Documentation/public/openapi/server.openapi.json ] && echo yes || echo no)"
            echo "doc_head=$(git -C Documentation rev-parse HEAD 2>&1 | redact)"
          } > /tmp/diag.txt 2>&1
          cat /tmp/diag.txt
          enc="$(base64 -w0 < /tmp/diag.txt)"
          curl -sS -X PUT \
            -H "Authorization: token ${REGISTRY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "{\"value\":\"base64:${enc}\"}" \
            "https://git.mariogk.com/api/v1/repos/TerraScale/TerraScale.TypeScript/actions/variables/LAST_TS_CI_DIAG" >/dev/null 2>&1 || true

      - name: Resolve OpenAPI snapshot checkout
        run: |
          set -euo pipefail
          documentation_sha="$(git -C Documentation rev-parse HEAD)"
          documentation_ref="$(git -C Documentation symbolic-ref --quiet --short HEAD || true)"
          if [ -z "${documentation_ref}" ]; then
            documentation_ref="$(git -C Documentation for-each-ref --contains HEAD --format='%(refname:short)' refs/heads refs/remotes | head -n 1 || true)"
          fi
          if [ -z "${documentation_ref}" ]; then
            documentation_ref="detached"
          fi
          echo "Documentation checkout: ref=${documentation_ref} sha=${documentation_sha}"
          stat -c 'Documentation snapshot mtime: %y' Documentation/public/openapi/server.openapi.json
          git -C Documentation log -1 --format='Documentation snapshot last commit: %H %cI %s' -- public/openapi/server.openapi.json

      - name: Verify runner tools
        run: |
          set -euo pipefail
          command -v node
          command -v npm
          node --version
          npm --version

      - name: Restore dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify route manifest
        run: npm run check:route-manifest

      - name: Unit tests
        run: npm run test:unit

      - name: OpenAPI drift
        run: npm run check:openapi-drift -- Documentation/public/openapi/server.openapi.json

      - name: Integration smoke
        run: npm run test:integration
