name: ts-rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Run ts-rust checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      FORGEJO_SHA: ${{ forgejo.sha }}
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the checked out source revision
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${FORGEJO_SHA:?event SHA is required}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      # The builder image ships rustup under /usr/local/cargo/bin (CARGO_HOME);
      # act step shells have not always inherited the image PATH, so resolve
      # the binary explicitly instead of relying on PATH lookup.
      - name: Install the pinned toolchain components
        run: |
          set -eu
          ls /usr/local/cargo/bin >&2 || true
          RUSTUP="$(command -v rustup || echo /usr/local/cargo/bin/rustup)"
          test -x "${RUSTUP}"
          "${RUSTUP}" component add rustfmt clippy --toolchain 1.97.1

      - name: Verify the pinned contract bundle
        run: |
          set -eu
          dotnet run scripts/contracts.cs --version v1 --source contracts/v1
          git diff --exit-code -- contracts/v1 src/generated_contract.rs

      - name: Verify the pinned Rust toolchain
        run: |
          set -eu
          case "$(rustc --version)" in
            "rustc 1.97.1 "*) ;;
            *) echo "unexpected Rust toolchain: $(rustc --version)" >&2; exit 1 ;;
          esac
          host="$(rustc -vV | awk '/^host:/ { print $2 }')"
          case "${host}" in
            x86_64-*|aarch64-*) printf 'rust=%s host=%s\n' "$(rustc --version)" "${host}" ;;
            *) echo "unsupported Rust host: ${host}" >&2; exit 1 ;;
          esac

      - name: Audit Rust dependencies with the pinned advisory scanner
        run: |
          set -eu
          audit_root="${RUNNER_TEMP:-/tmp}/terrascale-cargo-audit"
          rm -rf -- "${audit_root}"
          cargo install cargo-audit --version 0.22.2 --locked --root "${audit_root}"
          "${audit_root}/bin/cargo-audit" audit

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Build and lint all workspace targets and features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run the locked workspace test suite
        run: cargo test --locked --workspace --all-features
