name: TypeScript SDK native checks

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.repository }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

jobs:
  static:
    name: verify/static-contracts
    runs-on: terrascale-builder
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - name: Check out the exact event revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          token: ""
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the repository Node.js version
        uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Provision the reviewed npm CLI
        run: node scripts/provision-reviewed-npm.ts

      - name: Install locked dependencies
        run: nice -n 10 npm ci

      - name: Typecheck the SDK
        run: nice -n 10 npm run typecheck

      - name: Build the SDK
        run: nice -n 10 npm run build

      - name: Check the public contract fixture
        run: nice -n 10 npm run check:public-contract-fixture

      - name: Check out the current Dashboard API contract
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/ts-dashboard
          path: Dashboard
          fetch-depth: 0
          token: ""
          persist-credentials: false

      - name: Check Dashboard OpenAPI contract identity
        run: nice -n 10 npm run check:openapi-contract-descriptor -- Dashboard/docs/product/openapi/server.openapi.json

      - name: Check Dashboard OpenAPI route drift
        run: nice -n 10 npm run check:openapi-drift -- Dashboard/docs/product/openapi/server.openapi.json sdk-route-manifest.json --exclude-contract=database

      - name: Check the route manifest
        run: nice -n 10 npm run check:route-manifest

      - name: Check the forbidden SDK surface
        run: nice -n 10 npm run check:forbidden-surface

      - name: Report the unavailable Database API contract gate
        env:
          TERRASCALE_DATABASE_OPENAPI_SPEC: ${{ vars.TERRASCALE_DATABASE_OPENAPI_SPEC }}
        run: |
          set -euo pipefail
          if [[ -z "${TERRASCALE_DATABASE_OPENAPI_SPEC:-}" ]]; then
            echo "SKIPPED: Database API OpenAPI source is not configured; no fake service or substitute contract is used."
          else
            test -f "${TERRASCALE_DATABASE_OPENAPI_SPEC}"
            nice -n 10 npm run check:openapi-drift -- "${TERRASCALE_DATABASE_OPENAPI_SPEC}" sdk-database-route-manifest.json --strict --require-spec-coverage
            nice -n 10 node scripts/check-database-openapi-contract-descriptor.mjs "${TERRASCALE_DATABASE_OPENAPI_SPEC}"
          fi

  node:
    name: verify/node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.2", "24.20.0"]
    runs-on: terrascale-builder
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - name: Check out the exact event revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          token: ""
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          check-latest: false

      - name: Confirm the selected runtime and host architecture
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${{ matrix.node }}"
          node -p 'JSON.stringify({ node: process.version, platform: process.platform, architecture: process.arch })'
          uname -m

      - name: Provision the reviewed npm CLI
        run: node scripts/provision-reviewed-npm.ts

      - name: Install locked dependencies
        run: nice -n 10 npm ci

      - name: Build the SDK
        run: nice -n 10 npm run build

      - name: Run the complete SDK test suite
        run: nice -n 10 npm test

  browser:
    name: verify/browser-current-engines
    runs-on: terrascale-builder
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - name: Check out the exact event revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          token: ""
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the repository Node.js version
        uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Confirm the browser host architecture
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.20.0
          node -p 'JSON.stringify({ node: process.version, platform: process.platform, architecture: process.arch })'
          uname -m

      - name: Provision the reviewed npm CLI
        run: node scripts/provision-reviewed-npm.ts

      - name: Install locked dependencies
        run: nice -n 10 npm ci

      - name: Build the SDK
        run: nice -n 10 npm run build

      - name: Run browser qualification against the current package
        run: nice -n 10 npm run test:browser
