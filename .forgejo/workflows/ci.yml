name: TerraScale delivery

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

concurrency:
  group: ${{ forgejo.event_name == 'pull_request' && format('pr-{0}-{1}', forgejo.repository, forgejo.event.pull_request.number) || format('delivery-{0}-{1}', forgejo.repository, forgejo.ref) }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

env:
  TERRASCALE_TOOLBOX_REVISION: "2026.07.1"
  TERRASCALE_DEPLOY_CLI_VERSION: ${{ needs.bootstrap.outputs.version }}

jobs:
  bootstrap:
    if: ${{ (forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main') || (forgejo.event_name == 'pull_request' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository) }}
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    outputs:
      version: ${{ steps.cli.outputs.version }}
    env:
      DEPLOY_CLI_READ_TOKEN: ${{ secrets.DEPLOY_CLI_READ_TOKEN }}
    steps:
      - name: Resolve newest stable Deploy CLI once
        id: cli
        shell: bash
        run: |
          set -euo pipefail
          config="$(mktemp -d)"
          trap 'rm -rf -- "${config}"' EXIT
          dotnet new nugetconfig --output "${config}" --force >/dev/null
          dotnet nuget add source https://git.terrascale.tech/api/packages/TerraScale/nuget/index.json --name terrascale --username forgejo-actions --password "${DEPLOY_CLI_READ_TOKEN}" --store-password-in-clear-text --configfile "${config}/nuget.config" >/dev/null
          dotnet tool install TerraScale.Deploy.Cli --tool-path .tools --configfile "${config}/nuget.config"
          .tools/terrascale-deploy ci resolve-cli
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        with: { name: deploy-cli, path: .tools }

  pr-policy:
    name: pr/policy
    if: ${{ forgejo.event_name == 'pull_request' && forgejo.base_ref == 'develop' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository }}
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    needs: bootstrap
    steps:
      - uses: https://data.forgejo.org/actions/download-artifact@v3
        with: { name: deploy-cli, path: .tools }
      - run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci policy

  release-policy:
    name: release/policy
    if: ${{ forgejo.event_name == 'pull_request' && forgejo.base_ref == 'main' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository }}
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    needs: bootstrap
    steps:
      - uses: https://data.forgejo.org/actions/download-artifact@v3
        with: { name: deploy-cli, path: .tools }
      - run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci policy

  plan:
    if: ${{ (forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main') || (forgejo.event_name == 'pull_request' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository) }}
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    needs: bootstrap
    outputs:
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      tree: ${{ steps.plan.outputs.tree }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0 }
      - uses: https://data.forgejo.org/actions/download-artifact@v3
        with: { name: deploy-cli, path: .tools }
      - id: plan
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci plan --repository-root . --output artifacts/plan.json

  pr-static:
    name: pr/static
    if: ${{ forgejo.event_name == 'pull_request' && forgejo.base_ref == 'develop' }}
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          github-server-url: "https://git.terrascale.tech"
          persist-credentials: false
      - run: git -c credential.helper= clone --depth 1 --branch develop https://git.terrascale.tech/TerraScale/TerraScale.Documentation.git Documentation
      - run: node scripts/check-public-contract-fixture.mjs Documentation/public/openapi/server.openapi.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:openapi-drift -- Documentation/public/openapi/server.openapi.json
      - run: npm run check:route-manifest

  pr-build:
    name: pr/build
    if: ${{ forgejo.event_name == 'pull_request' && forgejo.base_ref == 'develop' }}
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          github-server-url: "https://git.terrascale.tech"
          persist-credentials: false
      - run: npm ci
      - run: npm run build

  release-tests:
    name: release/tests
    if: ${{ forgejo.event_name == 'pull_request' && forgejo.base_ref == 'main' && forgejo.head_ref == 'develop' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository }}
    needs: [bootstrap, release-policy, plan]
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0 }
      - uses: https://data.forgejo.org/actions/download-artifact@v3
        with: { name: deploy-cli, path: .tools }
      - run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci release-test --repository-root . --profile regression

  release-e2e:
    name: release/e2e
    if: ${{ forgejo.event_name == 'pull_request' && forgejo.base_ref == 'main' && forgejo.head_ref == 'develop' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository }}
    needs: [bootstrap, release-policy, plan]
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    env:
      TERRASCALE_API_BASE_URL: ${{ vars.TERRASCALE_API_BASE_URL }}
      TERRASCALE_AUTH_API_BASE_URL: ${{ vars.TERRASCALE_AUTH_API_BASE_URL }}
      TERRASCALE_E2E_ACCESS_TOKEN: ${{ secrets.TERRASCALE_E2E_ACCESS_TOKEN }}
      TERRASCALE_E2E_PROJECT_ID: ${{ vars.TERRASCALE_E2E_PROJECT_ID }}
      TERRASCALE_E2E_ORGANIZATION_ID: ${{ vars.TERRASCALE_E2E_ORGANIZATION_ID }}
      TERRASCALE_E2E_SAVED_QUERIES_PROJECT_ID: ${{ vars.TERRASCALE_E2E_SAVED_QUERIES_PROJECT_ID }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0 }
      - uses: https://data.forgejo.org/actions/download-artifact@v3
        with: { name: deploy-cli, path: .tools }
      - run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci release-test --repository-root . --profile release-e2e

  release-artifacts:
    name: release/artifacts (${{ matrix.profile }})
    if: ${{ forgejo.event_name == 'pull_request' && forgejo.base_ref == 'main' && forgejo.head_ref == 'develop' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository }}
    needs: [bootstrap, release-policy, plan]
    strategy:
      fail-fast: true
      matrix: { include: "${{ fromJSON(needs.plan.outputs.build_matrix) }}" }
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0 }
      - uses: https://data.forgejo.org/actions/download-artifact@v3
        with: { name: deploy-cli, path: .tools }
      - run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci build-candidate --repository-root . --target "${{ matrix.profile }}"
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        with: { name: "candidate-${{ matrix.profile }}", path: artifacts/candidate }

  release-contract-fixture:
    name: release/contract-fixture
    if: ${{ forgejo.event_name == 'pull_request' && forgejo.base_ref == 'main' && forgejo.head_ref == 'develop' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository }}
    needs: [bootstrap, release-policy, plan]
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with: { github-server-url: "https://git.terrascale.tech" }
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/TerraScale.Documentation
          ref: develop
          path: Documentation
      - run: node scripts/check-public-contract-fixture.mjs Documentation/public/openapi/server.openapi.json

  release-version-availability:
    name: release/version-availability
    if: ${{ forgejo.event_name == 'pull_request' && forgejo.base_ref == 'main' && forgejo.head_ref == 'develop' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository }}
    needs: [bootstrap, release-policy, plan]
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with: { github-server-url: "https://git.terrascale.tech" }
      - run: |
          version="$(node -p 'require("./package.json").version')"
          node scripts/promote-npm-candidate.mjs --check-availability --package @terrascale/sdk --version "${version}" --registry https://registry.npmjs.org/

  candidate:
    if: ${{ forgejo.event_name == 'pull_request' && forgejo.base_ref == 'main' && forgejo.head_ref == 'develop' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository }}
    needs: [bootstrap, plan, release-tests, release-e2e, release-artifacts, release-contract-fixture, release-version-availability]
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    env:
      FORGEJO_TOKEN: ${{ secrets.CANDIDATE_STORE_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0 }
      - uses: https://data.forgejo.org/actions/download-artifact@v3
        with: { name: deploy-cli, path: .tools }
      - uses: https://data.forgejo.org/actions/download-artifact@v3
        with: { path: artifacts/candidate }
      - run: |
          chmod +x .tools/terrascale-deploy
          .tools/terrascale-deploy ci candidate-manifest --repository-root . --artifacts artifacts/candidate --version "$(node -p \"require('./package.json').version\")"
          .tools/terrascale-deploy ci candidate-store upload --tree "${{ needs.plan.outputs.tree }}" --file artifacts/release-candidate.json
          .tools/terrascale-deploy ci candidate-store upload --tree "${{ needs.plan.outputs.tree }}" --file artifacts/candidate.zip

  promote:
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: [bootstrap, plan]
    runs-on: terrascale-builder
    container: { image: "terrascale-builder:2026.07.1" }
    env:
      FORGEJO_TOKEN: ${{ secrets.CANDIDATE_STORE_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0 }
      - uses: https://data.forgejo.org/actions/download-artifact@v3
        with: { name: deploy-cli, path: .tools }
      - run: |
          chmod +x .tools/terrascale-deploy
          .tools/terrascale-deploy ci candidate-store download --tree "${{ needs.plan.outputs.tree }}" --file artifacts/release-candidate.json
          .tools/terrascale-deploy ci candidate-store download --tree "${{ needs.plan.outputs.tree }}" --file artifacts/candidate.zip
          .tools/terrascale-deploy ci promote --repository-root . --manifest artifacts/release-candidate.json --bundle artifacts/candidate.zip --verify-only
          node scripts/promote-npm-candidate.mjs --manifest artifacts/release-candidate.json --artifacts artifacts/candidate --registry https://registry.npmjs.org/
