name: TypeScript SDK native checks

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.repository }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

env:
  CONTRACT_SOURCE: contracts/terrabase
  EDGE_CONTRACT_SOURCE: contracts/edge

jobs:
  static:
    name: verify/static-contracts
    runs-on: terrascale-builder
    timeout-minutes: 45
    steps:
      - name: Check out the exact event revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          token: "${{ secrets.REGISTRY_TOKEN }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Install the repository Node.js version
        run: |
          set -euo pipefail
          node_version="$(cat .node-version)"
          case "${node_version}" in
            24.20.0) node_sha256=2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2 ;;
            *) echo "unsupported repository Node.js version: ${node_version}" >&2; exit 1 ;;
          esac
          archive="${RUNNER_TEMP:-/tmp}/node-v${node_version}-linux-x64.tar.xz"
          install_dir="${RUNNER_TEMP:-/tmp}/node-v${node_version}"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${node_version}/node-v${node_version}-linux-x64.tar.xz" --output "${archive}"
          echo "${node_sha256}  ${archive}" | sha256sum --check --strict
          rm -rf -- "${install_dir}"
          mkdir -p -- "${install_dir}"
          tar -xJf "${archive}" --strip-components=1 -C "${install_dir}"
          printf '%s/bin\n' "${install_dir}" >> "${GITHUB_PATH:?GITHUB_PATH is required}"
          PATH="${install_dir}/bin:${PATH}" node --version

      - name: Provision the reviewed npm CLI
        run: node scripts/provision-reviewed-npm.ts

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck the SDK
        run: npm run typecheck

      - name: Build the SDK
        run: npm run build

      - name: Check out the pinned producer contract bundles
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/ts-rust
          ref: 98678aa89bccc709c2fca48319ffdb3a9f94ff5e
          path: contracts/terrabase-root
          fetch-depth: 1
          token: "${{ secrets.REGISTRY_TOKEN }}"
          persist-credentials: false

      - name: Check out the pinned edge contract bundle
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/ts-atlas
          ref: e9150027048325dab70003a878f42a4a7e5b25c2
          path: contracts/edge-root
          fetch-depth: 1
          token: "${{ secrets.REGISTRY_TOKEN }}"
          persist-credentials: false

      - name: Stage the contract bundles for digest verification
        run: |
          set -euo pipefail
          mkdir -p contracts
          cp -r contracts/terrabase-root/contracts/v1 contracts/terrabase
          cp -r contracts/edge-root/contracts/v1 contracts/edge

      - name: Check the public contract fixture
        run: npm run check:public-contract-fixture

      - name: Check Dashboard OpenAPI contract identity
        run: npm run check:openapi-contract-descriptor

      - name: Check the route manifest
        run: npm run check:route-manifest

      - name: Check the forbidden SDK surface
        run: npm run check:forbidden-surface

      - name: Generate and validate the locked dependency SBOM
        run: npm run check:sbom -- --output ts-typescript-sbom.json

      - name: Fail closed on high or critical dependency vulnerabilities
        run: npm run check:vulnerabilities

  node:
    name: verify/node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.2", "24.20.0"]
    runs-on: terrascale-builder
    timeout-minutes: 45
    steps:
      - name: Check out the exact event revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          token: "${{ secrets.REGISTRY_TOKEN }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js ${{ matrix.node }}
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          set -euo pipefail
          case "${NODE_VERSION}" in
            22.23.2) node_sha256=d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307 ;;
            24.20.0) node_sha256=2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2 ;;
            *) echo "unsupported Node.js version: ${NODE_VERSION}" >&2; exit 1 ;;
          esac
          archive="${RUNNER_TEMP:-/tmp}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          install_dir="${RUNNER_TEMP:-/tmp}/node-v${NODE_VERSION}"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" --output "${archive}"
          echo "${node_sha256}  ${archive}" | sha256sum --check --strict
          rm -rf -- "${install_dir}"
          mkdir -p -- "${install_dir}"
          tar -xJf "${archive}" --strip-components=1 -C "${install_dir}"
          printf '%s/bin\n' "${install_dir}" >> "${GITHUB_PATH:?GITHUB_PATH is required}"
          PATH="${install_dir}/bin:${PATH}" node --version

      - name: Confirm the selected runtime and host architecture
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${{ matrix.node }}"
          node -p 'JSON.stringify({ node: process.version, platform: process.platform, architecture: process.arch })'
          uname -m

      - name: Provision the reviewed npm CLI
        run: node scripts/provision-reviewed-npm.ts

      - name: Install locked dependencies
        run: npm ci

      - name: Check out the pinned producer contract bundles
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/ts-rust
          ref: 98678aa89bccc709c2fca48319ffdb3a9f94ff5e
          path: contracts/terrabase-root
          fetch-depth: 1
          token: "${{ secrets.REGISTRY_TOKEN }}"
          persist-credentials: false

      - name: Check out the pinned edge contract bundle
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/ts-atlas
          ref: e9150027048325dab70003a878f42a4a7e5b25c2
          path: contracts/edge-root
          fetch-depth: 1
          token: "${{ secrets.REGISTRY_TOKEN }}"
          persist-credentials: false

      - name: Stage the contract bundles for digest verification
        run: |
          set -euo pipefail
          cp -r contracts/terrabase-root/contracts/v1 contracts/terrabase
          cp -r contracts/edge-root/contracts/v1 contracts/edge

      - name: Build the SDK
        run: npm run build

      - name: Run the complete SDK test suite
        run: npm test

      - name: Validate the locked dependency SBOM
        run: npm run check:sbom

      - name: Fail closed on high or critical dependency vulnerabilities
        run: npm run check:vulnerabilities

  browser:
    name: verify/browser-current-engines
    runs-on: terrascale-builder
    timeout-minutes: 60
    steps:
      - name: Check out the exact event revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          token: "${{ secrets.REGISTRY_TOKEN }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Install the repository Node.js version
        run: |
          set -euo pipefail
          node_version="$(cat .node-version)"
          case "${node_version}" in
            24.20.0) node_sha256=2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2 ;;
            *) echo "unsupported repository Node.js version: ${node_version}" >&2; exit 1 ;;
          esac
          archive="${RUNNER_TEMP:-/tmp}/node-v${node_version}-linux-x64.tar.xz"
          install_dir="${RUNNER_TEMP:-/tmp}/node-v${node_version}"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${node_version}/node-v${node_version}-linux-x64.tar.xz" --output "${archive}"
          echo "${node_sha256}  ${archive}" | sha256sum --check --strict
          rm -rf -- "${install_dir}"
          mkdir -p -- "${install_dir}"
          tar -xJf "${archive}" --strip-components=1 -C "${install_dir}"
          printf '%s/bin\n' "${install_dir}" >> "${GITHUB_PATH:?GITHUB_PATH is required}"
          PATH="${install_dir}/bin:${PATH}" node --version

      - name: Confirm the browser host architecture
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.20.0
          node -p 'JSON.stringify({ node: process.version, platform: process.platform, architecture: process.arch })'
          uname -m

      - name: Provision the reviewed npm CLI
        run: node scripts/provision-reviewed-npm.ts

      - name: Install locked dependencies
        run: npm ci

      - name: Build the SDK
        run: npm run build

      - name: Install the pinned Playwright browsers
        run: npx playwright install chromium firefox webkit

      - name: Run browser qualification against the current package
        run: npm run test:browser
