name: ts-go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Run ts-go checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      FORGEJO_SHA: ${{ forgejo.sha }}
      CONTRACT_URL: ${{ vars.CONTRACT_URL }}
      GOTOOLCHAIN: local
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install the pinned Go toolchain and vulnerability scanner
        run: |
          set -euo pipefail
          go_version=1.24.0
          go_root="${RUNNER_TEMP:-/tmp}/terrascale-go-${go_version}"
          go_archive="${RUNNER_TEMP:-/tmp}/go${go_version}.linux-amd64.tar.gz"
          if [ ! -x "${go_root}/go/bin/go" ]; then
            mkdir -p "${go_root}"
            curl --fail --location --retry 3 \
              "https://go.dev/dl/go${go_version}.linux-amd64.tar.gz" \
              --output "${go_archive}"
            printf '%s  %s\n' \
              'dea9ca38a0b852a74e81c26134671af7c0fbe65d81b0dc1c5bfe22cf7d4c8858' \
              "${go_archive}" | sha256sum --check --strict
            tar -xzf "${go_archive}" -C "${go_root}"
          fi
          export PATH="${go_root}/go/bin:${go_root}/bin:${PATH}"
          mkdir -p "${go_root}/bin"
          GOBIN="${go_root}/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          printf '%s\n' "${go_root}/go/bin" "${go_root}/bin" >> "${GITHUB_PATH:?GITHUB_PATH is required}"
          go version
          govulncheck -version

      - name: Report the pinned Go toolchain
        run: go version

      - name: Verify the checked out source revision
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${FORGEJO_SHA:?event SHA is required}"

      - name: Verify the immutable producer contract
        run: dotnet run scripts/verify-producer.cs

      - name: Verify the committed contract bundle
        run: dotnet run scripts/verify-contracts.cs

      - name: Run the contract boundary tests
        run: dotnet run scripts/contracts.tests.cs -- --minimum-expected-tests 9

      - name: Verify Go formatting
        run: |
          set -eu
          test -z "$(gofmt -l .)"

      - name: Run Go vet
        run: go vet ./...

      - name: Run the pinned Go vulnerability scanner
        run: govulncheck ./...

      - name: Build all Go packages
        run: go build ./...

      - name: Run the race-enabled test suite
        run: go test -race ./...
