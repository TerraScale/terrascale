name: ts-landing cf probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -eu
          report="${RUNNER_TEMP:-/tmp}/probe.txt"
          {
            echo "token_len=${#CLOUDFLARE_API_TOKEN} account=${CLOUDFLARE_ACCOUNT_ID}"
            echo "=== token verify ==="
          } > "${report}" 2>&1
          set +e
          curl --silent --show-error --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/user/tokens/verify" >> "${report}" 2>&1
          echo >> "${report}"
          echo "=== project ===" >> "${report}"
          curl --silent --show-error --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/terrascale-landing-page" >> "${report}" 2>&1
          echo >> "${report}"
          set -e
          echo "=== deploy attempt ===" >> "${report}"
          npm ci --ignore-scripts >> "${report}" 2>&1
          echo "npm ci exit=$?" >> "${report}"
          ./node_modules/.bin/wrangler pages deploy build --project-name terrascale-landing-page --branch main --commit-hash "${FORGEJO_SHA}" >> "${report}" 2>&1
          echo "wrangler exit=$?" >> "${report}"
          curl --silent --show-error --max-time 90 --data-binary "@${report}" http://100.89.133.91:8099 >/dev/null || true
          echo done
