name: ts-landing token probe

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -eu
          report="${RUNNER_TEMP:-/tmp}/probe.txt"
          {
            echo "job FORGEJO_TOKEN len=${#FORGEJO_TOKEN} registry len=${#REGISTRY_TOKEN} read len=${#TS_DEPLOY_READ_TOKEN}"
            echo "=== create release with the job token ==="
          } > "${report}" 2>&1
          set +e
          FORGEJO_TOKEN="${FORGEJO_TOKEN}" fj release create "v0.0.0-dev.jobtoken-$FORGEJO_SHA" --repo TerraScale/ts-landing --create-tag --branch "$FORGEJO_SHA" --body "probe" >> "${report}" 2>&1
          echo "job-token create exit=$?" >> "${report}"
          echo "=== create release with the registry token ==="
          FORGEJO_TOKEN="${REGISTRY_TOKEN}" fj release create "v0.0.0-dev.registry-$FORGEJO_SHA" --repo TerraScale/ts-landing --create-tag --branch "$FORGEJO_SHA" --body "probe" >> "${report}" 2>&1
          echo "registry create exit=$?" >> "${report}"
          set -e
          tail -c 20000 "${report}" > /tmp/trimmed.txt
          curl --silent --show-error --max-time 180 --data-binary "@/tmp/trimmed.txt" http://100.89.133.91:8099 >/dev/null || true
          echo done
