name: ts-landing ci probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
      TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -eu
          report="${RUNNER_TEMP:-/tmp}/probe.txt"
          {
            echo "sha=${FORGEJO_SHA:-unknown} event=${FORGEJO_EVENT_NAME:-unset} ref=${FORGEJO_REF:-unset} repo=${FORGEJO_REPOSITORY:-unset}"
          } > "${report}" 2>&1
          set +e
          make check >> "${report}" 2>&1
          echo "make check exit=$?" >> "${report}"
          set -e
          if command -v curl >/dev/null 2>&1; then
            curl --silent --show-error --max-time 90 --data-binary "@${report}" http://100.89.133.91:8099 >/dev/null || true
          fi
          echo "probe complete"
