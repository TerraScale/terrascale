name: ts-landing fj probe

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -eu
          report="${RUNNER_TEMP:-/tmp}/probe.txt"
          token="${FORGEJO_TOKEN:-}"
          {
            echo "=== fj with job token: create release using an existing tag ==="
          } > "${report}" 2>&1
          set +e
          FORGEJO_TOKEN="${token}" fj release create "probe-tag-d054815c" --repo TerraScale/ts-landing --body "probe" >> "${report}" 2>&1
          echo "fj create (existing tag) exit=$?" >> "${report}"
          echo "=== fj with job token: asset upload ===" >> "${report}"
          printf 'probe asset' > /tmp/probe-asset.txt
          FORGEJO_TOKEN="${token}" fj release asset create "probe-rel-d054815c" /tmp/probe-asset.txt probe-asset.txt --repo TerraScale/ts-landing >> "${report}" 2>&1
          echo "fj asset exit=$?" >> "${report}"
          set -e
          tail -c 20000 "${report}" > /tmp/trimmed.txt
          curl --silent --show-error --max-time 180 --data-binary "@/tmp/trimmed.txt" http://100.89.133.91:8099 >/dev/null || true
          echo done
