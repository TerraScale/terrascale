name: ts-landing api probe

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -eu
          report="${RUNNER_TEMP:-/tmp}/probe.txt"
          token="${FORGEJO_TOKEN:-}"
          {
            echo "job token len=${#token}"
            echo "=== tag create via API ==="
          } > "${report}" 2>&1
          set +e
          curl --silent --show-error --max-time 30 -X POST \
            -H "Authorization: token ${token}" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"probe-tag-${FORGEJO_SHA:0:8}\",\"target\":\"${FORGEJO_SHA}\"}" \
            "https://git.terrascale.tech/api/v1/repos/TerraScale/ts-landing/tags" >> "${report}" 2>&1
          echo >> "${report}"
          echo "tag exit=$?" >> "${report}"
          echo "=== release create via API ===" >> "${report}"
          curl --silent --show-error --max-time 30 -X POST \
            -H "Authorization: token ${token}" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"probe-rel-${FORGEJO_SHA:0:8}\",\"name\":\"probe\",\"body\":\"probe\",\"target_commitish\":\"${FORGEJO_SHA}\"}" \
            "https://git.terrascale.tech/api/v1/repos/TerraScale/ts-landing/releases" >> "${report}" 2>&1
          echo >> "${report}"
          echo "release exit=$?" >> "${report}"
          set -e
          tail -c 20000 "${report}" > /tmp/trimmed.txt
          curl --silent --show-error --max-time 180 --data-binary "@/tmp/trimmed.txt" http://100.89.133.91:8099 >/dev/null || true
          echo done
