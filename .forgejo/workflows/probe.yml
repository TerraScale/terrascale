name: ts-landing token probe

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -eu
          report="${RUNNER_TEMP:-/tmp}/probe.txt"
          {
            echo "fj version: $(fj --version 2>&1 | head -1)"
            echo "token len=${#TS_DEPLOY_READ_TOKEN}"
            echo "=== whoami ==="
          } > "${report}" 2>&1
          fj auth add-token "${TS_DEPLOY_READ_TOKEN}" --host git.terrascale.tech >> "${report}" 2>&1
          set +e
          fj whoami -H git.terrascale.tech >> "${report}" 2>&1
          echo "whoami exit=$?" >> "${report}"
          echo "=== create release ==="
          fj release create "v0.0.0-dev.probe-$FORGEJO_SHA" --repo TerraScale/ts-landing --create-tag --branch "$FORGEJO_SHA" --body "probe" >> "${report}" 2>&1
          echo "create exit=$?" >> "${report}"
          set -e
          tail -c 20000 "${report}" > /tmp/trimmed.txt
          curl --silent --show-error --max-time 180 --data-binary "@/tmp/trimmed.txt" http://100.89.133.91:8099 >/dev/null || true
          echo done
