name: ts-docs diagnostics
on:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  token_fj:
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - run: |
          set -eu
          TS="${FORGEJO_TOKEN:-$GITHUB_TOKEN}"
          test -n "$TS"
          fj auth add-token "$TS" --host git.terrascale.tech
          fj -H git.terrascale.tech whoami
          fj -H git.terrascale.tech release view v0.0.0-dev.73ab580df8907a52c6c2bbbc8f2d1bb0abdeafbc --repo TerraScale/ts-deploy >/dev/null
          fj -H git.terrascale.tech release asset download v0.0.0-dev.73ab580df8907a52c6c2bbbc8f2d1bb0abdeafbc ts-deploy-linux-amd64 --repo TerraScale/ts-deploy --output /tmp/ts-deploy
          chmod +x /tmp/ts-deploy
          /tmp/ts-deploy version
  api_deploy_jobtoken:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "curl -sf -H \"Authorization: token $GITHUB_TOKEN\" https://git.terrascale.tech/api/v1/repos/TerraScale/ts-deploy"
