name: ts-docs diagnostics
on:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "true"
  which_fj:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "command -v fj"
  fj_version:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "fj --version"
  fj_whoami:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "fj -H git.terrascale.tech whoami"
  fj_release:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "fj -H git.terrascale.tech release list --repo TerraScale/ts-deploy"
  path_usrbin:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "test -x /usr/bin/fj"
  path_usrlocalbin:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "test -x /usr/local/bin/fj"
  path_homelocal:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "test -x \"$HOME/.local/bin/fj\""
  path_cargo:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "test -x \"$HOME/.cargo/bin/fj\""
  path_nix:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "test -x /run/current-system/sw/bin/fj"
  path_nixprofile:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "test -x /nix/var/nix/profiles/default/bin/fj"
  path_cache_fj:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "test -x /var/cache/terrascale/toolchains/fj/0.6.0/bin/fj"
  in_container:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "test -f /.dockerenv -o -f /run/.containerenv"
  has_curl:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "command -v curl"
  has_token:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: "test -n \"${FORGEJO_TOKEN:-${GITHUB_TOKEN:-${GITEA_TOKEN:-}}}\""
