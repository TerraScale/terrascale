name: ts-docs diagnostics
on:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  plain:
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: |
          set -eu
          echo "plain ok"
          uname -m
          command -v fj
          fj -H git.terrascale.tech whoami
  remote:
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false
      - run: test -f .forgejo/actions/ts-deploy/action.yml
  vars:
    runs-on: terrascale-builder
    timeout-minutes: 5
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
    steps:
      - run: |
          set -eu
          test -n "${TS_DEPLOY_VERSION}"
          test "${#TS_DEPLOY_SHA256}" -eq 64
          test "${#TS_DEPLOY_SIGNATURE_SHA256}" -eq 64
          echo "vars ok ${TS_DEPLOY_VERSION}"
  install:
    runs-on: terrascale-builder
    timeout-minutes: 10
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
    steps:
      - run: |
          set -eu
          case "$(uname -m)" in
            aarch64|arm64) asset=ts-deploy-linux-arm64 ;;
            x86_64|amd64) asset=ts-deploy-linux-amd64 ;;
          esac
          fj release view "${TS_DEPLOY_VERSION}" --repo TerraScale/ts-deploy >/dev/null
          fj release asset download "${TS_DEPLOY_VERSION}" "${asset}" --repo TerraScale/ts-deploy --output /tmp/ts-deploy
          fj release asset download "${TS_DEPLOY_VERSION}" "${asset}.sig" --repo TerraScale/ts-deploy --output /tmp/ts-deploy.sig
          printf '%s  %s\n' "${TS_DEPLOY_SHA256}" /tmp/ts-deploy | sha256sum --check --strict -
          printf '%s  %s\n' "${TS_DEPLOY_SIGNATURE_SHA256}" /tmp/ts-deploy.sig | sha256sum --check --strict -
          chmod +x /tmp/ts-deploy
          /tmp/ts-deploy version
  action:
    runs-on: terrascale-builder
    timeout-minutes: 20
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.forgejo/actions/ts-deploy
        with:
          repo: ts-docs
