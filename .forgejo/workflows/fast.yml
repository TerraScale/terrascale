name: Fast integration

# fast and release run in parallel. Require "Fast integration / fast" and
# "Fast integration / release" in Forgejo's branch protection for the merge gate.
#
# - fast: locked restore, formatting, Release build with analyzers as errors,
#   and the Fast integration suite (make targets).
# - release: publishes the self-contained single-file linux-amd64 and linux-arm64
#   executables, smoke-runs the exact staged amd64 bytes and checks the arm64 ELF
#   header. On a push to main or of a v* tag it attaches them to a draft release
#   (scripts/ci/release.sh draft).
# - publish: once both pass, publishes that draft. Nothing is rebuilt.
# - deploy: on main, hands the published release to ts-orchestrator, which
#   rolls it out to every region (scripts/ci/deploy.sh, TS-610).
#
# The Slow suite runs separately (slow.yml) and never blocks.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a running check of the same branch; main always finishes.
concurrency:
  group: terrabase-fast-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  fast:
    name: fast
    runs-on: terrascale-builder
    # Fast takes a few minutes; fail a hung run before it holds the runner.
    timeout-minutes: 20
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use the persistent NuGet cache
        run: bash scripts/ci/nuget-cache.sh

      - name: Restore with locked dependencies
        run: make restore

      - name: Check formatting
        run: make fmt-check

      - name: Build Release with analyzers as errors
        run: make build CONFIGURATION=Release

      - name: TB0001 analyzer build check
        run: make analyzer-check CONFIGURATION=Release

      - name: Fast integration suite
        run: make test-fast CONFIGURATION=Release

  release:
    name: release
    runs-on: terrascale-builder
    timeout-minutes: 20
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          # Full history and tags: release notes and the tag-on-main check.
          fetch-depth: 0
          persist-credentials: false

      - name: Use the persistent NuGet cache
        run: bash scripts/ci/nuget-cache.sh

      - name: Check the release script against a fake release API
        run: bash scripts/ci/check-release.sh

      - name: Check the deploy script against a stub API and ts-orch
        run: bash scripts/ci/check-deploy.sh

      - name: Publish and check the release executables
        run: bash scripts/ci/stage-release.sh artifacts/dist

      # Pull requests get a read-only job token and never reach this step.
      - name: Attach the tested bytes to a draft release
        id: draft
        if: ${{ forgejo.event_name == 'push' && (forgejo.ref == 'refs/heads/main' || startsWith(forgejo.ref, 'refs/tags/v')) }}
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: bash scripts/ci/release.sh draft artifacts/dist

  publish:
    name: publish
    needs: [fast, release]
    if: ${{ needs.release.outputs.release_id != '' }}
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish the tested release
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: bash scripts/ci/release.sh publish "$RELEASE_ID"


      # Deployment failure must not erase the time this build became qualified.
      - name: Record the qualified main build for the deployment-lag guard
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 -o /dev/null \
            -H "Authorization: token ${FORGEJO_TOKEN}" -H 'Content-Type: application/json' \
            --data '{"state":"success","context":"deployment/qualified","description":"Verified main build ready for automatic deployment"}' \
            "https://git.terrascale.tech/api/v1/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
  # TS-610: hand the published release to ts-orchestrator, which rolls it out
  # to every region, canary first, health-gated with automatic rollback.
  # Missing deployment configuration fails visibly after Fast and publication;
  # scripts/ci/deploy.sh lists every input.
  deploy:
    name: deploy
    needs: [publish]
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    runs-on: terrascale-builder
    # GRU and SFO may each use the pinned helper's 30-minute regional wait.
    # Three downloads allow 15 minutes each; setup and cleanup get 15 more.
    timeout-minutes: 120
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Roll the release out to every region
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          TS_RELEASE_OCI_KEY: ${{ secrets.TS_RELEASE_OCI_KEY }}
          TS_AUTO_DEPLOY_CELLS: ${{ vars.TS_AUTO_DEPLOY_CELLS }}
          TS_ORCH_RELEASE: ${{ vars.TS_ORCH_RELEASE }}
          TS_ORCH_SHA256: ${{ vars.TS_ORCH_SHA256 }}
          TS_AUTO_DEPLOY_ENVIRONMENT: ${{ vars.TS_AUTO_DEPLOY_ENVIRONMENT }}
          TS_OBJECT_NAMESPACE: ${{ vars.TS_OBJECT_NAMESPACE }}
          TS_RELEASE_VAULT_ID: ${{ vars.TS_RELEASE_VAULT_ID }}
          TS_RELEASE_KEY_SECRET: ${{ vars.TS_RELEASE_KEY_SECRET }}
          TS_RELEASE_ACTOR: ${{ vars.TS_RELEASE_ACTOR }}
          TS_RELEASE_OCI_USER: ${{ vars.TS_RELEASE_OCI_USER }}
          TS_RELEASE_OCI_TENANCY: ${{ vars.TS_RELEASE_OCI_TENANCY }}
          TS_RELEASE_OCI_FINGERPRINT: ${{ vars.TS_RELEASE_OCI_FINGERPRINT }}
        run: bash scripts/ci/deploy.sh terrabase terrabase-linux-arm64 "ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
