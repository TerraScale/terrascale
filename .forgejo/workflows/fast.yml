name: Fast integration

# fast and release run in parallel. Require "Fast integration / fast" and
# "Fast integration / release" in Forgejo's branch protection for the merge gate.
#
# - fast: locked restore, formatting, Release build with analyzers as errors,
#   and the Fast integration suite (make targets).
# - release: publishes the self-contained single-file executable and smoke-runs
#   the exact staged bytes. On a push to main or of a v* tag it attaches them to
#   a draft release (scripts/ci/release.sh draft).
# - publish: once both pass, publishes that draft. Nothing is rebuilt.
#
# The Slow suite runs separately (slow.yml) and never blocks.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a running check of the same branch; main always finishes.
concurrency:
  group: terrabase-fast-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  fast:
    name: fast
    runs-on: terrascale-builder
    # Fast takes a few minutes; fail a hung run before it holds the runner.
    timeout-minutes: 20
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use the persistent NuGet cache
        run: bash scripts/ci/nuget-cache.sh

      - name: Restore with locked dependencies
        run: make restore

      - name: Check formatting
        run: make fmt-check

      - name: Build Release with analyzers as errors
        run: make build CONFIGURATION=Release

      - name: Fast integration suite
        run: make test-fast CONFIGURATION=Release

  release:
    name: release
    runs-on: terrascale-builder
    timeout-minutes: 20
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          # Full history and tags: release notes and the tag-on-main check.
          fetch-depth: 0
          persist-credentials: false

      - name: Use the persistent NuGet cache
        run: bash scripts/ci/nuget-cache.sh

      - name: Check the release script against a fake release API
        run: bash scripts/ci/check-release.sh

      - name: Publish and smoke-run the release executable
        run: bash scripts/ci/stage-release.sh artifacts/dist

      # Pull requests get a read-only job token and never reach this step.
      - name: Attach the tested bytes to a draft release
        id: draft
        if: ${{ forgejo.event_name == 'push' && (forgejo.ref == 'refs/heads/main' || startsWith(forgejo.ref, 'refs/tags/v')) }}
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: bash scripts/ci/release.sh draft artifacts/dist

  publish:
    name: publish
    needs: [fast, release]
    if: ${{ needs.release.outputs.release_id != '' }}
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish the tested release
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: bash scripts/ci/release.sh publish "$RELEASE_ID"
