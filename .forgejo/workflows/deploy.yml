name: deploy
on:
  push:
    branches: [main]
concurrency:
  group: dashboard-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: terrascale-builder
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Go and Node.js toolchains
        run: scripts/setup-ci-toolchains.sh
      - name: Install dashboard JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Check generated Templ, lint, bundle, and run fast Go tests
        run: make lint test-fast build
      - name: Deploy production (one warm demo machine)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          fly config validate --strict -c fly.toml
          fly deploy -c fly.toml --strategy immediate --ha=false
          # The in-memory demo has process-local account and session state.
          fly scale count 1 -a ts-dashboard-2 -c fly.toml --yes
          machines_json=$(mktemp)
          volumes_json=$(mktemp)
          trap 'rm -f "$machines_json" "$volumes_json"' EXIT
          fly machine list -a ts-dashboard-2 --json > "$machines_json"
          fly volumes list -a ts-dashboard-2 --json > "$volumes_json"
          node scripts/check-fly-deployment.mjs production "$machines_json" "$volumes_json"
