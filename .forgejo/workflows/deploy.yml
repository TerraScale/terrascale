name: deploy
on:
  push:
    branches: [main]
concurrency:
  group: dashboard-production-deploy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        env:
          INPUT_GO-VERSION: '1.27.1'
        with:
          cache: false
      - uses: actions/setup-node@v4
        env:
          INPUT_NODE-VERSION: '24'
          INPUT_CACHE-DEPENDENCY-PATH: |
            package-lock.json
            tests/integration/sdk/package-lock.json
        with:
          cache: npm
      - name: Install dashboard JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Lint, bundle, and run fast Go tests
        run: make lint css test-fast build
      - name: Run slow browser and SDK contract tests
        env:
          CI: "1"
        run: make test-slow
  deploy:
    needs: verify
    runs-on: terrascale-builder
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production (single warm machine)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # In-memory demo state must stay on one process and one warm machine.
          fly deploy --strategy immediate --ha=false
          fly scale count 1 --yes
