name: deploy
on:
  push:
    branches: [main]
concurrency:
  group: dashboard-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pull requests only merge after the e2e workflow lints and tests them,
      # and Fly's remote builder compiles the image, so the runner needs no
      # Go or Node.js toolchain of its own.
      - name: Build on Fly and deploy production (one warm demo machine)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ts-dashboard
        run: |
          set -euo pipefail
          fly config validate --strict -c fly.toml
          fly deploy -c fly.toml --remote-only --strategy immediate --ha=false \
            --build-arg VERSION="$GITHUB_SHA"
          # The in-memory demo has process-local account and session state.
          fly scale count 1 -a "$FLY_APP" -c fly.toml --yes
          machine_id=$(fly machine list -a "$FLY_APP" -q | xargs)
          fly machine wait "$machine_id" -a "$FLY_APP" --state started --wait-timeout 2m
          machines_json=$(mktemp)
          volumes_json=$(mktemp)
          trap 'rm -f "$machines_json" "$volumes_json"' EXIT
          fly machine list -a "$FLY_APP" --json > "$machines_json"
          fly volumes list -a "$FLY_APP" --json > "$volumes_json"
          node scripts/check-fly-deployment.mjs production "$machines_json" "$volumes_json"
          curl -fsS --retry 6 --retry-delay 2 --retry-connrefused \
            "https://${FLY_APP}.fly.dev/health/ready"
