name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: terrascale-builder
    steps:
      - uses: actions/checkout@v4
      - name: Install flyctl
        run: curl -sL https://fly.io/install.sh | sh -s -- 0.4.52
      - name: Deploy production (single machine)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          fly deploy --strategy immediate
