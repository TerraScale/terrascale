name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: terrascale-builder
    steps:
      - uses: actions/checkout@v4
      - name: Build CSS bundle
        run: npm ci --no-audit --no-fund && npm run build:css
      - name: Deploy production (single machine)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # The in-memory demo backend must live in exactly one process:
          # two machines each hold their own accounts and sessions, so a
          # registration on one is invisible on the other (sign-in then fails
          # with "Incorrect email or password" and onboarding bounces to
          # /login). --ha=false skips spare machines and the explicit scale
          # pins the app to one warm machine.
          fly deploy --strategy immediate --ha=false
          fly scale count 1 --yes
