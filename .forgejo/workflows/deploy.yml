name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: terrascale-builder
    steps:
      - uses: actions/checkout@v4
      # A single unbalanced brace silently nests every following rule into a
      # dead selector and whole pages render unstyled — fail fast, no deps.
      - name: Verify CSS brace balance
        run: awk 'BEGIN{d=0}{for(i=1;i<=length($0);i++){c=substr($0,i,1);if(c=="{")d++;else if(c=="}"){d--;if(d<0){print "extra } at line "NR;exit 1}}}}END{if(d!=0){print d" unclosed brace(s)";exit 1}}' src/TerraScale.Dashboard/wwwroot/css/terrascale.css
      - name: Deploy production (single machine)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SEED_TEST_PASSWORD: ${{ secrets.TS_DASHBOARD_SEED_TEST_PASSWORD }}
        run: |
          if [ -n "$SEED_TEST_PASSWORD" ]; then
            [ "${#SEED_TEST_PASSWORD}" -ge 12 ] || { echo 'TS_DASHBOARD_SEED_TEST_PASSWORD must have at least 12 characters.' >&2; exit 1; }
            fly secrets set --stage TS_DASHBOARD_SEED_TEST_PASSWORD="$SEED_TEST_PASSWORD"
          else
            echo 'TS_DASHBOARD_SEED_TEST_PASSWORD is absent; existing Fly secrets are unchanged.'
          fi
          # The in-memory demo backend must live in exactly one process:
          # two machines each hold their own accounts and sessions, so a
          # registration on one is invisible on the other (sign-in then fails
          # with "Incorrect email or password" and onboarding bounces to
          # /login). --ha=false skips spare machines and the explicit scale
          # pins the app to one warm machine.
          fly deploy --strategy immediate --ha=false
          fly scale count 1 --yes
