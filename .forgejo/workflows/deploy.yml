name: deploy
on:
  push:
    branches: [main]
concurrency:
  group: dashboard-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: terrascale-builder
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Go and Node.js toolchains
        run: scripts/setup-ci-toolchains.sh
      - name: Install dashboard JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Check generated Templ, lint, bundle, and run fast Go tests
        run: make lint test-fast build
      - name: Deploy production (one warm demo machine)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          fly config validate --strict -c fly.toml
          fly deploy -c fly.toml --strategy immediate --ha=false
          # The in-memory demo has process-local account and session state.
          fly scale count 1 -a ts-dashboard -c fly.toml --yes
          machines_json=$(mktemp)
          volumes_json=$(mktemp)
          trap 'rm -f "$machines_json" "$volumes_json"' EXIT
          fly machine list -a ts-dashboard --json > "$machines_json"
          machine_to_update=$(node -e '
            const machines = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (machines.length !== 1) process.exit(1);
            if (machines[0].config?.init?.swap_size_mb !== 900) process.stdout.write(machines[0].id);
          ' "$machines_json")
          if [[ -n "$machine_to_update" ]]; then
            fly machine update "$machine_to_update" -a ts-dashboard -c fly.toml --swap-size 900 --yes
            fly machine list -a ts-dashboard --json > "$machines_json"
          fi
          fly volumes list -a ts-dashboard --json > "$volumes_json"
          node scripts/check-fly-deployment.mjs production "$machines_json" "$volumes_json"
