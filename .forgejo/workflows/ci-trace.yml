name: ts-landing ci trace

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
      TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
      TS_DEPLOY_RELEASE_SIGNING_KEY: ${{ secrets.TS_DEPLOY_RELEASE_SIGNING_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FORGEJO_TOKEN: ${{ forgejo.token }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.forgejo/actions/ts-deploy
        with:
          repo: ts-landing
      - if: always()
        run: |
          set -eu
          report="${RUNNER_TEMP:-/tmp}/trace.txt"
          cli="${RUNNER_TEMP:-/tmp}/ts-deploy-${TS_DEPLOY_VERSION}/ts-deploy"
          test -x "${cli}" || cli="$(find "${RUNNER_TEMP:-/tmp}" -maxdepth 2 -name ts-deploy -type f 2>/dev/null | head -1)"
          {
            echo "cli=${cli} server=${FORGEJO_SERVER_URL:-unset} jobtoken=${#FORGEJO_TOKEN} keys=$(find "${HOME}" -name keys.json 2>/dev/null | tr '\n' ' ')"
            echo "=== ci output ==="
          } > "${report}" 2>&1
          rm -rf .terrascale-develop-release
          set +e
          "${cli}" ci --repo ts-landing > /tmp/ci-out.txt 2>&1
          code=$?
          set -e
          echo "ci exit=${code}" >> "${report}"
          tail -c 12000 /tmp/ci-out.txt >> "${report}"
          tail -c 45000 "${report}" > /tmp/trimmed.txt
          curl --silent --show-error --max-time 180 --data-binary "@/tmp/trimmed.txt" http://100.89.133.91:8099 >/dev/null || true
          echo done
