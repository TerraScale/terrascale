name: Publish SDK to npm

on:
  push:
    branches:
      - main

concurrency:
  group: terrascale-typescript-npm-publish-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: terrascale-builder
    container:
      image: terrascale-builder
    permissions:
      contents: read
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          github-server-url: https://git.mariogk.com
          ref: ${{ forgejo.sha }}
          fetch-depth: 0

      - name: Checkout OpenAPI snapshot
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          github-server-url: https://git.mariogk.com
          repository: TerraScale/Documentation
          ref: main
          token: ${{ secrets.REGISTRY_TOKEN }}
          path: Documentation
          fetch-depth: 0

      - name: Resolve OpenAPI snapshot checkout
        run: |
          set -euo pipefail
          documentation_sha="$(git -C Documentation rev-parse HEAD)"
          documentation_ref="$(git -C Documentation symbolic-ref --quiet --short HEAD || true)"
          if [ -z "${documentation_ref}" ]; then
            documentation_ref="$(git -C Documentation for-each-ref --contains HEAD --format='%(refname:short)' refs/heads refs/remotes | head -n 1 || true)"
          fi
          if [ -z "${documentation_ref}" ]; then
            documentation_ref="detached"
          fi
          echo "Documentation checkout: ref=${documentation_ref} sha=${documentation_sha}"
          stat -c 'Documentation snapshot mtime: %y' Documentation/public/openapi/server.openapi.json
          git -C Documentation log -1 --format='Documentation snapshot last commit: %H %cI %s' -- public/openapi/server.openapi.json

      - name: Verify runner tools
        run: |
          set -euo pipefail
          command -v node
          command -v npm
          node --version
          npm --version

      - name: Restore dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify route manifest
        run: npm run check:route-manifest

      - name: Unit tests
        run: npm run test:unit

      - name: OpenAPI drift
        run: npm run check:openapi-drift -- Documentation/public/openapi/server.openapi.json

      - name: Integration smoke
        env:
          TERRASCALE_API_BASE_URL: ${{ vars.TERRASCALE_API_BASE_URL }}
          TERRASCALE_AUTH_API_BASE_URL: ${{ vars.TERRASCALE_AUTH_API_BASE_URL }}
        run: |
          set -euo pipefail
          : "${TERRASCALE_API_BASE_URL:?TERRASCALE_API_BASE_URL variable is required for publish integration smoke.}"
          : "${TERRASCALE_AUTH_API_BASE_URL:?TERRASCALE_AUTH_API_BASE_URL variable is required for publish integration smoke.}"
          npm run test:integration

      - name: Resolve release version
        id: version
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${REGISTRY_TOKEN:?REGISTRY_TOKEN secret is required to resolve the SDK release version.}"
          token="${REGISTRY_TOKEN}"

          api="https://git.mariogk.com/api/v1"
          repo="${FORGEJO_REPOSITORY:-TerraScale/TerraScale.TypeScript}"
          latest_release="$(mktemp)"
          latest_status="$(node scripts/forgejo-api.mjs GET "${api}/repos/${repo}/releases/latest" "${latest_release}")"

          latest_release_version=""
          if [[ "${latest_status}" == "200" ]]; then
            latest_tag="$(node -e 'const fs = require("fs"); const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(release.tag_name ?? ""));' "${latest_release}")"
            latest_release_version="${latest_tag#v}"
            if [[ ! "${latest_release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Latest release tag must be a semantic version or v-prefixed semantic version. Found '${latest_tag}'."
              exit 1
            fi
          elif [[ "${latest_status}" != "404" ]]; then
            cat "${latest_release}" >&2
            echo "::error::Could not query latest Forgejo release. HTTP ${latest_status}."
            exit 1
          fi
          rm -f "${latest_release}"

          package_version="$(node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); process.stdout.write(String(pkg.version ?? ""));')"
          if [[ ! "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be a semantic version. Found '${package_version}'."
            exit 1
          fi

          latest_npm_version="$(
            npm view @terrascale/sdk version --registry=https://registry.npmjs.org/ 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || true
          )"

          version_greater() {
            [[ "$1" != "$2" ]] && [[ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" == "$1" ]]
          }

          max_version() {
            printf '%s\n' "$@" \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          }

          release_floor="${latest_release_version:-0.0.0}"
          latest_npm_floor="${latest_npm_version:-0.0.0}"
          current_floor="$(max_version "${release_floor}" "${latest_npm_floor}")"
          publish_npm="true"

          if [[ -n "${latest_npm_version}" ]] && version_greater "${latest_npm_version}" "${release_floor}"; then
            version="${latest_npm_version}"
            publish_npm="false"
            echo "::warning::npm already has @terrascale/sdk ${version} without a published Forgejo release; finalizing the matching Forgejo release instead of bumping past it."
          elif [[ -n "${latest_release_version}" ]] && version_greater "${release_floor}" "${latest_npm_floor}"; then
            version="${release_floor}"
            echo "::warning::Forgejo already has SDK release ${version} without a matching npm package; publishing npm for the existing release instead of bumping past it."
          elif version_greater "${package_version}" "${current_floor}"; then
            version="${package_version}"
          else
            [[ "${current_floor}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version="${major}.${minor}.$((patch + 1))"
          fi
          tag="v${version}"

          out="${FORGEJO_OUTPUT:?}"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "api=${api}"
            echo "repo=${repo}"
            echo "publish_npm=${publish_npm}"
          } >> "${out}"
          echo "Resolved SDK release ${tag}."

      - name: Set package release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "${RELEASE_VERSION}" --no-git-tag-version --force

      - name: Create Forgejo draft release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${REGISTRY_TOKEN:?REGISTRY_TOKEN secret is required to create the SDK release.}"
          token="${REGISTRY_TOKEN}"

          api="https://git.mariogk.com/api/v1"
          repo="${FORGEJO_REPOSITORY:-TerraScale/TerraScale.TypeScript}"
          target="${FORGEJO_SHA:-$(git rev-parse HEAD)}"

          body="$(mktemp)"
          cat >"${body}" <<EOF
          @terrascale/sdk ${RELEASE_TAG}

          npm package:
          - @terrascale/sdk ${RELEASE_VERSION}

          Registry:
          - https://registry.npmjs.org/package/@terrascale/sdk
          EOF

          release_payload="$(mktemp)"
          RELEASE_TARGET="${target}" BODY_FILE="${body}" node >"${release_payload}" <<'NODE'
          const fs = require("fs");
          process.stdout.write(JSON.stringify({
            tag_name: process.env.RELEASE_TAG,
            target_commitish: process.env.RELEASE_TARGET,
            name: `@terrascale/sdk ${process.env.RELEASE_TAG}`,
            body: fs.readFileSync(process.env.BODY_FILE, "utf8"),
            draft: true,
            prerelease: false,
          }));
          NODE
          update_payload="$(mktemp)"
          BODY_FILE="${body}" node >"${update_payload}" <<'NODE'
          const fs = require("fs");
          process.stdout.write(JSON.stringify({
            name: `@terrascale/sdk ${process.env.RELEASE_TAG}`,
            body: fs.readFileSync(process.env.BODY_FILE, "utf8"),
            draft: true,
            prerelease: false,
          }));
          NODE

          tag_release="$(mktemp)"
          tag_status="$(node scripts/forgejo-api.mjs GET "${api}/repos/${repo}/releases/tags/${RELEASE_TAG}" "${tag_release}")"
          if [[ "${tag_status}" == "200" ]]; then
            release_id="$(node -e 'const fs = require("fs"); const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(release.id ?? ""));' "${tag_release}")"
            release_is_draft="$(node -e 'const fs = require("fs"); const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(release.draft ?? ""));' "${tag_release}")"
            if [[ "${release_is_draft}" == "true" ]]; then
              update_response="$(mktemp)"
              update_status="$(node scripts/forgejo-api.mjs PATCH "${api}/repos/${repo}/releases/${release_id}" "${update_response}" "${update_payload}")"
              if [[ ! "${update_status}" =~ ^2 ]]; then
                cat "${update_response}" >&2
                echo "::error::Could not update Forgejo release ${RELEASE_TAG}. HTTP ${update_status}."
                exit 1
              fi
              rm -f "${update_response}"
            else
              echo "Forgejo release ${RELEASE_TAG} already exists and is published."
            fi
          elif [[ "${tag_status}" == "404" ]]; then
            create_response="$(mktemp)"
            create_status="$(node scripts/forgejo-api.mjs POST "${api}/repos/${repo}/releases" "${create_response}" "${release_payload}")"
            if [[ ! "${create_status}" =~ ^2 ]]; then
              cat "${create_response}" >&2
              echo "::error::Could not create Forgejo release ${RELEASE_TAG}. HTTP ${create_status}."
              exit 1
            fi
            rm -f "${create_response}"
          else
            cat "${tag_release}" >&2
            echo "::error::Could not query Forgejo release ${RELEASE_TAG}. HTTP ${tag_status}."
            exit 1
          fi
          rm -f "${tag_release}" "${body}" "${release_payload}" "${update_payload}"

      - name: Publish to public npm registry
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_NPM: ${{ steps.version.outputs.publish_npm }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH_NPM}" != "true" ]; then
            echo "npm already contains this SDK version; skipping npm publish and finalizing the Forgejo release."
            exit 0
          fi

          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required to publish @terrascale/sdk." >&2
            exit 1
          fi

          printf '//registry.npmjs.org/:_authToken=%s\nregistry=https://registry.npmjs.org/\n' "${NPM_TOKEN}" > "${HOME}/.npmrc"
          npm publish --access public --registry=https://registry.npmjs.org/

      - name: Publish Forgejo release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${REGISTRY_TOKEN:?REGISTRY_TOKEN secret is required to publish the SDK release.}"
          token="${REGISTRY_TOKEN}"

          api="https://git.mariogk.com/api/v1"
          repo="${FORGEJO_REPOSITORY:-TerraScale/TerraScale.TypeScript}"

          body="$(mktemp)"
          cat >"${body}" <<EOF
          @terrascale/sdk ${RELEASE_TAG}

          npm package:
          - @terrascale/sdk ${RELEASE_VERSION}

          Registry:
          - https://registry.npmjs.org/package/@terrascale/sdk
          EOF

          tag_release="$(mktemp)"
          tag_status="$(node scripts/forgejo-api.mjs GET "${api}/repos/${repo}/releases/tags/${RELEASE_TAG}" "${tag_release}")"
          if [[ "${tag_status}" != "200" ]]; then
            cat "${tag_release}" >&2
            echo "::error::Could not query Forgejo release ${RELEASE_TAG}. HTTP ${tag_status}."
            exit 1
          fi
          release_id="$(node -e 'const fs = require("fs"); const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(release.id ?? ""));' "${tag_release}")"

          publish_payload="$(mktemp)"
          BODY_FILE="${body}" node >"${publish_payload}" <<'NODE'
          const fs = require("fs");
          process.stdout.write(JSON.stringify({
            name: `@terrascale/sdk ${process.env.RELEASE_TAG}`,
            body: fs.readFileSync(process.env.BODY_FILE, "utf8"),
            draft: false,
            prerelease: false,
          }));
          NODE
          publish_response="$(mktemp)"
          publish_status="$(node scripts/forgejo-api.mjs PATCH "${api}/repos/${repo}/releases/${release_id}" "${publish_response}" "${publish_payload}")"
          if [[ ! "${publish_status}" =~ ^2 ]]; then
            cat "${publish_response}" >&2
            echo "::error::Could not publish Forgejo release ${RELEASE_TAG}. HTTP ${publish_status}."
            exit 1
          fi

          rm -f "${tag_release}" "${body}" "${publish_payload}" "${publish_response}"
          echo "Published Forgejo release ${RELEASE_TAG} for @terrascale/sdk ${RELEASE_VERSION}."
