name: Publish SDK to npm

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: terrascale-builder
    timeout-minutes: 20
    container:
      image: terrascale-builder
    permissions:
      contents: read
    env:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      TERRASCALE_API_BASE_URL: ${{ vars.TERRASCALE_API_BASE_URL }}
      TERRASCALE_AUTH_API_BASE_URL: ${{ vars.TERRASCALE_AUTH_API_BASE_URL }}
    steps:
      - name: Install TerraScale Deploy CLI
        run: |
          set -euo pipefail
          : "${REGISTRY_TOKEN:?REGISTRY_TOKEN is required to install TerraScale.Deploy.Cli.}"
          nuget_config_dir="$(mktemp -d)"
          trap 'rm -rf "${nuget_config_dir}"' EXIT
          nuget_user="${REGISTRY_USER:-forgejo-actions}"
          dotnet new nugetconfig --output "${nuget_config_dir}" --force >/dev/null
          dotnet nuget add source "https://git.mariogk.com/api/packages/TerraScale/nuget/index.json" \
            --name terrascale-forgejo \
            --username "${nuget_user}" \
            --password "${REGISTRY_TOKEN}" \
            --store-password-in-clear-text \
            --configfile "${nuget_config_dir}/nuget.config" >/dev/null
          rm -rf .tools
          dotnet tool install TerraScale.Deploy.Cli \
            --tool-path .tools \
            --configfile "${nuget_config_dir}/nuget.config"
          ./.tools/terrascale-deploy version

      - name: Publish SDK
        run: ./.tools/terrascale-deploy publish-application --checkout --repository-root TerraScale.TypeScript
