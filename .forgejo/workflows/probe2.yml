on:
  workflow_call:
    inputs:
      probe_input:
        description: probe
        type: string
        required: false
        default: ""

jobs:
  probe:
    runs-on: terrascale-builder
    timeout-minutes: 5
    env:
      PROBE_VAR: ${{ vars.TS_DEPLOY_VERSION }}
      FORGEJO_TOKEN: ${{ forgejo.token }}
      PROBE_INPUT: ${{ inputs.probe_input }}
    steps:
      - run: |
          set -eu
          test -n "${PROBE_VAR}"
          test -n "${FORGEJO_TOKEN}"
          echo "env-contexts-ok"
