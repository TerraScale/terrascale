<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1382" viewBox="0 0 1600 1382" role="img" aria-labelledby="title desc">
<title id="title">TerraScale target architecture with 10 regions</title>
<desc id="desc">REST bootstrap through a Cloudflare Worker then direct regional REST. Reactive delivery through a Snippet and CDN. TerraBase runs SQLite, physical RF=2 and direct QUIC replication. Every member host has a local orchestrator; GRU controls mutations and three fixed global store replicas serve 10 regions.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#536c83"/></marker></defs>
<rect width="1600" height="1382" fill="#f7f9fc"/>
<style>text{font-family:Arial,sans-serif;fill:#18334a}.body{font-size:15px}.small{font-size:15px}.h{font-size:18px;font-weight:700}.section{font-size:18px;font-weight:700;letter-spacing:.6px}</style>
<rect x="0" y="0" width="1600" height="128" rx="0" fill="#112d43" stroke="#112d43"/>
<text x="44" y="39" class="section" style="fill:#78d7bb">TERRASCALE / ARCHITECTURE</text>
<text x="44" y="86" class="h" style="fill:#fff;font-size:34px">10 regions. One v1 architecture.</text>
<text x="1060" y="52" class="h" style="fill:#fff">20 member hosts minimum</text>
<text x="1060" y="82" class="body" style="fill:#c4dbe9">20 local orchestrators · 3 control replicas</text>
<text x="44" y="158" class="small" >TARGET DESIGN  ·  Blue = REST  ·  Green = reactive  ·  Amber = data/replication  ·  Purple = control</text>
<rect x="32" y="180" width="1536" height="502" rx="12" fill="#fff" stroke="#d2dee8"/>
<text x="52" y="212" class="section" >01  REQUESTS AND THE DATABASE</text>
<text x="888" y="212" class="small" >OCI detail = one selected database Region, repeated as placed</text>
<rect x="56" y="264" width="220" height="116" rx="12" fill="#f0f4f8" stroke="#73889d"/>
<text x="73" y="293" class="h" >App / SDK</text>
<text x="73" y="322" class="body" >TS · Go · Rust · .NET</text>
<text x="73" y="345" class="body" >Sign in / API credential</text>
<text x="73" y="368" class="body" >Session + idempotency</text>
<rect x="326" y="264" width="260" height="116" rx="12" fill="#eaf2ff" stroke="#3778bd"/>
<text x="343" y="293" class="h" >REST load balancer</text>
<text x="343" y="322" class="body" >api.terrascale.tech</text>
<text x="343" y="345" class="body" >ts-proxy Worker</text>
<text x="343" y="368" class="body" >Placement + health + load</text>
<rect x="646" y="264" width="290" height="116" rx="12" fill="#fff3df" stroke="#b47d2b"/>
<text x="663" y="293" class="h" >TerraBase public API</text>
<text x="663" y="322" class="body" >Direct regional TLS endpoint</text>
<text x="663" y="345" class="body" >Auth · scope · session frontier</text>
<text x="663" y="368" class="body" >CRUD · read-only SQL · attach</text>
<rect x="996" y="264" width="260" height="116" rx="12" fill="#fff3df" stroke="#b47d2b"/>
<text x="1013" y="293" class="h" >SQLite + WAL</text>
<text x="1013" y="322" class="body" >Per database, one writer</text>
<text x="1013" y="345" class="body" >Bytes · indexes · history</text>
<text x="1013" y="368" class="body" >Atomic publication journal</text>
<rect x="1316" y="264" width="228" height="116" rx="12" fill="#fff3df" stroke="#b47d2b"/>
<text x="1333" y="293" class="h" >Physical follower</text>
<text x="1333" y="322" class="body" >Second regional host</text>
<text x="1333" y="345" class="body" >RF=2 · durable WAL ack</text>
<text x="1333" y="368" class="body" >Same placement</text>
