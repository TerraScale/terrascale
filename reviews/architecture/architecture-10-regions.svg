<text x="44" y="1301" class="body" >Regional services: TerraBase + ts-orchestrator + ts-node + Grafana agent on each host. Regional backups remain on OCI.</text>
<text x="44" y="1328" class="body" >Estate growth does not widen database residency. A separate regional R3 needs at least 3 eligible hosts and explicit admission.</text>
<text x="44" y="1355" class="small" >GRU / NATS outage pauses new control mutations; admitted data-plane service continues. Launch qualifies 3 Regions; 10/20 are design targets.</text>
