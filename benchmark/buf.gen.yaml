# Go stub generation for the TBEP gRPC contract (ADR 0025).
#
# CI pins buf v1.50.0, protoc v34.1, protoc-gen-go v1.36.12, and
# protoc-gen-go-grpc v1.6.2. The sole checked-in client binding tree is
# generated from the buf.yaml module's single engine.proto input with
# source-relative paths.
#
# Regenerate after editing the proto with:
#
#   PATH="$(go env GOPATH)/bin:$(go env GOBIN):$PATH" buf generate
#
# The committed stubs are drift-checked in CI by regenerating and
# diffing. The Rust side needs no such step: its build.rs regenerates
# through protox on every build.
version: v2
plugins:
  - local: protoc-gen-go
    out: terrabase-go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: terrabase-go
    opt: paths=source_relative
