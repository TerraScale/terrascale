# ts-orchestrator renders private-network targets for the exact candidate.
# Do not add a public load-balancer or public gateway target here.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/prometheus-rules.yml

scrape_configs:
  - job_name: terrabase
    scheme: http
    metrics_path: /internal/metrics
    scrape_timeout: 10s
    enable_http2: true
    sample_limit: 10000
    target_limit: 1000
    # ts-orchestrator supplies targets reachable only through its private
    # network policy. An empty target list is intentional.
    static_configs:
      - targets: []
