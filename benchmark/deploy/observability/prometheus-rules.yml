# TerraBase SLO rules for the bounded metric contract.
#
# The only alerting rules in this file page. Every cause-level signal remains
# a dashboard fact; the OnCall router accepts only slo.burn_rate.* events.
# The request counters are local instrumentation, not an external availability
# probe. These recording rules are an explicitly named availability proxy.
groups:
  - name: terrabase-slo-recordings
    interval: 30s
    rules:
      # D-75: 99.9% monthly availability, so the error budget is 0.1%.
      # Rejected requests are excluded: invalid credentials, customer limits,
      # and requested suspension are not unavailable operations.
      - record: terrabase:slo:api_requests:rate5m
        expr: sum by (job, region) (rate(terrabase_requests_total{job="terrabase",region!="unknown",outcome=~"success|error|timeout"}[5m]))
      - record: terrabase:slo:api_errors:rate5m
        expr: sum by (job, region) (rate(terrabase_requests_total{job="terrabase",region!="unknown",outcome=~"error|timeout"}[5m]))
      - record: terrabase:slo:api_error_ratio:5m
        expr: terrabase:slo:api_errors:rate5m / clamp_min(terrabase:slo:api_requests:rate5m, 0.000000001)
      - record: terrabase:slo:api_error_ratio:30m
        expr: sum by (job, region) (rate(terrabase_requests_total{job="terrabase",region!="unknown",outcome=~"error|timeout"}[30m])) / clamp_min(sum by (job, region) (rate(terrabase_requests_total{job="terrabase",region!="unknown",outcome=~"success|error|timeout"}[30m])), 0.000000001)
      - record: terrabase:slo:api_error_ratio:1h
        expr: sum by (job, region) (rate(terrabase_requests_total{job="terrabase",region!="unknown",outcome=~"error|timeout"}[1h])) / clamp_min(sum by (job, region) (rate(terrabase_requests_total{job="terrabase",region!="unknown",outcome=~"success|error|timeout"}[1h])), 0.000000001)
      - record: terrabase:slo:api_error_ratio:6h
        expr: sum by (job, region) (rate(terrabase_requests_total{job="terrabase",region!="unknown",outcome=~"error|timeout"}[6h])) / clamp_min(sum by (job, region) (rate(terrabase_requests_total{job="terrabase",region!="unknown",outcome=~"success|error|timeout"}[6h])), 0.000000001)

      # Burn rate is error ratio divided by the 0.001 D-75 budget.
      - record: terrabase:slo:api_burn_rate:5m
        expr: terrabase:slo:api_error_ratio:5m / 0.001
      - record: terrabase:slo:api_burn_rate:30m
        expr: terrabase:slo:api_error_ratio:30m / 0.001
      - record: terrabase:slo:api_burn_rate:1h
        expr: terrabase:slo:api_error_ratio:1h / 0.001
      - record: terrabase:slo:api_burn_rate:6h
        expr: terrabase:slo:api_error_ratio:6h / 0.001

  - name: terrabase-slo-pages
    interval: 30s
    rules:
      # Fast burn: 14.4x in both the 1h and 5m windows. The two-window
      # confirmation avoids paging on a short-lived spike.
      - alert: TerraBaseSLOBurnRateFast
        expr: |
          terrabase:slo:api_burn_rate:1h{region!="unknown"} >= 14.4
            and on (job, region)
          terrabase:slo:api_burn_rate:5m{region!="unknown"} >= 14.4
        for: 2m
        labels:
          service: terrabase
          severity: critical
          notification: page
          slo: api_availability
        annotations:
          summary: TerraBase API availability is burning its error budget quickly
          description: The 99.9% API availability proxy is burning at least 14.4x in {{ $labels.region }} in both the 1h and 5m windows. Confirm the external probe before treating this as the published D-75 SLO.

      # Slow burn: 6x in both the 6h and 30m windows. This catches a sustained
      # customer-visible degradation that the fast tier may not catch.
      - alert: TerraBaseSLOBurnRateSlow
        expr: |
          terrabase:slo:api_burn_rate:6h{region!="unknown"} >= 6
            and on (job, region)
          terrabase:slo:api_burn_rate:30m{region!="unknown"} >= 6
        for: 15m
        labels:
          service: terrabase
          severity: critical
          notification: page
          slo: api_availability
        annotations:
          summary: TerraBase API availability is burning its error budget steadily
          description: The 99.9% API availability proxy is burning at least 6x in {{ $labels.region }} in both the 6h and 30m windows. Confirm the external probe before treating this as the published D-75 SLO.
