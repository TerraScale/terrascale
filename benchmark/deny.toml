[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Parent-ratified allowlist (PD-2026-08-26-14 companion action, 2026-08-26):
# SE-02's 157-package sync-core closure audit plus SE-04's serde_json —
# MIT/Apache-2.0 dominant, with the flagged exceptions named in
# docs/spike/se02-base-engine-spike.md. The pinned cargo-deny gate enforces
# this recorded disposition.
#
# 2026-08-27 (PD-2026-08-27-01): `r-efi` declares
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later". cargo-deny accepts it through the
# already-allowed MIT or Apache-2.0 branch. LGPL is deliberately absent from
# this list, so a package whose only option is LGPL remains rejected.
# The GAP-S2 crypto closure (chacha20poly1305 0.11.0 / aes-gcm 0.11.1,
# 25 packages) is otherwise MIT OR Apache-2.0 throughout.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSL-1.0",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace packages cannot be published while the distribution license is
# still an owner decision. Dependency licenses remain subject to the allowlist
# above; the separate repository license gate validates this pending marker.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
