[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Parent-ratified allowlist (PD-2026-08-26-14 companion action, 2026-08-26):
# SE-02's 157-package sync-core closure audit plus SE-04's serde_json —
# MIT/Apache-2.0 dominant, with the flagged exceptions named in
# docs/spike/se02-base-engine-spike.md. cargo-deny itself remains unrun
# until the tool is available; this list is the recorded disposition.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSL-1.0",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
