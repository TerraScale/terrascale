[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Parent-ratified allowlist (PD-2026-08-26-14 companion action, 2026-08-26):
# SE-02's 157-package sync-core closure audit plus SE-04's serde_json —
# MIT/Apache-2.0 dominant, with the flagged exceptions named in
# docs/spike/se02-base-engine-spike.md. The pinned cargo-deny gate enforces
# this recorded disposition.
#
# 2026-08-27 (PD-2026-08-27-01): `r-efi` declares
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later". cargo-deny accepts it through the
# already-allowed MIT or Apache-2.0 branch. LGPL is deliberately absent from
# this list, so a package whose only option is LGPL remains rejected.
# The GAP-S2 crypto closure (chacha20poly1305 0.11.0 / aes-gcm 0.11.1,
# 25 packages) is otherwise MIT OR Apache-2.0 throughout.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSL-1.0",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8
# AWS-LC's FIPS source distribution combines its ISC and Apache-2.0 code with
# the OpenSSL license. Keep that additional license scoped to the exact FIPS
# sys crate rather than widening the repository-wide allowlist.
exceptions = [
  { allow = ["OpenSSL"], crate = "aws-lc-fips-sys@0.14.1" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Every first-party workspace crate is private (`publish = false`). Permit
# unversioned path edges between them while registry wildcard edges stay denied.
allow-wildcard-paths = true
# Only the enumerated upstream duplicate families are accepted. Every
# unlisted duplicate remains a hard failure.
skip = [
  { crate = "foldhash@0.1.5", reason = "prost-build's petgraph closure still uses hashbrown 0.15 while the runtime graph uses hashbrown 0.17" },
  { crate = "getrandom@0.2.17", reason = "ring still uses getrandom 0.2 while current build and transport dependencies use getrandom 0.4" },
  { crate = "hashbrown@0.15.5", reason = "prost-build's petgraph closure still uses hashbrown 0.15 while the runtime graph uses hashbrown 0.17" },
  { crate = "itertools@0.13.0", reason = "aws-lc-fips-sys bindgen uses itertools 0.13 while prost code generation uses itertools 0.14" },
  { crate = "logos@0.15.1", reason = "protox-parse uses logos 0.15 while prost-reflect uses logos 0.16" },
  { crate = "logos-codegen@0.15.1", reason = "protox-parse uses logos 0.15 while prost-reflect uses logos 0.16" },
  { crate = "logos-derive@0.15.1", reason = "protox-parse uses logos 0.15 while prost-reflect uses logos 0.16" },
  { crate = "shlex@1.3.0", reason = "aws-lc-fips-sys bindgen uses shlex 1 while its cc build path uses shlex 2; both are upstream build-only dependencies" },
  { crate = "syn@2.0.119", reason = "upstream TLS and code-generation derives still use syn 2 while current derives use syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
