[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Parent-ratified allowlist (PD-2026-08-26-14 companion action, 2026-08-26):
# SE-02's 157-package sync-core closure audit plus SE-04's serde_json —
# MIT/Apache-2.0 dominant, with the flagged exceptions named in
# docs/spike/se02-base-engine-spike.md. cargo-deny itself remains unrun
# until the tool is available; this list is the recorded disposition.
#
# 2026-08-27 (PD-2026-08-27-01): "MIT OR Apache-2.0 OR LGPL-2.1-or-later"
# is permitted as a LICENSE EXPRESSION CHOICE for packages whose effective
# license is permissive at choice — recorded for `r-efi` (in the lock via
# `getrandom` since the SE-02 closure; re-flagged by the GAP-S2 dependency
# audit). This is an expression-level allowance, not an LGPL code
# acceptance: no package whose ONLY option is LGPL may enter the tree.
# The GAP-S2 crypto closure (chacha20poly1305 0.11.0 / aes-gcm 0.11.1,
# 25 packages) is otherwise MIT OR Apache-2.0 throughout.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT OR Apache-2.0 OR LGPL-2.1-or-later",
  "MPL-2.0",
  "BSL-1.0",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
