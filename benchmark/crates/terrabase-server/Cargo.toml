[package]
name = "terrabase-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Production TerraBase engine daemon"
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = "warn"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
terrabase-auth = { path = "../terrabase-auth" }
terrabase-member-transport = { path = "../terrabase-member-transport" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
terrabase = { path = "../..", default-features = false }
terrabase-tbep = { path = "../terrabase-tbep", default-features = false }
terrabase-cluster = { path = "../terrabase-cluster", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "ws", "json"] }
aws-lc-rs = { version = "1.18.0", default-features = false, features = ["non-fips"] }
base64 = "0.22"
hex = "0.4"
zeroize = "1.9.0"
rustix = { version = "1.1.4", features = ["process", "fs"] }
blake3 = "1.8.2"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"
serde_json = { version = "1", features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "sync",
  "time",
] }
toml = "1"
tower-service = "0.3"
rmp = "0.8.15"
terrabase-sync-core = { version = "0.1.0", path = "../terrabase-sync-core" }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std", "async-await"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tokio = { version = "1", features = ["test-util"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
