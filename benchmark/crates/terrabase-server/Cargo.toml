[package]
name = "terrabase-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Production TerraBase engine daemon"
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = "warn"

[dependencies]
terrabase = { path = "../..", default-features = false }
terrabase-tbep = { path = "../terrabase-tbep", default-features = false }
terrabase-cluster = { path = "../terrabase-cluster", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "ws"] }
blake3 = "1.8.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "sync",
  "time",
] }
toml = "1"
rmp = "0.8.15"
terrabase-sync-core = { version = "0.1.0", path = "../terrabase-sync-core" }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
