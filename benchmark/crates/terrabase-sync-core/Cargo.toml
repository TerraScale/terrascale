# `terrabase-sync-core` — the owner of the TerraBase sync result views
# (S-04, D-38): the transport-independent result-view state machine and
# the `terrascale.sync.v2` frame-envelope discipline. The per-field CRDT
# materialization and its `SERVER_PEER_ID` actor model were deleted; no
# CRDT or causal datatype is a dependency of this crate.
#
# Workspace member of the engine root (see the root `Cargo.toml`).

[package]
name = "terrabase-sync-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "TerraBase sync result views: authorized ordered results, revisions, checkpoints, and the sync.v2 frame envelope"
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = "warn"
