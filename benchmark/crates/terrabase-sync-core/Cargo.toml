# `terrabase-sync-core` — the engine-side sync-core seam over
# TerraBase-native CRDT types (per ADR 0024 and the sync-v2 replacement
# contract: no external CRDT engine is a dependency of this crate).
#
# Workspace member of the engine root (see the root `Cargo.toml`).

[package]
name = "terrabase-sync-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "LicenseRef-TerraScale-Pending"
description = "TerraBase sync-core seam: server-authoritative journal materialization over native CRDTs, checkpoints, budgeted deltas, frames"
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = "warn"

[dependencies]
# The datatypes are TerraBase-native: LWW registers from `terrabase-crdt`
# joined over the dotted version vectors, causal contexts, and hybrid
# logical clocks of `terrabase-causal`.
terrabase-causal = { path = "../terrabase-causal" }
terrabase-crdt = { path = "../terrabase-crdt" }

[dev-dependencies]
# The golden conformance corpus is JSON so every SDK CI can consume the
# same data files; the runner parses it with serde_json.
serde_json = "1.0.150"
