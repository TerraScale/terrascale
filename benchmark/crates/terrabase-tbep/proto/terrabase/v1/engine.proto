// TerraBase engine protocol (TBEP) over gRPC.
//
// This file is the contract of record between the Rust engine
// (`terrabase-tbep`, served by tonic) and every client, led by the
// terrabase-go client in this repository. See
// docs/adr/0025-private-protobuf-grpc.md.
//
// Identity: `terrabase.engine.protocol`, registry lineage 1.x, gRPC
// protocol generation 2 (gRPC replaces the custom framing of wire
// generation 1).
//
// Cross-cutting conventions:
//
// - Tenant identity rides gRPC metadata, not fields: every RPC (except
//   `Channel/Bind`, which establishes it) requires `x-tb-principal` and
//   `x-tb-tenant`; a missing identity fails closed. The transport is
//   expected to be mutually authenticated TLS in production; the
//   metadata names the application identity within that channel.
// - Mutations carry their retry identity in the `x-tb-idempotency-key`
//   metadata key (1..=128 bytes, no control characters); the engine
//   deduplicates retries within its retained horizon.
// - Host failures return a gRPC status whose `details` carry one
//   `TbepError` message naming the closed error code and the bounded
//   detail. Clients map codes, never string-match details.
// - Field bounds named in comments are enforced fail-closed by the
//   server; `0` is never a valid enum value on the wire for the closed
//   vocabularies below.

syntax = "proto3";

package terrabase.v1;

option go_package = "terrascale.tech/terrabase-go/terrabase/v1;v1";

// ---------------------------------------------------------------------------
// The recursive document value
// ---------------------------------------------------------------------------

// The closed null marker (mirrors google.protobuf.NullValue).
enum NullValue {
  NULL_UNSPECIFIED = 0;
  NULL = 1;
}

// One ordered map entry of an object value. Object fields are canonically
// name-sorted by the engine; clients treat objects as maps.
message ValueEntry {
  string name = 1; // 1..=64 bytes.
  Value value = 2;
}

// An ordered array of values.
message ValueList {
  repeated Value items = 1; // <= 4096 items.
}

// The recursive document-body value: the payload type of document bodies,
// schema declarations, and sync field values.
message Value {
  oneof kind {
    NullValue null = 1;
    bool boolean = 2;
    sint64 integer = 3;
    double number = 4;
    string text = 5; // <= 1 MiB.
    ValueList list = 6;
    ValueMap map = 7;
  }
}

// An object value: name-sorted field entries.
message ValueMap {
  repeated ValueEntry entries = 1; // <= 1024 entries.
}

// ---------------------------------------------------------------------------
// Shared closed vocabularies
// ---------------------------------------------------------------------------

// The acknowledgement discipline of a committed mutation.
enum Acknowledgement {
  ACK_UNSPECIFIED = 0;
  ACK_REGIONAL_QUORUM = 1;
  ACK_GLOBAL_QUORUM = 2;
  ACK_BACKUP = 3;
}

// Whether a commit reached a backup tier.
enum BackupOutcome {
  BACKUP_UNSPECIFIED = 0;
  BACKUP_NONE = 1;
  BACKUP_FULL = 2;
  BACKUP_PARTIAL = 3;
}

// The read consistency level.
enum ReadLevel {
  READ_LEVEL_UNSPECIFIED = 0;
  READ_LEVEL_LOCAL = 1;
  READ_LEVEL_REGIONAL_QUORUM = 2;
  READ_LEVEL_GLOBAL_QUORUM = 3;
}

// The cluster mode of the serving topology.
enum ClusterMode {
  CLUSTER_MODE_UNSPECIFIED = 0;
  CLUSTER_MODE_STANDALONE = 1;
  CLUSTER_MODE_ACTIVE = 2;
  CLUSTER_MODE_BACKUP = 3;
}

// The cause of a tier move decision.
message TierMoveReason {
  string fact = 1;     // <= 64 bytes.
  string observed = 2; // <= 128 bytes.
}

// The tier administration decision vocabulary.
enum TierDecision {
  TIER_DECISION_UNSPECIFIED = 0;
  TIER_DECISION_PROMOTE = 1;
  TIER_DECISION_DEMOTE = 2;
  TIER_DECISION_SPLIT = 3;
  TIER_DECISION_NONE = 4;
  TIER_DECISION_REFUSED = 5;
}

// The receipt of one tier policy evaluation or move.
message TierMoveReceipt {
  string policy_id = 1;       // <= 128 bytes.
  uint32 policy_version = 2;
  TierDecision decision = 3;
  repeated TierMoveReason reasons = 4; // <= 16 items.
  uint64 segment_id = 5;
  uint64 bytes = 6;
  uint64 manifest_before = 7;
  uint64 manifest_after = 8;
  bool dry_run = 9;
  bool manifest_accepted = 10;
}

// The commit receipt of an applied mutation.
message CommitReceipt {
  uint64 sequence = 1;
  uint64 version = 2;
  string operation_id = 3; // <= 128 bytes.
  Acknowledgement acknowledgement = 4;
  BackupOutcome backup = 5;
}

// The expected-version discipline of a mutation.
message ExpectedVersion {
  oneof discipline {
    ExpectedAbsent absent = 1;
    ExpectedAny any = 2;
    uint64 exact = 3;
  }
}

// The document must not yet exist.
message ExpectedAbsent {}

// The document may exist at any version.
message ExpectedAny {}

// Why a mutation was refused.
enum WriteReason {
  WRITE_REASON_UNSPECIFIED = 0;
  WRITE_REASON_INVALID_DOCUMENT = 1;
  WRITE_REASON_SCHEMA_REFUSED = 2;
  WRITE_REASON_NOT_FOUND = 3;
}

// The outcome of a document write, delete, or batch.
message WriteOutcome {
  oneof outcome {
    CommitReceipt committed = 1;
    WriteConflict conflict = 2;
    WriteRejected rejected = 3;
  }
}

// The write lost the expected-version race.
message WriteConflict {}

// The write was refused before commit.
message WriteRejected {
  WriteReason reason = 1;
}

// Whether a query completed or was truncated by its item bound.
enum QueryTerminal {
  QUERY_TERMINAL_UNSPECIFIED = 0;
  QUERY_TERMINAL_COMPLETE = 1;
  QUERY_TERMINAL_TRUNCATED = 2;
}

// The outcome of a query cancellation.
enum CancelOutcome {
  CANCEL_OUTCOME_UNSPECIFIED = 0;
  CANCEL_OUTCOME_CANCELLED = 1;
  CANCEL_OUTCOME_ALREADY_COMPLETE = 2;
  CANCEL_OUTCOME_UNKNOWN_QUERY = 3;
}

// The kind of one backbone change event.
enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_PUT = 1;
  CHANGE_KIND_DELETE = 2;
}

// One ordered backbone change event.
message ChangeEvent {
  uint64 sequence = 1;
  string operation_id = 2; // <= 128 bytes.
  ChangeKind kind = 3;
  string collection = 4;   // <= 64 bytes.
  string document = 5;     // <= 64 bytes.
}

// Where a subscription starts.
message SubscriptionStart {
  oneof start {
    SubscriptionLive live = 1;
    uint64 sequence = 2;
  }
}

// Start from the live edge.
message SubscriptionLive {}

// The outcome of a sync-session mutation.
message MutationOutcome {
  oneof outcome {
    CommitReceipt applied = 1;
    MutationRejected rejected = 2;
  }
}

// The mutation was refused.
message MutationRejected {
  MutationReason reason = 1;
}

// Why a sync mutation was refused.
enum MutationReason {
  MUTATION_REASON_UNSPECIFIED = 0;
  MUTATION_REASON_SCOPE_REFUSED = 1;
  MUTATION_REASON_INVALID_BODY = 2;
  MUTATION_REASON_SEQUENCE_OUT_OF_ORDER = 3;
}

// One field of a sync change payload.
message SyncField {
  string name = 1; // <= 64 bytes.
  Value value = 2;
}

// One sync mutation: a put of named fields or a delete.
message SyncChange {
  oneof change {
    SyncPut put = 1;
    SyncDelete delete = 2;
  }
}

// A put of named fields.
message SyncPut {
  repeated SyncField fields = 1; // <= 1024 items.
}

// A delete.
message SyncDelete {}

// The serving health of the engine.
enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_STARTING = 1;
  HEALTH_STATE_SERVING = 2;
  HEALTH_STATE_DRAINING = 3;
  HEALTH_STATE_STOPPED = 4;
}

// Why the engine was asked to shut down.
enum ShutdownReason {
  SHUTDOWN_REASON_UNSPECIFIED = 0;
  SHUTDOWN_REASON_OPERATOR = 1;
  SHUTDOWN_REASON_SUPERVISOR = 2;
}

// Why a subscription closed.
enum SubscriptionCloseReason {
  SUBSCRIPTION_CLOSE_REASON_UNSPECIFIED = 0;
  SUBSCRIPTION_CLOSE_REASON_REPLACED = 1;
  SUBSCRIPTION_CLOSE_REASON_SHUTTING_DOWN = 2;
}

// The transport a binding serves. The gRPC serving replaces the retired
// UDS/QUIC custom bindings; local sockets and mTLS TCP remain.
enum BindingKind {
  BINDING_KIND_UNSPECIFIED = 0;
  BINDING_KIND_LOCAL = 1;
  BINDING_KIND_NETWORK_MTLS = 2;
}

// ---------------------------------------------------------------------------
// Documents, queries, and families
// ---------------------------------------------------------------------------

// A document as stored: identity, version, and body.
message DocumentBody {
  string id = 1;         // <= 64 bytes.
  string collection = 2; // <= 64 bytes.
  uint64 version = 3;
  Value body = 4;
}

// A document to put (create or overwrite).
message DocumentPut {
  string id = 1;         // <= 64 bytes.
  string collection = 2; // <= 64 bytes.
  Value body = 3;
}

// One item of an atomic batch.
message BatchWrite {
  DocumentPut document = 1;
  ExpectedVersion expected = 2;
  string operation_id = 3; // <= 128 bytes.
}

message DocumentReadRequest {
  string collection = 1; // <= 64 bytes.
  string document = 2;   // <= 64 bytes.
  ReadLevel level = 3;
}

message DocumentReadResponse {
  bool found = 1;
  DocumentBody document = 2;
  uint64 position = 3;
}

message DocumentWriteRequest {
  DocumentPut document = 1;
  ExpectedVersion expected = 2;
  string operation_id = 3; // <= 128 bytes.
  Acknowledgement ack = 4;
  UsageAdmissionContext usage = 5;
}

message DocumentWriteResponse {
  WriteOutcome outcome = 1;
}

message DocumentDeleteRequest {
  string collection = 1; // <= 64 bytes.
  string document = 2;   // <= 64 bytes.
  ExpectedVersion expected = 3;
  string operation_id = 4; // <= 128 bytes.
  Acknowledgement ack = 5;
  UsageAdmissionContext usage = 6;
}

message DocumentDeleteResponse {
  WriteOutcome outcome = 1;
}

message DocumentBatchRequest {
  repeated BatchWrite items = 1; // 1..=256 items.
  Acknowledgement ack = 2;
  UsageAdmissionContext usage = 3;
}

message DocumentBatchResponse {
  WriteOutcome outcome = 1;
}

message QueryExecuteRequest {
  uint64 query_id = 1;
  string text = 2; // 1..=4096 bytes.
  uint32 max_items = 3;
  ReadLevel level = 4;
}

message QueryExecuteResponse {
  repeated DocumentBody documents = 1; // <= max_items.
  uint32 count = 2;
  QueryTerminal terminal = 3;
  uint64 position = 4;
}

message QueryCancelRequest {
  uint64 query_id = 1;
}

message QueryCancelResponse {
  CancelOutcome outcome = 1;
}

message FamilyReadRequest {
  string family = 1;         // closed vocabulary: attachment, counter,
                             // time_series, revisions, compare_exchange,
                             // identities, expiration_refresh, archival.
  string name = 2;           // <= 64 bytes.
  string request_codec = 3;  // e.g. terrabase.family-request/1.
  bytes request = 4;         // <= 16 MiB.
}

message FamilyReadResponse {
  string response_codec = 1;
  bytes response = 2; // <= 16 MiB.
}

message FamilyWriteRequest {
  string family = 1;
  string name = 2;
  string request_codec = 3;
  bytes request = 4;
  string operation_id = 5; // <= 128 bytes.
  UsageAdmissionContext usage = 6;
}

message FamilyWriteResponse {
  string response_codec = 1;
  bytes response = 2;
}

// ---------------------------------------------------------------------------
// Backbone subscriptions
// ---------------------------------------------------------------------------

message BackboneSubscribeRequest {
  uint64 subscription_id = 1;
  repeated string collections = 2; // <= 64 items, each <= 64 bytes.
  SubscriptionStart from = 3;
}

message BackboneSubscribeResponse {
  uint64 subscription_id = 1;
  uint64 start_sequence = 2;
}

message BackboneAcknowledgeRequest {
  uint64 subscription_id = 1;
  uint64 through_sequence = 2;
}

message BackboneAcknowledgeResponse {
  uint64 subscription_id = 1;
  uint64 acknowledged_through = 2;
}

message BackboneUnsubscribeRequest {
  uint64 subscription_id = 1;
}

message BackboneUnsubscribeResponse {
  uint64 subscription_id = 1;
}

// An ordered, bounded batch of change events.
message SubscriptionBatch {
  uint64 subscription_id = 1;
  uint64 from_sequence = 2;
  repeated ChangeEvent events = 3; // <= 256 items.
  uint64 next_sequence = 4;
}

// The content-free change trigger: the client re-pulls.
message TriggerNotification {
  uint64 subscription_id = 1;
  string collection = 2;     // <= 64 bytes.
  uint64 sequence = 3;
  string operation_id = 4;   // <= 128 bytes.
}

// The subscription closed.
message SubscriptionClosed {
  uint64 subscription_id = 1;
  SubscriptionCloseReason reason = 2;
}

// The server-stream event of one backbone subscription: the initial
// confirmation, then ordered batches, triggers, and the close frame.
message BackboneStreamEvent {
  oneof event {
    BackboneSubscribeResponse subscribed = 1;
    SubscriptionBatch batch = 2;
    TriggerNotification trigger = 3;
    SubscriptionClosed closed = 4;
  }
}

// ---------------------------------------------------------------------------
// Sync sessions
// ---------------------------------------------------------------------------

message SyncSessionSetupRequest {
  string collection = 1; // <= 64 bytes.
  bytes resume = 2;       // <= 1057 bytes; empty starts fresh.
}

message SyncSessionSetupResponse {
  uint64 session_id = 1;
  bytes checkpoint = 2;    // <= 1057 bytes.
  bytes retained_floor = 3; // <= 1057 bytes.
}

message SyncDeltaPullRequest {
  uint64 session_id = 1;
  bytes from = 2; // <= 1057 bytes.
}

message SyncDeltaPullResponse {
  uint64 session_id = 1;
  string payload_codec = 2;
  bytes payload = 3;  // <= 16 MiB.
  bytes next = 4;     // <= 1057 bytes.
  uint32 commits = 5;
  bool single_commit_oversize = 6;
}

message SyncSnapshotPullRequest {
  uint64 session_id = 1;
}

message SyncSnapshotPullResponse {
  uint64 session_id = 1;
  string payload_codec = 2;
  bytes payload = 3;
  bytes checkpoint = 4;
}

message SyncCheckpointAckRequest {
  uint64 session_id = 1;
  bytes checkpoint = 2; // <= 1057 bytes.
}

message SyncCheckpointAckResponse {
  uint64 session_id = 1;
}

message SyncMutationSubmitRequest {
  uint64 session_id = 1;
  string document = 2; // <= 64 bytes.
  SyncChange change = 3;
  UsageAdmissionContext usage = 4;
}

message SyncMutationSubmitResponse {
  uint64 session_id = 1;
  MutationOutcome outcome = 2;
}

message SyncSessionCloseRequest {
  uint64 session_id = 1;
}

message SyncSessionCloseResponse {
  uint64 session_id = 1;
}

// ---------------------------------------------------------------------------
// Schema and migrations
// ---------------------------------------------------------------------------

// One field of a declared schema rule document.
message SchemaViolation {
  string field = 1; // <= 64 bytes.
  ViolationKind kind = 2;
}

// The closed schema-violation vocabulary.
enum ViolationKind {
  VIOLATION_KIND_UNSPECIFIED = 0;
  VIOLATION_KIND_DOCUMENT_NOT_OBJECT = 1;
  VIOLATION_KIND_MISSING_REQUIRED_FIELD = 2;
  VIOLATION_KIND_TYPE_MISMATCH = 3;
  VIOLATION_KIND_VALUE_NOT_ALLOWED = 4;
  VIOLATION_KIND_NUMBER_OUT_OF_RANGE = 5;
  VIOLATION_KIND_LENGTH_OUT_OF_RANGE = 6;
}

// The closed coercion vocabulary of a retype transform.
enum Coercion {
  COERCION_UNSPECIFIED = 0;
  COERCION_INTEGER_TO_TEXT = 1;
  COERCION_TEXT_TO_INTEGER = 2;
  COERCION_INTEGER_TO_NUMBER = 3;
  COERCION_NUMBER_TO_INTEGER = 4;
}

// Why a transform literal was rejected.
enum TransformRejection {
  TRANSFORM_REJECTION_UNSPECIFIED = 0;
  TRANSFORM_REJECTION_VALUE_NOT_COERCIBLE = 1;
  TRANSFORM_REJECTION_TARGET_FIELD_OCCUPIED = 2;
}

// The literal default of a retype transform.
message TransformLiteral {
  oneof literal {
    bool boolean = 1;
    sint64 integer = 2;
    string text = 3;
  }
}

// The closed field-transform vocabulary.
enum FieldTransform {
  FIELD_TRANSFORM_UNSPECIFIED = 0;
  FIELD_TRANSFORM_ADD_FIELD = 1;
  FIELD_TRANSFORM_REMOVE_FIELD = 2;
  FIELD_TRANSFORM_RENAME_FIELD = 3;
  FIELD_TRANSFORM_RETYPE_FIELD = 4;
}

// One step of a migration contract.
message FieldTransformStep {
  FieldTransform kind = 1;
  string field = 2; // <= 64 bytes.
  string to = 3;    // <= 64 bytes.
  TransformLiteral default = 4;
  Coercion coercion = 5;
}

// The declared migration contract.
message SchemaMigrationContract {
  string collection = 1; // <= 64 bytes.
  uint64 from_version = 2;
  uint64 to_version = 3;
  Value target = 4;
  repeated FieldTransformStep transforms = 5; // <= 64 items.
}

// One problem of a migration plan.
message PlanProblem {
  string document = 1; // <= 64 bytes.
  string field = 2;    // <= 64 bytes.
  PlanProblemKind kind = 3;
  TransformRejection rejection = 4;
  repeated SchemaViolation violations = 5; // <= 256 items.
}

// The closed plan-problem vocabulary.
enum PlanProblemKind {
  PLAN_PROBLEM_KIND_UNSPECIFIED = 0;
  PLAN_PROBLEM_KIND_TRANSFORM_REJECTED = 1;
  PLAN_PROBLEM_KIND_TARGET_VIOLATIONS = 2;
}

// The per-kind transform counts of a plan.
message TransformCounts {
  uint64 added = 1;
  uint64 removed = 2;
  uint64 renamed = 3;
  uint64 retyped = 4;
}

// The state of a collection's migration.
message MigrationState {
  MigrationStateKind kind = 1;
  string manifest = 2; // <= 128 bytes.
  uint64 from_version = 3;
  uint64 to_version = 4;
  uint64 documents = 5;
  uint64 transformed = 6;
  uint64 pages = 7;
}

// The closed migration-state vocabulary.
enum MigrationStateKind {
  MIGRATION_STATE_KIND_UNSPECIFIED = 0;
  MIGRATION_STATE_KIND_NONE = 1;
  MIGRATION_STATE_KIND_IN_PROGRESS = 2;
  MIGRATION_STATE_KIND_ROLLING_BACK = 3;
  MIGRATION_STATE_KIND_COMPLETE = 4;
}

// The closed rollback-limit vocabulary.
enum RollbackLimitKind {
  ROLLBACK_LIMIT_KIND_UNSPECIFIED = 0;
  ROLLBACK_LIMIT_KIND_REVERSIBLE = 1;
  ROLLBACK_LIMIT_KIND_NOT_REVERSIBLE = 2;
}

// The dry-run plan of a migration.
message MigrationPlan {
  string manifest = 1;        // <= 128 bytes.
  string collection = 2;      // <= 64 bytes.
  uint64 from_version = 3;
  uint64 to_version = 4;
  bool ready = 5;
  uint64 documents = 6;
  string source_digest = 7;   // <= 64 bytes.
  string result_digest = 8;   // <= 64 bytes.
  TransformCounts transform_counts = 9;
  repeated PlanProblem problems = 10; // <= 256 items.
  bool problems_truncated = 11;
}

// The receipt of an applied migration.
message MigrationReceipt {
  string collection = 1;
  string manifest = 2;
  uint64 from_version = 3;
  uint64 to_version = 4;
  string source_digest = 5;
  string result_digest = 6;
  uint64 documents = 7;
  uint64 transformed = 8;
  TransformCounts transform_counts = 9;
  uint64 pages = 10;
  RollbackLimitKind rollback_limit = 11;
  bool acknowledged_not_rollbackable = 12;
  bool already_applied = 13;
}

message SchemaDeclareRequest {
  string collection = 1; // <= 64 bytes.
  Value schema = 2;
  string operation_id = 3; // <= 128 bytes.
}

message SchemaDeclareResponse {
  uint64 enforced_version = 1;
  uint32 rule_count = 2;
}

message SchemaStatusRequest {
  string collection = 1; // <= 64 bytes.
}

message SchemaStatusResponse {
  uint64 enforced_version = 1;
  uint32 rule_count = 2;
}

message SchemaValidateRequest {
  string collection = 1; // <= 64 bytes.
  Value document = 2;
}

message SchemaValidateResponse {
  uint64 enforced_version = 1;
  bool valid = 2;
  repeated SchemaViolation violations = 3; // <= 256 items.
}

message MigrationStatusRequest {
  string collection = 1; // <= 64 bytes.
}

message MigrationStatusResponse {
  MigrationState state = 1;
}

message MigrationDryRunRequest {
  SchemaMigrationContract contract = 1;
}

message MigrationDryRunResponse {
  MigrationPlan plan = 1;
}

message MigrationApplyRequest {
  SchemaMigrationContract contract = 1;
  bool acknowledge_not_rollbackable = 2;
  string operation_id = 3; // <= 128 bytes.
}

message MigrationApplyResponse {
  MigrationReceipt receipt = 1;
}

// ---------------------------------------------------------------------------
// Replication observation
// ---------------------------------------------------------------------------

message ReplicationConflictsRequest {}

// One causal-clock stamp of a conflict participant.
message ClockStamp {
  uint64 ticks = 1;
  uint64 counter = 2;
}

// The outcome of one resolved conflict.
message ConflictOutcome {
  ConflictOutcomeKind kind = 1;
  string member = 2; // <= 128 bytes.
}

// The closed conflict-outcome vocabulary.
enum ConflictOutcomeKind {
  CONFLICT_OUTCOME_KIND_UNSPECIFIED = 0;
  CONFLICT_OUTCOME_KIND_WINNER = 1;
  CONFLICT_OUTCOME_KIND_DEPOSED_OWNER_RETAINED = 2;
  CONFLICT_OUTCOME_KIND_UNTRUSTED_CLOCK = 3;
}

// One observed conflict.
message ConflictRecord {
  string tenant = 1; // <= 64 bytes.
  repeated string operations = 2; // <= 16 items.
  repeated string members = 3;    // <= 16 items.
  repeated ClockStamp clocks = 4; // <= 16 items.
  ConflictOutcome outcome = 5;
}

message ReplicationConflictsResponse {
  string member = 1;
  repeated ConflictRecord records = 2; // <= 256 items.
}

message ReplicationFencedRequest {}

// One observed fenced range.
message FencedRecord {
  string range = 1;       // <= 128 bytes.
  uint64 batch_epoch = 2;
  uint64 highest_epoch = 3;
  string source = 4;      // <= 128 bytes.
}

message ReplicationFencedResponse {
  string member = 1;
  repeated FencedRecord records = 2; // <= 256 items.
}

message ReplicationDepositionsRequest {}

// One observed leadership deposition.
message DepositionRecord {
  string range = 1;      // <= 128 bytes.
  uint64 held_epoch = 2;
  uint64 owner_epoch = 3;
  string new_owner = 4;  // <= 128 bytes.
}

message ReplicationDepositionsResponse {
  string member = 1;
  repeated DepositionRecord records = 2; // <= 256 items.
}

message ReplicationCursorRequest {}

message ReplicationCursorResponse {
  string member = 1;
  uint64 position = 2;
}

message ReplicationHealthRequest {}

// The closed replication-status vocabulary.
enum ReplicationStatus {
  REPLICATION_STATUS_UNSPECIFIED = 0;
  REPLICATION_STATUS_ASSIGNED = 1;
  REPLICATION_STATUS_ACTIVE = 2;
  REPLICATION_STATUS_RESPONSIVE = 3;
  REPLICATION_STATUS_STALE = 4;
  REPLICATION_STATUS_UNAVAILABLE = 5;
  REPLICATION_STATUS_DEGRADED = 6;
  REPLICATION_STATUS_UNKNOWN = 7;
}

message ReplicationHealthResponse {
  string member = 1;
  ReplicationStatus status = 2;
}

message ReplicationDenialsRequest {}

// Which seam observed a cross-tenant denial.
enum DenialSeam {
  DENIAL_SEAM_UNSPECIFIED = 0;
  DENIAL_SEAM_SERVE_REQUEST = 1;
  DENIAL_SEAM_APPLY_DELIVERY = 2;
}

// One observed cross-tenant denial.
message DenialRecord {
  DenialSeam seam = 1;
  string scope_tenant = 2;     // <= 64 bytes.
  string attempted_tenant = 3; // <= 64 bytes.
  string counterparty = 4;     // <= 128 bytes.
}

message ReplicationDenialsResponse {
  string member = 1;
  repeated DenialRecord records = 2; // <= 256 items.
}

// ---------------------------------------------------------------------------
// Topology, administration, supervision
// ---------------------------------------------------------------------------

message ChannelBindRequest {
  string principal = 1; // 1..=128 bytes.
  string tenant = 2;    // 1..=64 bytes.
}

message ChannelBindResponse {
  string tenant = 2;
  uint64 serving_instance = 3;
}

message TopologyReadRequest {}

message TopologyReadResponse {
  BindingKind binding = 1;
  repeated string subsystems = 2; // <= 16 items.
  bool engine_topology_available = 3;
  ClusterMode cluster_mode = 4;
}

message AdminStatusRequest {}

message AdminStatusResponse {
  string registry_version = 1;
  uint64 frames_served = 2;
  uint32 sessions = 3;
  uint32 subscriptions = 4;
  uint32 scopes = 5;
}

message SupervisionHealthRequest {}

message SupervisionHealthResponse {
  HealthState state = 1;
  uint32 sessions = 2;
  uint32 subscriptions = 3;
  uint64 frames_served = 4;
}

message SupervisionShutdownRequest {
  ShutdownReason reason = 1;
}

message SupervisionShutdownResponse {
  HealthState state = 1;
  uint32 in_flight = 2;
}

// ---------------------------------------------------------------------------
// Authoritative usage facts
// ---------------------------------------------------------------------------

// The closed usage meter vocabulary. Meter versions are immutable and travel
// beside this kind so a consumer never guesses which accounting rule applied.
enum UsageMeter {
  USAGE_METER_UNSPECIFIED = 0;
  USAGE_METER_ADMITTED_REQUEST_UNITS = 2;
  USAGE_METER_PUBLIC_EGRESS_BYTES = 3;
  reserved 1, 4 to 6;
  reserved "USAGE_METER_STORED_BYTE_HOURS", "USAGE_METER_ACTIVE_REGION_SEATS",
      "USAGE_METER_BACKUP_BYTE_HOURS", "USAGE_METER_RESTORE_WORK";
}

// The integer unit carried by one usage fact.
enum UsageUnit {
  USAGE_UNIT_UNSPECIFIED = 0;
  USAGE_UNIT_REQUEST_UNIT = 2;
  USAGE_UNIT_BYTE = 3;
  reserved 1, 4, 5;
  reserved "USAGE_UNIT_BYTE_HOUR", "USAGE_UNIT_SEAT_HOUR",
      "USAGE_UNIT_RESTORE_WORK";
}

// The scope at which the meter charges one unit.
enum UsageChargeScope {
  USAGE_CHARGE_SCOPE_UNSPECIFIED = 0;
  USAGE_CHARGE_SCOPE_ADMITTED_REQUEST = 2;
  USAGE_CHARGE_SCOPE_PUBLIC_EGRESS = 3;
  reserved 1, 4 to 6;
  reserved "USAGE_CHARGE_SCOPE_ACTIVE_REGION_COPY",
      "USAGE_CHARGE_SCOPE_ACTIVE_REGION_SEAT", "USAGE_CHARGE_SCOPE_BACKUP_COPY",
      "USAGE_CHARGE_SCOPE_EXPLICIT_RESTORE";
}

// The stable event identity that prevents retries and replicas from minting a
// second fact.
enum UsageMintingRule {
  USAGE_MINTING_RULE_UNSPECIFIED = 0;
  USAGE_MINTING_RULE_STABLE_ADMITTED_REQUEST = 2;
  USAGE_MINTING_RULE_PUBLIC_RESPONSE = 3;
  reserved 1, 4 to 6;
  reserved "USAGE_MINTING_RULE_ACCEPTED_ORIGIN_COMMIT",
      "USAGE_MINTING_RULE_ACTIVE_REGION_HOUR",
      "USAGE_MINTING_RULE_BACKUP_BYTE_HOUR",
      "USAGE_MINTING_RULE_EXPLICIT_RESTORE";
}

// Closed Region vocabulary for usage accounting. These values are canonical
// airport codes; callers cannot supply aliases or free-form Region names.
enum UsageRegion {
  USAGE_REGION_UNSPECIFIED = 0;
  USAGE_REGION_GRU = 1;
  USAGE_REGION_SFO = 2;
  USAGE_REGION_FRA = 3;
}

// Trusted admission data attached atomically to one origin mutation. Tenant
// scope comes only from the authenticated channel metadata. request_id must
// equal x-tb-idempotency-key so commit replay and usage replay share one
// identity. The admitted-request meter and unit are implied.
message UsageAdmissionContext {
  string project = 1;       // 1..=255 bytes.
  string database = 2;      // 1..=255 bytes.
  string partition = 3;     // 1..=255 bytes.
  UsageRegion origin_region = 4;
  string request_id = 5;    // 1..=128 bytes.
  uint64 accepted_at_millis = 6;
  uint32 meter_version = 7;
  string integer_units = 8; // Canonical positive i128, <= 1,000,000.
}

// Record admits only facts whose public-boundary work cannot be attached to
// an engine mutation. One call records one fact and is idempotent by the
// (meter, fact_id) identity. x-tb-idempotency-key must equal fact_id.
enum UsageRecordMeter {
  USAGE_RECORD_METER_UNSPECIFIED = 0;
  USAGE_RECORD_METER_ADMITTED_REQUEST_UNITS = 1;
  USAGE_RECORD_METER_PUBLIC_EGRESS_BYTES = 2;
}

message UsageRecordRequest {
  UsageRecordMeter meter = 1;
  string project = 2;       // 1..=255 bytes.
  string database = 3;      // 1..=255 bytes.
  string partition = 4;     // 1..=255 bytes.
  UsageRegion origin_region = 5;
  string fact_id = 6;       // 1..=128 bytes.
  uint64 recorded_at_millis = 7;
  uint32 meter_version = 8;
  // Canonical positive i128. Admitted-request units are <= 1,000,000;
  // public-egress bytes are <= 1,099,511,627,776 (1 TiB).
  string integer_units = 9;
}

message UsageRecordResponse {
  uint64 sequence = 1;
  uint64 replica_epoch = 2;
  bool already_recorded = 3;
}

// One WAL-durable, canonically encoded usage fact. The signed quantity is a
// canonical base-10 i128 string because protobuf has no portable i128 scalar.
// Consumers deduplicate on (minting_rule, fact_id) and preserve the canonical
// bytes for audit. The tenant must equal the identity metadata bound to the RPC.
message UsageFact {
  string fact_id = 1; // 1..=255 bytes.
  UsageMeter meter = 2;
  uint32 meter_version = 3;
  UsageUnit unit = 4;
  UsageChargeScope charge_scope = 5;
  UsageMintingRule minting_rule = 6;
  string tenant = 7;      // 1..=64 bytes.
  string project = 8;     // 1..=255 bytes.
  string database = 9;    // 1..=255 bytes.
  string partition = 10;  // 1..=255 bytes.
  UsageRegion region = 11;
  uint64 measurement_start_millis = 12;
  uint64 measurement_end_millis = 13;
  string integer_delta = 14; // Canonical signed i128, <= 40 bytes and nonzero.
  uint64 sequence = 15;
  uint64 replica_epoch = 16;
  uint32 format_version = 17;
  bytes canonical = 18; // Canonical durable fact envelope, <= 64 KiB.
  bytes checksum = 19;  // Exactly 32 bytes; the envelope's trailing checksum.
}

// Reads one stable, tenant-bound snapshot. Window bounds are an all-or-none
// half-open pair. The continuation is opaque and bound to the tenant, exact
// filters, and snapshot sequence selected by the first page.
message UsageExportRequest {
  optional uint64 window_start_millis = 1;
  optional uint64 window_end_millis = 2;
  uint32 page_size = 3;   // 1..=256 facts.
  bytes continuation = 4; // <= 1024 bytes; empty starts a snapshot.
}

// Facts are ordered by (sequence, minting_rule, fact_id). An empty
// continuation completes the snapshot. Facts committed after
// snapshot_sequence are excluded from every page in this response chain.
message UsageExportResponse {
  repeated UsageFact facts = 1; // <= 256 facts.
  bytes continuation = 2;       // <= 1024 bytes.
  uint64 snapshot_sequence = 3;
}

// ---------------------------------------------------------------------------
// Tier administration
// ---------------------------------------------------------------------------

message TierConfigureRequest {
  string policy_id = 1; // <= 128 bytes.
  uint32 version = 2;
  uint64 nvme_budget_bytes = 3;
  uint32 min_residence_moves = 4;
  uint32 promotion_threshold = 5;
  repeated uint64 pinned_segment_ids = 6; // <= 4096 items.
}

message TierConfigureResponse {
  string policy_id = 1;
  uint32 version = 2;
  bool paused = 3;
}

message TierInspectRequest {}

message TierInspectResponse {
  bool configured = 1;
  bool paused = 2;
  uint64 manifest_epoch = 3;
  uint32 object_count = 4;
  uint64 nvme_bytes = 5;
}

message TierDryRunRequest {}

message TierDryRunResponse {
  TierMoveReceipt receipt = 1;
}

message TierExplainRequest {}

message TierExplainResponse {
  TierMoveReceipt receipt = 1;
}

message TierRunRequest {}

message TierRunResponse {
  TierMoveReceipt receipt = 1;
}

message TierPauseRequest {}

message TierPauseResponse {
  bool paused = 1;
}

message TierResumeRequest {}

message TierResumeResponse {
  bool paused = 1;
}

// ---------------------------------------------------------------------------
// The error detail
// ---------------------------------------------------------------------------

// The closed engine error vocabulary, carried in gRPC status details.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED_VERSION = 1;
  ERROR_CODE_MALFORMED_REQUEST = 2;
  ERROR_CODE_UNKNOWN_OPERATION = 3;
  ERROR_CODE_DIGEST_MISMATCH = 4;
  ERROR_CODE_IDEMPOTENCY_PAIRING = 5;
  ERROR_CODE_UNBOUND_CHANNEL = 6;
  ERROR_CODE_ALREADY_BOUND = 7;
  ERROR_CODE_INVALID_REQUEST = 8;
  ERROR_CODE_OPERATION_REFUSED = 9;
  ERROR_CODE_ENGINE_FAILURE = 10;
  ERROR_CODE_SESSION_REFUSED = 11;
  ERROR_CODE_SUBSCRIPTION_REFUSED = 12;
  ERROR_CODE_CHECKPOINT_REFUSED = 13;
  ERROR_CODE_SHUTTING_DOWN = 14;
  ERROR_CODE_REQUEST_TOO_LARGE = 15;
  ERROR_CODE_OVERLOADED = 16;
  ERROR_CODE_PROTOCOL_VERSION_MISMATCH = 17;
  ERROR_CODE_BACKUP_CLUSTER_READ_ONLY = 18;
  ERROR_CODE_BACKUP_CLUSTER_IMMUTABLE = 19;
  ERROR_CODE_COLD_TIER_UNAVAILABLE = 20;
  ERROR_CODE_FRONTIER_UNREACHABLE = 21;
  ERROR_CODE_USAGE_UNAVAILABLE = 22;
  ERROR_CODE_USAGE_CORRUPT = 23;
}

// The machine-readable failure detail of one refused RPC.
message TbepError {
  ErrorCode code = 1;
  string detail = 2; // <= 512 bytes.
}

// A protobuf `Any`, as defined by the language-neutral wire contract; the
// status envelope below is the `google.rpc.Status` shape so stock gRPC
// clients decode engine failures without extra dependencies.
message Any {
  string type_url = 1;
  bytes value = 2;
}

// The `google.rpc.Status` shape carried in gRPC trailing status details.
message RpcStatus {
  int32 code = 1;
  string message = 2;
  repeated Any details = 3;
}

// ---------------------------------------------------------------------------
// Services
// ---------------------------------------------------------------------------

// Channel identity: validates the application identity the metadata
// carries and answers the serving instance.
service Channel {
  rpc Bind(ChannelBindRequest) returns (ChannelBindResponse);
}

// Documents, queries, and families.
service Engine {
  rpc DocumentRead(DocumentReadRequest) returns (DocumentReadResponse);
  rpc DocumentWrite(DocumentWriteRequest) returns (DocumentWriteResponse);
  rpc DocumentDelete(DocumentDeleteRequest) returns (DocumentDeleteResponse);
  rpc DocumentBatch(DocumentBatchRequest) returns (DocumentBatchResponse);
  rpc QueryExecute(QueryExecuteRequest) returns (QueryExecuteResponse);
  rpc QueryCancel(QueryCancelRequest) returns (QueryCancelResponse);
  rpc FamilyRead(FamilyReadRequest) returns (FamilyReadResponse);
  rpc FamilyWrite(FamilyWriteRequest) returns (FamilyWriteResponse);
}

// The backbone change stream.
service Backbone {
  // Opens one subscription; the stream delivers the confirmation, then
  // ordered batches, triggers, and the close frame. Acknowledgements and
  // teardown ride the sibling unary RPCs on the same channel.
  rpc Subscribe(BackboneSubscribeRequest) returns (stream BackboneStreamEvent);
  rpc Acknowledge(BackboneAcknowledgeRequest) returns (BackboneAcknowledgeResponse);
  rpc Unsubscribe(BackboneUnsubscribeRequest) returns (BackboneUnsubscribeResponse);
}

// Sync delivery sessions.
service Sync {
  rpc SessionSetup(SyncSessionSetupRequest) returns (SyncSessionSetupResponse);
  rpc DeltaPull(SyncDeltaPullRequest) returns (SyncDeltaPullResponse);
  rpc SnapshotPull(SyncSnapshotPullRequest) returns (SyncSnapshotPullResponse);
  rpc CheckpointAck(SyncCheckpointAckRequest) returns (SyncCheckpointAckResponse);
  rpc MutationSubmit(SyncMutationSubmitRequest) returns (SyncMutationSubmitResponse);
  rpc SessionClose(SyncSessionCloseRequest) returns (SyncSessionCloseResponse);
}

// Schema declaration and migrations.
service Schema {
  rpc Declare(SchemaDeclareRequest) returns (SchemaDeclareResponse);
  rpc Status(SchemaStatusRequest) returns (SchemaStatusResponse);
  rpc Validate(SchemaValidateRequest) returns (SchemaValidateResponse);
  rpc MigrationStatus(MigrationStatusRequest) returns (MigrationStatusResponse);
  rpc MigrationDryRun(MigrationDryRunRequest) returns (MigrationDryRunResponse);
  rpc MigrationApply(MigrationApplyRequest) returns (MigrationApplyResponse);
}

// Replication observation (read-only).
service Replication {
  rpc Conflicts(ReplicationConflictsRequest) returns (ReplicationConflictsResponse);
  rpc Fenced(ReplicationFencedRequest) returns (ReplicationFencedResponse);
  rpc Depositions(ReplicationDepositionsRequest) returns (ReplicationDepositionsResponse);
  rpc Cursor(ReplicationCursorRequest) returns (ReplicationCursorResponse);
  rpc Health(ReplicationHealthRequest) returns (ReplicationHealthResponse);
  rpc Denials(ReplicationDenialsRequest) returns (ReplicationDenialsResponse);
}

// Topology, administration, and supervision.
service Maintenance {
  rpc TopologyRead(TopologyReadRequest) returns (TopologyReadResponse);
  rpc AdminStatus(AdminStatusRequest) returns (AdminStatusResponse);
  rpc SupervisionHealth(SupervisionHealthRequest) returns (SupervisionHealthResponse);
  rpc SupervisionShutdown(SupervisionShutdownRequest) returns (SupervisionShutdownResponse);
}

// Tenant-bound export of authoritative WAL-durable usage facts.
service Usage {
  rpc Record(UsageRecordRequest) returns (UsageRecordResponse);
  rpc Export(UsageExportRequest) returns (UsageExportResponse);
}

// Tier administration.
service Tier {
  rpc Configure(TierConfigureRequest) returns (TierConfigureResponse);
  rpc Inspect(TierInspectRequest) returns (TierInspectResponse);
  rpc DryRun(TierDryRunRequest) returns (TierDryRunResponse);
  rpc Explain(TierExplainRequest) returns (TierExplainResponse);
  rpc Run(TierRunRequest) returns (TierRunResponse);
  rpc Pause(TierPauseRequest) returns (TierPauseResponse);
  rpc Resume(TierResumeRequest) returns (TierResumeResponse);
}
