# `tbep-gen` — regenerates the committed TBEP bindings from the shared
# schema (`crates/terrabase-tbep/schema/tbep-registry.json`).
#
# Own nested workspace on purpose: the generator `#[path]`-includes the
# crate's `src/codegen.rs` directly and must be able to run BEFORE the
# `terrabase-tbep` library compiles (the library consumes the generated
# file this tool produces), so it cannot be a `[[bin]]` of that package
# (cargo links every package bin against the package lib).
#
# Run from `crates/terrabase-tbep/tools/tbep-gen`:
#
#     cargo run

[workspace]

[package]
name = "tbep-gen"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "LicenseRef-TerraScale-Pending"
description = "Regenerates the committed TerraBase Engine Protocol (TBEP) Rust and C# bindings from the shared schema"
publish = false

[lints.rust]
unsafe_code = "deny"

[dependencies]
serde_json = "1.0.150"
