# `tbep-fbs` — compiles and verifies the generated TBEP FlatBuffers
# bindings of ADR 0025 phase 1.
#
# Own nested workspace on purpose, exactly like `tools/tbep-gen` before
# it: the parent `terrabase-tbep` package must not gain a `flatbuffers`
# dependency in phase 1 (the packet is additive; the served codec is
# still the positional-array one, and the crate's `[dependencies]` is an
# integrator-owned serialized file). This package `#[path]`-includes the
# committed generated files at `../../src/generated/fbs/*_generated.rs`
# and owns the runtime dependency plus the receiver-decode seam and the
# hostile-decode, golden-vector, and registry-parity suites.
#
# Run from `crates/terrabase-tbep/tools/tbep-fbs`:
#
#     cargo test
#
# `terrabase-tbep`'s `tests/fbs_bindings.rs` drives this suite so the
# single focused check `cargo test -p terrabase-tbep` covers it too.

[workspace]

[package]
name = "tbep-fbs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "LicenseRef-TerraScale-Pending"
description = "Compiles and verifies the pinned generated TBEP FlatBuffers Rust bindings (ADR 0025 phase 1)"
publish = false

# The generated bindings carry `unsafe` blocks by design of the pinned
# compiler (flatc 25.12.19 emits `::flatbuffers::read_scalar` reads
# behind verified offsets). This package compiles only that generated
# code plus hand-written code with no `unsafe` of its own; the
# unsafe-code lint is therefore relaxed here and nowhere else. The
# parent crate's `unsafe_code = "deny"` is untouched.
[lints.rust]
unsafe_code = "allow"

[dependencies]
# The pinned FlatBuffers Rust runtime, matching the pinned `flatc`
# 25.12.19 exactly (`nixpkgs#flatbuffers`).
flatbuffers = "=25.12.19"
# The registry-parity suite parses `schema/tbep-registry.json` with the
# same JSON stack as the parent crate's tests.
serde_json = "1.0.150"
