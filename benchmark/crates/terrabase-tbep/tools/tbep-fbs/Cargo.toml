# `tbep-fbs` — compiles, verifies, and safely wraps the generated TBEP
# FlatBuffers bindings of ADR 0025.
#
# Own nested workspace on purpose, exactly like `tools/tbep-gen` before
# it: the parent `terrabase-tbep` package must not gain a `flatbuffers`
# dependency in phase 1 (the packet is additive; the served codec is
# still the positional-array one, and the crate's `[dependencies]` is an
# integrator-owned serialized file). This package `#[path]`-includes the
# committed generated files at `../../src/generated/fbs/*_generated.rs`
# and owns the runtime dependency plus the receiver-decode seam and the
# hostile-decode, golden-vector, and registry-parity suites.
#
# Run from `crates/terrabase-tbep/tools/tbep-fbs`:
#
#     cargo test
#
# Root CI and `scripts/check.sh` invoke this nested manifest directly so
# the additive package remains outside the parent workspace while its
# receiver and pinned-regeneration gates remain mandatory.

[package]
name = "tbep-fbs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "LicenseRef-TerraScale-Pending"
description = "Verified generated TBEP FlatBuffers codec boundary (ADR 0025)"
publish = false

# The generated bindings carry `unsafe` blocks by design of the pinned
# compiler (flatc 25.12.19 emits `::flatbuffers::read_scalar` reads
# behind verified offsets). This package compiles only that generated
# code plus hand-written code with no `unsafe` of its own; the
# unsafe-code lint is therefore relaxed here and nowhere else. The
# parent crate's `unsafe_code = "deny"` is untouched.
[lints.rust]
unsafe_code = "allow"

[dependencies]
# The pinned FlatBuffers Rust runtime, matching the pinned `flatc`
# 25.12.19 exactly (`nixpkgs#flatbuffers`).
flatbuffers = "=25.12.19"
# The canonical revision digest that names the pinned schema + registry
# inputs (the same primitive and version the engine root already uses, so
# the dependency closure gains no new supplier). `schema_identity.rs`
# pins the generation inputs by digest so the drift gate holds with
# neither `flatc` nor the network.
blake3 = "1.8.2"
# Test-only live interop peer dependencies. This peer is qualification
# evidence for the generated bindings and framing only; it is not a TBEP
# production server and is never linked by `terrabase-tbep`.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "io-util"] }
# The registry-parity suite parses `schema/tbep-registry.json` with the
# same JSON stack as the parent crate's tests.
serde_json = "1.0.150"
