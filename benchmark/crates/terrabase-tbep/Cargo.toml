# `terrabase-tbep` — the TerraBase Engine Protocol (TBEP) engine server
# crate (ticket SE-14, charter PD-2026-08-26-02).
#
# Standalone workspace root on purpose, exactly like
# `crates/terrabase-sync-core` before its integrator wiring: the engine
# workspace at the repository root stays zero-dependency and untouched;
# the integrator adds this crate to the root `members` list when wiring
# it in (recorded as a collision action in the SE-14 packet report).
#
# Async is allowed to live here and nowhere else (PD-2026-08-26-05 D1);
# this packet serves the UDS binding with the standard library's
# synchronous Unix-domain listener plus one thread per connection, which
# keeps the dependency closure to the mandated codec pair (rmp-serde).
# The QUIC binding is deferred per PD-2026-08-26-11 D1.


[package]
name = "terrabase-tbep"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "LicenseRef-TerraScale-Pending"
description = "TerraBaseV2 engine server behind the TerraBase Engine Protocol (TBEP): MessagePack frames over the UDS binding"
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = "warn"

[dependencies]
# The QUIC+TLS network binding (P4): quinn over rustls with the `ring`
# provider — the same pins `terrabase-member-transport` qualified for its
# member lanes — so the TBEP frame layer rides an authenticated TLS 1.3
# transport beside the local UDS binding.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }

# The mandated codec pair (PD-2026-08-26-02 D4): Rust rmp-serde against
# C# MessagePack-CSharp with contractless/typeless modes disabled.
# serde rides as rmp-serde's foundation (the generated frame bodies
# implement the serde traits directly); MIT/Apache-2.0.
serde = "1"
rmp-serde = "1.3"
# The shared generated schema's source of truth is JSON, and the drift
# tests parse it with serde_json; the golden conformance corpus is JSON
# too so every language's CI consumes the same data files (same
# convention as the SE-04 corpus). The generator itself lives in its own
# nested package (`tools/tbep-gen`) so it can regenerate the bindings
# before this crate compiles.
serde_json = "1.0.150"
# The adopted sync delivery core (SE-02 GO decision) this server hosts
# behind TBEP's sync-delivery frames.
terrabase-sync-core = { path = "../terrabase-sync-core" }
# The engine this host serves (P4): the real durable engine behind the
# document spine.
terrabase-cluster = { path = "../terrabase-cluster" }
terrabase-v2 = { path = "../.." }

[dev-dependencies]
# Self-signed test certificates for the QUIC binding's conformance rows.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
