# `terrabase-tbep` — the TerraBase Engine Protocol (TBEP) engine server
# crate (ticket SE-14, charter PD-2026-08-26-02; ADR 0025: gRPC).
#
# Standalone workspace member: the engine workspace at the repository
# root stays zero-dependency and untouched.
#
# The wire protocol is gRPC (tonic) over the generated protobuf contract
# in `proto/terrabase/v1/engine.proto`, compiled at build time by the
# pure-Rust `protox` front end — no system `protoc`, no committed
# generated code, no repository-owned generator.

[package]
name = "terrabase-tbep"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "TerraBase engine server behind the TBEP gRPC contract"
publish = false

[features]
default = ["local-crypto"]
local-crypto = [
  "terrabase/local-crypto",
  "tonic/tls-ring",
  "tokio-rustls/ring",
]
production-fips = [
  "terrabase/production-fips",
  "tonic/tls-aws-lc",
  "tokio-rustls/fips",
]

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = "warn"

[dependencies]
# The gRPC serving stack (ADR 0025): tonic over tokio, prost messages,
# rustls TLS with a feature-selected provider. Production uses AWS-LC FIPS;
# the local test profile uses ring.
tonic = { version = "0.14", default-features = false, features = [
  "codegen",
  "transport",
  "server",
  "router",
] }
prost = "0.14"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
x509-parser = "0.18"
tonic-prost = "0.14"
tokio-rustls = { version = "0.26", default-features = false }
rustls-pki-types = { version = "1", features = ["std"] }
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "net",
  "time",
  "sync",
  "io-util",
  "macros",
] }
tokio-stream = { version = "0.1", default-features = false, features = [
  "net",
] }

# The adopted sync delivery core (SE-02 GO decision) this server hosts
# behind TBEP's sync-delivery operations.
terrabase-sync-core = { path = "../terrabase-sync-core" }
# The engine this host serves (P4): the real durable engine behind the
# document spine.
terrabase = { path = "../..", default-features = false }

[build-dependencies]
# The protobuf front end: pure-Rust schema compilation feeding
# tonic-prost-build, so builds need no system `protoc` installation.
# tonic 0.14 split the prost codegen out of `tonic-build` (which now
# keeps only the manual service generator); `tonic-prost-build` owns
# `compile_fds` for pre-compiled protox descriptors.
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
# Self-signed test certificates for the TLS binding's conformance rows.
tower = { version = "0.5", default-features = false, features = ["util"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rcgen = { version = "0.13", default-features = false, features = [
  "ring",
  "pem",
] }
