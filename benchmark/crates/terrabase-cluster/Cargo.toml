# TerraBase (P5): the cluster lifecycle crate — immutable cluster
# identity, membership epochs, and the cluster-mode host seam.
[package]
name = "terrabase-cluster"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.2"
rustix = { version = "1.1.4", features = ["fs"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }

# The engine core and the authenticated member transport. The
# replication-core edge is gone with the per-field LWW stand-in
# (issue #130, ADR 0041); the real data plane attaches through
# `ProductionDataPlane`.
terrabase-member-transport = { path = "../terrabase-member-transport", default-features = false }
terrabase = { path = "../..", default-features = false }
# The follower folds WAL frames with the same bundled SQLite substrate as the
# engine, so promotion and recovery cannot disagree on the on-disk format.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache"] }

[dev-dependencies]
