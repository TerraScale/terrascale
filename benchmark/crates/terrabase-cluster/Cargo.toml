# TerraBase (P5): the cluster lifecycle crate — immutable cluster
# identity, membership epochs, and the cluster-mode host seam.
[package]
name = "terrabase-cluster"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = ["local-crypto"]
local-crypto = ["terrabase/local-crypto", "terrabase-replication-core/local-crypto"]
production-fips = ["terrabase/production-fips", "terrabase-replication-core/production-fips"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The leaderless core P5 drives: ComposedMember, ReplicaSet, the
# coordinators, and the engine beneath them.
terrabase-replication-core = { path = "../terrabase-replication-core", default-features = false }
terrabase-member-transport = { path = "../terrabase-member-transport" }
terrabase = { path = "../..", default-features = false }

[dev-dependencies]
