# TerraBase (P5): the cluster lifecycle crate — immutable cluster
# identity, membership epochs, and the cluster-mode host seam.
[package]
name = "terrabase-cluster"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = ["local-crypto"]
local-crypto = [
  "terrabase/local-crypto",
  "terrabase-member-transport/local-crypto",
]
production-fips = [
  "terrabase/production-fips",
  "terrabase-member-transport/production-fips",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The engine core and the authenticated member transport. The
# replication-core edge is gone with the per-field LWW stand-in
# (issue #130, ADR 0041); the real data plane attaches through
# `ProductionDataPlane`.
terrabase-member-transport = { path = "../terrabase-member-transport", default-features = false }
terrabase = { path = "../..", default-features = false }

[dev-dependencies]
