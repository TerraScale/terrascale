[graph]
# Studio is packaged with the same two supported Linux release artifacts as
# the engine. Target-only WASM and Windows branches are outside that contract.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSL-1.0",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8
exceptions = [
  { allow = ["OpenSSL"], crate = "aws-lc-fips-sys@0.14.1" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Cargo represents an unversioned private path dependency as `*`. Studio and
# every in-repository crate it consumes set `publish = false`; registry
# wildcard dependencies remain denied.
allow-wildcard-paths = true
skip = [
  { crate = "crypto-common@0.1.7", reason = "object_store's CRC checksum implementation still uses digest 0.10 while its S3 MD5 implementation uses digest 0.11" },
  { crate = "digest@0.10.7", reason = "object_store's CRC checksum implementation still uses digest 0.10 while its S3 MD5 implementation uses digest 0.11" },
  { crate = "getrandom@0.2.17", reason = "ring uses getrandom 0.2 while current rand and object-store dependencies use getrandom 0.4" },
  { crate = "itertools@0.13.0", reason = "aws-lc-fips-sys bindgen uses itertools 0.13 while object-store uses itertools 0.15" },
  { crate = "shlex@1.3.0", reason = "aws-lc-fips-sys bindgen uses shlex 1 while its cc build path uses shlex 2" },
  { crate = "syn@2.0.119", reason = "object_store's HTTP and ICU dependency closure still uses syn 2 while current derives use syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
