[graph]
# Studio is packaged with the same two supported Linux release artifacts as
# the engine. Target-only WASM and Windows branches are outside that contract.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSL-1.0",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Cargo represents an unversioned private path dependency as `*`. Studio and
# every in-repository crate it consumes set `publish = false`; registry
# wildcard dependencies remain denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
