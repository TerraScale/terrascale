# `terrabase-member-transport` — the SE-06 engine-owned member transport
# crate: the first real network incarnation of the W4 replication plane on
# engine-owned lanes (charter PD-2026-08-26-13 D2, ADR 0012 D-2).
#
# Standalone workspace root on purpose: the engine workspace at the
# repository root stays untouched; the integrator adds this crate to the
# root `members` list when wiring it in (recorded as the required
# integrator action in the SE-06 receipt and docs).

[package]
name = "terrabase-member-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "TerraBase member transport: versioned fail-closed member envelopes over in-process lanes and engine QUIC sockets; NATS never carries member frames"
publish = false

# Own workspace root: stays out of the engine workspace without any
# root-Cargo.toml edit until the integrator wires it in.

[features]
default = ["local-crypto"]
local-crypto = ["dep:ring", "quinn/rustls-ring", "rustls/ring", "rcgen/ring"]
production-fips = [
  "dep:aws-lc-rs",
  "aws-lc-rs/fips",
  "quinn/rustls-aws-lc-rs-fips",
  "rustls/fips",
  "rcgen/fips",
  "rcgen/aws_lc_rs",
]

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = "warn"

[dependencies]
# The qualification lane keeps its pinned ring provider. The production
# boundary selects AWS-LC FIPS explicitly and never relies on rustls' process
# default. Both use the same quinn transport implementation.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
aws-lc-rs = { version = "1.18.0", default-features = false, optional = true }
rcgen = { version = "0.13", default-features = false, features = ["pem"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
x509-parser = "0.18"
# Content digest of every envelope payload (message-contract discipline).
# `ring` is already in the QUIC closure; reusing its SHA-256 keeps the crate's
# dependency tree at exactly the engine-socket set, with no second digest crate
# (and no second `cpufeatures`) in the eventual unified workspace lock.
ring = { version = "0.17", optional = true }

[dev-dependencies]
# Hostile decode probes re-sign corrupted frames with the crate's own
# digest backend (a test-only use of the already-direct dependency, so the
# workspace lock and the engine-socket crypto closure stay unchanged).
ring = "0.17"
