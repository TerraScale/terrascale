# `terrabase-replication-core` — the P2 leaderless multi-writer CRDT
# plane (ADR 0018). The opposite shape of the client sync seam: every
# Member of a replica set is a distinct CRDT peer-writer, and the
# exchange is member-to-member frontier summaries and delta batches per
# the frozen leaderless contract §5 (anti-entropy) and §8 scenarios 6,
# 11, and 13.
#
# The datatypes are TerraBase-native: LWW registers from
# `terrabase-crdt` joined over the dotted version vectors and causal
# contexts of `terrabase-causal`. No external CRDT engine is a
# dependency of this crate.

[package]
name = "terrabase-replication-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "TerraBase leaderless multi-writer replication core: per-Member native CRDT replicas, frontier summaries, member-to-member delta exchange"
publish = false

[features]
default = ["local-crypto"]
local-crypto = ["terrabase/local-crypto"]
production-fips = ["terrabase/production-fips"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = "warn"

[dependencies]
terrabase-causal = { path = "../terrabase-causal" }
terrabase-crdt = { path = "../terrabase-crdt" }
terrabase = { path = "../..", default-features = false }
