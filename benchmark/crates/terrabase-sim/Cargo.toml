# Deterministic simulation harness for E-12 / ADR 0044 §4.
# The production adapter exercises the durable Engine, member transport,
# reconciliation, and result-view state. The stub world tests harness mechanics.
# Product crates never depend on this qualification harness.

[package]
name = "terrabase-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "TerraBase deterministic production-engine simulation qualification for ADR 0044 §4 (E-12)"
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = "warn"

[dependencies]
rand = "0.9"
rand_chacha = "0.9"
# The adapter is the one deliberate integration point for the durable Engine.
# The Engine does not depend on this harness, so this edge does not form a
# cycle and keeps the harness trait vocabulary independent.
terrabase = { path = "../..", default-features = false }
terrabase-member-transport = { path = "../terrabase-member-transport", default-features = false }
terrabase-replication-core = { path = "../terrabase-replication-core" }
terrabase-sync-core = { path = "../terrabase-sync-core" }
