[package]
name = "terrabase-sqlite-baseline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "modern_sqlite"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
