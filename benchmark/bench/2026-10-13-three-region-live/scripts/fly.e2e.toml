# The disposable three-region acceptance app (terrascale-previews-515): one machine per region, synthetic data only.
app = "ts-terrabase-e2e"
primary_region = "gru"
swap_size_mb = 1024

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "terrabase_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "5s"
    timeout = "2s"
    grace_period = "10s"
