# `terrabase-bench-lane` — the operator-side reference driver of the
# TerraBase benchmark lane.
#
# Standalone workspace root on purpose, exactly like
# `crates/terrabase-tbep/tools/tbep-fbs`: the engine workspace at the
# repository root stays zero-dependency (its architecture gate freezes the
# engine core at `blake3`), so the reference drivers that must speak
# PostgreSQL's and RavenDB's client protocols live here, outside that
# closure. This package only *drives* references and emits facts as JSON;
# every verdict, gate, and receipt is produced by the engine-side adapter
# (`src/benchmarks/`) under the SE-15 discipline, never here.
[package]
name = "terrabase-bench-lane"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Operator-side reference drivers (PostgreSQL, PostgreSQL full-stack, RavenDB) for the TerraBase benchmark lane"
publish = false

[workspace]

[dependencies]
# The synchronous PostgreSQL client: one connection per concurrency slot,
# prepared statements, autocommit per statement — the exact client shape
# the SE-15 pin records. MIT/Apache-2.0.
postgres = "0.19"
# The synchronous HTTP client for the RavenDB REST boundary, with rustls
# TLS for any future secured lane. MIT/Apache-2.0.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
