[graph]
# The benchmark driver ships only with the two Linux release artifacts. Do
# not make unrelated WASM and Windows dependency branches part of this gate.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSL-1.0",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8
# `ureq` uses the Mozilla root-certificate data through these two exact
# `webpki-roots` releases. CDLA-Permissive-2.0 is accepted for those data
# packages only, not as a repository-wide license allowance.
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@0.26.11" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# These old major lines cannot unify while the pinned `ureq` and `postgres`
# drivers remain on their current public APIs. Every other duplicate stays a
# hard error.
skip = [
  { crate = "getrandom@0.2.17", reason = "ring requires 0.2 while postgres-protocol requires rand's 0.4 line" },
  { crate = "syn@2.0.119", reason = "ureq's URL/ICU closure still requires syn 2 while current driver derives require syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
