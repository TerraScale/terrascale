[workspace]
resolver = "3"
members = ["crates/fc-harness", "crates/fc-guest-agent", "crates/fc-image-builder"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive", "std"] }
libc = "0.2.177"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
