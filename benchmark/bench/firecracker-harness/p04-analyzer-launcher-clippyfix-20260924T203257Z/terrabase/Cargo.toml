[workspace]
members = [
    "crates/tb-core",
    "crates/tb-format",
    "crates/tb-storage",
    "crates/tb-object",
    "crates/tb-protocol",
    "crates/tb-replication",
    "crates/tb-document",
    "crates/tb-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aws-lc-rs = "=1.18.1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "=1.12.1"
clap = { version = "=4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
crc32c = "=0.6.8"
fs2 = "=0.4.3"
futures-util = { version = "=0.3.34", default-features = false, features = ["async-await", "std"] }
hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["server", "server-graceful", "service", "tokio"] }
libc = "=0.2.189"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["checked-decode", "frame", "safe-decode", "safe-encode", "std"] }
metrics = "=0.24.6"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
prost = "=0.14.4"
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["http2", "rustls"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }
rustls = { version = "=0.23.37", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "tls-aws-lc", "transport"] }
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
tower = { version = "=0.5.3", default-features = false, features = ["limit", "util"] }
tracing = "=0.1.44"
ulid = "=3.0.0"

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
