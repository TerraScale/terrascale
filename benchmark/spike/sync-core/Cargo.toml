# SE-02 spike crate — standalone, deliberately NOT a member of the engine
# workspace at the repository root.
#
# The empty `[workspace]` table below makes this manifest its own workspace
# root, so the engine build (root `Cargo.toml`, zero external dependencies)
# stays untouched. The spike is exempt from the zero-dependency rule by the
# SE-02 ticket: it exists to produce the Loro go/no-go evidence.

[package]
name = "terrabase-sync-core-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "LicenseRef-TerraScale-Pending"
description = "SE-02 spike: Loro server-authoritative delivery prototype and budget comparison"
publish = false

# Makes this manifest its own workspace root: the spike stays out of the
# engine workspace at the repository root without any root-Cargo.toml edit.
[workspace]

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = "warn"

[dependencies]
loro = "1.13.9"

[lib]
name = "terrabase_sync_core_spike"
path = "src/lib.rs"

[[bin]]
name = "se02_spike"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
