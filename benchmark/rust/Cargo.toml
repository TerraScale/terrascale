[package]
name = "ts-bench-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
terrascale = { path = "../../sdk/rust" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "http2"] }
base64 = "0.22"

[workspace]
