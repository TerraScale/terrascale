[package]
name = "terrascale"
version = "0.1.0"
edition = "2021"
description = "Typed Rust client for TerraBase's native document protocol and TerraScale authentication"
license = "Apache-2.0"
exclude = ["AGENTS.md", "CLAUDE.md"]

[features]
default = []
postgres = ["dep:tokio-postgres", "dep:tokio-rustls", "dep:rustls", "tokio/net"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
base64 = "0.22"
bytes = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

tokio-postgres = { version = "=0.7.18", optional = true }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"], optional = true }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"], optional = true }

[[example]]
name = "postgres_journey"
path = "examples/postgres_journey.rs"
required-features = ["postgres"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "test-util"] }
base64 = "0.22"
sha2 = "0.10"

[lints.clippy]
# The single crate Error type carries every diagnostic field in full (never
# boxed) so callers can match without dereferencing; that keeps it above
# clippy's Result-size threshold.
result_large_err = "allow"
